<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>매일메일 스터디</title>
<style>
  :root {
    --bg: #0f0e0c;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-strong: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.11);
    --glass-border-soft: rgba(255, 255, 255, 0.07);
    --text: #f2efe9;
    --text-dim: #b6b0a5;
    --text-faint: #837c70;
    --accent: #d97757;
    --accent-strong: #e79274;
    --accent-soft: rgba(217, 119, 87, 0.18);
    --accent-dim: rgba(217, 119, 87, 0.45);
    --done: #6fbf8b;
    --done-soft: rgba(111, 191, 139, 0.16);
    --code-bg: rgba(0, 0, 0, 0.35);
    --radius: 16px;
    --sidebar-w: 340px;
    --blur: blur(20px) saturate(140%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: break-word;
    background: var(--bg);
  }
  header {
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--glass-border-soft);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 15.5px;
    margin: 0;
    font-weight: 800;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .subject-toggle {
    display: flex;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 11px;
    padding: 3px;
    gap: 3px;
  }
  .subject-toggle button {
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: background .12s, color .12s;
  }
  .subject-toggle button.active {
    background: var(--accent);
    color: #16110d;
    box-shadow: 0 2px 10px rgba(217, 119, 87, 0.4);
  }
  #search {
    flex: 1;
    min-width: 180px;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 11px;
    font-size: 13px;
  }
  #search::placeholder { color: var(--text-faint); }
  #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn {
    border: 1px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: border-color .12s, color .12s, background .12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--glass-strong); }
  #progress-summary {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    white-space: nowrap;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 8px 12px;
    border-radius: 11px;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .category {
    flex-shrink: 0;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-soft);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(5, 8, 20, 0.25);
    overflow: hidden;
    transition: border-color .12s, background .12s;
  }
  .category.open { border-color: var(--glass-border); background: var(--glass-strong); }
  .category-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 13px 14px;
    cursor: pointer;
    user-select: none;
  }
  .category-head:hover { background: rgba(255,255,255,0.05); }
  .cat-index {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: var(--accent-soft);
    border: 1px solid var(--glass-border-soft);
    color: var(--accent-strong);
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .category-head-main { flex: 1; min-width: 0; }
  .category-title {
    font-size: 13.5px;
    font-weight: 700;
    display: block;
    line-height: 1.5;
  }
  .category-progress-track {
    margin-top: 7px;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .category-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--done), #7fe8c2);
    border-radius: 3px;
    transition: width .2s;
  }
  .category-count {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-top: 2px;
  }
  .category-count.all-done { color: var(--done); }
  .chevron {
    flex-shrink: 0;
    transition: transform .15s;
    color: var(--text-faint);
    font-size: 10px;
    margin-top: 3px;
  }
  .category.open .chevron { transform: rotate(90deg); color: var(--accent); }
  .category-desc {
    font-size: 11.5px;
    color: var(--text-faint);
    padding: 0 14px 13px 48px;
    line-height: 1.55;
    margin-top: -2px;
  }
  .category-items {
    display: none;
    padding: 4px 8px 10px;
    border-top: 1px solid var(--glass-border-soft);
  }
  .category.open .category-items { display: block; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 8px 8px 8px 10px;
    margin: 2px 0;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text-dim);
    line-height: 1.55;
    border-radius: 9px;
  }
  .item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .item.active { background: var(--accent-soft); color: var(--text); }
  .item.active .item-title { color: var(--text); font-weight: 600; }
  .item.done .item-title { color: var(--text-faint); }
  .item input[type=checkbox] { margin-top: 2px; accent-color: var(--done); cursor: pointer; flex-shrink: 0; }
  #content-pane {
    flex: 1;
    overflow-y: auto;
    padding: 32px 32px 100px;
  }
  #content-inner {
    max-width: 720px;
    margin: 0 auto;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-soft);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(5, 8, 20, 0.3);
    padding: 36px 44px;
  }
  #content-inner:has(.empty-state) {
    background: transparent;
    border: none;
    box-shadow: none;
  }
  .empty-state {
    color: var(--text-faint);
    font-size: 14px;
    margin: 100px auto;
    text-align: center;
    line-height: 1.8;
  }
  .qa-breadcrumb {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-strong);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qa-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 14px;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }
  .qa-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--glass-border-soft);
    color: var(--text-faint);
    font-size: 12px;
  }
  .qa-meta .qa-id {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border-soft);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .qa-meta .btn { padding: 6px 12px; font-size: 12px; }
  .qa-meta .btn.is-done { border-color: var(--done); color: var(--done); background: var(--done-soft); }
  .course-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--glass-border-soft);
  }
  .course-nav-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    max-width: 44%;
    padding: 10px 14px;
    text-align: left;
  }
  .course-nav-btn.next { align-items: flex-end; text-align: right; margin-left: auto; }
  .course-nav-btn .cn-label { font-size: 10.5px; color: var(--text-faint); font-weight: 700; }
  .course-nav-btn .cn-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .course-nav-btn:hover .cn-title { color: var(--accent-strong); }
  .course-position {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .md h2 {
    font-size: 17px;
    font-weight: 700;
    margin-top: 40px;
    margin-bottom: 16px;
    padding-top: 24px;
    border-top: 1px solid var(--glass-border-soft);
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .md h2::before {
    content: "Q";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .md h3 { font-size: 15px; margin-top: 22px; color: var(--text); }
  .md p { line-height: 1.9; margin: 0 0 16px; font-size: 15px; color: var(--text); }
  .md ul, .md ol { line-height: 1.9; font-size: 15px; margin: 0 0 16px; padding-left: 24px; color: var(--text); }
  .md li { margin-bottom: 6px; }
  .md blockquote {
    margin: 0 0 16px;
    padding: 10px 16px;
    border-left: 3px solid var(--accent);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    border-radius: 0 10px 10px 0;
    font-size: 14px;
  }
  .md code {
    background: var(--code-bg);
    border: 1px solid var(--glass-border-soft);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 0.88em;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    color: #f0cf8e;
  }
  .md pre {
    background: var(--code-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
    overflow-x: auto;
    margin: 0 0 18px;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.7; color: var(--text); }
  .md a { color: var(--accent-strong); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  .md a:hover { border-bottom-color: var(--accent-strong); }
  .md strong { color: #fff; font-weight: 700; }
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--glass-strong);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    #sidebar { width: 100%; max-height: 44vh; }
    #content-pane { padding: 20px 16px; }
    #content-inner { padding: 24px 22px; }
  }
</style>
</head>
<body>
<header>
  <h1>매일메일 스터디</h1>
  <div class="subject-toggle" id="subject-toggle">
    <button data-subject="frontend" class="active">Frontend</button>
    <button data-subject="backend">Backend</button>
  </div>
  <input type="text" id="search" placeholder="질문 검색... (예: 클로저, useEffect)" />
  <button class="btn" id="course-btn">학습 코스</button>
  <button class="btn" id="random-btn">랜덤 복습</button>
  <span id="progress-summary"></span>
</header>
<main>
  <nav id="sidebar"></nav>
  <section id="content-pane">
    <div id="content-inner">
      <div class="empty-state">왼쪽 목록에서 질문을 선택하거나, "랜덤 복습" 버튼을 눌러보세요.</div>
    </div>
  </section>
</main>
<div id="toast"></div>

119", "fe-137", "fe-52", "fe-130", "fe-53", "fe-88", "fe-98", "fe-124", "fe-128", "fe-59", "fe-40", "fe-68", "fe-92", "fe-87", "fe-145", "fe-96", "fe-134", "fe-127", "fe-131"]}, {"name": "테스트, 품질과 협업 판단", "desc": "현업에서 문제를 진단하고, 테스트 전략을 세우고, 협업 속에서 의사결정하는 데 가까운 질문들입니다.", "items": ["fe-97", "fe-120", "fe-64", "fe-27", "fe-142", "fe-143"]}], "items": {"fe-1": {"id": "fe-1", "content": "**클로저**는 함수가 선언될 때의 스코프를 기억하여, 함수가 생성된 이후에도 그 스코프에 접근할 수 있는 기능을 말합니다. 비유하자면, 함수가 자신이 생성된 환경을 '기억'하는 것이라고 할 수 있습니다. 클로저는 자바스크립트의 **함수가 일급 객체라는 특성**과 **렉시컬 스코프**의 조합으로 만들어집니다. \n\n예시와 함께 클로저의 동작을 설명드리면 좋을 것 같습니다.   \n\n**클로저 예시 코드**\n```javascript\nfunction outerFunction(outerVariable) {\n  return function innerFunction(innerVariable) {\n    console.log('Outer Variable: ' + outerVariable);\n    console.log('Inner Variable: ' + innerVariable);\n  };\n}\n\nconst newFunction = outerFunction('outside');\nnewFunction('inside');\n```\n여기서 `innerFunction`은 `outerFunction`의 내부에 정의되어 있습니다. `innerFunction`은 자신이 생성된 스코프, 즉 `outerFunction`의 스코프를 기억하고, `outerFunction`의 호출이 완료된 이후에도 그 스코프에 접근할 수 있습니다. 그리고 이에 따라 `innerFunction`은 `outerVariable`에도 접근할 수 있습니다. 이것이 클로저가 동작하는 방식입니다.\n\n## 클로저는 언제 활용하나요?\n클로저는 변수와 함수의 접근 범위를 제어하고 특정 데이터와 상태를 유지하기 위해 자주 활용됩니다. 크게 세 가지 대표적인 사용 사례로 나누어 설명드릴 수 있습니다.  \n\n**첫째, 데이터 은닉에 활용됩니다.** 클로저는 외부에서 접근할 수 없는 비공개 변수와 함수를 만들 수 있습니다. 이를 통해 데이터를 은닉하여 외부 접근을 막고, 데이터 무결성을 유지할 수 있습니다. 예를 들어, 특정 함수 내부에서만 접근 가능한 변수를 생성하고, 이를 조작할 수 있는 함수만 외부로 노출하여 안전하게 데이터를 관리할 수 있습니다.   \n\n**둘째, 비동기 작업에 활용됩니다.** 클로저는 비동기 작업에서 이전의 실행 컨텍스트를 유지해야 할 때 유용합니다. 콜백 함수가 비동기적으로 실행될 때 클로저를 사용하면 함수 실행 시점의 변수를 참조할 수 있습니다. \n```js\nfunction createLogger(name) {\n  return function() {\n    console.log(`Logger: ${name}`);\n  };\n}\n\nconst logger = createLogger('MyApp');\nsetTimeout(logger, 1000); // 1초 후에 'Logger: MyApp' 출력\n```\n위의 예시에서 클로저가 `name` 변수(`'MyApp'`)를 저장하여 1초 후에도 해당 값이 유지되어 출력됩니다. \n\n**셋째, 모듈 패턴을 구현하는 데 활용됩니다.** 모듈 패턴은 특정 기능을 캡슐화하고, 외부에 공개하고자 하는 부분만 선택적으로 노출하여 코드의 응집력을 높이고, 유지보수성을 향상시키는 패턴입니다. 클로저를 활용하면 필요한 함수와 데이터만 외부로 노출함으로써 모듈 패턴을 쉽게 구현할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[얄팍한 코딩사전] 클로저(Closure) - 죽은 함수의 망령](https://www.youtube.com/watch?v=WbVVKY9CDP0)", "title": "클로저에 대해서 설명해주세요."}, "fe-10": {"id": "fe-10", "content": "첫번째로 **DNS 조회**가 일어납니다.\n사용자가 `www.google.com`을 입력하면, 브라우저는 먼저 이 도메인 이름을 IP 주소로 변환해야 합니다. 이 과정을 DNS 조회(DNS Lookup)라고 합니다.\n브라우저는 캐시된 DNS 기록을 먼저 확인하고, 없으면 로컬 DNS 서버에 요청하여 `www.google.com`에 해당하는 IP 주소를 얻습니다.\n\n두번째로 **TCP 연결 수립**입니다.\nIP 주소가 확인되면, 브라우저는 서버와 TCP 연결을 수립합니다. TCP(Transmission Control Protocol)는 데이터를 신뢰성 있게 전달하기 위한 프로토콜입니다.\n이 과정에서 브라우저는 서버와 3-way handshake를 수행합니다. 즉, 브라우저가 SYN 패킷을 보내고, 서버가 SYN-ACK 패킷을 보내며, 다시 브라우저가 ACK 패킷을 보내는 과정입니다.\n\n세번째로 **HTTP 요청**입니다.\nTCP 연결이 수립되면, 브라우저는 HTTP 또는 HTTPS 요청을 보냅니다. 이 요청은 \"GET / HTTP/1.1\" 같은 형식으로, 웹 페이지를 요청하는 메시지입니다.\n만약 HTTPS를 사용할 경우, 이 단계 이전에 SSL/TLS 핸드셰이크도 수행됩니다. 이 과정에서는 브라우저와 서버가 암호화된 연결을 설정하기 위해 보안 인증서를 교환하고, 암호화 키를 협상합니다.\n\n네번째로 **서버의 응답**을 받습니다.\n서버는 요청을 받고, 해당 리소스(HTML, CSS, JavaScript, 이미지 등)를 브라우저에게 응답으로 보냅니다. 이 응답은 HTTP 응답 코드(예: 200 OK)와 함께 전달됩니다.\n\n마지막으로 받은 리소스들을 바탕으로 **브라우저 렌더링 파이프라인을 진행**합니다.\nDOM과 CSSOM을 생성하고, 렌더 트리를 구성한 뒤, 레이아웃과 페인트 단계를 통해 웹 페이지가 화면에 표시됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[미쿡엔지니어] 브라우저에서 google.com을 치면 일어나는 일들에 대해 알아볼까요?\n](https://www.youtube.com/watch?v=0Oqkw8wVY_c)", "title": "인터넷 창에 www.google.com를 입력하면 무슨 일이 일어나는지 설명해주세요."}, "fe-100": {"id": "fe-100", "content": "`useRef()`와 `let`의 가장 큰 차이점은 **리렌더링 시의 동작방식**입니다.\n\n`let`으로 선언한 변수는 **컴포넌트가 리렌더링될 때마다 초기화되어서 이전 값을 잃어버리는 반면, `useRef()`로 만든 변수는 리렌더링되어도 값이 유지됩니다.** 더불어 `useRef()`는 `useState()`와 다르게 상태 값이 변경되어도 컴포넌트가 리렌더링이 유발되지 않는다는 특징이 있습니다.\n\n실제 사용 사례를 보면, `useRef()`는 주로 DOM 요소에 접근할 때 사용합니다. 예를 들어 `input`에 focus를 주거나 스크롤 위치를 조정하는 경우에 `ref`를 활용합니다.\n\n그리고 `useRef()`는 `setTimeout()`이나 `setInterval()`의 ID를 저장할 때도 유용합니다. 컴포넌트가 리렌더링되어도 타이머 ID가 유지되어야 cleanup 함수에서 해당 값을 이용하여 타이머를 정리할 수 있기 때문입니다.\n\n## 컴포넌트 외부에서 let을 선언하면 리렌더링에 영향을 안 받지 않나요? 🤔\n\n맞는 말씀입니다. 컴포넌트 외부에서 선언된 `let` 변수는 리렌더링의 영향을 받지 않습니다. 하지만 이런 방식은 권장되지 않는 패턴입니다.\n\n그 이유는 크게 세 가지를 들 수 있는데요.\n\n첫째, **컴포넌트 외부의 변수는 모든 컴포넌트 인스턴스가 공유하게 됩니다.** 즉, 같은 컴포넌트를 여러 번 사용할 때 예상치 못한 동작이 발생할 수 있습니다.\n\n둘째, **전역 변수처럼 동작하기 때문에 코드의 예측 가능성과 유지보수성이 떨어집니다.**\n\n셋째, **리액트의 원칙 중 하나인 단방향 데이터 흐름에 위배됩니다.** 상태 관리가 리액트의 생명주기 밖에서 이루어지기 때문입니다.\n\n따라서 컴포넌트의 상태를 관리할 때는 `useState()`나 `useRef()`와 같은 리액트에서 제공하는 공식적인 방법을 사용하는 것이 좋습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [Mastering React's useRef Hook: A Deep Dive](https://dev.to/samabaasi/mastering-reacts-useref-hook-a-deep-dive-1548)\n- [[ZeroCho TV] useRef와 let 변수의 차이를 아시나요?](https://www.youtube.com/watch?v=dz8-fdIEFPw)", "title": "리액트에서 변수 관리 시 useRef를 사용하는 것은 let을 사용하는 것과 어떤 차이가 있나요?"}, "fe-101": {"id": "fe-101", "content": "메모리 캐시랑 디스크 캐시는 브라우저가 리소스를 저장하는 방식을 나타냅니다.\n\n메모리 캐시는 말 그대로 **메모리, 즉 RAM에 저장돼서 빠른 속도가 특징입니다.** 현재 열린 탭에서 CSS나 JS 같은 리소스를 바로 가져올 때 유용합니다. 하지만 브라우저 창을 닫거나 새로고침하면 해당 리소스들이 사라지게 됩니다.\n\n반면에 디스크 캐시는 **하드디스크나 SSD 같은 저장장치에 저장돼서, 브라우저를 껐다 켜도 남아 있는 것이 특징입니다.** 그래서 자주 방문하는 사이트의 이미지나 폰트 같은 리소스를 다시 다운받지 않고 사용할 수 있는 장점이 있습니다.\n\n다만, 디스크는 메모리보다 접근 속도가 느려서 로딩 속도에 차이가 있을 수 있습니다.\n\n## 브라우저가 메모리 캐시와 디스크 캐시는 각각 언제 사용하나요? 🤔\n\n브라우저는 일반적으로 페이지에서 빠르게 다시 쓸 가능성이 높은 건 메모리에 저장하고, 오래 유지해야 하는 건 디스크에 저장합니다.\n\n예를 들어, 현재 페이지에서 사용되는 JS나 CSS 파일은 메모리 캐시에 두고, 이미지나 웹 폰트와 같은 리소스는 디스크 캐시에 저장해서 나중에도 재사용할 수 있도록 할 수 있습니다.\n\n캐시와 관련된 정책과 그에 따른 동작은 브라우저마다 다를 수 있다는 점에 유의해야 합니다.", "title": "브라우저 메모리 캐시와 디스크 캐시가 무엇인지 설명해주세요."}, "fe-102": {"id": "fe-102", "content": "```js\nsetTimeout(() => {\n    console.log('1')\n    \n    setTimeout(() => {console.log('2')} )\n\n    Promise.resolve().then(()=> console.log('3'))\n    \n    console.log('4')\n})\n\nPromise.resolve().then(() => {\n    console.log('5')\n    \n    setTimeout(() => {console.log('6')} )\n\n    Promise.resolve().then(()=> console.log('7'))\n    \n    console.log('8')\n})\n\nconsole.log('9')\n```\n\n> 위 코드를 복사하여 브라우저 콘솔 창에서 직접 실행해보세요. 🙂\n\n<details>\n  <summary>답변 보기</summary>\n<br />\n  \n**답:** `9 → 5 → 8 → 7 → 1 → 4 → 3 → 6 → 2`\n\n이벤트 루프는 아래와 같은 과정을 반복하여 태스크를 처리합니다.\n1. 동기 코드를 순차적으로 처리\n2. 마이크로태스크 큐의 모든 태스크를 처리 (큐가 비워질 때까지)\n3. 매크로태스크 큐에서 하나의 태스크를 가져와 처리\n4. 다시 1번으로 돌아감\n\n**위 규칙에 따라 처리되었을 때 구체적인 실행 과정은 다음과 같습니다.**\n\n전역 실행 컨텍스트 내 동기 코드인 `console.log('9')`가 가장 먼저 실행되어 `1️⃣ 9`가 출력됩니다.\n\n그 후 전역 실행 컨텍스트의 `Promise.then()` 핸들러가 마이크로태스크 큐에서 처리되며 내부의 동기 코드가 실행되어 `2️⃣ 5`와 `3️⃣ 8`이 출력됩니다.\n\n이어서 동일 `Promise.then()` 핸들러 내부의 `Promise.then()` 핸들러가 마이크로태스크 큐에서 처리되어 `console.log('7')`이 실행되며 `4️⃣ 7`이 출력됩니다.\n\n그 다음 첫 번째 `setTimeout()`의 콜백이 매크로태스크 큐에서 처리되며 내부의 동기 코드가 순차 실행되어 `5️⃣ 1`과 `6️⃣ 4`가 출력됩니다.\n\n그 후 동일 `setTimeout()` 콜백 내부의 `Promise.then()`이 마이크로태스크 큐에서 처리되며 `console.log('3')`이 실행되어 `7️⃣ 3`이 출력됩니다.\n\n이어서 남은 매크로태스크 중에서 먼저 등록된 `console.log('6')`이 처리되어 `8️⃣ 6`이 출력되며, 끝으로 `9️⃣ 2`가 출력됩니다.\n\n\n따라서 최종 출력 순서는 `9 → 5 → 8 → 7 → 1 → 4 → 3 → 6 → 2`가 됩니다.\n\n</details>\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[매일메일] 이벤트 루프에 대해서 설명해주세요.](https://www.maeil-mail.kr/question/15)\n- [[10분 테코톡] 🍗 피터의 이벤트루프](https://www.youtube.com/watch?v=wcxWlyps4Vg)\n- [[f-lab] 자바스크립트의 이벤트 루프: 동시성 관리 이해하기](https://f-lab.kr/insight/understanding-the-event-loop-in-javascript)", "title": "다음 Promise 코드의 실행 결과를 설명해주세요."}, "fe-103": {"id": "fe-103", "content": "결론부터 말씀드리면, 기본 `<img>` 태그 대신 `next/image` 컴포넌트를 사용한 이유는 **사용성 향상 및 성능 최적화를 빠르게 구현할 수 있기 때문입니다.**\n\n먼저, `next/image`는 `placeholder` 속성을 활용하여 **로딩 중일 때의 사용자 경험을 개선할 수 있습니다.** 기본 `<img>`를 사용할 경우 이미지를 로딩하는 동안 빈 공간이 보이지만, next/image는 `placeholder` 옵션을 활용해 로딩 전에도 이미지를 잠시 대체할 수 있는 요소를 보여줄 수 있습니다. 이를 통해 콘텐츠의 시각적 일관성을 유지하여 사용자가 페이지를 더 쾌적하게 탐색할 수 있게 해줍니다.\n\n또한, `next/image`는 **브라우저 환경에 맞는 최적화된 포맷과 크기의 이미지를 제공합니다.** 예를 들어, 사용자의 브라우저가 `WebP` 포맷을 지원하면 `JPG`나 `PNG` 대신 `WebP` 이미지를 자동으로 제공합니다. 또한, 요청된 이미지 크기에 따라 적절한 크기의 이미지를 서빙하여 불필요한 데이터 전송을 줄입니다. 이러한 기능 덕분에 개발자가 별도로 이미지 최적화를 수행하지 않아도 성능이 향상됩니다.\n\n마지막으로, `next/image`는 **기본적으로 lazy loading을 지원합니다.** `next/image`는 기본적으로 뷰포트에 들어올 때 필요한 이미지만 로드하도록 구현되어 있습니다. 이를 통해 별도 설정 없이도 초기 페이지 로딩 속도를 개선하고, 네트워크 리소스를 절약할 수 있습니다.\n\n## next/image를 사용할 때 발생할 수 있는 단점은 무엇인가요? 🤔\n가장 큰 단점은 **설정이 상대적으로 복잡할 수 있다는 점입니다.** 예를 들어, 외부 도메인의 이미지를 사용할 경우 `next.config.js`에서 해당 도메인을 허용 목록에 추가해야 합니다. 또한, 기본적으로 `next/image`는 서버 사이드에서 이미지 최적화를 수행하므로, 자체 서버가 없는 경우 Vercel과 같은 호스팅 서비스를 활용해야 하는 제약이 있을 수 있습니다.\n\n## next/image를 사용하지 않고도 이미지 최적화를 할 수 있지 않을까요? 🧐\n물론 가능합니다. 예를 들어, 이미지 크기를 미리 조절한 후 정적인 파일로 제공하거나, `loading=\"lazy\"` 속성을 활용하여 지연 로딩을 설정할 수도 있습니다. 또, 클라우드 기반의 이미지 최적화 서비스(ex. Cloudinary, Imgix)를 활용하면 `next/image` 없이도 최적화를 진행할 수 있습니다.  \n\n그러나 `next/image`를 사용하면 이러한 기능들을 많은 노력을 들이지 않고도 기본 제공받을 수 있기 때문에, 시간의 제약을 극복하기 위해 사용했습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[next js 한글문서] Image](https://nextjs-ko.org/docs/pages/api-reference/components/image)\n- [[kakao entertainment] Next/Image를 활용한 이미지 최적화](https://fe-developers.kakaoent.com/2022/220714-next-image/)", "title": "왜 기본 img 태그 대신 next/Image를 사용하셨나요?"}, "fe-104": {"id": "fe-104", "content": "CSS에서 `dvh`, `svh`, `lvh`는 **뷰포트 높이를 측정하는 새로운 단위**입니다. 기존 `vh(viewport height)`는 브라우저의 뷰포트 높이를 기준으로 설정되지만, 모바일 환경에서는 주소창이나 네비게이션 바의 유무에 따라 동적으로 변할 수 있어 정확한 높이를 계산하기 어렵다는 단점이 있었습니다. 이를 해결하기 위해 `dvh`, `svh`, `lvh`가 등장했습니다.\n\n먼저 `dvh(Dynamic Viewport Height)`는 **동적인 뷰포트 높이**를 의미합니다. 사용자가 스크롤하거나 모바일 주소창과 같은 UI 요소가 나타나거나 사라질 때마다 뷰포트의 높이가 변하는 경우, 이를 반영하여 실시간으로 계산된 값을 제공합니다. 예를 들어, 모바일에서 주소창이 사라지면 뷰포트의 높이가 증가하는데, 이 변화를 즉시 반영하는 수치입니다.\n\n`svh(Small Viewport Height)`는 **뷰포트가 가장 작을 때의 높이**를 의미합니다. 일반적으로 모바일 브라우저에서 주소창이 보이는 상태에서의 최소 높이를 기준으로 합니다. 따라서 `svh`를 사용하면, 화면의 공간이 최대로 제한되는 시나리오에서도 UI가 깨지지 않도록 레이아웃을 설계할 수 있습니다.\n\n`lvh(Large Viewport Height)`는 반대로 **뷰포트가 가장 클 때의 높이**를 기준으로 합니다. 즉, 모바일에서 주소창이 사라진 후 전체 화면이 확장된 상태의 최대 뷰포트 높이를 나타냅니다. 이를 활용하면 전체 화면을 적극적으로 활용하는 UI를 구성할 수 있습니다.\n\n## dvh가 가변적이니 svh보다 더 유용할 것 같은데, 꼭 svh를 사용해야 하는 경우가 있나요?\n말씀하신 대로 dvh가 가변적이라 더 자연스러운 경험을 제공합니다. 하지만 svh가 필요한 특수한 상황들이 있습니다.\n\n예를 들면, **빠른 스크롤이나 주소창 토글이 자주 발생하는 상황**이 있습니다. 이 경우 `dvh`는 주소창이 움직일 때마다 높이를 재계산하는데, 이때 레이아웃이 미세하게 흔들려 보일 수 있습니다. 반면, svh는 최소 높이로 고정이 되어 있어 이런 떨림 현상이 없습니다.\n\n또, **성능이 중요한 상황**에서도 `svh`가 유용하게 사용될 수 있습니다. `dvh`는 지속적으로 변하기 때문에 요소의 레아이웃을 변화시켜 리플로우를 자주 유발할 수 있습니다. 모바일과 같이 성능 차이가 민감하게 체감되는 환경에서 부드러운 사용자 경험을 제공하기 위해서는 `svh`가 더 안정적일 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[dev.to] CSS vh (dvh, lvh, svh) and vw units](https://dev.to/frehner/css-vh-dvh-lvh-svh-and-vw-units-27k4)\n- [[teamelysium] CSS Viewport 사이즈 상대 길이 단위](https://blog.teamelysium.kr/css-viewport-units)", "title": "css 속성 dvh, svh, lvh 란 무엇인가요?"}, "fe-105": {"id": "fe-105", "content": "## never\n먼저, `never`는 **절대 발생할 수 없는 값을 나타내는 타입입니다.** 함수가 값을 반환하지 않고 항상 예외를 던지거나 무한 루프를 도는 경우, 그 반환 타입은 `never`가 됩니다. `never`는 \"bottom type\"이라고도 불리며, 모든 타입의 하위 타입입니다.\n\n예를 들어, 다음과 같이 `never`를 사용할 수 있습니다.\n```ts\nfunction throwError(message: string): never {\n    throw new Error(message);\n}\n```\n\n이 함수는 어떤 값도 반환하지 않으며, 실행될 경우 예외를 던지기 때문에 `never` 반환 타입을 갖습니다.\n\n이외에도, `if-else`, `switch` 문을 통한 타입 검사 과정에서 허용된 케이스에 포함되지 않은 경우에 대응하기 위해 `never`를 사용하기도 합니다.\n\n## unknown\n반면, `unknown`은 **알 수 없는 값을 나타내는 타입입니다.** \"외부 API 호출 결과\"와 같이 구체적인 타입을 미리 알 수 없고, 런타임에 타입이 결정되는 경우에 사용합니다. `any`와 비슷하지만 더 안전한 방식입니다. `any`는 어떤 값이든 허용하기 때문에 타입 안정성이 떨어질 수 있지만, `unknown`은 특정한 타입으로 사용하려면 타입을 좁혀야 하기 때문입니다. `unknown`은 `any`와 함께 \"top type\"이라고도 불리며, 모든 타입의 상위 타입입니다.\n\n예를 들어, 다음과 같이 `unknown`을 사용할 수 있습니다.\n```ts\nfunction processUnknownValue(value: unknown) {\n    if (typeof value === 'string') {\n      //\n    } else if (typeof value === 'number') {\n      //\n    } else {\n      //\n    }\n}\n```\n\n이처럼 `unknown`은 직접 타입을 강제할 수 없으며, 타입을 좁혀야 사용할 수 있다는 점에서 `any`보다 안전한 선택입니다. 이를 활용하면 예상치 못한 타입 오류를 방지할 수 있습니다.\n\n## never 타입과 void 타입의 차이점은 무엇인가요? 🤔\n`void`는 함수가 **명시적으로 값을 반환하지 않음**을 의미하지만, `never` 타입은 **아예 반환될 수 없는 상태**를 나타냅니다. 예를 들어, `void`는 반환값 없이 `return;`을 하는 함수에서 사용될 수 있지만, `never`는 예외를 던지거나 무한 루프에 빠지는 함수에만 적용될 수 있습니다. 즉, `void`는 정상적인 종료를 하지만 `never`는 실행이 끝날 수 없는 함수에 적용되는 타입입니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[yceffort] 타입스크립트 타입 never에 대해 자세히 알아보자](https://yceffort.kr/2022/03/understanding-typescript-never)\n- [[10분 테코톡] 시지프의 타입스크립트 도약하기](https://www.youtube.com/watch?v=kMuJz6N-Grw)\n- [[f-lab] 타입스크립트에서의 unknown과 never 타입의 이해와 활용](https://f-lab.kr/insight/understanding-unknown-and-never-in-typescript)", "title": "never와 unknown 타입에 대해서 설명해주세요."}, "fe-106": {"id": "fe-106", "content": "먼저, 사용자가 웹 페이지를 요청하면 HTML 문서가 브라우저로 전송됩니다. 브라우저는 이를 파싱하면서 CSS 파일을 로드하고, CSS 내에 `@font-face`가 있는지를 확인합니다. 이 `@font-face`를 통해 브라우저는 폰트 파일의 위치와 스타일을 파악하게 됩니다.\n\n다음으로, 브라우저는 `@font-face`에 명시된 정보에 따라 폰트를 로컬 시스템에서 가져오거나 네트워크 요청을 통해 불러옵니다. 이때, 폰트는 일반적으로 `woff`나 `woff2` 같은 형식을 사용합니다. 이 형식이 용량이 작고 압축률이 높아 웹에서 널리 사용됩니다.\n\n폰트가 로드되기 이전에 텍스트가 어떻게 렌더링될지는 CSS 속성 설정에 따라 달라집니다. 만약 `font-display` 속성이 `swap`으로 설정되어 있다면, fallback 폰트가 먼저 적용되었다가 폰트가 로드된 후 교체됩니다. 이때 텍스트의 형태가 순간적으로 변하는 \"FOUT 현상\"이 발생할 수 있습니다. 반면, `block`으로 설정되어 있다면 웹 폰트가 완전히 로드될 때까지 텍스트가 보이지 않습니다. 이로 인해 폰트가 순간적으로 보이지 않았다가 등장하며 깜빡이는 \"FOIT 현상\"이 발생할 수 있습니다.\n\n## FOUT, FOIT 현상이 일어나지 않도록 할 수 있을까요? 🤔\n사전 로딩을 위해 `preload` 속성을 사용하면(ex. `<link rel=\"preload\" as=\"font\">`) 브라우저가 폰트 요청을 우선적으로 처리할 수 있습니다. 이를 통해 폰트가 이른 시점에 로드되어 FOUT이나 FOIT이 발생하지 않도록 할 수 있습니다.\n\n또한, `font-display: optional`을 사용할 수도 있습니다. 이를 사용하면 폰트가 빠르게 로드되지 않을 경우 fallback 폰트를 그대로 유지함으로써 텍스트의 형태가 순간적으로 변화하는 현상을 막을 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[rldnd.net] 웹에서 사용되는 font에 대해서 좀 알아보자](https://www.rldnd.net/font-)\n- [[요즘IT] 개발자에게 웹 폰트 최적화가 중요한 이유](https://yozm.wishket.com/magazine/detail/2107/)", "title": "브라우저가 폰트를 적용하는 과정을 설명해주세요."}, "fe-107": {"id": "fe-107", "content": "함수형 프로그래밍은 프로그래밍 패러다임 중 하나로, **순수 함수**와 **불변성**을 강조하는 방식입니다. 어떻게(how)보다는 **무엇(what)에 집중하며, 순수 함수를 조합하는 형태로 코드를 작성한다는 특징**이 있습니다.\n\n먼저, 함수형 프로그래밍의 핵심 개념 중 하나는 **순수 함수** 입니다. 순수 함수란 **동일한 입력에 대해 항상 동일한 결과를 반환하며, 외부 상태를 변경하지 않는 함수**를 의미합니다.\n```js\nfunction add(a, b) {\n  return a + b;\n}\n```\n\n이 함수는 인자 a와 b에 따라 항상 같은 값을 반환하며, 외부 상태를 변경하지 않기 때문에 순수 함수입니다. 만약 함수 내에서 데이터베이스에 접근하거나 전역 변수를 변경하는 등 부수 효과를 포함한다면 순수 함수가 아닙니다.\n\n다음으로 중요한 개념은 **불변성** 입니다. 함수형 프로그래밍에서는 데이터를 직접 변경하는 것을 피하고, 기존 데이터를 기반으로 새로운 데이터를 생성하는 방식을 사용합니다. 예를 들어, 배열의 값을 변경할 때 `push` 대신 `concat`을 사용하는 것이 함수형 프로그래밍에 적합한 방식입니다.\n\n```js\nconst numbers = [1, 2, 3];\nconst newNumbers = numbers.concat(4);\nconsole.log(newNumbers); // [1, 2, 3, 4]\nconsole.log(numbers); // [1, 2, 3] (원본 배열이 변경되지 않음)\n```\n\n이외에도 고차 함수, 커링, 함수 합성, 재귀 등의 기법을 적극적으로 활용하기도 합니다.\n\n## 이런 식으로 코드를 짤 때 어떤 장점이 있나요? 🤔\n여러 장점이 있지만, 크게 세 가지 장점에 대해 말씀드리겠습니다.\n\n첫째, **코드의 유지보수성이 좋습니다.** 함수형 코드는 절차적이지 않고 선언적이기 때문에 코드가 읽고 수정하기 좋은 형태입니다.\n\n둘째, **테스트하기 용이합니다.** 순수 함수는 외부 의존성이 없기 때문에 테스트하기 쉬운 형태이기 때문입니다.\n\n셋째, **병렬 처리하기 용이합니다.** 불변성 및 부수 효과가 없다는 특징 덕분에 병렬 처리하기에 적합합니다.\n\n\n## 추가 학습 자료를 공유합니다.\n- [[toss tech] 함수형 프로그래밍, 프론트엔드 개발에 진짜 도움 될까? | EP.2 모닥불](https://toss.tech/article/firesidechat_frontend_2)\n- [[jongminfire.dev] 함수형 프로그래밍이란?](https://jongminfire.dev/%ED%95%A8%EC%88%98%ED%98%95-%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%98%EB%B0%8D%EC%9D%B4%EB%9E%80)\n- [marpple - FxJS](https://github.com/marpple/FxJS)", "title": "함수형 프로그래밍에 대해 설명해주세요."}, "fe-108": {"id": "fe-108", "content": "자바스크립트에서 `0.1 + 0.2 === 0.3`의 결과는 `false`입니다. **그 원인은 부동소수점 형식의 한계에 있습니다.**\n\n자바스크립트에서 모든 숫자는 IEEE 754 표준을 따르는 64비트 부동소수점 형식으로 저장됩니다. 이 방식은 일부 소수점 연산에서 정확한 값을 저장하지 못하는 한계를 갖습니다. 예를 들어, `0.1`과 `0.2`를 이진수로 변환하면 무한 반복되는 소수로 표현되므로, 컴퓨터는 이를 근사값으로 저장합니다. 이로 인해 결과적으로 `0.1 + 0.2`의 실제 값은 `0.30000000000000004`가 되는데, 이는 `0.3`과 일치하지 않기 때문에 `===` 연산자로 비교하면 `false`가 반환됩니다.\n\n## 이러한 오차를 해결하려면 어떻게 하나요? 🤔\n가장 단순한 해결책은 **특정 자릿수까지 반올림하는 것입니다.** `toFixed()` 또는 `toPrecision()` 메서드를 사용할 수 있습니다. 다만 이 방법은 숫자가 문자열로 변환되는 부작용이 있습니다.\n\n또 다른 방법은 **`Number.EPSILON`을 활용하여 비교하는 것입니다.** `Number.EPSILON`은 자바스크립트에서 표현할 수 있는 가장 작은 수입니다. 이 값을 이용하여 다음과 같이 두 수를 비교하는 함수를 작성할 수 있습니다.\n```js\nfunction isEqual(a, b) {\n  return Math.abs(a - b) < Number.EPSILON;\n}\n\nconsole.log(isEqual(0.1 + 0.2, 0.3)) // true;\n```\n\n## 오차가 발생함에도 자바스크립트가 부동소수점 표준을 채택한 이유는 무엇인가요? 🧐\n> 스스로 답변을 하는 연습을 해보세요. 🙂\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[얄팍한 코딩사전] 부동소수점 (실수계산 오차가 생기는 이유)](https://www.youtube.com/watch?v=ZQDsWySjY6g)\n- [[f-lab] 자바스크립트에서의 부동소수점 연산과 정확한 계산 방법](https://f-lab.kr/insight/accurate-floating-point-calculation-in-javascript)", "title": "자바스크립트에서 \"0.1 + 0.2 === 0.3\"의 실행 결과에 대해 설명해주세요."}, "fe-109": {"id": "fe-109", "content": "Core Web Vitals는 **구글이 웹사이트 사용자 경험을 평가하기 위해 제안한 핵심 지표입니다.** 이 지표들은 사용자 경험과 직결될 뿐 아니라, SEO에도 영향을 미치기 때문에, 프론트엔드 개발자라면 꼭 이해하고 최적화할 필요가 있습니다.\n\n**Core Web Vitals는 LCP, INP, CLS로 구성됩니다.** 이 세 가지 지표에 대해 설명드리겠습니다.\n\n첫째, **LCP(Largest Contentful Paint)는 페이지에서 가장 큰 콘텐츠 요소가 로드되는 시간을 측정합니다.** 사용자가 웹사이트를 방문했을 때 주요 콘텐츠가 얼마나 빨리 표시되는지를 나타냅니다. 일반적으로 **2.5초 이내**에 로드되면 우수하다고 판단합니다. \n\n둘째, **INP(Interaction to Next Paint)는 상호작용에 대한 페이지의 전반적인 응답성을 평가합니다.** 사용자가 페이지를 방문하는 전체 기간 동안 발생하는 클릭, 탭, 키보드 상호작용의 지연 시간을 관찰하는 방식으로 측정됩니다. 최종 INP 값은 관찰된 가장 긴 상호작용을 기준으로 합니다. INP가 **200밀리초 이하**이면 우수하다고 판단합니다. \n\n셋째, **CLS(Cumulative Layout Shift)는 페이지가 예상치 못하게 시각적으로 이동하는 정도를 측정합니다.** 예를 들어, 사용자가 읽던 문장이 갑자기 밀려나거나, 버튼 위치가 바뀌어 잘못 클릭되는 현상 등이 CLS의 사례에 해당합니다. CLS 값이 **0.1 이하**이면 우수하다고 판단합니다. \n\n## 각 지표를 어떻게 개선할 수 있나요? 🤔\nLCP가 느리다면, 이미지 및 폰트 최적화, 서버 응답 시간 단축을 통해 개선할 수 있습니다.\n\nINP가 높다면, 불필요한 자바스크립트 실행을 줄이거나, 코드 분할을 통해 메인 스레드의 부담을 낮춤으로써 개선할 수 있습니다.\n\nCLS를 줄이려면, 이미지 크기를 명시적으로 설정하거나, 웹 폰트 로드 전략을 조정하여 개선할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[web.dev] Web Vitals](https://web.dev/articles/vitals?hl=ko)", "title": "Core Web Vitals란 무엇인가요?"}, "fe-11": {"id": "fe-11", "content": "리액트에서 `StrictMode`는 주로 개발 중에 발생할 수 있는 잠재적인 문제를 사전에 감지하고 예방하기 위해 사용됩니다.\n\n첫째, **오래된 라이프사이클 메서드와 비권장 API의 사용을 감지**합니다. 예를 들어, `componentWillMount()`, `componentWillReceiveProps()`와 같은 메서드는 더 이상 사용이 권장되지 않는데, `StrictMode`는 이러한 메서드들이 코드에 포함된 경우 경고를 표시해줍니다.\n이를 통해 개발자가 최신 React API를 사용하여 보다 안정적이고 효율적인 코드를 작성하도록 돕습니다.\n\n둘째, **의도치 않은 부수 효과를 방지**합니다. 리액트는 컴포넌트의 렌더링이 예측 가능하고 순수하게 이루어지기를 기대합니다.\n`StrictMode`는 이를 검증하기 위해 `useEffect()`, `useState()` 등 일부 훅이나 메서드를 두 번씩 실행합니다. 이렇게 두 번 실행하는 이유는, 동일한 결과가 나오는지 확인함으로써 컴포넌트가 사이드 이펙트를 일으키지 않고 순수하게 동작하는지를 검사하기 위함입니다.\n\n이러한 검증이 중요한 이유는 예기치 않은 동작이나 버그를 사전에 방지하기 위해서입니다. 개발 환경에서 두 번씩 실행해봤을 때 문제가 발생하지 않으면, 프로덕션에서도 안전하게 실행된다는 신호라고 볼 수 있습니다. 이 과정에서 부수 효과가 감지되면 개발자는 코드를 수정해야 할 필요가 있습니다.\n\n이렇듯 StrictMode는 개발자가 더욱 안전하고 효율적인 코드를 작성할 수 있도록 도와주는 도구입니다.\n\n\n## 코드가 두 번씩 실행되면 성능에 문제가 발생하지 않나요? 🤔\n이러한 두 번 실행되는 현상은 개발 모드에서만 발생하고, 실제 프로덕션 빌드에서는 정상적으로 한 번만 실행되기 때문에 성능에 영향을 미치지 않습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [FE 재남 - [React 공식문서 reference] #6-3. ＜StrictMode＞](https://www.youtube.com/watch?v=UoMdirFwFsU)", "title": "리액트의 Strict Mode에 대해서 설명해주세요."}, "fe-110": {"id": "fe-110", "content": "트리 쉐이킹은 **최종 번들 크기를 줄이기 위해 사용되지 않는 코드를 제거하는 최적화 방법**입니다. 이 방법은 주로 모듈 시스템을 기반으로 동작하며, 사용되지 않는 데드(dead) 코드를 감지하고 번들에서 제거하여 최적화합니다.\n\n트리 쉐이킹이 작동하려면 ES 모듈을 사용해야 합니다. ES 모듈은 정적인 구조를 가지기 때문에, 코드 분석 과정에서 어떤 모듈이 사용되고 어떤 모듈이 사용되지 않는지를 쉽게 판단할 수 있습니다. 반면, CommonJS 같은 동적 모듈 시스템을 사용할 경우, 정확한 코드 분석이 어려워 트리 쉐이킹이 제대로 동작하지 않을 수 있습니다.\n\n또, 트리 쉐이킹을 적용하려면 코드가 사이드 이펙트가 없는 순수 함수 형태로 작성되어야 합니다. 만약 모듈 내부에서 실행되는 코드가 전역 상태를 변경하거나 예측할 수 없는 동작을 한다면, 번들러는 해당 코드가 제거되어도 안전한지 확신할 수 없기 때문에 트리 쉐이킹이 적용되지 않을 수 있습니다. 이를 해결하기 위해 `package.json`에 `\"sideEffects\": false`를 설정하면 해당 패키지가 사이드 이펙트가 없음을 명시하여 보다 적극적으로 최적화할 수 있습니다.\n\n\n## 트리 쉐이킹은 어떻게 적용하나요? 🤔\nwebpack, Rollup, esbuild 등의 번들러에서 트리 쉐이킹 기능을 지원합니다. 이때 설정 방법은 번들러마다 조금씩 차이가 있습니다. 최신 버전의 webpack을 예로 들면, `mode: 'production'` 설정만으로도 기본적인 트리 쉐이킹이 활성화되며, `TerserPlugin` 같은 플러그인을 추가하면 더욱 강력한 최적화가 가능합니다.\n\n## 트리 쉐이킹의 효과를 어떻게 측정해볼 수 있을까요? 🧐\n트리 쉐이킹이 적용되었는지 확인하는 가장 일반적인 방법은 번들 크기를 비교하는 것입니다. 번들링된 결과물을 분석하는 webpack의 `bundle analyzer` 같은 도구를 사용하면 번들 이후 코드의 양을 시각적으로 확인할 수 있습니다. 또한, 번들 파일을 직접 확인하여 원래 코드와 비교하는 것도 좋은 방법입니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 제레미의 번들사이즈 최적화](https://www.youtube.com/watch?v=ut10rvh1vug)\n- [[TOAST UT] 트리 쉐이킹으로 자바스크립트 페이로드 줄이기](https://ui.toast.com/weekly-pick/ko_20180716)", "title": "트리 쉐이킹에 대해 설명해주세요."}, "fe-111": {"id": "fe-111", "content": "프로그래밍 언어는 **타입을 어떻게 다루는지에 따라 크게 동적 타입 언어와 정적 타입 언어로 나뉩니다.**\n\n먼저, **동적 타입 언어는 런타임 시점에 변수의 타입이 결정되는 언어입니다.** 대표적인 예시로는 JavaScript, Python, Ruby 등이 있습니다. 동적 타입 언어는 변수의 타입이 고정되어 있지 않아 하나의 변수에 다양한 타입의 값을 할당할 수 있습니다. 예를 들어 JavaScript에서는 다음과 같이 동일한 변수에 다른 타입의 값을 할당할 수 있습니다.\n\n```js\nlet value = 10; // 숫자 타입\nvalue = \"Hello\"; // 문자열 타입 할당됨\n```\n\n이처럼 동적 타입 언어는 개발자가 타입을 명시적으로 선언할 필요 없이 자유롭게 코드를 작성할 수 있도록 합니다. 하지만 실행 중에 타입 오류가 발생할 가능성이 상대적으로 높아 디버깅이 어려울 수 있습니다.\n\n반면, **정적 타입 언어는 컴파일 시점에 변수의 타입이 결정되는 언어입니다.** 대표적인 예시로는 Java, C, TypeScript 등이 있습니다. 정적 타입 언어는 변수의 타입을 미리 선언해야 합니다. 예를 들어 TypeScript에서는 다음과 같이 변수의 타입을 지정합니다.\n\n```ts\nlet value: number = 10;\nvalue = \"Hello\"; // ⚠️ 컴파일 오류 발생\n```\n\n정적 타입 언어는 코드 작성 단계에서 타입 오류를 사전에 방지할 수 있어 안정성이 높고, 코드의 가독성이 좋아집니다. 더불어, IDE에서 자동 완성 기능을 활용할 수 있어 개발 생산성이 향상됩니다. 하지만 자유도가 낮고, 타이핑을 엄격히 하다보면 초기에 개발 속도가 상대적으로 느릴 수 있습니다.\n\n## 동적 타입 언어와 정적 타입 언어 중 어떤 것이 더 나은 선택인가요? 🤔\n이는 정답이 없고 프로젝트의 성격이나 팀의 선호도에 따라 달라지는 문제라고 생각합니다. 빠르게 프로토타입을 만들거나 개발 유연성이 중요한 경우 동적 타입 언어가 유리할 수 있습니다. 반면, 코드의 안정성과 유지보수성을 중요하게 고려해야 하는 대규모의 프로젝트에서는 정적 타입 언어가 더 적합할 것입니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[f-lab] 프로그래밍 언어의 타입 시스템: 정적 타입과 동적 타입 비교](https://f-lab.kr/insight/programming-language-type-systems)\n- [[얄팍한 코딩사전] 자료형과 정적/동적 타입 (+ 컴파일/인터프리터 언어와의 관계)](https://www.youtube.com/watch?v=50N_NiDUKpw&t=1s)", "title": "동적 타입 언어와 정적 타입 언어에 대해 설명해주세요."}, "fe-112": {"id": "fe-112", "content": "`satisfies` 키워드는 **기존 타입 정보를 유지하면서 해당 값이 특정 타입 조건을 충족하는지 확인할 때 사용됩니다.**\n\n예를 들어, `satisfies`는 유니온 타입을 다룰 때 이점이 있습니다. 구체적인 코드를 통해 설명을 드리면 좋을 것 같습니다.\n\n```ts\ntype Color = \"red\" | \"green\" | \"blue\";\ntype RGB = [red: number, green: number, blue: number];\n\nconst palette: Record<Color, string | RGB> = {\n    red: [255, 0, 0],\n    green: \"#00ff00\",\n    blue: [0, 0, 255]\n};\n\n// ⚠️ 오류 발생\nconst greenNormalized = palette.green.toUpperCase();\n```\n\n위 코드에서 `palette.green`의 타입은 `string | RGB`로 변환 추론되기 때문에 `.toUpperCase()` 호출 시 타입 에러가 발생합니다. \n\n```ts\nconst palette = {\n    red: [255, 0, 0],\n    green: \"#00ff00\",\n    blue: [0, 0, 255]\n} satisfies Record<Color, string | RGB>;\n\n// ✅ 정상 동작\nconst greenNormalized = palette.green.toUpperCase();\n```\n\n하지만 위와 같이 `satisfies`를 활용하면 `palette.green`의 타입이 `string`으로 추론되어 `.toUpperCase()`를 정상적으로 호출할 수 있습니다.\n\n즉, `satisfies`를 사용하면, 의도보다 더 넓은 타입으로 추론되는 일을 방지하며 타입 검사를 수행할 수 있습니다.\n\n## 어떤 상황에서 satisfies를 활용해야 할까요? 🤔\n`satisfies`는 유니온 타입의 타입 체크가 필요할 때 유용합니다. 또는, 객체 리터럴이 필수적인 타입을 만족해야 하고, 동시에 추가적인 필드가 존재할 수 있는 경우에도 유용하게 활용될 수 있습니다.\n\n\n## 추가 학습 자료를 공유합니다.\n- [[TypeScript] The satisfies Operator](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-4-9.html)\n- [[데굴데굴 블로그] TypeScript에서 satisfies와 as const로 리터럴 타입 안전하게 다루기](https://blog.hansolbangul.com/post/typescript-satisfies-1)", "title": "타입스크립트 satisfies 키워드에 대해 설명해주세요."}, "fe-113": {"id": "fe-113", "content": "JSX는 **JavaScript XML의 약자로, React에서 UI를 선언적으로 표현하기 위해 사용하는 확장 문법입니다.** HTML과 유사한 문법을 사용하여 JavaScript 코드 안에서 UI 구조를 직관적으로 표현할 수 있도록 해줍니다.\n\nJSX는 브라우저에서 직접 실행할 수 없습니다. Babel과 같은 트랜스파일러를 통해 일반적인 JavaScript 코드로 변환된 후 실행됩니다. 예를 들면 다음과 같습니다.\n```jsx\nconst element = (\n  <h1 className=\"greeting\">\n    Hello, JSX!\n  </h1>\n);\n```\n\n위의 JSX 코드가 트랜스파일링 과정을 거치면 다음과 같은 JavaScript 코드로 변환됩니다.\n\n```jsx\nconst element = React.createElement(\n  'h1',\n  {className: 'greeting'},\n  'Hello, world!'\n);\n```\n\n여기서, `React.createElement()`는 React의 핵심 API 중 하나로, 가상 DOM 요소를 생성하는 역할을 합니다. 이를 통해 React는 요소를 트리 구조로 관리하고, 변경 사항을 효율적으로 감지해 실제 DOM에 반영합니다.\n\n## JSX는 반드시 React에서만 사용해야 하나요? React가 아닌 다른 환경에서도 사용할 수 있나요? 🤔\n\n아닙니다. JSX는 React 전용이 아니며, 다른 라이브러리나 프레임워크에서도 사용할 수 있습니다.\n\nJSX는 단순한 문법 확장이므로, 트랜스파일링을 통해 React 외의 라이브러리에서도 활용할 수 있습니다. JSX를 지원하는 라이브러리를 사용하면 React 없이도 JSX를 사용할 수 있습니다.\n\n## JSX에서는 왜 하나의 부모 요소로 감싸서 요소를 반환해야 하나요? 🧐\nJavascript 문법 상, 하나의 함수에서 배열로 감싸지 않은 두 개의 객체를 반환할 수 없기 때문입니다. JSX도 HTML처럼 보이지만 내부적으로는 일반 JavaScript 객체로 변환됩니다. 따라서 또 다른 태그나 Fragment로 감싸지 않으면 두 개의 JSX 태그를 반환할 수 없습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[react.dev] JSX로 마크업 작성하기](https://ko.react.dev/learn/writing-markup-with-jsx#why-do-multiple-jsx-tags-need-to-be-wrapped)\n", "title": "jsx란 무엇이며, 이는 자바스크립트에서 어떻게 변환되나요?"}, "fe-114": {"id": "fe-114", "content": "CSS 명시도는 **스타일이 충돌할 때 어떤 것이 우선 적용될지를 결정하는 개념입니다.** 웹 페이지에서 여러 개의 CSS 규칙이 동일한 요소에 적용될 수 있습니다. 이때 브라우저는 명시도를 계산하여 어떤 스타일을 적용할지 판단합니다.\n\nCSS 명시도는 선택자의 종류에 따라 다음과 같은 우선순위를 갖습니다.  \n- 1순위: 인라인 스타일\n- 2순위: id 선택자\n- 3순위: 클래스, 가상 클래스, 속성 선택자\n- 4순위: 요소 선택자  \n\n이러한 우선순위에 따라 점수를 부여한 뒤 합산하여 어떤 스타일을 적용할지 결정하는 것입니다. 만약 합산 점수가 동일한 경우, 나중에 선언된 것이 적용됩니다.\n\n```css\np { color: blue; } /* 요소 선택자 */\n.text { color: red; } /* 클래스 선택자 */\n#unique { color: green; } /* ID 선택자 */\n```\n\n```html\n<p id=\"unique\" class=\"text\">Hello, CSS!</p>\n```\n이 경우, `<p>` 요소는 명시도가 가장 높은 ID 선택자가 적용된 `#unique`의 스타일을 따라 초록색(green)으로 표시됩니다.\n\n## 명시도가 높은 스타일을 강제로 덮어쓰려면 어떻게 해야 하나요? 🤔\n`!important`를 사용하면 됩니다. `!important`는 타일 규칙의 명시도를 무시하고 가장 높은 우선순위를 갖게 합니다. 만약 동일한 속성에 대해 여러 개의 `!important` 규칙이 존재하면, 그때는 일반적인 명시도 규칙을 따르게 됩니다.\n\n예를 들어, 다음과 같이 기존의 규칙을 강제로 덮어쓸 수 있습니다.\n```css\np { color: black !important; }\n```\n\n다만, `!important`는 과도하게 사용하면 유지보수가 어려워질 수 있으므로 최대한 필요한 경우에만 사용해야 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[specifishity] 물고기 그림으로 알아보는 css 명시도](https://specifishity.com/)\n- [[MDN] 명시도](https://developer.mozilla.org/ko/docs/Web/CSS/CSS_cascade/Specificity)", "title": "CSS 명시도(Specificity)에 대해서 설명해주세요."}, "fe-115": {"id": "fe-115", "content": "메모리 누수는 **개발자가 의도치 않게 참조를 유지하는 경우에 발생합니다.**\n\n먼저, 가장 흔한 메모리 누수 원인 중 하나는 **이벤트 리스너를 해제하지 않는 경우**입니다. 예를 들어, 특정 DOM 요소에 이벤트 리스너를 등록한 후 해당 요소를 제거할 때, 이벤트 리스너를 명시적으로 제거하지 않으면 해당 요소에 대한 참조가 유지되어 메모리가 해제되지 않습니다. 이를 방지하기 위해서는 `removeEventListener()`를 호출해 불필요한 이벤트 리스너를 제거해야 합니다.\n\n다음으로, **클로저를 잘못 사용하는 경우**에도 메모리 누수가 발생할 수 있습니다. 클로저는 내부 함수가 외부 함수의 변수를 참조할 수 있도록 해주는 유용한 기능이지만, 특정 변수나 DOM 요소를 참조하는 클로저가 계속 유지되면 가비지 컬렉터가 해당 메모리를 회수하지 못하게 됩니다.\n\n또한, **전역 변수를 과도하게 사용하는 경우**에도 메모리 누수를 발생할 수 있습니다. 전역 객체(`window`)에 저장된 변수는 애플리케이션이 종료될 때까지 유지되므로, 필요하지 않은 데이터를 전역 변수로 선언하면 메모리 누수가 발생하게 됩니다. 따라서 전역 범위를 최소화하고, 필요한 경우 즉시 실행 함수나 모듈 패턴을 활용해 변수를 적절히 관리하는 것이 중요합니다.\n\n## 자바스크립트에서 메모리 사용량을 모니터링하는 방법이 있나요? 🤔\n크롬 개발자 도구에서 제공하는 **Memory 탭을 활용하면 메모리 사용량을 쉽게 확인할 수 있습니다.** 'Heap snapshot' 기능을 이용하면 현재 힙 메모리에 어떤 객체들이 존재하는지 파악할 수 있습니다. 또한, 'Allocations on timeline' 기능을 통해 시간에 따른 메모리 할당 및 해제 상태를 실시간으로 확인할 수도 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[yceffort] 자바스크립트 메모리 누수와 해결 방법](https://yceffort.kr/2020/07/memory-leaks-in-javascript)\n- [[10분 테코톡] 코난의 자바스크립트 메모리 관리](https://www.youtube.com/watch?v=1BoJZqxFYfQ)", "title": "자바스크립트에서 메모리 누수가 발생하는 상황들을 설명해주세요."}, "fe-116": {"id": "fe-116", "content": "`dependency`, `devDependency`, `peerDependency`는 모두 npm에서 사용되는 의존성의 유형에 해당합니다.\n\n먼저 `dependency`는 **프로덕션 환경에서도 필요한 패키지를 의미합니다.** 예를 들어, `react`를 사용하는 프로젝트라면 `react` 패키지는 실행에 필수적이므로 `dependencies`에 포함됩니다. 이 의존성은 배포 환경에서도 설치되며, 애플리케이션이 동작하는 데 직접적인 영향을 미칩니다.\n\n반면 `devDependency`는 **개발 과정에서만 필요한 패키지를 의미합니다.** 예를 들어, `eslint`, `jest`, `webpack` 같은 도구들은 코드 품질 검증이나 테스트, 번들링을 위해 사용되지만, 실제 서비스 운영에는 필요하지 않습니다. 따라서 `devDependencies`에 포함하여 프로덕션 환경에서 설치되지 않도록 합니다.\n\n마지막으로 `peerDependency`는 **호환성을 위해 특정 버전의 다른 패키지를 필요로 한다는 사실을 명시합니다.** 이 의존성은 보통 라이브러리를 개발할 때 중요하며, 해당 패키지가 특정 버전의 다른 패키지를 사용해야 할 경우 지정합니다. 이를 통해 호환성 문제를 줄이면서도 동일한 패키지가 여러 번 설치되는 문제를 방지할 수 있습니다.\n\n## dependencies와 devDependencies를 잘못 설정하면 어떤 문제가 발생할 수 있을까요? 🤔\n**불필요한 패키지가 프로덕션 환경에 포함되는 문제가 발생합니다.** 예를 들어, `devDependencies`에 추가해야 할 `webpack` 같은 패키지를 `dependencies`에 추가하면 배포된 애플리케이션 크기가 불필요하게 커질 수 있습니다. 이는 배포 속도 저하나 서버 부하 증가의 원인이 될 수 있습니다. 또한, 불필요한 패키지를 포함하면 보안 취약점이 늘어나게 됩니다.\n\n반대로, `dependencies`에 있어야 할 패키지를 `devDependencies`에 잘못 넣으면, 실제 운영 환경에서 해당 패키지가 누락되어 애플리케이션이 정상적으로 실행되지 않을 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[bohyeon-n] Peer Dependencies는 왜 쓸까?](https://bohyeon-n.github.io/deploy/etc/peerdependencies.html)", "title": "dependency, devDependency, peerDependency에 대해서 설명해주세요."}, "fe-117": {"id": "fe-117", "content": "Storybook은 **UI 컴포넌트를 개발하고 문서화하는 데 사용되는 개발 도구입니다.** Storybook은 컴포넌트의 상태와 동작을 독립적으로 테스트할 수 있도록 도와줍니다. \n\nStorybook에서 \"Story\"란 **특정 컴포넌트가 특정 상태에서 어떻게 렌더링되는지를 정의**하는 것입니다. 예를 들어, 버튼 컴포넌트가 기본 상태에서 렌더링되는 모습과 비활성화된 상태에서 렌더링되는 모습을 각각 별도의 스토리로 정의할 수 있습니다. 이를 통해 UI 컴포넌트의 다양한 활용 사례들을 쉽게 테스트하고 관리할 수 있습니다.\n\nStorybook을 활용하면, 전체 애플리케이션을 실행하지 않고도 **개별 컴포넌트를 분리하여 개발하고 테스트할 수 있어 개발 생산성이 향상**됩니다.\n\n또한, Storybook은 개발자뿐만 아니라 디자이너, QA, PM과 같은 **다양한 직군과의 협업을 원활하게 해줍니다.** 팀원들이 직접 컴포넌트를 시각적으로 확인하고 피드백을 줄 수 있어, 개발 프로세스에서 커뮤니케이션 비용을 줄이는 데 도움이 됩니다. 특히, 디자인 시스템을 구축하는 경우 Storybook을 활용하면 컴포넌트 라이브러리를 보다 쉽게 문서화하고 공유할 수 있습니다.\n\n## Storybook을 도입할 때의 단점은 없을까요? 🤔\n**Storybook 관련 설정과 유지보수를 위한 추가적인 업무가 발생하게 됩니다.** 특히, 대규모 프로젝트에서는 수많은 스토리 파일을 관리하는 것이 큰 부담이 될 수 있습니다. 특정 라이브러리와의 호환성 문제가 발생할 수도 있습니다. 또한, 서버와 연동된 컴포넌트의 경우 Mock 데이터를 따로 설정해야 하는 부담이 생깁니다.\n\n따라서 Storybook의 장점을 명확하게 누릴 수 있는 상황인지 판단하고 신중하게 도입할 필요가 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [Storybook 공식 홈페이지](https://storybook.js.org/)\n- [[f-lab] 스토리북(Storybook) 도입으로 UI 컴포넌트 개발 최적화하기\n](https://f-lab.kr/insight/optimizing-ui-component-development-with-storybook)", "title": "Storybook을 알고 계신가요? Storybook이란 무엇인지 설명해주세요."}, "fe-118": {"id": "fe-118", "content": "최신 버전의 Next.js는 성능 최적화를 위해 다양한 캐싱 기능들을 제공합니다. 크게 리퀘스트 메모이제이션, 클라이언트 라우터 캐시, 데이터 캐시, 풀 라우트 캐시로 나누어 설명드리겠습니다.\n\n먼저, **리퀘스트 메모이제이션은 동일한 요청이 여러 번 발생할 때, 불필요한 추가 요청을 방지하는 기능입니다.** 기본적으로 Next.js는 서버 사이드에서 동일한 요청이 중복 발생하면 기존 응답을 재사용합니다. 이를 통해 하나의 페이지 내에 존재하는 중복된 요청을 방지하여 네트워크 비용을 감소시킵니다.\n\n**클라이언트 라우터 캐시는 레이아웃, 로딩 상태와 같이 공통적으로 쓰이는 요소에 대한 RSC Payload를 브라우저에 캐싱하는 기능입니다.** 이를 통해 클라이언트 측에서 페이지 전환 시 캐싱된 데이터를 활용하기 때문에 빠른 탐색이 가능합니다. 또한 서버 부하가 줄어드는 효과도 있습니다.\n\n**데이터 캐시는 네트워크 요청에 대한 응답을 Next 서버에 캐싱하는 기능입니다.** Next.js에서는 `fetch()`에 다양한 데이터 캐시 옵션을 적용할 수 있습니다. 예를 들면, `{ cache: 'force-cache' }`을 통해 캐싱을 적용할 수 있습니다. `revalidate` 옵션을 통해 캐싱을 적용하되 일정 주기로 갱신하도록 설정할 수도 있습니다. 또한, `{ cache: 'no-store' }`을 통해 캐싱 없이 항상 새로운 데이터를 가져오도록 설정할 수 있습니다.\n\n끝으로, **풀 라우트 캐시는 서버에서 미리 생성된 페이지를 저장하고, 이후 동일한 요청이 들어오면 캐싱된 페이지를 즉시 제공하는 방식입니다.** `cookies()`, `headers()`와 같은 Dynamic Function을 사용하거나 Route Segment Config를 동적 옵션으로 설정하지 않고, 데이터 캐시를 적용하면 풀 라우트 캐시가 활성화됩니다. `fetch()`에 `revalidate` 옵션을 설정하면 일정 주기로 페이지가 갱신되는 ISR 방식으로 동작하도록 설정할 수도 있습니다. 풀 라우트 캐시를 적용하면 페이지 로드 속도를 극대화할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[Next.js 한글 문서] Caching in Next.js](https://nextjs-ko.org/docs/app/building-your-application/caching)\n- [[kakao entertainment] Next.js 캐싱으로 웹 서버 성능 최적화](https://fe-developers.kakaoent.com/2024/240418-optimizing-nextjs-cache/)", "title": "최신 버전의 Next.js가 제공하는 캐싱 기능들에 대해 설명해주세요."}, "fe-119": {"id": "fe-119", "content": "3-way handshake는 TCP 연결을 수립하는 과정으로, 클라이언트와 서버 간에 신뢰성 있는 연결을 보장하기 위해 존재합니다. 이 과정은 크게 세 단계로 구성됩니다.\n\n첫째, **클라이언트가 서버에 SYN 패킷을 보내면서 연결 요청을 시작**합니다. 이 패킷에는 클라이언트의 초기 시퀀스 번호(Initial Sequence Number)가 포함됩니다.\n\n둘째, **서버는 클라이언트의 SYN을 받고 SYN-ACK 패킷으로 응답**합니다. 서버가 클라이언트로부터 요청을 잘 받았다고 확인하고, 데이터를 주고받을 준비가 되었음을 알리는 과정입니다. 이 패킷에는 클라이언트의 시퀀스 번호에 1을 더한 값(ACK)과 서버 자신의 초기 시퀀스 번호(SYN)가 포함됩니다.\n\n마지막으로, **클라이언트는 서버의 SYN-ACK를 받고 ACK 패킷을 보냅니다**. 이 패킷에는 서버의 시퀀스 번호에 1을 더한 값이 포함됩니다.\n\n이 세 단계가 완료되면 TCP 연결이 수립되어 신뢰성 있는 데이터 전송이 가능해집니다.\n\n## 3-way handshake 과정이 필요한 이유는 무엇인가요? 🤔\nTCP는 신뢰성 있는 데이터 전송을 보장해야 하기 때문에, 송신자와 수신자가 서로를 확인하고 준비 상태를 점검하는 3-way handshake 과정을 거치는 것입니다. 단순히 패킷을 한 번 보내는 것이 아니라, 세 번의 패킷 교환을 통해 실제 연결이 정상적으로 설정되었는지 확인할 수 있습니다. 만약 이 과정이 없다면, 네트워크 지연이나 패킷 손실로 인해 잘못된 연결이 설정될 가능성이 있습니다.\n\n## 3-way handshake 없이 데이터를 전송할 수 있는 프로토콜도 있나요? 🧐\n네, 대표적으로 UDP가 있습니다. UDP는 TCP와 달리 연결을 설정하는 과정 없이 데이터를 바로 전송합니다. 따라서 속도는 빠르지만 신뢰성이 보장되지 않습니다. 영상 스트리밍이나 온라인 게임처럼 실시간성이 필요한 경우에는 UDP를 사용합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[따라學IT] 09. 연결지향형 TCP 프로토콜 - TCP 3Way Handshake](https://www.youtube.com/watch?v=Ah4-MWISel8)\n- [[10분 테코톡] 🔮 수리의 TCP/IP](https://youtu.be/BEK354TRgZ8?feature=shared)", "title": "TCP 3-way handshake 과정에 대해서 설명해주세요."}, "fe-12": {"id": "fe-12", "content": "리액트의 렌더링 과정은 크게 두 가지 단계로 나눌 수 있습니다.\n**render phase**와 **commit phase**입니다.\n\n먼저 **render phase는 리액트가 변화된 상태나 props에 따라 어떤 UI가 변경되어야 할지를 결정하는 단계**입니다.\n이 과정에서는 실제로 DOM을 업데이트하지 않고, 변경사항을 가상 DOM에서 계산하여 비교합니다.\n이 단계는 순수하게 계산과정이기 때문에 성능에 영향을 주지 않도록 중단되거나 다시 실행될 수 있으며, React 18에서 도입된 **Concurrent Mode**를 통해 비동기적으로 처리될 수도 있습니다.\n\n다음으로 **commit phase는 실제로 변화된 UI를 DOM에 반영하는 단계**입니다.\n이때 리액트는 가상 DOM에서 계산된 결과를 실제 DOM에 적용하고, 변화된 UI를 브라우저에 렌더링합니다. DOM 업데이트 이후에는 `useEffect`와 같은 사이드 이펙트를 발생시키는 훅들이 실행됩니다.\n\n요약하면 **render phase**는 변화된 UI를 결정하는 계산 과정이고, **commit phase**는 그 계산된 결과를 실제로 반영하는 단계입니다.\n\n## 그럼 render phase와 commit phase가 동기화될 때의 특징이 있을까요? 🤔\n\n크게 두 가지로 말씀드릴 수 있습니다. **단계적 진행**과 **병목 관리**입니다.\n\n첫번째로 render phase가 완료되면 리액트는 즉시 commit phase를 실행하지 않고, **다른 높은 우선순위 작업이 있다면 먼저 처리한 후 나중에 commit phase를 실행**할 수 있습니다. 이러한 단계적 진행을 통해 React는 동기화가 필요한 작업을 효율적으로 관리하여 사용자 경험을 개선합니다.\n\n두번째로 **병목 관리**입니다. render phase에서 모든 변경 사항이 Fiber Tree에 준비된 상태에서 commit phase로 넘어가므로, render와 commit 단계의 일관성이 유지됩니다. 이렇게 두 단계는 순차적으로 작동하여, UI가 정확하게 동기화되고 불필요한 재렌더링을 방지합니다.", "title": "리액트의 render phase와 commit phase에 대해서 설명해주세요."}, "fe-120": {"id": "fe-120", "content": "결합도와 응집도는 코드 설계의 품질을 결정하는 중요한 개념들입니다.\n\n먼저, 결합도는 **서로 다른 모듈 간에 상호 의존하고 있는 정도가 얼마나 높은지**를 의미합니다. 만약 결합도가 낮으면 모듈의 독립성이 높아져 변경이 용이해지고 코드의 재사용성이 증가합니다. 반면, 결합도가 높으면 한 모듈이 변경될 때 다른 모듈도 영향을 받을 가능성이 커집니다. 이로 인해 한 부분을 수정하면 연쇄적인 변경이 발생할 가능성이 높은데, 이는 유지보수를 어렵게 만듭니다. 이상적인 설계를 위해서는 결합도를 낮추는 것이 중요합니다.\n\n응집도는 **모듈 내부 요소들이 얼마나 밀접하게 서로 관련되어 있는지**를 의미합니다. 응집도가 높을수록 모듈 내부의 기능이 단일한 목적을 가지고 있습니다. 이러한 특성은 가독성과 유지보수성에 도움이 됩니다. 반대로 응집도가 낮으면 하나의 모듈이 여러 가지 역할을 수행하게 되어 코드가 복잡해지고, 예측 가능성이 낮아져 수정할 때 예상치 못한 부작용이 발생할 가능성이 높아집니다. 따라서 이상적인 코드 설계를 위해서는 응집도를 높이는 것이 중요합니다.\n\n주로 **결합도와 응집도는 서로 반비례하는 경향이 있습니다.** 일반적으로 결합도가 낮을수록 응집도가 높아지고, 반대로 결합도가 높으면 응집도가 낮아지는 경우가 많습니다.\n\n## 결합도 및 응집도와 관련된 예시를 설명해주실 수 있나요? 🤔\n예를 들어, 하나의 모듈이 다른 모듈의 내부 구현에 직접 접근한다면 결합도가 높은 상태입니다. 인터페이스를 통해 의존 관계를 느슨하게 만들면 결합도를 낮출 수 있습니다.\n\n한편, 하나의 파일에서 사용자 인증과 데이터베이스 처리를 함께 담당한다면 응집도가 낮다고 볼 수 있습니다. 이러한 경우 인증 관련 로직과 데이터베이스 처리를 분리하여 각각의 책임을 명확히 하면 응집도를 높일 수 있습니다. \n\n## 📚 추가 학습 자료를 공유합니다.\n- [객체의 결합도 & 응집도 의미와 단계 💯 총정리](https://inpa.tistory.com/entry/OOP-%F0%9F%92%A0-%EA%B0%9D%EC%B2%B4%EC%9D%98-%EA%B2%B0%ED%95%A9%EB%8F%84-%EC%9D%91%EC%A7%91%EB%8F%84-%EC%9D%98%EB%AF%B8%EC%99%80-%EB%8B%A8%EA%B3%84-%EC%9D%B4%ED%95%B4%ED%95%98%EA%B8%B0-%EC%89%BD%EA%B2%8C-%EC%A0%95%EB%A6%AC)\n- [[Toss Frontend Fundametals] 변경하기 쉬운 코드](https://frontend-fundamentals.com/code/)", "title": "결합도와 응집도에 대해 설명해주세요."}, "fe-121": {"id": "fe-121", "content": "## 생성자 함수가 무엇인가요?\n자바스크립트에서 **생성자 함수는 객체를 생성하는 하나의 방법**입니다. 일반적으로 `function` 키워드를 사용하여 정의하며, `new` 키워드와 함께 호출할 경우 새로운 객체가 만들어집니다. 생성자 함수 내부에서 `this` 키워드는 새롭게 생성된 객체를 가리키며, 여기에 속성을 추가하면 해당 객체에 저장됩니다.\n\n예를 들어, 다음과 같은 방식으로 생성자 함수를 사용할 수 있습니다.\n```js\nfunction Person(name, age) {\n  this.name = name;\n  this.age = age;\n}\n\nPerson.prototype.greet = function() {\n  console.log(`안녕하세요, 저는 ${this.name}입니다.`);\n};\n\nconst person1 = new Person('Alice', 25);\n```\n\n## class 문법은 왜 도입되었나요? 🤔\n**생성자 함수는 유지보수성이 떨어진다는 문제가 있습니다.** 우선, 명확한 클래스 개념이 없기 때문에 상속을 구현할 때 프로토타입 체인을 이용해야 하는데, 이는 가독성이 좋지 않습니다. 다른 객체지향 언어와 형태가 많이 다르기 때문에 이해하기 비교적 어렵기도 합니다. 또한 `new` 키워드 없이 일반 함수처럼 호출될 수도 있어 혼동을 유발합니다.\n\n이러한 단점을 극복하기 위해 `class` 문법이 등장했습니다. `class`를 사용하면 객체를 생성하는 코드를 더욱 직관적으로 작성할 수 있습니다. 예시와 함께 설명드리겠습니다.\n\n```js\nclass Person {\n  constructor(name, age) {\n    this.name = name;\n    this.age = age;\n  }\n  \n  greet() {\n    console.log(`안녕하세요, 저는 ${this.name}입니다.`);\n  }\n}\n\nconst person2 = new Person('Bob', 30);\n```\n이처럼 `class`를 사용하면 생성자와 메서드를 명확하게 정의할 수 있습니다. 또한 다른 객체지향 언어의 문법과 유사한 형태여서 이해하기 쉽습니다. `extends`, `super`를 이용하여 상속을 간결하게 구현할 수 있고, `static`, `getter/setter` 등 객체지향 관련 키워드를 지원하기도 합니다. 또한, 생성자 함수와 달리 일반 함수처럼 호출할 수 없도록 하는 제약이 추가됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[javascript.info] new 연산자와 생성자 함수](https://ko.javascript.info/constructor-new)\n- [[RoyJung] ES6 Class는 단지 prototype 상속의 문법설탕일 뿐인가?](https://roy-jung.github.io/161007_is-class-only-a-syntactic-sugar/)", "title": "자바스크립트에서 생성자 함수가 무엇인지, class 문법은 왜 도입되었는지 설명해주세요."}, "fe-122": {"id": "fe-122", "content": "메모리 관리를 크게 **메모리 할당과 해제** 두 가지 과정으로 나누어 설명드리겠습니다. C와 같은 저수준 언어에서는 `malloc()`, `free()`와 같은 함수를 통해 개발자가 직접 메모리를 할당하고 해제합니다. 하지만 자바스크립트에서는 이러한 작업이 언어 차원에서 자동으로 이루어집니다.\n\n메모리 할당과 해제에 대해 차례로 설명드리겠습니다.\n\n## 메모리 할당\n**메모리 할당은 변수나 객체를 생성할 때 발생합니다.** 예를 들어, `const name = \"maeil-mail\";` 와 같은 코드에서 `name` 변수는 메모리에 할당됩니다.\n\n문자열, 숫자와 같은 원시 값은 Stack 영역에 저장됩니다. 원시 값은 고정 크기를 가지기 때문에 엔진이 컴파일 타임에 그 크기를 알고 있어 **정적 데이터**라고 불립니다.\n\n한편, 객체(참조 타입)는 Heap 영역에 저장됩니다. 객체는 실행 시점에 필요한 만큼 메모리가 동적으로 할당되기 때문에 **동적 데이터**라고 불립니다.\n\n## 메모리 해제\n**메모리 해제는 할당된 메모리가 더 이상 필요없을 때 발생합니다.** 자바스크립트는 **가비지 컬렉션(GC)** 이라는 자동 메모리 해제 방법을 사용합니다. 언어 차원에서 메모리 할당을 추적하고, 특정 메모리가 필요하지 않게 되었다면 메모리를 해제하는 방식입니다. \n\n대표적인 가비지 컬렉션 알고리즘인 Reference-counting과 Mark-and-sweep에 대해 간단히 설명드리겠습니다.\n\n**Reference-counting**는 단순하게 구현된 알고리즘으로, 객체가 참조되는 횟수를 추적하고 참조 횟수가 0이 되면 메모리에서 해제합니다. 즉, 다른 어떤 객체도 참조하지 않는 객체를 찾아내어 메모리를 해제하는 방식입니다. 하지만 이 방식에서는 순환 참조가 발생할 경우, 참조 카운트가 0이 되지 않아 메모리에서 해제되지 않는 문제가 발생하는 한계점이 있습니다.\n\n**Mark-and-sweep**은 루트 객체에서 시작하여 참조되는 객체를 표시(mark)하고, 마지막까지 표시되지 않은 객체를 찾아 메모리를 청소(sweep), 즉 해제하는 방식입니다. 이 방식에서는 순환 참조가 발생하더라도 루트에서 도달이 불가능하다면 표시가 되지 않습니다. 이런 특징으로 인해 Reference-counting 방식의 한계점을 보완할 수 있습니다.\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] JavaScript의 메모리 관리](https://developer.mozilla.org/ko/docs/Web/JavaScript/Guide/Memory_management)\n- [[매일메일] 자바스크립트에서 메모리 누수가 발생하는 상황들을 설명해주세요.](https://www.maeil-mail.kr/question/239)\n- [[10분 테코톡] 코난의 자바스크립트 메모리 관리](https://www.youtube.com/watch?v=1BoJZqxFYfQ)", "title": "자바스크립트의 메모리 관리에 대해서 아는대로 설명해주세요."}, "fe-123": {"id": "fe-123", "content": "OSI 7계층은 **국제표준화기구(ISO)에서 제시한 국제 표준 규약으로, 네트워크 통신이 일어나는 과정을 7개의 계층으로 나누어 정의했습니다.** 각 계층은 하위 계층의 기능만을 이용하며 상위 계층에게 기능을 제공합니다. \n\n**1계층 `물리 계층(Physical Layer)`은 실제로 데이터를 전송하는 하드웨어적인 부분을 담당합니다.** 데이터를 0과 1의 신호로 변환해 전기, 빛, 무선 주파수 등을 통해 전달하는 역할을 합니다. 흔히 볼 수 있는 케이블, 안테나 같은 장비가 물리 계층에서 동작합니다.\n\n**2계층 `데이터 링크 계층(Data Link Layer)`은 신뢰성 있는 전송을 보장하기 위한 계층입니다.** 물리 계층에서 전송된 데이터를 프레임 단위로 관리하고, 통신 오류를 감지 및 수정하는 역할을 수행합니다. 데이터 링크 계층에서는 각 장치가 서로를 구별할 수 있도록 MAC 주소를 가지고 통신합니다. 대표적으로 스위치가 이 계층에서 동작합니다.\n\n**3계층 `네트워크 계층(Network Layer)`은 데이터를 목적지까지 정확하게 전달하는 역할을 합니다.** 쉽게 말해, 네트워크 상에서 최적의 길을 찾아 패킷을 목적지까지 보내는 기능을 합니다. 여기에는 라우터와 같은 장치나 `IP`와 같은 프로토콜이 포함됩니다.\n\n**4계층 `전송 계층(Transport Layer)`은 양 끝단의 사용자들이 신뢰성 있는 데이터를 주고 받을 수 있도록 해주는 역할을 합니다.** 전송 계층은 오류 검출 및 복구, 흐름 제어, 순서 보장과 같은 일들에 중점을 둡니다. 대표적으로 `TCP`와 `UDP`가 전송 계층에 속합니다.\n\n**5계층 `세션 계층(Session Layer)`은 애플리케이션 간의 통신 연결을 설정하고 유지하는 역할을 합니다.** 연결이 끊어졌을 때 다시 복구하는 기능도 포함됩니다. 대표적으로 `RPC`와 `NetBIOS`가 세션 계층에 속합니다.\n\n**6계층 `표현 계층(Presentation Layer)`은 데이터 표현 방식을 다룹니다.** 하위 계층으로부터 온 데이터를 사용자가 이해할 수 있는 형태로 만들기 위해 데이터 형식을 변환합니다. 혹은, 암호화 및 복호화, 압축과 같은 작업을 수행합니다. 예를 들면, `MIME 인코딩`, `ASCII 인코딩` 등의 작업이 표현 계층에서 이루어집니다. \n\n**7계층 `응용 계층(Application Layer)`은 사용자와 직접 접하여 네트워크에 접근할 수 있게 해주는 역할을 합니다.** 유저가 사용하는 웹 브라우저, 이메일, 메신저 같은 애플리케이션이 이 계층에서 동작합니다. 대표적으로 `HTTP`, `SMTP`, `FTP` 같은 프로토콜이 응용 계층에 포함됩니다.\n\n## OSI 7계층의 필요성을 설명해주세요. 🤔\nOSI 7계층은 서로 다른 시스템끼리 올바르게 통신할 수 있도록 표준화된 규칙을 제시해줍니다. 더불어, 전체 통신 흐름을 이해하기 용이하게 해주고, 계층을 명확히 나눔으로써 문제가 발생했을 때 원인을 좁히고 해결하는 데 도움을 줍니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 이오의 OSI 7계층](https://www.youtube.com/watch?v=wuOzMvNEzAg)\n- [[cloudflare] OSI 모델이란?](https://www.cloudflare.com/ko-kr/learning/ddos/glossary/open-systems-interconnection-model-osi/)", "title": "OSI 7계층에 대해서 설명해주세요."}, "fe-124": {"id": "fe-124", "content": "`ETag(Entity Tag)`는 **HTTP 프로토콜에서 사용되는 헤더로, 웹 리소스의 특정 버전을 식별하는 고유한 식별자**입니다.\n\n서버가 클라이언트에게 리소스를 전송할 때 `ETag` 헤더를 포함시키고, 클라이언트는 이후 요청 시 `If-None-Match` 헤더에 이 값을 포함하여 조건부 요청을 보낼 수 있습니다.\n\n`ETag`의 주요 목적은 **캐싱 효율성을 높이는 것입니다.** 클라이언트가 이미 가지고 있는 리소스와 서버의 현재 버전이 동일한지 확인할 수 있어, 변경되지 않았다면 전체 콘텐츠를 다시 다운로드하지 않고 `304 Not Modified` 응답을 받습니다. 이를 통해 네트워크 트래픽과 서버 부하를 줄일 수 있습니다.\n\n`Last-Modified` 헤더와 비슷한 역할을 하지만, 타임스탬프 기반이 아닌 콘텐츠 기반으로 동작합니다. 그렇기 때문에 `ETag`는 1초 내에 여러 변경이 있거나 시간 기반 비교가 적합하지 않은 상황에서 더 정확한 캐싱을 제공합니다.\n\n`ETag` 값은 보통 리소스의 내용에 기반한 해시값이나 버전 번호로 생성되며, `Strong ETag`와 `Weak ETag(W/ 접두사 사용)` 두 종류로 나뉩니다. `Strong ETag`는 바이트 단위까지 정확히 일치해야 하고, `Weak ETag`는 의미적으로 동등하면 일치하는 것으로 간주합니다.\n\n## ETag를 Cache-Control 헤더와 함께 사용하기도 하나요? 🤔\n\n`ETag`와 `Cache-Control`은 서로 보완적인 관계에 있으며, 함께 사용하면 더 효과적인 캐싱 전략을 구현할 수 있습니다.\n\n`Cache-Control`은 **리소스의 캐싱 정책을 직접적으로 지정하는 헤더로, 캐시 가능 여부, 유효 기간, 재검증 요구사항 등을 설정**합니다. 반면 `ETag`는 리소스의 변경 여부를 확인하는 메커니즘을 제공합니다.\n\n실제 프로젝트에서는 두 헤더를 다음과 같이 조합하여 사용할 수 있습니다.\n\n\n```\nCache-Control: max-age=31536000\nETag: \"abc123\"\n```\n\n정적 리소스(이미지, CSS, JS 등)의 경우, 이와 같이 설정하면 1년간 클라이언트 캐시를 사용하되, 리소스 갱신 시(ex. 배포) `ETag`가 변경되어 새 버전을 받아갑니다. 파일명에 해시를 포함시키는 방식으로도 구현할 수 있습니다.\n\n\n```\nCache-Control: no-cache\nETag: \"xyz789\"\n```\n\n자주 변경되는 API 응답의 경우, 이처럼 `no-cache` 설정으로 매번 서버에 재검증을 요청하게 하되, `ETag`를 통해 콘텐츠가 변경되지 않았다면 `304` 응답으로 데이터 전송을 줄일 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] ETag](https://developer.mozilla.org/ko/docs/Web/HTTP/Reference/Headers/ETag)\n- [[생활코딩] HTTP Cache - 5. ETag](https://www.youtube.com/watch?v=cFsGpS9WHxw)\n", "title": "HTTP의 ETag에 대해서 설명해주세요."}, "fe-125": {"id": "fe-125", "content": "JSON Schema는 **JSON 데이터의 형식을 기술하고 검증하기 위한 명세서**입니다. 특정 JSON이 어떤 구조를 가져야 하는지를 명시할 수 있도록 해줍니다. \n\n예를 들어 회원 정보에 대한 명세를 다음과 같이 작성할 수 있습니다.\n```json\n{\n  \"type\": \"object\",\n  \"properties\": {\n    \"username\": { \"type\": \"string\", \"minLength\": 3 },\n    \"email\": { \"type\": \"string\", \"format\": \"email\" },\n    \"password\": { \"type\": \"string\", \"minLength\": 6 }\n  },\n  \"required\": [\"username\", \"email\", \"password\"],\n  \"additionalProperties\": false\n}\n```\n\nJSON Schema가 어떻게 활용될 수 있는지 구체적으로 설명해 드리겠습니다.\n\n먼저, **백엔드 API와의 통신 과정에서 데이터 형식을 검증하는 데 활용될 수 있습니다.** 예를 들어 백엔드에서 데이터를 내려줄 때, JSON Schema를 활용하여 그 데이터가 어떤 속성들을 가지고 있는지, 타입은 어떤지, 필수인지 아닌지 정의할 수 있습니다. 그러면 프론트엔드에서는 그 스키마를 기준으로 데이터의 유효성을 검증할 수 있어서, API 통신에서 발생할 수 있는 오류를 사전에 방지할 수 있습니다.\n\n**JSON Schema는 정적 타입 생성 도구와 통합되어 사용되며 개발 생산성을 높여주기도 합니다.** 예를 들어 `json-schema-to-typescript` 같은 도구를 사용하면 JSON Schema로부터 TypeScript 타입을 자동 생성할 수 있습니다. 이는 API 명세에 따라 타입을 작성하거나 수정하는 시간을 아껴주며, 스키마와 타입 간의 불일치를 줄이는 데 도움이 됩니다.\n\n또한, **설정 파일에 대한 명세서로 활용될 수 있습니다.** 예를 들어 `eslintrc`, `tsconfig`, `prettierrc` 같은 설정 파일들은 대부분 JSON 기반 형식을 사용하는데, `JSON Schema Store`에서 이러한 설정 파일들의 JSON Schema를 찾아볼 수 있습니다. VSCode와 같은 에디터에서 이 스키마를 기반으로 자동 완성, 타입 힌트, 경고 메시지 등을 지원하기 때문에, 설정 실수를 줄이고 생산성을 높이는 데 큰 도움이 됩니다. \n\n## 📚 추가 학습 자료를 공유합니다.\n- [[JSON Schema] what is a schema](https://json-schema.org/understanding-json-schema/about)\n- [JSON Schema: JSON 스키마란 무엇일까?](https://madplay.github.io/post/understanding-json-schema)", "title": "JSON Schema에 대해 설명해주세요."}, "fe-126": {"id": "fe-126", "content": "클라이언트 사이드 라우팅은 **브라우저에서 페이지를 전환할 때 전체 페이지를 다시 불러오지 않고, 현재 로딩된 애플리케이션 내에서 필요한 컴포넌트만 교체하는 방식**입니다.\n\n클라이언트 사이드 라우팅의 과정에 대해 구체적으로 설명드리겠습니다.\n\n기본적으로 사용자가 `<Link to=\"/about\">About</Link>`와 같은 요소를 클릭하면, 브라우저는 바뀐 URL에 따라 전체 페이지를 다시 로드하려고 합니다. 하지만 `React Router`와 같은 라이브러리를 사용할 경우, 이 기본 동작은 막히게 됩니다.\n\n이때 라우터는 `window.history.pushState()` 메서드를 호출하여 브라우저의 URL을 바꾸면서도, 실제로 서버에 요청은 보내지 않습니다. 즉, 브라우저 히스토리에 해당 URL을 추가만 할 뿐, 아무런 렌더링도 일으키지 않습니다. 대신 라우터는 별도로 현재 URL이 변경되었는지 감지하고, 그 경로에 매핑된 React 컴포넌트를 찾아서 렌더링합니다.\n\n예를 들어, `/about`이라는 경로로 이동하면, Javascript 코드에 의해 라우터가 내부적으로 정의된 `<Route path=\"/about\" element={<AboutPage />}>` 항목을 찾고, 이때 `<AboutPage />` 컴포넌트가 렌더링됩니다. 이렇게 하면 전체 HTML을 다시 불러오지 않아도 브라우저가 마치 새로운 페이지로 이동한 것처럼 보이게 됩니다.\n\n또한, 이 과정에서 필요한 데이터가 있다면, 새롭게 렌더링된 컴포넌트 내에서 `useEffect()` 등을 통해 API 요청을 보내거나 상태를 업데이트합니다. 이러한 동작이 JavaScript로 이뤄지기 때문에, 네트워크 요청은 서버 HTML이 아니라 데이터에 집중되고, 사용자에게는 빠른 페이지 전환을 제공할 수 있게 됩니다.\n\n그리고 브라우저의 \"뒤로 가기\"나 \"앞으로 가기\" 버튼을 눌렀을 때는 `popstate` 이벤트가 발생합니다. 이때도 `React Router`는 해당 이벤트를 구독하고 있다가, 바뀐 URL을 다시 분석해서 그에 맞는 컴포넌트를 렌더링합니다. 따라서 사용자가 뒤로가기 버튼을 눌러도 전체 리프레시가 일어나지 않고, CSR 방식으로 화면 전환만 일어나게 됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[김정환 블로그] 리액트 라우터 만들기](https://jeonghwan-kim.github.io/dev/2022/05/06/react-router.html)\n- [React Rotuer 공식 홈페이지](https://reactrouter.com/home)", "title": "클라이언트 사이드 라우팅이 동작하는 과정에 대해 설명해주세요."}, "fe-127": {"id": "fe-127", "content": "`관계형 데이터베이스`는 **데이터를 테이블 형식으로 저장하고 관리하는 데이터베이스입니다.** 각 테이블은 고정된 스키마를 가지며, 행(Row)은 개별 레코드, 열(Column)은 속성을 나타냅니다. 각 테이블은 고유한 스키마를 가지고 있어, 데이터 타입과 구조가 엄격하게 정의되어 있습니다. 대표적인 예로는 `MySQL`, `PostgreSQL`, `Oracle`이 있습니다.\n\n**관계형 데이터베이스는 정형화된 데이터를 다룰 때 특히 유용합니다.** 미리 정의된 타입과 구조가 있기 때문에 이에 부합하는지 검증하여 데이터의 일관성을 유지하기 용이합니다. 또한, 데이터 간의 관계를 명확히 표현할 수 있는 것이 큰 장점입니다. 예를 들어 사용자와 주문 데이터를 각각 테이블로 만들고, 사용자 ID를 외래키로 설정해 두 테이블을 연결할 수 있습니다. 이를 통해 하나의 사용자에 속한 주문 내역을 정확히 조회할 수 있으며, 이 외에도 복잡한 조건의 데이터 조회나 조인을 처리하기 용이합니다.\n\n반면, 흔히 NoSQL이라고 부르기도 하는 `비관계형 데이터베이스`는 **전통적인 테이블 기반 구조가 아닌, 보다 유연한 데이터 모델을 사용합니다.** \"Key - value\", \"Document\", \"Graph\" 등의 유형이 존재합니다. 비관계형 데이터베이스는 스키마가 고정되어 있지 않아서, 저장되는 데이터 구조가 일관되지 않아도 됩니다. 필요에 따라 유동적으로 속성을 추가할 수도 있습니다. 대표적인 예로는 `MongoDB`, `Cassandra`, `Redis`가 있습니다.\n\n**비관계형 데이터베이스의 장점은 유연성과 확장성입니다.** 스키마가 고정되어 있지 않기 때문에, 초기 개발 단계에서 데이터 구조가 자주 변경될 가능성이 있는 프로젝트에 특히 적합합니다. 또한, 수평적 확장이 쉬워서 대용량의 데이터를 빠르게 처리하거나, 사용자가 급격히 늘어나는 상황에서도 안정적인 성능을 유지할 수 있다는 장점이 있습니다. 문서 기반 NoSQL에서는 하나의 객체에 필요한 데이터를 모두 담을 수 있어서, 관계를 맺고 조인하는 대신 한 번의 조회로 필요한 정보를 가져올 수 있다는 장점도 있습니다.\n\n## 둘의 단점에 대해서도 간단히 설명해주실 수 있나요? 🤔\n**관계형 데이터베이스의 단점은 유연성이 떨어진다는 점입니다.** 스키마가 고정돼 있기 때문에, 새로운 필드를 추가하거나 데이터 구조를 바꾸려면 테이블 자체를 수정해야 하고, 이로 인해 마이그레이션 과정이 복잡하고 시간이 오래 걸릴 수 있습니다. 또한, 서버를 여러 대로 분산시키는 수평적 확장이 상대적으로 어렵다는 단점도 있습니다. 관계형 데이터는 여러 테이블 간의 조인이 많기 때문에 데이터를 분산시켜 저장하면 성능 저하가 생길 수 있습니다. 그래서 대규모 트래픽을 처리해야 하는 시스템에서는 확장성이 한계로 작용할 수 있습니다.\n\n**비관계형 데이터베이스는 반대로 데이터의 일관성 유지가 어렵다는 문제가 있습니다.** 스키마가 자유롭다 보니, 같은 컬렉션 안에 구조가 다른 문서들이 들어갈 수 있고, 그로 인해 나중에 데이터를 가공하거나 검증할 때 오류가 발생하기 쉽습니다. 또한, 조인 기능이 제한적이기 때문에, 데이터 간의 관계를 표현하는 데 한계가 있습니다. 만약 여러 컬렉션에 나눠 저장된 데이터를 합쳐서 조회해야 한다면, 애플리케이션 단에서 로직을 더 많이 처리해야 할 수도 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[AWS] 관계형 데이터베이스와 비관계형 데이터베이스의 차이점은 무엇인가요?](https://aws.amazon.com/ko/compare/the-difference-between-relational-and-non-relational-databases/)", "title": "관계형 데이터베이스와 비관계형 데이터베이스에 대해 설명해주세요."}, "fe-128": {"id": "fe-128", "content": "`stale-while-revalidate`은 `Cache-Control` 헤더의 디렉티브입니다. 이는 **캐싱 유지 기간이 끝난 오래된 컨텐츠를 어떻게 처리할 것인지에 대한 지시**를 표현합니다.\n\n`stale-while-revalidate`의 핵심 아이디어는 **오래된 캐싱 데이터를 먼저 보여주고, 그 후 새로운 데이터를 백그라운드에서 받아와 갱신**하는 것입니다. 이를 통해 네트워크 통신으로 인한 지연을 숨기면서도 데이터를 적절한 시점에 갱신할 수 있도록 합니다. \n\n예를 들면 다음과 같이 사용할 수 있습니다.\n\n```\nCache-Control: max-age=60, stale-while-revalidate=30\n```\n\n이는, 리소스를 60초 동안은 캐싱하여 재사용하고, 그후 30초 동안은 캐시 유지 기간이 끝났더라도 오래된 데이터를 사용하면서 동시에 백그라운드에서 새 데이터를 가져와 갱신하라는 의미입니다.\n\n이 전략은 뉴스 목록, 유저 프로필, 상품 리스트처럼 실시간성이 비교적 중요하지 않은 데이터에 적합합니다.\n\n## stale-while-revalidate이 적합하지 않은 상황에 대해 설명해주세요. 🤔\n`stale-while-revalidate`은 **실시간성이 중요한 기능에는 적합하지 않습니다.**  주식 시세, 실시간 재고, 예약 현황과 같이 데이터의 실시간성이 매우 중요한 기능에서는, 사용자가 정확하지 않은 데이터를 보게 되는 것이 브랜드 이미지 악화, 신뢰도 하락, 의도하지 않은 행동 등 큰 문제로 이어질 수 있기 때문입니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[Youthfulhps.dev] stale-while-revalidate 전략은 어떻게 활용되고 있을까](https://youthfulhps.dev/web/stale-while-ravalidate/)\n- [RFC 5861 - HTTP Cache-Control Extensions for Stale Content](https://datatracker.ietf.org/doc/html/rfc5861)", "title": "stale-while-revalidate에 대해 설명해주세요."}, "fe-129": {"id": "fe-129", "content": "커링이란, **여러 개의 인자를 받는 함수를 단일 인자를 받는 함수들의 함수열로 바꾸는 기법**입니다. 다시 말해, 여러 개의 인자를 한번에 받지 않고, 하나씩 여러 차례 받는 형태로 변환합니다.\n\n```js\nfunction add(a) {\n  return function(b) {\n    return a + b;\n  };\n}\n\nadd(2)(3); // 5\n\n\nconst addTwo = add(2)\naddTwo(3); // 5\n```\n\n예를 들어, 두 수를 더하는 함수를 일반적으로 작성하면 `add(2, 3)`처럼 두 개의 인자를 동시에 전달해야 합니다. 하지만 커링을 적용하면 `add(2)(3)`처럼 하나씩 나눠서 인자를 전달할 수 있습니다. 혹은 `const addTwo = add(2)`와 같이 함수를 선언해둔 후, 필요할 때 재사용할 수도 있습니다.\n\n## 커링의 장점은 무엇인가요?\n\n먼저, **커링을 적용하면 코드의 재사용성이 증가합니다.** 예시를 들어 설명드리겠습니다.\n```js\n// ❌ 커링 미적용\nconst numbers = [10, 20, 30, 40, 50]\n\nconst greaterThan30 = numbers.filter(n => n > 30)\nconst greaterThan20 = numbers.filter(n => n > 20)\n```\n위와 같은 코드에 커링을 적용하면 아래와 같이 재사용성을 개선할 수 있습니다.\n```js\n// ✅ 커링 적용\nconst isGreaterThan = (min: number) => (value: number) => value > min\n\nconst numbers = [10, 20, 30, 40, 50]\n\nconst greaterThan30 = numbers.filter(isGreaterThan(30))\nconst greaterThan20 = numbers.filter(isGreaterThan(20))\n```\n\n또한, **커링을 적용하면 함수 합성이 쉬워집니다.** 함수형 프로그래밍에서 함수 합성을 위해 `compose()`나 `pipe()`와 같은 함수를 활용하는데요. 이때 커링을 적용하면 단일 인자 함수로 변환할 수 있기 때문에 `compose()`나 `pipe()`에 끼워 넣어 활용할 수 있습니다.\n\n```js\nconst add = a => b => a + b;\n\nconst square = x => x * x;\nconst toString = x => x.toString();\n\nconst pipe = (...fns) => input =>\n  fns.reduce((acc, fn) => fn(acc), input);\n\nconst process = pipe(\n  add(2),\n  square,\n  toString\n);\n\nconsole.log(process(3)); // \"25\"\n```\n\n## 커링의 단점은 없나요? 🧐\n> 고민하고 답변을 연습해보세요. 어렵다면 추가 학습 자료를 참고해보세요. 🙂\n\n## 📚 추가 학습 자료를 공유합니다.\n- [JavaScript 커링(Currying) 이해하기: 6가지 실전 활용 사례](https://weezip.treefeely.com/post/learn-js-currying-with-6-examples)\n- [[얄팍한 코딩사전] 커링 (Currying) - 세련된 함수형 코드 작성하기](https://www.youtube.com/watch?v=PRLWfdCFQTQ)", "title": "커링(currying)이란 무엇인지 설명하고, 활용 예시를 들어줄 수 있나요?"}, "fe-13": {"id": "fe-13", "content": "**호이스팅(Hoisting)** 은 자바스크립트가 **코드를 실행하기 전에 변수와 함수 선언이 코드의 최상단으로 끌어올리는 것처럼 동작**하는 특징입니다.\n이 때문에 코드의 선언된 위치보다 상단에서 변수에 접근할 수 있는 것처럼 보일 수 있습니다.\n\n한편, 호이스팅은 값 할당까지 끌어올리지는 않습니다. 예를 들어 `var`로 선언된 변수는 선언과 초기화는 끌어올려지지만 값 할당은 끌어올려지지 않기 때문에, 값 할당이 이뤄지기 전까지는 `undefined`로 평가됩니다. 예시는 다음과 같습니다.\n\n```js\nconsole.log(myVar); // undefined\n\nvar myVar = 10;\nconsole.log(myVar); // 10\n```\n\n반면, 함수 선언식은 함수 자체가 호이스팅되기 때문에, 함수 호출을 선언 이전에 해도 문제가 없습니다.\n\n```js\nconsole.log(myFunction()); // 'Hello World' 출력\n\nfunction myFunction() {\n  return 'Hello World';\n}\n```\n\n단, ES6에서 도입된 `let`과 `const`는 선언문 이전에 접근하려고 하면 `ReferenceError`가 발생합니다.\n\n이는 **Temporal Dead Zone(TDZ)** 이라는 개념 때문입니다. TDZ는 **변수가 선언되었지만 초기화되기 전까지의 구간**을 말합니다. `let`과 `const`로 선언된 변수에는 TDZ가 존재하며, 이 구간에서는 변수에 접근할 경우 `ReferenceError`가 발생합니다. TDZ는 코드에서 변수가 선언된 시점부터 초기화될 때까지의 구간에서 변수를 사용하지 못하게 막아주는 역할을 합니다.\n\n```js\nconsole.log(myLet); // ReferenceError 발생\n\nlet myLet = 10;\n```\n\n참고로, `let` 변수는 선언 자체는 호이스팅되지만 초기화가 호이스팅되지 않습니다. 선언 즉시 `undefined`로 초기화되는 `var`와 다르게, `let`은 해당 라인의 코드가 실행될 때까지 초기화가 이루어지지 않는 것입니다.\n\n지금까지의 내용을 정리하면, **호이스팅**은 변수와 함수 선언을 코드 상단으로 끌어올리는 것처럼 동작하는 특징을 가리킵니다. `var`는 초기화 전에 접근 시 `undefined`로 나타나며, `let`과 `const`는 TDZ로 인해 초기화 전에 접근하면 `ReferenceError`를 발생시킵니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[코딩앙마] 자바스크립트 중급 강좌 #1 - 변수, 호이스팅, TDZ(Temporal Dead Zone)](https://www.youtube.com/watch?v=ocGc-AmWSnQ)\n- [[F-Lab] 자바스크립트의 호이스팅(Hoisting) 이해하기](https://f-lab.kr/insight/understanding-javascript-hoisting)", "title": "자바스크립트 호이스팅에 대해서 설명해주세요."}, "fe-130": {"id": "fe-130", "content": "HTTP 2.0이라고도 불리는 **HTTP/2는 기존 HTTP/1.1의 성능 한계를 개선하기 위해 등장한 프로토콜**입니다. 로드 속도를 향상시키고 네트워크 자원을 효율적으로 사용할 수 있도록 여러 기능들이 추가되었습니다.\n\n먼저, **가장 핵심적인 변화는 Multiplexing입니다.** HTTP/1.1에서도 Pipelining을 통해 하나의 TCP 연결을 여러 요청에 재사용할 수는 있었습니다. 하지만 각 요청에 대한 응답이 순차적으로 처리되어야 했기 때문에 동시에 여러 요청을 병렬적으로 처리하는 데는 한계가 있었습니다. 반면, HTTP/2는 하나의 연결 안에서 여러 요청과 응답을 서로 독립적인 스트림으로 처리할 수 있도록 설계되어, 완전한 병렬 처리가 가능해졌습니다. 이로 인해 리소스 로딩 속도가 크게 개선됐습니다.\n\n다음 **주요 특징은 헤더 압축입니다.** HTTP/1.1은 매 요청마다 거의 동일한 헤더 정보를 반복적으로 전송했기 때문에, 네트워크 상에서 많은 양의 데이터가 불필요하게 오가는 문제가 있었습니다. HTTP/2에서는 `HPACK`이라는 압축 방식을 적용하여, 이러한 중복을 줄이고 `Huffman coding`을 통해 데이터 전송량을 줄였습니다.\n\n또한, HTTP/2는 **서버 푸시 기능을 제공합니다.** 이는 클라이언트가 특정 HTML 문서를 요청했을 때, 서버가 해당 페이지에 필요하다고 예상되는 CSS나 JavaScript 파일 등을 클라이언트가 요청하지 않았더라도 미리 함께 전송하는 기능입니다. 이를 통해 초기 페이지 렌더링 속도를 개선할 수 있는 장점이 있습니다.\n\n## HTTP/1.1의 Pipelining이 무엇인지 보충 설명해주실 수 있나요? 🤔\nPipelining은 **클라이언트가 한 번의 연결에 여러 요청을 연달아 보내고, 서버는 그 요청들을 처리해 순서대로 응답을 주는 방식**입니다. Pipelining은 `keep-alive` 연결 위에서 작동합니다.\n\nPipelining 덕분에 클라이언트는 첫 번째 응답을 기다리지 않고 두 번째, 세 번째 요청을 보낼 수 있게 되어 성능이 일부 개선됐습니다. 하지만, 서버가 응답을 반드시 요청 순서대로 반환해야 하므로 여전히 **HOL Blocking** 문제로 인한 성능 이슈가 존재합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 아이크의 HTTP 2.0](https://www.youtube.com/watch?v=uhlvXrDpM-Y)\n- [[Cloudflare] HTTP란? HTTP/2가 HTTP/1.1보다 빠른 이유는?](https://www.cloudflare.com/ko-kr/learning/performance/http2-vs-http1.1/)", "title": "HTTP/2의 특징에 대해 설명해주세요."}, "fe-131": {"id": "fe-131", "content": "멀티 프로세스와 멀티 스레드는 **컴퓨터 자원을 효율적으로 활용하고, 상황에 따라 작업의 안정성 또는 처리 속도를 개선하기 위한 기법**입니다.\n\n## 멀티 프로세스\n\n먼저, **멀티 프로세스는 하나의 프로그램이 여러 개의 프로세스를 생성해, 각각이 독립적으로 실행되는 구조**를 의미합니다. 각 프로세스는 자신만의 메모리 공간을 가지고 있습니다. 그래서 하나의 프로세스에서 문제가 생기더라도 다른 프로세스에는 영향을 미치지 않아 **높은 안정성**을 가집니다. 이처럼 격리된 실행 환경은 보안성과 충돌 방지에 강점을 보입니다.\n\n대표적인 예시로는 크롬 브라우저의 탭 구조가 있습니다. 각 탭이 별도의 프로세스로 실행되기 때문에, 한 탭에서 무한 루프나 오류가 발생하더라도 브라우저 전체가 멈추지 않고, 해당 탭만 종료됩니다.\n\n하지만 멀티 프로세스에는 단점도 존재합니다. 프로세스마다 메모리를 별도로 할당받기 때문에 시스템 자원 소모가 큽니다. 또한, 서로 다른 프로세스 간 데이터를 주고받기 위한 `IPC(Inter-Process Communication)`도 복잡하고 비용이 높습니다.\n\n## 멀티 스레드\n반면, **멀티 스레드는 하나의 프로세스 내부에서 여러 스레드가 동시에 작업을 수행하는 구조**입니다. 이 스레드들은 하나의 메모리 공간을 공유하고, 가볍고 빠른 작업 분할이 가능하다는 점에서 성능 효율이 높습니다.\n\n예를 들어 서버에서 네트워크 요청을 동시에 처리하거나, 게임에서 여러 캐릭터의 움직임을 병렬로 계산할 때 효과적입니다.\n\n하지만 멀티 스레드 구조에서는 공유 자원에 대한 충돌 문제가 존재합니다. 두 스레드가 동시에 같은 메모리 주소를 수정하려고 할 때 데이터가 꼬일 수 있으며, 이를 방지하기 위해 락이나 세마포어 같은 동기화 기술을 사용해야 합니다. 이러한 동기화 처리에는 추가적인 코드 복잡도와 성능 저하의 위험도 따라옵니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[wooody92's blog] 멀티 프로세스(Multi Process)와 멀티 스레드(Multi Thread)](https://wooody92.github.io/os/%EB%A9%80%ED%8B%B0-%ED%94%84%EB%A1%9C%EC%84%B8%EC%8A%A4%EC%99%80-%EB%A9%80%ED%8B%B0-%EC%8A%A4%EB%A0%88%EB%93%9C/)\n- [[얄팍한 코딩사전] 프로세스는 뭐고 스레드는 뭔가요?](https://www.youtube.com/watch?v=iks_Xb9DtTM)\n", "title": "멀티 프로세스와 멀티 스레드에 대해 설명해주세요."}, "fe-132": {"id": "fe-132", "content": "Node.js는 **크롬 V8 엔진을 기반으로 동작하는 자바스크립트 런타임 환경입니다.** 브라우저에서만 동작하던 자바스크립트를 서버 사이드 환경에서도 실행할 수 있도록 만들어 줍니다.\n\nNode.js의 주요 특징은 크게 세 가지로 정리할 수 있습니다.\n\n먼저, **Node.js는 싱글 스레드 기반으로 동작합니다.** 이는 기본적으로 하나의 스레드로 연산 작업을 수행한다는 뜻으로, 요청마다 JS 실행 스레드를 추가 생성하거나 할당하지 않습니다. 일반적으로 멀티 스레드 방식은 각 요청에 대해 스레드를 따로 생성하여 병렬적으로 처리하지만, Node.js는 단일 스레드로 처리하기 때문에 서버 자원을 효율적으로 사용합니다.\n\n또한, **Node.js는 이벤트 기반 구조를 따릅니다.** 이는 특정 이벤트가 발생했을 때 태스크 큐에 등록된 콜백 함수를 실행하는 방식입니다. 예를 들어, 데이터베이스 조회나 파일 읽기 같은 비동기 작업을 요청하더라도, 그 작업이 끝날 때까지 기다리지 않고 바로 다음 코드를 실행합니다. 이후 해당 작업이 완료되면, 이벤트 루프가 해당 이벤트를 감지해 콜백 함수를 호출합니다. 이런 방식으로 코드 흐름을 차단하지 않으면서도 필요한 작업은 차질 없이 처리할 수 있습니다.\n\n끝으로, **Node.js는 논 블로킹 I/O 모델을 채택하고 있습니다.** 일반적인 I/O 작업은 완료될 때까지 실행을 멈추는 ‘블로킹’ 방식이지만, Node.js는 작업이 끝날 때까지 기다리지 않고 다음 작업을 이어서 처리할 수 있습니다. 이처럼 I/O 작업이 애플리케이션의 흐름을 막지 않기 때문에, 많은 요청을 동시에 처리하는 데 유리하며, 서버 자원을 효율적으로 사용할 수 있습니다. 이러한 비동기 I/O 방식은 앞서 설명한 이벤트 기반 구조와 결합되어 Node.js의 높은 처리량과 확장성을 가능하게 만듭니다.\n\n## Node.js가 적합하지 않은 경우는 언제인가요? 🤔\nNode.js는 **CPU 계산량이 많은 작업에는 상대적으로 부적합합니다.** 예를 들어 복잡한 이미지 변환, 머신러닝 연산, 수치 계산처럼 CPU 리소스를 많이 사용하는 작업은 싱글 스레드에서 병목이 발생할 수 있기 때문에, 이런 경우에는 다른 언어나 워커 스레드 등의 대안이 필요할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[위키독스] Node.js의 기술적인 특징](https://wikidocs.net/223233)\n- [[10분 테코톡] 유세지의 Node.js](https://www.youtube.com/watch?v=A04zlpL1Uw4)", "title": "Node.js의 주요 특징에 대해 설명해주세요."}, "fe-133": {"id": "fe-133", "content": "Progressive Partial Rendering(PPR)은 **웹 페이지의 로딩 성능을 최적화하는 기법으로, 페이지의 전체 콘텐츠를 한 번에 로딩하는 대신 중요도에 따라 콘텐츠를 단계적으로 로딩하는 방식**입니다.\n\n이 방법을 통해 사용자는 핵심 콘텐츠를 먼저 볼 수 있게 되어 체감 로딩 시간이 단축됩니다.\n\n주요 기법으로는 서버 사이드 렌더링(SSR), 클라이언트 사이드 렌더링(CSR)을 혼합한 하이브리드 렌더링, 스트리밍 SSR, 점진적 하이드레이션 등이 있습니다.\n\n이러한 PPR 기법들은 First Contentful Paint(FCP)와 Time To Interactive(TTI) 같은 성능 지표를 개선하는데 도움이 됩니다.\n\n## Progressive Partial Rendering과 Lazy Loading의 차이점은 무엇인가요?🤔\nLazy Loading은 주로 뷰포트 밖에 있는 이미지나 컴포넌트와 같은 특정 리소스를 필요한 시점에 로드하는 기술입니다.\n\n반면, Progressive Partial Rendering은 더 넓은 개념으로, 페이지의 핵심 콘텐츠를 먼저 렌더링하고 우선순위가 낮은 부분은 점진적으로 렌더링하는 전체적인 접근 방식입니다.\n\nLazy Loading은 Progressive Partial Rendering을 구현하는 기법 중 하나라고 볼 수 있습니다.\n\n## Progressive Partial Rendering이 SEO에 미치는 영향은 무엇인가요? 🤔\n\nProgressive Partial Rendering은 SEO에 긍정적인 영향을 미칠 수 있습니다. 핵심 콘텐츠가 더 빨리 로드되기 때문에 검색 엔진 크롤러가 중요한 콘텐츠를 더 효율적으로 색인화할 수 있습니다.\n\n특히 서버 사이드 렌더링이나 하이브리드 접근 방식을 사용할 경우, HTML이 미리 렌더링되어 제공되므로 검색 엔진이 JavaScript를 실행하지 않고도 콘텐츠를 이해할 수 있어 유리합니다.\n\n또한 Core Web Vitals 성능 지표가 SEO 순위에 영향을 미치는데, Progressive Partial Rendering은 LCP(Largest Contentful Paint), FID(First Input Delay), CLS(Cumulative Layout Shift) 같은 지표를 개선하는 데 도움이 됩니다.\n", "title": "Progressive Partial Rendering(PPR)에 대해서 설명해주세요."}, "fe-134": {"id": "fe-134", "content": "XSS(Cross-Site Scripting)는 **공격자가 신뢰할 수 있는 웹사이트에 악성 스크립트를 삽입하여 사용자 브라우저에서 실행되게 하는 공격**입니다. 이를 통해 쿠키 탈취, 세션 하이재킹, 피싱 등이 가능합니다.\n\nXSS 공격은 크게 세 가지 유형이 있습니다.\n\n첫번째로 **저장형(Stored) XSS**입니다. 악성 스크립트가 서버에 저장되어 다른 사용자가 해당 페이지를 방문할 때 실행됩니다.\n\n두번째는 **반사형(Reflected) XSS**입니다. URL 파라미터 등을 통해 전달된 악성 스크립트가 서버 응답에 포함되어 실행됩니다.\n\n마지막으로 **DOM 기반 XSS**입니다. 클라이언트 측 스크립트가 DOM을 동적으로 조작할 때 발생합니다.\n\n## 해결 방법\n\n이러한 보안문제를 해결하기 위한 방법으로는 **입력 검증**과 **출력 이스케이핑**이 있습니다. 사용자 입력을 적절히 검증하고, HTML 출력 시 특수 문자를 이스케이프 처리합니다.\n\n아래처럼 `element.innerHTML` 대신 `element.textContent`를 이용하거나, `DOMPurify`를 사용하여 사용자의 입력값에 대해서 특수 문자와 입력 검증을 해줄 수 있습니다.\n\n```js\n// ❌ 잘못된 방법\nelement.innerHTML = userInput;\n\n// ✅ 올바른 방법\nelement.textContent = userInput; // 자동 이스케이프\n\n// ✅ HTML이 필요한 경우 DOMPurify 사용\nimport DOMPurify from 'dompurify';\n\nelement.innerHTML = DOMPurify.sanitize(userInput);\n```\n\n혹은, 메타 태그에 `Content-Security-Policy(CSP)`를 설정하여 브라우저에 실행을 허용할 컨텐츠 소스를 제한할 수 있습니다.\n\n```html\n<!-- HTTP 헤더 또는 메타 태그로 설정 -->\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'self' https://trusted-cdn.com;\">\n```\n\n마지막으로는 `HttpOnly` 쿠키입니다. 쿠키에 `HttpOnly` 플래그를 설정하여 자바스크립트를 통한 접근을 차단할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[코드없는 프로그래밍] 크로스 사이트 스크립팅, XSS](https://www.youtube.com/watch?v=LfI6TAchgT4)", "title": "XSS 공격이란 무엇이며, 프론트엔드에서 이를 방어하기 위한 방법을 설명해주세요."}, "fe-135": {"id": "fe-135", "content": "이터러블 프로토콜은 자바스크립트에서 **데이터를 순차적으로 순회하여 탐색할 수 있도록 정해놓은 프로토콜**입니다. 이터러블 프로토콜이 존재하는 이유는, 다양한 자료구조를 같은 방식으로 순회할 수 있게 하여 일관된 반복 처리 방법을 제공하기 위함입니다.\n\n예를 들어 배열, `String`, `Set`, `Map` 등은 서로 다른 구조를 가지고 있지만, 이터러블 프로토콜을 따르고 있기 때문에 `for...of` 문이나 스프레드 연산자 같은 문법으로 동일하게 순회할 수 있습니다. 이런 통일성 덕분에 개발자는 자료구조마다 다른 순회 방식을 고민하지 않아도 됩니다.\n\n이터러블로 간주되기 위해서는 **해당 객체에 `Symbol.iterator`라는 키를 가진 메서드가 정의되어 있어야 하며, 이 메서드는 이터레이터 객체를 반환해야 합니다.** 이때 반환된 이터레이터 객체는 `next()`라는 메서드를 가지고 있으며, 이 메서드를 호출하면 `{ value, done }` 형태의 결과를 반환해야 합니다. 이 과정을 통해 내부 데이터를 순서대로 꺼내는 것이 가능합니다.\n\n정리하면, 이터러블 프로토콜의 핵심 목적은 “순회할 수 있는 객체”의 공통된 인터페이스를 정의하여, 일관된 방식으로 데이터를 탐색할 수 있게 하는 것입니다.\n\n## 직접 이터러블 객체를 구현해보실 수 있을까요? 🤔\n네, 가능합니다. 객체에 `Symbol.iterator` 메서드를 직접 구현하면 커스텀 이터러블을 만들 수 있습니다. \n```js\nconst customIterable = {\n  data: [1, 2, 3],\n  [Symbol.iterator]() {\n    let index = 0;\n    return {\n      next: () => {\n        return index < this.data.length\n          ? { value: this.data[index++], done: false }\n          : { done: true };\n      }\n    };\n  }\n};\n\nfor (const item of customIterable) {\n  console.log(item); // 1, 2, 3 차례로 출력\n}\n```\n\n## 이터러블과 이터레이터의 차이에 대해 설명해주세요. 🧐\n> 스스로 고민해보고 답변하는 연습을 해보세요! 🙂\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] 이터러블 프로토콜](https://developer.mozilla.org/ko/docs/Web/JavaScript/Reference/Iteration_protocols#%EC%88%9C%ED%9A%8C_%EA%B0%80%EB%8A%A5_%ED%94%84%EB%A1%9C%ED%86%A0%EC%BD%9C)\n- [[Inpa Dev] 이터러블 & 이터레이터 - 완벽 이해](https://inpa.tistory.com/entry/JS-%F0%9F%93%9A-%EC%9D%B4%ED%84%B0%EB%9F%AC%EB%B8%94-%EC%9D%B4%ED%84%B0%EB%A0%88%EC%9D%B4%ED%84%B0-%F0%9F%92%AF%EC%99%84%EB%B2%BD-%EC%9D%B4%ED%95%B4)", "title": "이터러블 프로토콜에 대해 설명해주세요."}, "fe-136": {"id": "fe-136", "content": "제네레이터(Generator)는 자바스크립트에서 **반복 가능한 데이터를 만들거나, 실행 흐름을 중간에 멈췄다가 다시 이어서 실행할 수 있게 해주는 특수한 함수**입니다. 일반 함수와 다르게 `function*` 키워드로 정의하며, 내부에서 `yield` 키워드를 사용해 값을 순차적으로 반환합니다.\n\n제네레이터 함수는 실행하면 즉시 코드가 실행되지 않고, 대신 이터레이터 객체를 반환합니다. 이 이터레이터는 `next()` 메서드를 통해 하나씩 값을 꺼낼 수 있으며, `yield` 지점에서 멈췄다가, 다음 `next()` 호출 시 그 지점부터 다시 실행됩니다.\n\n```js\nfunction* myGenerator() {\n  yield 1;\n  yield 2;\n  yield 3;\n}\n\nconst gen = myGenerator();\nconsole.log(gen.next()); // { value: 1, done: false }\nconsole.log(gen.next()); // { value: 2, done: false }\nconsole.log(gen.next()); // { value: 3, done: false }\nconsole.log(gen.next()); // { value: undefined, done: true }\n```\n\n제네레이터의 가장 큰 특징은 함수의 실행 상태를 보존하면서 여러 번 호출할 수 있다는 점입니다. 이 덕분에 데이터를 지연 평가하거나 복잡한 반복 로직, 커스텀 이터러블 등을 구현할 때 유용하게 사용됩니다.\n\n## 제네레이터를 실제로 유용하게 활용한 예시를 들어줄 수 있나요? 🤔\n예를 들어, 제네레이터를 활용하면, 배열에서 조건에 맞는 값만 순회하고 싶을 때 조건 필터링을 포함한 이터러블을 만들 수 있습니다.\n\n```js\nfunction* validNumbers(numbers) {\n  for (const num of numbers) {\n    if (typeof num === \"number\" && !isNaN(num)) {\n      yield num;\n    }\n  }\n}\n\nconst mixed = [1, \"a\", 2, NaN, 3];\nfor (const n of validNumbers(mixed)) {\n  console.log(n); // 1, 2, 3\n}\n```\n\n## 제네리이터가 반환하는 객체는 이터레이터인가요? 아니면 이터러블인가요? 그 이유와 함께 설명해주세요. 🧐\n> 스스로 생각해보고 답변하는 연습을 해보세요! 🙂\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[javascript.info] 제네레이터](https://ko.javascript.info/generators)\n- [[흑묘테크] JS : Iterator, Generator, Lazy-Evaluation](https://www.youtube.com/watch?v=AlrxmVIYxKA)", "title": "제네레이터에 대해 설명해주세요."}, "fe-137": {"id": "fe-137", "content": "TLS 핸드셰이크는 **브라우저와 서버가 TLS 프로토콜을 통해 암호화된 통신을 시작하기 전, 안전하게 연결을 설정하는 절차**입니다. 이 절차는 보통 다음과 같은 흐름으로 이뤄집니다.\n\n먼저 브라우저는 Client Hello 메시지를 보냅니다. 여기에는 브라우저가 지원하는 TLS 버전, 사용할 수 있는 암호화 알고리즘 목록, 세션 ID, 그리고 Client Random이라는 난수가 포함되어 있습니다.\n\n서버는 이에 대해 Server Hello로 응답하면서, 서버가 선택한 암호화 방식, 자신의 Server Random 값, 그리고 디지털 인증서를 함께 보냅니다. 이 인증서 안에는 서버의 공개키와 CA의 서명이 포함되어 있으며, 브라우저는 이걸 통해 서버의 신원을 검증합니다.\n\n검증이 완료되면 브라우저는 서버의 공개키로 Pre-Master Secret이라는 임시 비밀 값을 암호화해서 전송합니다. 서버는 자신의 개인키로 이를 복호화해 Pre-Master Secret 값을 복원하고, 이제 클라이언트와 서버는 서로 갖고 있는 Client Random, Server Random, 그리고 Pre-Master Secret을 기반으로 동일한 대칭키를 생성합니다. 이 대칭키는 이후 주고 받는 데이터를 암호화하고 복호화하는 데 사용됩니다.\n\n마지막으로 서로 Finished 메시지를 교환하면서 대칭키로 암호화된 통신이 잘 되는지 확인하고 나면, 정상적인 HTTPS 통신이 시작됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[cloudflare] TLS 핸드셰이크란 무엇일까요?](https://www.cloudflare.com/ko-kr/learning/ssl/what-happens-in-a-tls-handshake/)\n- [[생활코딩] ssl 통신과정](https://www.youtube.com/watch?v=8R0FUF_t_zk)", "title": "TLS 핸드셰이크 과정에 대해 설명해주세요."}, "fe-138": {"id": "fe-138", "content": "`User-Agent`는 HTTP 요청 헤더에 포함되는 문자열로, **웹 서버에 접속하는 클라이언트(브라우저, 운영체제, 디바이스 등)의 정보를 식별하는 데 사용됩니다.**\n\n이 문자열에는 브라우저 종류, 버전, 운영체제, 렌더링 엔진 등의 정보가 포함되어 있습니다.\n프론트엔드 개발자로서 `User-Agent`는 특정 브라우저에 맞는 기능을 제공하거나, 디바이스에 따른 최적화를 구현할 때 참고할 수 있습니다.\n\n하지만 현대적인 웹 개발에서는 `User-Agent` 문자열에 의존하기보다는 기능 감지(feature detection)와 반응형 디자인을 통해 크로스 브라우징 이슈를 해결하는 것이 권장됩니다.\n\n`JavaScript`에서는 `navigator.userAgent`를 통해 `User-Agent` 정보에 접근할 수 있으며, 서버 측에서는 HTTP 요청 헤더에서 이 정보를 확인할 수 있습니다.\n\n## 프론트엔드 개발자로서 User-Agent 정보를 활용한 경험이 있나요? 🤔\n\n> 본인의 경험담을 바탕으로 답변을 연습해 보세요!\n\n### 예시\n실무에서는 User-Agent 정보를 다음과 같이 활용한 경험이 있습니다\n\n첫번째로는, 애널리틱스 시스템에서 사용자 환경 데이터 수집하는데에 사용자의 기기 정보를 얻기 위해 수집해본 경험이 있습니다. \n\n두번째로는, 특정 브라우저에서만 발생하는 렌더링 버그에 대한 대응책을 강구하기 위해 수집했습니다.\n\n마지막으로 특정 기능이 지원되지 않는 환경에 대체 UI 제공하기 위해 User-Agent를 활용하였습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n\n- [MDN User-Agent](https://developer.mozilla.org/ko/docs/Web/HTTP/Reference/Headers/User-Agent)\n", "title": "User-Agent에 대해서 설명해주세요."}, "fe-139": {"id": "fe-139", "content": "리액트의 배칭 업데이트(Batching Update)는 **여러 상태 업데이트를 하나의 리렌더링으로 그룹화하는 최적화 기법**입니다.\n\n리액트는 성능 향상을 위해 여러 `setState` 호출을 일괄 처리하여 불필요한 렌더링을 방지합니다.\n\n예를 들어, 하나의 이벤트 핸들러 내에서 여러 번 상태를 업데이트하는 경우, 리액트는 이를 내부적으로 모아서 한 번의 업데이트로 처리합니다.\n\n```tsx\nfunction handleClick() {\n  setCount(c => c + 1); // 첫 번째 업데이트\n  setFlag(f => !f);     // 두 번째 업데이트\n  setName('리액트');     // 세 번째 업데이트\n  // 이 세 가지 상태 변경은 배칭되어 단 한 번의 렌더링만 발생합니다\n}\n```\n\nReact 18 이전에는 이벤트 핸들러 내부와 같은 리액트가 제어하는 영역에서만 배칭이 적용되었습니다.\n\n그러나 React 18부터는 '자동 배칭'이 도입되어 `Promise`, `setTimeout`, 네이티브 이벤트 핸들러 등 리액트 외부 영역에서도 배칭이 기본적으로 적용됩니다.\n\n배칭을 통해 불필요한 리렌더링을 줄이고 계산 비용을 절감하여 애플리케이션의 성능을 향상시킬 수 있습니다.\n\n## React 18의 자동 배칭(Automatic Batching)이 이전 버전과 어떻게 다른가요? 🤔\n\nReact 18 이전에는 배칭이 React의 이벤트 핸들러 내부에서만 작동했습니다.\n\n```tsx\n// React 17에서:\nfunction handleClick() {\n  setCount(c => c + 1); // 이벤트 핸들러 내부: 배칭 적용됨\n  setFlag(f => !f);     // 배칭 적용됨 (한 번의 렌더링)\n}\n\nsetTimeout(() => {\n  setCount(c => c + 1); // React 외부 환경: 배칭 적용 안됨\n  setFlag(f => !f);     // 배칭 적용 안됨 (두 번의 렌더링 발생)\n}, 1000);\n```\n\nReact 18에서는 자동 배칭이 도입되어 비동기 작업을 포함한 여러 상태 업데이트에 배칭이 적용됩니다.\n\n1. Promise 내부\n2. setTimeout/setInterval 내부\n3. 네이티브 이벤트 핸들러\n4. 기타 모든 이벤트 내부\n\n이러한 변화로 개발자가 별도의 최적화 작업 없이도 더 효율적인 렌더링을 기대할 수 있게 되었습니다.\n\n## - 📚 추가 학습 자료를 공유합니다.\n\n- [리액트 배칭의 모든 것](https://yozm.wishket.com/magazine/detail/2493/)\n\n- [리액트 공식 문서](https://ko.react.dev/learn/queueing-a-series-of-state-updates)", "title": "리액트의 Batching Update에 대해서 설명해주세요."}, "fe-14": {"id": "fe-14", "content": "자바스크립트의 배열(Array)은 **순서가 있는 리스트형 객체**로, 여러 값을 하나의 자료구조에 저장할 수 있습니다.\n\n배열은 **제로 인덱스 기반**으로, 배열의 각 값은 인덱스를 통해 접근할 수 있습니다. 배열의 선언은 간단하며, 다양한 데이터 타입을 함께 저장할 수 있습니다.\n\n```js\nconst array = [1, 'apple', true, { key: 'value' }];\n```\n\n이 배열은 숫자, 문자열, 불리언, 객체 등 다양한 타입을 저장할 수 있으며, 배열의 첫 번째 요소는 `array[0]`으로, 두 번째 요소는 `array[1]`과 같이 접근할 수 있습니다.\n\n자바스크립트 배열의 중요한 특징 중 하나는 `동적 배열`이라는 점입니다. 이는 배열의 크기를 미리 지정하지 않아도 되고, 요소를 추가할 때마다 배열의 크기가 자동으로 조정됩니다.\n\n```js\nconst arr = [1, 2, 3];\narr.push(4); // 배열의 끝에 요소 추가\nconsole.log(arr); // [1, 2, 3, 4]\n```\n\n또한, 배열의 특정 인덱스에 값을 할당하면, 배열이 자동으로 확장됩니다.\n\n```js\narr[5] = 6;\nconsole.log(arr); // [1, 2, 3, undefined, undefined, 6]\nconsole.log(arr.length); // 6\n```\n\n이처럼 자바스크립트 배열은 동적으로 크기가 조정되는 유연성을 제공합니다. 요소를 추가하거나 특정 인덱스에 값을 할당하면, 배열은 자동으로 확장됩니다.\n\n자바스크립트 배열의 `length` 속성은 배열의 크기를 나타내며, 배열에 요소가 추가되거나 제거될 때 자동으로 변경됩니다.\n\n또한, 배열은 자바스크립트의 객체와 유사한 방식으로 관리되며, 해시 테이블과 같은 자료구조로 구현되어 있습니다. 이 덕분에 배열 요소들은 메모리 상에서 연속적이지 않아도 되며, 배열 크기를 미리 지정하지 않고 유연하게 사용할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] Array](https://developer.mozilla.org/ko/docs/Web/JavaScript/Reference/Global_Objects/Array)\n- [[JAVASCRIPT.INFO] 배열](https://ko.javascript.info/array)", "title": "자바스크립트 배열에 대해서 설명해주세요."}, "fe-140": {"id": "fe-140", "content": "웹표준은 **다양한 웹 기술들이 브라우저나 기기와 상관없이 일관되게 동작하도록 보장하기 위한 규약들의 집합**입니다. HTML, CSS, JavaScript와 같은 핵심 기술뿐만 아니라 접근성, 통신, 보안 등 여러 영역까지 포괄하며, IETF, W3C 등의 국제 표준 기구에서 정의하고 관리합니다.\n\n웹표준의 목적은 **다양한 브라우저, 기기, 플랫폼에서 웹 페이지가 동일하게 작동하도록 보장하는 것**입니다. 먼저, 개발자 입장에서는 웹표준을 따름으로써 특정 브라우저에 종속되지 않는 코드를 작성할 수 있습니다. 즉, 특정 환경에 맞추어 여러 버전을 만들 필요 없이 한 번의 개발로 여러 환경의 사용자에게 서비스를 제공할 수 있습니다. 또한 사용자 입장에서는 어떤 브라우저나 기기를 사용하더라도 콘텐츠가 일관되게 표현되므로 더 나은 접근성과 사용자 경험을 얻을 수 있게 됩니다.\n\n예를 들어, HTML에서 시맨틱 태그를 사용하면 콘텐츠의 의미와 구조를 명확하게 표현할 수 있으며, CSS의 표준 속성은 스타일의 일관성을 보장합니다. JavaScript도 ECMAScript 표준에 따라 구현되므로, 서로 다른 브라우저 간에 전반적인 동작의 일관성을 유지할 수 있습니다.\n\n## 웹표준을 지키지 않을 때 발생할 수 있는 문제는 무엇인가요? 🤔\n웹표준을 따르지 않으면 몇몇 브라우저 환경에서 웹사이트가 의도한 대로 동작하지 않거나 레이아웃이 깨지는 등의 문제가 발생할 수 있습니다. 또한, 특정 기능이 브라우저에서 비활성화되거나 보안 취약점으로 이어질 가능성도 존재합니다. 특히, 모바일 환경에서는 기기 종류가 다양하므로 표준을 지키지 않으면 사용자 경험이 크게 저하될 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] Web standards](https://developer.mozilla.org/ko/docs/Glossary/Web_standards)\n- [[HPP] 정보통신접근성(웹 접근성) 및 웹 표준 준수 가이드 안내](https://www.hrstpolicy.re.kr/kistep/kr/introduce/WebAcsGuide.html?menuId=2007104&rootId=2007000)", "title": "웹표준이 무엇인가요?"}, "fe-141": {"id": "fe-141", "content": "React의 리렌더링 과정은 **크게 Trigger, Render, Commit이라는 세 단계로 나눌 수 있습니다.**\n\n먼저 **Trigger 단계는 컴포넌트의 state나 props가 변경되면서 시작됩니다.** 사용자의 입력, 네트워크 응답 등의 이벤트에 의해 상태가 변경
