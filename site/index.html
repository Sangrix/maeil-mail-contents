트릭을 생성하는 방법을 설명해주세요.**\n\n아래는 Micrometer를 활용하여 커스텀 메트릭(카운터, 타이머, 게이지)을 생성하고 업데이트하는 예제 코드입니다. 이 코드는 HTTP 요청의 건수와 처리 시간, 그리고 현재 활성 세션 수를 측정하는 예제입니다.\n\n```java\npackage com.example.metrics;\n\nimport io.micrometer.core.instrument.Counter;\nimport io.micrometer.core.instrument.Gauge;\nimport io.micrometer.core.instrument.MeterRegistry;\nimport io.micrometer.core.instrument.Timer;\nimport org.springframework.stereotype.Service;\n\n@Service\npublic class CustomMetricsService {\n\n    private final Counter requestCounter;\n    private final Timer requestTimer;\n    private final CustomGauge customGauge;\n\n    // 생성자에서 MeterRegistry를 주입받아 필요한 메트릭을 등록합니다.\n    public CustomMetricsService(MeterRegistry meterRegistry) {\n        // HTTP 요청 총 건수를 세는 Counter (태그로 엔드포인트 구분)\n        this.requestCounter = meterRegistry.counter(\"custom.requests.total\", \"endpoint\", \"/api/test\");\n\n        // HTTP 요청 처리 시간을 측정하는 Timer (태그로 엔드포인트 구분)\n        this.requestTimer = meterRegistry.timer(\"custom.request.duration\", \"endpoint\", \"/api/test\");\n\n        // Gauge: 예를 들어, 현재 활성 세션 수를 측정하기 위한 커스텀 객체를 등록\n        this.customGauge = new CustomGauge();\n        Gauge.builder(\"custom.active.sessions\", customGauge, CustomGauge::getActiveSessions)\n                .tag(\"region\", \"us-east\")\n                .register(meterRegistry);\n    }\n\n    /**\n     * 실제 비즈니스 로직을 실행할 때 요청 카운트와 처리 시간을 측정합니다.\n     * @param requestLogic 실제 처리할 로직 (예: HTTP 요청 처리)\n     */\n    public void processRequest(Runnable requestLogic) {\n        // 요청 수 증가\n        requestCounter.increment();\n        // 요청 처리 시간 측정\n        requestTimer.record(requestLogic);\n    }\n\n    /**\n     * 활성 세션 수 업데이트 (예를 들어, 로그인/로그아웃 이벤트에서 호출)\n     * @param activeSessions 현재 활성 세션 수\n     */\n    public void updateActiveSessions(int activeSessions) {\n        customGauge.setActiveSessions(activeSessions);\n    }\n\n    /**\n     * 커스텀 Gauge의 값을 저장하는 내부 클래스.\n     */\n    private static class CustomGauge {\n        // 현재 활성 세션 수를 저장 (volatile을 사용해 스레드 안정성 확보)\n        private volatile double activeSessions = 0;\n\n        public double getActiveSessions() {\n            return activeSessions;\n        }\n\n        public void setActiveSessions(double activeSessions) {\n            this.activeSessions = activeSessions;\n        }\n    }\n}\n```\n\n- **MeterRegistry 사용**\n    \n    생성자에서 MeterRegistry를 주입받아 애플리케이션의 모든 메트릭을 중앙에서 관리하고, 설정된 모니터링 백엔드로 주기적으로 전송합니다.\n    \n- **Counter**\n    \n    requestCounter는 /api/test 엔드포인트에 대한 요청 건수를 카운트합니다. 매 HTTP 요청마다 increment() 호출로 증가시킵니다.\n    \n- **Timer**\n    \n    requestTimer는 HTTP 요청 처리 시간을 측정합니다. record() 메서드를 사용해 실제 로직 실행 시간을 기록합니다.\n    \n- **Gauge**\n    \n    customGauge는 현재 활성 세션 수를 측정하는 데 사용됩니다. Gauge는 항상 현재 상태를 조회하는 함수(getActiveSessions())를 호출하여 실시간 값을 반영합니다.", "title": "Micrometer가 무엇인지 설명해주세요."}, "be-106": {"id": "be-106", "content": "커넥션, 입출력 스트림과 같은 자원을 사용한 후에는 자원을 해제해서 성능 문제, 메모리 누수 등을 방지해야 합니다.\n**try-with-resources**는 이러한 자원을 자동으로 해제하는 기능으로, java 7부터 도입되었습니다.\n\ntry-with-resources가 정상적으로 동작하려면 `AutoCloseable` 인터페이스를 구현한 객체를 사용해야 하고, `try()` 괄호 내에서 변수를 선언해야 합니다.\n\n``` java\ntry (BufferedReader br = new BufferedReader(new FileReader(\"path\"))) {\n    return br.readLine();\n} catch (IOException e) {\n    return null;\n}\n```\n\n## try-catch-finally 대신 try-with-resources를 사용해야 하는 이유는 무엇인가요?\n\n``` java    \nBufferedReader br = null;\ntry {\n    br = new BufferedReader(new FileReader(\"path\"));\n    return br.readLine();\n} catch (IOException e) {\n    return null;\n} finally {\n    if (br != null) {\n        try {\n            br.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n**try-catch-finally**는 finally 블록에서 `close()`를 명시적으로 호출해야 합니다. 하지만 `close()` 호출을 누락하거나 이 과정에서 또 다른 예외가 발생하면 예외 처리가 복잡해지는 문제가 있습니다.\n\n또한 여러 개의 자원을 다룰 경우, 먼저 `close()`를 호출한 자원에서 에러가 발생하면 다음에 `close()`를 호출한 자원은 해제되지 않습니다.\n이를 해결하려면 추가적인 try-catch-finally가 필요하기 때문에 가독성이 떨어지고, 실수할 가능성이 높습니다.\n\n**try-with-resources**를 사용하면 try-catch-finally의 문제를 해결할 수 있습니다.\n\n- try 블록이 종료될 때 `close()`를 자동으로 호출해서 자원을 해제합니다.\n- finally 블록 없이도 자원을 안전하게 정리하기 때문에 코드가 간결해집니다.\n- try 문에서 여러 자원을 선언하면, 선언된 반대 순서로 자동 해제됩니다.\n\n## Suppressed Exception(억제된 예외)란 무엇인가요?\n\n**Suppressed Exception**은 예외가 발생했지만 무시되는 예외를 의미합니다.\n\n**try-with-resources**는 `close()` 과정에서 발생한 예외를 Suppressed Exception으로 관리합니다.\n\n``` java\nclass CustomResource implements AutoCloseable {\n    \n    @Override\n    public void close() throws Exception {\n        throw new Exception(\"Close Exception 발생\");\n    }\n\n    void process() throws Exception {\n        throw new Exception(\"Primary Exception 발생\");\n    }\n}\n\npublic class Main {\n    \n    public static void main(String[] args) throws Exception {\n        try (CustomResource resource = new CustomResource()) {\n            resource.process();\n        }\n    }\n}\n```\n\n``` java\nException in thread \"main\" java.lang.Exception: Primary Exception 발생\n    at CustomResource.process(CustomResource.java:9)\n    at Main.main(Main.java:5)\n    Suppressed: java.lang.Exception: Close Exception 발생\n        at CustomResource.close(CustomResource.java:5)\n        at Main.main(Main.java:4)\n```\n\nSuppressed Exception이 필요한 이유는 원래 예외(Primary Exception)를 유지하면서 추가 예외도 함께 추적할 수 있고, 자원을 안전하게 해제하면서 예외를 효율적으로 처리할 수 있습니다.\n\n**try-catch-finally**는 `close()`를 호출할 때 예외가 발생하면 원래 예외가 사라지고 `close()`에서 발생한 예외만 남을 수 있습니다.\n\n``` java\npublic class Main {\n    \n    public static void main(String[] args) throws Exception {\n        CustomResource resource = null;\n        try {\n            resource = new CustomResource();\n            resource.process();\n        } finally {\n            if (resource != null) {\n                resource.close();\n            }\n        }\n    }\n}\n```\n\n``` java\nException in thread \"main\" java.lang.Exception: Close Exception 발생\n    at CustomResource.close(CustomResource.java:5)\n    at Main.main(Main.java:16)\n```\n\n이처럼 원래 예외가 사라지면 디버깅이 어려워질 수 있습니다. Throwable의 `addSuppressed()`를 사용하면 문제를 해결할 수 있지만 코드가 더욱 복잡해지기 때문에 try-with-resources를 사용하는 것이 좋습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [Baeldung - Try with Resources](https://www.baeldung.com/java-try-with-resources)\n- [Oracle Java Docs - The try-with-resources Statement](https://docs.oracle.com/javase/tutorial/essential/exceptions/tryResourceClose.html)\n- [인프런 Q&A - close()에 관해 궁금한점이 있습니다.](https://www.inflearn.com/community/questions/1111010/close-%EC%97%90-%EA%B4%80%ED%95%B4-%EA%B6%81%EA%B8%88%ED%95%9C%EC%A0%90%EC%9D%B4-%EC%9E%88%EC%8A%B5%EB%8B%88%EB%8B%A4)\n", "title": "try-with-resources에 대해 설명해 주세요."}, "be-107": {"id": "be-107", "content": "네트워크에서 **회선 교환 방식(Circuit Switching)** 이란 특정 사용자를 위한 회선의 경로를 미리 설정하고 이 경로를 이용해서 호스트끼리 메시지를 주고받는 방식을 의미합니다. 회선 교환 방식은 미리 회선을 설정한다는 점에서 주어진 시간 동안에 전송되는 데이터의 양이 비교적 일정하고 안정적입니다. 다만, 회선 이용 효율이 떨어진다는 단점이 존재합니다. 회선 교환 방식의 대표적인 사례로는 유선 전화망이 있습니다.\n\n반면, **패킷 교환 방식(Packet Switching)** 은 목적지를 정해두고 메시지를 패킷으로 분할해서 보내고, 목적지에서 패킷을 조립해서 확인하는 방식입니다. 패킷 교환 방식에서 라우터는 주어진 패킷을 최적 경로로 전달하는 핵심적인 역할을 수행합니다. 이러한 특성으로 인해서 경로는 수시로 변경될 수 있고, 데이터를 전송하는 동안에만 네트워크 자원을 사용한다는 점에서 회선 교환 방식과 차이가 있습니다. 패킷 교환 방식은 회선 이용 효율이 높습니다. 하지만, 경로 탐색에서 지연이 발생하거나, 패킷을 위한 헤더로 인한 오버헤드가 발생할 수 있습니다.  \n\n<p align = \"center\" />\n\n  <img src = \"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Packet_Switching.gif/800px-Packet_Switching.gif?20200305201656\" />\n\n  <p>이미지 출처: 위키피디아</p>\n\n</p>\n\n## 추가 학습 자료를 공유합니다.\n\n- [한빛미디어 - 네트워크의 분류](https://youtu.be/FVoPnnC12k8?si=HxCpA6KSky79pE23)", "title": "네트워크에서 회선 교환 방식과 패킷 교환 방식은 어떤 차이점 있나요?"}, "be-108": {"id": "be-108", "content": "String 객체는 **불변(Immutable)** 입니다. String 클래스는 내부적으로 final 키워드가 선언된 byte[] 필드를 사용해서 문자열을 저장하기 때문입니다. 또한, String은 참조 타입(Reference Type)이기 때문에 `concat()`, `replace()`, `toUpperCase()`와 같은 String 메서드를 호출하면 새로운 String 객체를 참조하고 기존 객체를 수정하지 않습니다. 따라서 String 객체를 불변하게 유지할 수 있습니다.\n\n## String을 불변으로 설계한 이유는 무엇일까요?\n\nString을 불변으로 설계한 덕분에 많은 이점을 얻을 수 있습니다.\n\n1. String Constant Pool을 사용할 수 있습니다. 이를 통해 동일한 문자열의 String 변수들은 같은 객체를 공유하기 때문에 메모리를 효율적으로 사용할 수 있습니다.\n2. 불변한 객체는 멀티 스레드 환경에서 thread-safe합니다. 문자열을 변경하면 String Constant Pool에 새로운 객체를 생성하기 때문에 동기화를 신경쓸 필요가 없습니다.\n3. 해시코드를 한 번만 계산하고 이를 캐싱해서 재사용할 수 있습니다.\n4. 비밀번호, 토큰, URL 등의 민감한 정보를 안전하게 다룰 수 있습니다. 불변한 객체는 변경할 수 없기 때문에 민감한 정보가 예기치 않게 수정되는 것을 방지할 수 있습니다.\n\n## 리터럴로 생성한 String 객체와 생성자로 생성한 String 객체를 비교하면 어떤 차이가 있을까요?\n\n두 방식으로 생성한 객체는 같은 문자열을 갖더라도 메모리 상에서 다르게 처리됩니다.\n\n``` java\nString first = \"hello\"; // 리터럴로 생성\nString second = new String(\"hello\"); // 생성자로 생성\nString third = \"hello\";\n\nSystem.out.println(System.identityHashCode(first)); // 498931366\nSystem.out.println(System.identityHashCode(second)); // 2060468723\nSystem.out.println(System.identityHashCode(third)); // 498931366\n```\n\n리터럴로 생성한 String 객체는 Heap 영역의 String Constant Pool에 저장되어 동일한 문자열을 재사용할 수 있습니다. 문자열이 String Constant Pool에 이미 존재하면 같은 주소를 참조합니다.\n반면, 생성자로 생성한 String 객체는 Heap 영역에 저장되어 동일한 문자열이더라도 항상 새로운 객체를 생성합니다.\n\n``` java\nString first = \"hello\";\nString second = new String(\"hello\");\nString third = second.intern(); // intern() 메서드 사용\n\nSystem.out.println(System.identityHashCode(first)); // 498931366\nSystem.out.println(System.identityHashCode(second)); // 2060468723\nSystem.out.println(System.identityHashCode(third)); // 498931366\n```\n\n`intern()` 메서드를 사용하면 Heap 영역에 저장된 String 객체를 String Constant Pool에 저장할 수 있습니다.\n`intern()` 메서드는 해당 문자열이 String Constant Pool에 존재할 경우 그 주솟값을 반환하고, 없을 경우 String Constant Pool에 추가하고 새로운 주솟값을 반환합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [Baeldung - Why String Is Immutable in Java?](https://www.baeldung.com/java-string-immutable)\n- [Baeldung - Guide to Java String Pool](https://www.baeldung.com/java-string-pool)\n- [GeeksforGeeks - Compact Strings in Java 9 with Examples](https://www.geeksforgeeks.org/compact-strings-in-java-9-with-examples/)\n", "title": "String 객체는 가변일까요, 불변일까요? 그렇게 생각하신 이유도 함께 설명해 주세요."}, "be-109": {"id": "be-109", "content": "**코드형 인프라(Infrastructure as Code, IaC)** 는 수동 프로세스 대신 코드를 통해 인프라를 프로비저닝하고 관리하는 방법입니다. 기존의 수동 설정 방식은 반복 작업이 많고 휴먼 에러가 발생하기 쉬우며, 인프라 설정을 별도로 문서화해 관리해야 하는 번거로움이 있습니다. IaC는 이러한 문제를 해결하기 위해 등장했으며, 인프라를 코드로 관리함으로써 일관성을 보장하고 운영 효율성을 높일 수 있습니다.\n\nIaC는 크게 선언적(Declarative)방식과 명령형(Imperative)방식으로 나뉩니다. 선언적 방식은 **최종 상태**를 정의하면 IaC 도구가 이를 자동으로 구성하는 방식입니다. 사용자는 원하는 결과를 기술하기만 하면 되고, 수행 과정은 도구가 처리합니다. 대표적인 도구로는 Terraform과 AWS CloudFormation 등이 있습니다.\n명령형 방식은 **구성 방법**을 직접 정의하는 방식입니다. 사용자가 인프라를 설정하는 단계를 코드로 정의하며 명령어 기반으로 실행됩니다. 대표적인 도구로는 Ansible과 AWS CDK 등이 있습니다.\n\n## Infrastructure as Code의 장점과 단점은 무엇인가요?\n\n장점\n\n- Git과 같은 형상 관리 도구를 활용해서 변경 사항을 추적할 수 있습니다.\n- 코드 자체가 문서 역할을 하며 협업할 때 코드 리뷰를 통해 인프라 변경 사항을 검토할 수 있습니다.\n- 수동 작업없이 코드 실행만으로 인프라 구축을 자동화할 수 있습니다.\n- 코드를 재사용할 수 있기 때문에 비슷한 인프라를 구축할 때 시간을 절약할 수 있습니다.\n\n단점\n\n- 다양한 도구의 사용법을 익혀야 하기 때문에 러닝 커브가 발생할 수 있습니다.\n- 인프라의 상태 관리가 복잡할 수 있습니다.\n- 인프라 변경 시 문제가 발생했을 때 디버깅이 어려울 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [얼쑤 ALLSSU 유튜브 - IaC(Infrastructure as Code)가 뭘까?](https://www.youtube.com/watch?v=VF3j1a8VPFw)\n- [마켓컬리 - DevOps팀의 Terraform 모험](https://helloworld.kurly.com/blog/terraform-adventure/)", "title": "Infrastructure as Code(IaC)에 대해 설명해 주세요."}, "be-11": {"id": "be-11", "content": "## Tomcat\n\n웹 서버와 웹 컨테이너의 결합한 형태입니다. 현재 가장 일반적이고 많이 사용되는 WAS입니다. 컨테이너, 웹 컨테이너, 서블릿 컨테이너라고도 부릅니다. JSP와 서블릿 처리, 서블릿의 수명 주기 관리, 요청 URL을 서블릿 코드로 매핑, HTTP 요청 수신 및 응답, 필터 체인 관리 등을 처리해줍니다.\n\n### 서블릿이 무엇인가요? 🤔\n\n서블릿은 자바를 이용해 웹 서비스를 만들기 위한 스펙입니다. 클라이언트가 프로그램으로 요청을 보내면 그 요청에 대한 결과를 응답해주기 위해서 사용됩니다. 서블릿은 다음과 같이 동작합니다.\n\n1. 사용자가 URL을 입력하면 사용자의 요청이 서블릿 컨테이너로 전송됩니다.\n2. 요청을 받은 컨테이너는 HttpServletRequest, HttpServletResponse를 생성합니다.\n3. 서블릿 매핑 정보를 이용해 사용자가 요청한 경로를 처리할 수 있는 서블릿을 찾습니다.\n4. 서블릿의 service 메서드를 호출하고 HTTP 메서드 여부에 따라서 doGet(), doPost()를 호출합니다.\n5. 각 메서드는 요청을 처리하고 HttpServletResponse 객체를 이용해 응답을 처리합니다.\n\n### 서블릿의 생명주기는 어떻게 되나요? 🤓\n\n사용자의 요청이 들어오면 서블릿 컨테이너가 서블릿이 존재하는지 확인하고 없는 경우 init() 메서드를 호출하여 생성합니다. 이후 요청은 service() 메서드를 실행합니다. 만약 서블릿에 종료 요청이 들어오는 경우에는 destroy() 메서드를 호출합니다.", "title": "톰캣에 대해서 설명해주세요."}, "be-110": {"id": "be-110", "content": "양방향 @OneToOne일 때 **연관관계의 주인이 아닌 엔티티를 조회**할 경우 Lazy Loading이 동작하지 않습니다.\n\nJPA는 연관된 엔티티가 없으면 null로 초기화하고, 있으면 Lazy Loading이 설정되어 있을 경우 프록시 객체로 초기화합니다.\n하지만 데이터베이스의 테이블 관점에서 보면, 연관관계의 주인이 아닌 엔티티는 연관관계를 참조할 FK가 없기 때문에 연관관계의 존재 여부를 알지 못합니다.\n그래서 JPA는 null 혹은 프록시 객체 중 무엇으로 초기화할지 결정할 수 없게 되고, 결과적으로 연관된 엔티티의 존재 여부를 확인하는 추가 쿼리를 실행하기 때문에 Lazy Loading이 동작하지 않습니다. JPA의 한계이기 때문에 단방향으로 모델링하거나 Lazy Loading이 정말 필요한 것인지 다시 검토해 보아야 합니다.\n\n``` java\n@Entity(name = \"users\")\npublic class User {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @OneToOne(mappedBy = \"user\", fetch = FetchType.LAZY)\n    private Account account;\n}\n\n@Entity\npublic class Account {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @OneToOne(fetch = FetchType.LAZY)\n    private User user;\n}\n```\n\n``` java\n@Test\nvoid lazyTest() {\n    userRepository.save(new User());\n\n    userRepository.findById(1L).orElseThrow();\n}\n```\n\n<img width=\"300\" alt=\"image\" src=\"https://github.com/user-attachments/assets/8426feee-853d-40d2-99ff-f393bbdbf36e\" />\n\n\n## 추가 학습 자료를 공유합니다.\n\n- [Thorben Janssen - Hibernate Tip: How to lazily load one-to-one associations](https://thorben-janssen.com/hibernate-tip-lazy-loading-one-to-one/)\n", "title": "@OneToOne 연관관계에서 Lazy Loading을 설정할 때 주의할 점은 무엇일까요?"}, "be-111": {"id": "be-111", "content": "두 방식 모두 String 타입으로 변환하는 것은 동일하지만, 동작 방식과 예외 처리에서 차이가 있습니다.\n\n`(String) value`로 타입 캐스팅 하는 것은 value가 String 타입이 아닌 경우 ClassCastException이 발생하며, value가 null인 경우 그대로 null을 반환하여 이후 메서드를 호출할 때 NullPointerException이 발생합니다. 타입 캐스팅은 타입 안정성이 부족하기 때문에 캐스팅하는 타입이 확실할 때만 사용해야 합니다.\n\n``` java\nObject intValue = 10;\nString str1 = (String) intValue; // ClassCastException\n\nObject nullValue = null;\nString str2 = (String) nullValue; // null\nstr2.concat(\"maeilmail\"); // NullPointerException\n```\n\n`String.valueOf(value)`는 value가 String 타입이 아닌 경우 `value.toString()`을 호출하여 String으로 변환하며, value가 null인 경우 \"null\" 문자열을 반환합니다.\n\n``` java\nObject intValue = 10;\nString str1 = String.valueOf(intValue); // \"10\"\n\nObject nullValue = null;\nString str2 = String.valueOf(nullValue); // \"null\"\nstr2.concat(\"maeilmail\"); // \"nullmaeilmail\"\n```\n\n타입 캐스팅에서 발생하는 예외는 런타임 시점에 발생하기 때문에 `String.valueOf()`가 더 안전하고 예외를 방지할 수 있습니다.\n\n## 타입 캐스팅할 때 ClassCastException을 방지하는 방법은 무엇이 있을까요?\n\n캐스팅할 타입과 맞는지 먼저 확인 후 캐스팅하면 ClassCastException을 방지할 수 있습니다. 이때 instanceof를 사용하면 안전하게 변환할 수 있습니다.\n\n``` java\nObject intValue = 10;\n\nif (intValue instanceof String str) {\n    System.out.println(str);\n} else {\n    // ...\n}\n```\n\n## String.valueOf(null)이 \"null\"을 반환하는 것은 문제가 될 수도 있지 않나요?\n\n\"null\"이라는 문자열과 null 자체는 다른 의미를 가질 수 있기 때문에 문제가 될 수 있습니다. 특히, JSON 변환이나 데이터베이스에 저장할 때 null이 \"null\" 문자열로 저장되어서 오류가 발생할 가능성이 있습니다.\n원치 않는 \"null\" 문자열을 방지하려면 미리 null 여부를 검증하고 따로 처리하거나, `Objects.toString()`을 사용해서 null일 경우 다른 문자열로 처리하는 방법을 사용할 수 있습니다.\n", "title": "자바에서 Object 타입인 value를 String으로 타입 캐스팅하는 것과 String.valueOf()를 사용하는 것의 차이점은 무엇인가요?"}, "be-112": {"id": "be-112", "content": "자료구조 **트라이(Trie)** 는 문자열을 저장하고 효율적으로 탐색하기 위한 트리 형태의 자료 구조입니다. 트라이는 문자열을 탐색할 때 단순히 비교하는 것에 비해서 효율적으로 찾을 수 있지만, 각 정점이 자식에 대한 링크를 모두 가지고 있기 때문에 저장 공간을 더욱 많이 사용한다는 특징이 있습니다. 주로, 검색어 자동완성이나 사전 찾기 기능을 구현할 때 트라이 자료구조를 고려할 수 있습니다.\n\n<p align = \"center\" />\n\n  <img src = \"https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Trie_example.svg/500px-Trie_example.svg.png\" />\n  \n</p>\n\n출처 : 위키백과\n\n## 트라이는 어떻게 구현할 수 있나요? 🤔\n\n트라이 자료구조에서 루트는 항상 비어있으며, 각 간선은 추가될 문자를 키로 가지고 있습니다.\n또한, 각 정점은 이전 정점의 값과 간선의 키를 더한 결과를 값으로 가집니다. 트라이를 구현할 때는 이러한 구조를 염두에 두면서 해시 테이블과 연결 리스트를 이용하여 구현할 수 있습니다.\n\n```java\nclass TrieTest {\n\n    @Test\n    void trieTest() {\n        Trie trie = new Trie();\n        trie.insert(\"maeilmail\");\n        assertThat(trie.has(\"ma\")).isTrue();\n        assertThat(trie.has(\"maeil\")).isTrue();\n        assertThat(trie.has(\"maeilmail\")).isTrue();\n        assertThat(trie.has(\"mail\")).isFalse();\n    }\n\n    class Trie {\n\n        private final Node root = new Node(\"\");\n\n        public void insert(String str) {\n            Node current = root;\n            for (String ch : str.split(\"\")) {\n                if (!current.children.containsKey(ch)) {\n                    current.children.put(ch, new Node(current.value + ch));\n                }\n                current = current.children.get(ch);\n            }\n        }\n\n        public boolean has(String str) {\n            Node current = root;\n            for (String ch : str.split(\"\")) {\n                if (!current.children.containsKey(ch)) {\n                    return false;\n                }\n                current = current.children.get(ch);\n            }\n            return true;\n        }\n    }\n\n    class Node {\n\n        public String value;\n        public Map<String, Node> children;\n\n        public Node(String value) {\n            this.value = value;\n            this.children = new HashMap<>();\n        }\n    }\n}\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [Eleanor Lim - Trie(트라이) Tree에 대해서](https://youtu.be/TohdsR58i3Q?si=WoG4rQ8a1pSDj-NP)\n- [Code with Irtiza - Design an Autocomplete System | System Design\n](https://youtu.be/SG9CPplNGgo?si=dh4oTEePC3h8F8ey)\n- [System Design School - Design Typeahead (Autocomplete) System](https://systemdesignschool.io/problems/typeahead/solution)", "title": "자료구조 트라이에 대해서 설명해주세요."}, "be-113": {"id": "be-113", "content": "자바에서 **제네릭(Generic)** 은 기본적으로 **무공변(Invariant)** 입니다. 무공변이란 타입 S, T가 있을 때 서로 관계가 없다는 것을 의미합니다.\nS와 T가 서로 상속 관계이면 공변성이 있지만 제네릭은 상속 관계가 호환되지 않습니다. 따라서 타입이 정확히 일치하지 않으면 컴파일 에러가 발생합니다.\n\n``` java\npublic class Animal {\n}\n\npublic class Cat extends Animal {\n}\n\nList<Animal> animals = new ArrayList<Cat>(); // 컴파일 에러\nList<Cat> cats = new ArrayList<Animal>(); // 컴파일 에러\n```\n\n무공변은 타입 안정성을 보장하지만 타입의 유연성이 부족하다는 단점이 있어, 자바에서는 와일드카드(`?`)와 `extends`, `super` 키워드로 공변과 반공변을 지원합니다.\n\n**공변(Covariant)** 은 S가 T의 하위 타입일 때 S는 T가 될 수 있다는 것을 의미합니다.\n제네릭에서는 `<? extends T>`를 사용하여 하위 타입을 허용하고 **읽기 전용**으로 사용할 수 있습니다. 쓰기는 null만 가능합니다.\n\n**반공변(Contravariant)** 은 S가 T의 하위 타입일 때 T는 S가 될 수 있다는 것을 의미합니다.\n제네릭에서는 `<? super S>`를 사용하여 상위 타입을 허용하고 **쓰기 전용**으로 사용할 수 있습니다. 읽기는 Object 타입으로만 가능합니다.\n\n## PECS란 무엇인가요?\n\n**PECS(Producer Extends, Consumer Super)** 는 제네릭에서 와일드카드의 상위 또는 하위 경계를 설정할 때 사용하는 가이드라인입니다.\n객체를 생산할 때는 `<? extends T>`를 사용하고, 소비할 때는 `<? super T>`를 사용합니다.\n\n``` java\npublic void produce(List<? extends Animal> animals) { // animals가 생산자 역할\n    for (Animal a : animals) {\n        System.out.println(a);\n    }\n}\n\npublic void consume(List<? super Cat> cats) { // cats가 소비자 역할\n    cats.add(new Cat());\n}\n\n```\n\n## \\<?>와 \\<Object>의 차이점은 무엇인가요?\n\n`<?>`와 `<Object>`는 모든 타입을 수용하는 것처럼 보이지만 동작 방식에 차이가 있습니다.\n\n`<?>`는 모든 타입을 메서드 인자로 받을 수 있지만 null 외에는 값을 추가할 수 없기 때문에 **읽기 전용**으로 사용됩니다.\n`<Object>`는 `<Object>` 외의 타입을 메서드 인자로 받을 수 없지만 모든 객체를 추가할 수 있기 때문에 **읽기, 쓰기** 모두 가능합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [최범균님 유튜브 - 지네릭 변성(java)](https://www.youtube.com/watch?v=PtM44sO-A6g)\n- [Wikipedia - 공변성과 반공변성 (컴퓨터 과학)](https://ko.wikipedia.org/wiki/%EA%B3%B5%EB%B3%80%EC%84%B1%EA%B3%BC_%EB%B0%98%EA%B3%B5%EB%B3%80%EC%84%B1_(%EC%BB%B4%ED%93%A8%ED%84%B0_%EA%B3%BC%ED%95%99))\n- [Inpa 블로그 - 자바 제네릭의 공변성 & 와일드카드 완벽 이해](https://inpa.tistory.com/entry/JAVA-%E2%98%95-%EC%A0%9C%EB%84%A4%EB%A6%AD-%EC%99%80%EC%9D%BC%EB%93%9C-%EC%B9%B4%EB%93%9C-extends-super-T-%EC%99%84%EB%B2%BD-%EC%9D%B4%ED%95%B4)\n- [Baeldung - Java Generics PECS](https://www.baeldung.com/java-generics-pecs)\n", "title": "자바에서 제네릭의 공변, 반공변, 무공변에 대해 설명해 주세요."}, "be-114": {"id": "be-114", "content": "**Keep Alive**는 네트워크 또는 시스템에서 커넥션을 지속해서 유지하기 위해 사용되는 기술이나 설정을 의미합니다.\n\n**HTTP 프로토콜**에서 Keep-Alive는 하나의 TCP 커넥션으로 여러 개의 HTTP 요청과 응답을 주고받을 수 있도록 하는 기능입니다. HTTP/1.0에서는 요청마다 새로운 커넥션을 열고 닫았지만, HTTP/1.1부터는 Keep-Alive가 기본적으로 활성화되어 있어 커넥션을 재사용할 수 있습니다.\n\n**TCP 프로토콜**에서 Keep-Alive는 커넥션이 유휴 상태일 때 커넥션이 끊어지지 않도록 주기적으로 패킷을 전송하는 기능입니다.\n\n## Keep Alive의 장점과 단점은 무엇이 있을까요?\n\n장점\n\n- 커넥션을 재사용하여 네트워크 비용을 절감할 수 있습니다.\n- handshake에 필요한 RTT(Round Trip Time)가 감소하여 네트워크 지연 시간(Latency)을 줄일 수 있습니다.\n- handshake 과정에서 발생하는 CPU, 메모리 등의 리소스 소비를 줄일 수 있습니다.\n\n단점\n\n- 유휴 상태일 때에도 커넥션을 점유하고 있기 때문에 서버의 소켓이 부족해질 수 있습니다.\n- DoS 공격으로 다수의 연결을 길게 유지하여 서버를 과부하시킬 수 있습니다.\n- 타임아웃 설정이 적절하지 않으면 커넥션 리소스가 낭비될 수 있습니다.\n\n## HTTP와 TCP의 Keep Alive는 어떤 차이가 있나요?\n\nHTTP의 Keep-Alive는 클라이언트에서 일정 시간 동안 요청이 없으면 타임아웃만큼 커넥션을 유지하고, 타임아웃이 지나면 커넥션이 끊어집니다.\n\nTCP의 Keep-Alive는 커넥션이 유휴 상태일 때 주기적으로 패킷을 전송해서 커넥션이 살아있음을 확인하고, 살아있으면 커넥션을 지속해서 유지합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [Stack Overflow - Does a TCP socket connection have a \"keep alive\"?](https://stackoverflow.com/questions/1480236/does-a-tcp-socket-connection-have-a-keep-alive)\n- [MDN Web Docs - Keep-Alive](https://developer.mozilla.org/ko/docs/Web/HTTP/Headers/Keep-Alive)\n", "title": "Keep Alive에 대해 설명해 주세요."}, "be-115": {"id": "be-115", "content": "단일 프로세스 시스템은 **한 번에 하나의 프로그램만 실행**합니다.\n또 다른 프로그램을 실행하려면, 먼저 실행 중이던 프로그램을 종료시키고 그 다음 프로그램을 실행해야 합니다.\n\n## 단일 프로세스의 단점은 무엇이고 어떻게 개선할 수 있나요?\n\nCPU 사용률이 좋지 않습니다. 프로세스가 CPU를 사용하는 작업을 처리하다가, IO 작업을 하게 되면 CPU는 그 때 마다 아무런 일을 하지 않는 상태로 대기합니다. 이 문제를 개선하기 위해 **멀티 프로그래밍**을 사용할 수 있습니다. \n\n멀티 프로그래밍은 단일 프로세스 시스템과 달리 하나의 프로세스가 IO 작업을 하게 되어 대기하게 되면, 다른 프로세스가 실행되어 CPU가 아무 일도 하지 않는 시간을 줄입니다. 멀티 프로그래밍의 주된 목적은 **CPU 사용률을 극대화** 하는데 있습니다.\n\n## 멀티 프로그래밍의 단점은 무엇이고 어떻게 개선할 수 있나요?\n\n멀티 프로그래밍의 단점은 하나의 프로세스가 작업 시 CPU 사용하는 작업을 하면 계속 점유하게 되어 다른 프로세스가 작업을 하지 못하고 대기하는 것 입니다. 이를 위한 해결책은 두개 이상의 프로세스가 CPU를 사용할 때, 아주 짧은 시간 동안(Quantum)만 번갈아가며 실행될 수 있도록 하여 하나의 프로세스가 CPU를 독점하거나, 대기해야 하는 비효율을 개선할 수 있습니다. 이런 종류의 시스템을 **멀티 태스킹(Multi-Tasking)** 이라고 합니다.\n\n## 멀티 프로그래밍과 멀티 태스킹의 차이는 무엇인가요?\n\n멀티태스킹과 멀티프로그래밍은 **동시에 여러 프로그램을 실행시킨다는 면에서 유사**하지만, CPU 타임을 아주 짧게 쪼개서 **CPU 타임 안에서 프로세스들이 서로 번갈아 가면서 실행**될 수 있도록 했다는 점이 차이가 있습니다.\n\n**멀티태스킹**은 프로세스의 응답 시간을 최소화 시키는데 목적입니다. 응답시간을 최소화 시킨다는 것은 사용자 입장에서 **마치 정말 여러 프로그램이 동시에 실행되는 것 처럼** 느껴지게 만듭니다. 아주 짧은 타임 슬라이스 안에서 여러 프로세스들이 교대로 실행이 되면서 즉각적인 응답을 보여줍니다.\n\n멀티태스킹의 핵심은 타임 슬롯을 아주 짧게 쪼개서 프로세스들이 번갈아가며 실행을 하게 됨으로써 어떤 프로그램을 실행시키거나 어떤 동작을 했을 때 즉각적인 반응을 받을 수 있도록 하여 동시에 여러 프로그램이 실행되는 것과 같은 느낌을 주는 것 입니다.\n\n## 추가 학습 자료를 공유합니다.\n- [쉬운코드 - 프로세스, 스레드, 멀티태스킹, 멀티스레딩, 멀티프로세싱, 멀티프로그래밍, 이 모든 것을 한 방에 깔끔하게 설명합니다!! 콘텐츠 퀄리티 만족하실 겁니다!](https://www.youtube.com/watch?v=QmtYKZC0lMU)", "title": "단일 프로세스 시스템에 대해서 설명해주세요."}, "be-116": {"id": "be-116", "content": "멀티 태스킹 시스템을 사용하더라도 아래와 같은 문제점이 남아 있습니다.\n\n1. **하나의 프로세스가 동시에 여러 작업을 수행하지 못함**  \n    - 여러 프로세스를 생성하여 문제를 해결할 수는 있으나, 프로세스가 많아지면 관리와 자원 소모 측면에서 여러 가지 단점이 발생합니다.\n2. **무거운 프로세스 간 컨텍스트 스위칭**\n    - 컨텍스트 스위칭은 CPU가 한 프로세스에서 다른 프로세스로 전환할 때 발생하며, 이 작업은 상대적으로 무겁고 비용이 큽니다.\n3. **프로세스 간 데이터 공유의 어려움**\n    - 각 프로세스는 독립적인 메모리 공간을 사용하기 때문에, 서로 다른 프로세스 간에 데이터를 공유하는 것이 까다롭습니다.\n\n## 스레드(Thread)의 등장과 특징\n\n이러한 문제점을 해결하기 위해 등장한 것이 **스레드**입니다. 스레드는 한 프로세스 내에서 여러 작업을 동시에 실행할 수 있도록 도와줍니다.\n\n1. **프로세스 내 여러 스레드 보유**\n    - 하나의 프로세스는 하나 이상의 스레드를 가질 수 있으며, 각 스레드가 하나의 작업을 담당합니다. 이는 여러 작업을 동시에 실행할 수 있도록 하는 핵심 요소입니다.\n2. **CPU 실행 단위**\n    - 과거에는 프로세스가 CPU에서 실행되는 단위였다면, 현재는 스레드가 CPU에서 실행되는 최소 단위가 되었습니다.\n    - 기본적으로 프로세스는 하나의 스레드를 가지고 있으며, 필요에 따라 추가적인 스레드를 생성할 수 있습니다.\n3. **가벼운 스레드 간 컨텍스트 스위칭**\n    - 스레드는 동일 프로세스 내에서 메모리 영역(특히 Heap)을 공유하므로, 스레드 간의 컨텍스트 스위칭은 프로세스 간 스위칭보다 훨씬 가볍습니다.\n    - 다만, 각 스레드는 고유한 Stack, 포인터, 프로그램 카운터 등을 가지고 있어, 자신만의 실행 상태를 유지합니다. 같은 프로세스 내의 스레드들은 메모리 영역은 공유하지만, 각 스레드만의 고유한 정보(스택, 프로그램 카운터 등)를 보유합니다.\n\n## 멀티스레딩과 멀티프로세싱\n\n- **멀티스레딩 (Multi-threading):**  \n    하나의 프로세스 내에서 여러 스레드를 통해 동시에 여러 작업을 실행하는 기법입니다. \n- **확장된 멀티태스킹 개념:**  \n    과거에는 프로세스 간 아주 짧은 시간의 스위칭으로만 작업을 나누었다면,  \n    이제는 여러 프로세스와 스레드가 아주 짧게 쪼개진 CPU 타임을 나눠가져 실행됩니다.\n- **멀티프로세싱 (Multi-processing):**  \n    두 개 이상의 프로세서나 코어를 활용하여, 여러 프로세스가 동시에 실행되는 시스템입니다.", "title": "멀티 태스킹 시스템의 한계에 대해서 설명해주세요."}, "be-117": {"id": "be-117", "content": "JCF에서 ArrayList를 기준으로 설명하겠습니다. ArrayList의 기본 용량(capacity)은 10이며, 용량이 가득 차면 기존 크기의 **1.5배(oldCapacity + (oldCapacity >> 1))** 로 증가합니다. 예를 들어, MAX = 5,000,000일 때 기본 설정으로 리스트를 생성하면 여러 번의 리사이징이 발생해 최종 capacity가 6,153,400까지 증가하고, 약 70MB의 메모리를 사용합니다. 반면, `new ArrayList(MAX)`로 초기 용량을 설정하면 불필요한 리사이징 없이 5,000,000 크기로 고정되며, 약 20MB의 메모리만 사용하게 됩니다.\n\n```java\npublic class Main {\n\n    private static final int MAX = 5_000_000;\n\n    public static void main(String[] args) {\n        MemoryMXBean memoryMXBean = ManagementFactory.getMemoryMXBean();\n        printUsedHeap(1, memoryMXBean);\n\n        List<String> arr = new ArrayList<>();\n        for (int i = 0; i < MAX; i++) {\n            arr.add(\"a\");\n        }\n\n        printUsedHeap(2, memoryMXBean);\n        printUsedHeap(3, memoryMXBean);\n    }\n\n    private static void printUsedHeap(int logIndex, MemoryMXBean memoryMXBean) {\n        MemoryUsage heapUsage = memoryMXBean.getHeapMemoryUsage();\n        long used = heapUsage.getUsed();\n        System.out.println(\"[\" + logIndex + \"] \" + \"Used Heap Memory: \" + used / 1024 / 1024 + \" MB\");\n    }\n}\n```\n정리하자면, JCF에서 가변 크기의 자료 구조를 사용하는 경우, 초기 용량을 설정하면 리사이징을 줄이고 메모리와 연산 비용을 절약할 수 있습니다.\n\n## 로드 팩터와 임계점이란 무엇인가요? \n\n**로드 팩터(load factor)** 란 특정 크기의 자료 구조에 데이터가 어느 정도 적재되었는지 나타내는 비율입니다. 가변적인 크기를 가진 자료구조에서 크기를 증가시켜야 하는 **임계점(Threshold)** 을 계산하기 위해서 사용됩니다. 예를 들어, JCF에서 HashMap의 경우에는 내부적으로 배열을 사용하며, 초기 사이즈는 16입니다. 이때, HashMap의 기준 로드 팩터는 0.75이므로 임계점은 **12(capacity * load factor = threshold)** 입니다. 만약, HashMap 내부 배열의 사이즈가 12를 넘는 경우 내부 배열의 크기를 2배 늘리고, 재해싱을 수행합니다.\n\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 미아의 Java Collection Framework](https://youtu.be/FrPCDEiindY?si=ykbCGg0yFipstbSg)\n- [와탭랩스 유튜브 - JAVA 메모리 사용량 테스트, 이건 해보셨나요?](https://youtu.be/_PerqNUKKjY?si=Ke6fWcMXFOvEBpda)\n- [Naver D2 - Java HashMap은 어떻게 동작하는가?](https://d2.naver.com/helloworld/831311)\n\n\n\n\n", "title": "JCF 자료구조의 초기 용량을 지정하면 좋은 점이 무엇인가요?"}, "be-118": {"id": "be-118", "content": "**가상화(Virtualization)** 란 하나의 물리적인 컴퓨팅 리소스를 논리적으로 분리하여 여러 개의 가상 리소스를 생성해 사용하는 기술을 의미합니다.\n서버, 스토리지, 네트워크 등 다양한 IT 리소스를 가상화할 수 있으며, 클라우드 컴퓨팅에 핵심이 되는 기술 중 하나로 활용됩니다.\n\n## 가상화가 왜 필요한가요?\n\n1. 서버를 가상화할 경우 물리 서버에 여러 가상 서버를 배치하여 하드웨어 리소스를 효율적으로 사용할 수 있습니다.\n2. 물리적인 하드웨어 수를 줄일 수 있어 초기 구축 비용 및 유지 관리 비용을 절감할 수 있습니다.\n3. 각 가상 리소스들은 격리되어 있어 하나의 가상 리소스에 장애가 발생해도 다른 가상 리소스에 영향을 미치지 않습니다.\n4. 가상 리소스를 필요에 따라 빠르게 생성하거나 삭제할 수 있어 인프라 운영이 유연해집니다.\n5. 가상 리소스는 소프트웨어 기반이기 때문에 장애 복구가 용이하고 가용성을 높일 수 있습니다.\n\n## 서버 가상화에 대해 자세히 설명해 주세요.\n\n가장 일반적인 가상화 형태로, 물리적인 서버를 여러 개의 **가상 머신(VM, Virtual Machine)** 으로 나누어 사용하는 기술입니다.\nVM을 사용하면 하나의 물리 서버에서 여러 운영 체제를 실행할 수 있으며, 각각의 VM은 독립적으로 운영됩니다. 이 때 VM은 게스트, VM들이 실행되는 물리 서버는 호스트라고 합니다.\n\n**하이퍼바이저(Hypervisor)** 는 물리 서버에 설치되는 가상화 소프트웨어로, 하드웨어로부터 VM에 필요한 CPU, 메모리 등의 리소스를 할당하고 VM들이 서로 격리되어 동작할 수 있도록 관리하는 역할을 합니다. 하이퍼바이저는 실행 위치에 따라 Type 1과 Type 2로 나뉩니다.\n\nType 1은 Native 또는 Bare Metal 하이퍼바이저라도 하며, 하드웨어에서 직접 실행되어 별도의 호스트 OS가 필요하지 않습니다. 일반적으로 엔터프라이즈 데이터 센터에서 사용하며 KVM과\nMicrosoft의 Hyper-V 등이 대표적인 예시입니다.\n\nType 2는 Hosted 하이퍼바이저라고도 하며, 호스트 OS 위에서 하나의 애플리케이션으로 실행됩니다. 개인용 PC나 개발 환경에서 주로 사용하며 Oracle의 VirtualBox와 VMware의 Workstation 등이 대표적인 예시입니다.\n\n## VM과 컨테이너의 차이점을 알고 계신가요?\n\nVM은 하이퍼바이저를 통해 호스트 시스템에서 다수의 게스트 OS를 동시에 실행하는 기술입니다. VM은 다양한 OS를 실행할 수 있고 높은 수준의 격리를 제공하지만, 게스트 OS를 포함하기 때문에 무겁고 성능이 느리다는 단점이 있습니다.\n\n컨테이너는 호스트 OS의 커널을 공유하며, 컨테이너 이미지를 통해 애플리케이션을 실행하는 기술입니다. 컨테이너는 VM보다 가볍고 빠른 성능, 높은 확장성을 보이지만, 커널을 공유하기 때문에 보안에 취약할 수 있고 호스트 OS와 동일한 환경으로 구성해야 한다는 단점이 있습니다.\n\n다양한 OS가 필요한 환경이거나 높은 격리 수준이 중요할 경우 VM을 사용하고, 빠른 배포와 확장이 필요한 클라우드 네이티브 환경이거나 마이크로서비스 아키텍처를 활용할 경우 컨테이너를 사용할 수 있습니다. 하지만 VM과 컨테이너는 서로 대체하는 기술이 아니기 때문에 VM 위에서 컨테이너를 실행하는 방식과 같이 목적에 따라 함께 활용할 수도 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 새양의 가상화와 도커](https://www.youtube.com/watch?v=bEbW6zA0krY)\n- [AWS - 가상화란 무엇인가요?](https://aws.amazon.com/ko/what-is/virtualization/)\n- [IBM - 가상 머신이란 무엇인가요?](https://www.ibm.com/kr-ko/think/topics/virtual-machines)\n", "title": "가상화에 대해 설명해 주세요."}, "be-119": {"id": "be-119", "content": "우리가 작성한 `.java` 파일은 JDK에 포함된 **javac(java compiler)** 를 통해 컴파일됩니다. 이 과정에서 JVM이 이해할 수 있는 **바이트 코드**로 변환되어 `.class` 파일이 생성됩니다. 이후부터는 JVM이 담당하는데요. 먼저 **클래스 로더(Class Loader)** 가 바이트 코드를 JVM 메모리에 동적으로 로드합니다. 로드된 바이트 코드는 Method Area에 저장되며, 이때 로딩(Loading), 링킹(Linking), 초기화(Initialization) 단계를 거칩니다. 그다음, **실행 엔진(Execution Engine)** 이 로드된 바이트 코드를 실행합니다. 하지만 바이트 코드는 컴퓨터가 읽을 수 없기 때문에 **인터프리터(Interpreter)** 와 **JIT 컴파일러(Just-In-Time Compiler)** 를 함께 사용하여 기계어로 변환합니다. 인터프리터는 바이트 코드를 한 줄씩 읽어서 실행하는 방식이고, JIT 컴파일러는 자주 실행되는 메서드(Hotspot)를 감지하면 해당 메서드 전체를 네이티브 코드로 변환하여 캐싱합니다.\n\n## 클래스 로더가 바이트 코드를 동적으로 로드한다는 것은 무슨 의미인가요?\n\n프로그램이 시작될 때 모든 클래스를 한꺼번에 로드하는 것이 아니라, 런타임 시점에 필요한 클래스만 로드하는 것을 의미합니다. 클래스 로드는 인스턴스를 생성할 때, static 메서드나 변수를 사용할 때, static 변수에 값을 할당할 때 이루어집니다. 이러한 동적 로드 방식은 불필요한 클래스 로드를 방지하여 메모리를 효율적으로 사용할 수 있습니다.\n\n## 로딩, 링킹, 초기화 단계가 무엇인가요?\n\n**로딩(Loading)** 은 클래스 로더가 `.class` 파일을 읽어 JVM 메모리에 로드하는 단계입니다. 로드된 클래스는 Method Area에 저장됩니다.\n\n**링킹(Linking)** 은 로드된 클래스가 실행될 수 있도록 준비하는 단계이며 세 가지의 과정으로 이루어집니다.\n\n1. **Verification**: `.class` 파일이 구조적으로 올바른지 확인합니다.\n2. **Preparation**: static 변수를 메모리에 할당하고 기본값으로 초기화합니다.\n3. **Resolution**: 런타임 상수 풀에 있는 심볼릭 레퍼런스를 실제 메모리 레퍼런스로 교체합니다.\n\n**초기화(Initialization)** 는 static 변수를 사용자가 지정한 값으로 초기화하고 static 블록을 실행하는 단계입니다.\n\n## 실행 엔진이 바이트 코드를 기계어로 변환할 때 인터프리터와 JIT 컴파일러를 함께 사용하는 이유는 무엇인가요?\n\n인터프리터는 바이트 코드를 한 줄씩 읽어서 실행하는 방식이기 때문에 초기 실행 속도가 빠릅니다. 하지만 같은 코드가 반복적으로 실행될 경우 매번 해석해야 해서 성능이 저하되는 단점이 있습니다. 초기 JVM은 인터프리터만 사용했지만, 이러한 단점을 보완하기 위해 JIT 컴파일러가 도입되었습니다.\n\nJIT 컴파일러는 자주 실행되는 메서드를 네이티브 코드로 변환하여 캐싱합니다. 이렇게 변환된 코드는 반복 실행 시 인터프리터보다 훨씬 빠르게 실행됩니다. 하지만 JIT 컴파일 과정 자체에 시간이 소요되기 때문에 초기 실행 시 오버헤드가 발생할 수 있습니다. 따라서 JVM은 두 방식을 함께 사용하여 초기 실행 속도와 높은 반복 실행 성능을 동시에 달성할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [Oracle - Loading, Linking, and Initializing](https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-5.html)\n- [Inpa 블로그 - 클래스는 언제 메모리에 로딩 & 초기화 되는가?](https://inpa.tistory.com/entry/JAVA-%E2%98%95-%ED%81%B4%EB%9E%98%EC%8A%A4%EB%8A%94-%EC%96%B8%EC%A0%9C-%EB%A9%94%EB%AA%A8%EB%A6%AC%EC%97%90-%EB%A1%9C%EB%94%A9-%EC%B4%88%EA%B8%B0%ED%99%94-%EB%90%98%EB%8A%94%EA%B0%80-%E2%9D%93)\n- [BellSoft - Compilation in Java: JIT vs AOT](https://bell-sw.com/blog/compilation-in-java-jit-vs-aot/)\n", "title": "자바 프로그램이 실행되는 흐름을 설명해 주세요."}, "be-12": {"id": "be-12", "content": "AutoConfiguration의 시작은 `@SpringBootApplication` 어노테이션 안에 있는`@EnableAutoConfiguration` 이라는 애노테이션입니다.\n\n`@EnableAutoConfiguration`은 `@Import(AutoConfigurationImportSelector.class)`를 통해 자동 구성 클래스를 가져옵니다. \n\n```java\n@Target({ElementType.TYPE})\n@Retention(RetentionPolicy.RUNTIME)\n@Documented\n@Inherited\n@AutoConfigurationPackage\n@Import({AutoConfigurationImportSelector.class})\npublic @interface EnableAutoConfiguration {\n    String ENABLED_OVERRIDE_PROPERTY = \"spring.boot.enableautoconfiguration\";\n\n    Class<?>[] exclude() default {};\n\n    String[] excludeName() default {};\n}\n```\n\n자동 구성 클래스를 가져올 때는 AutoConfigurationImportSelector 클래스의 `selectImports(AnnotationMetadata annotationMetadata)` 라는 메서드를 이용하고, `getAutoConfigurationEntry(AnnotationMetadata annotationMetadata);` 메서드를 통해 Import할 클래스가 무엇인지 알 수 있게 됩니다.\n\n- 간단한 메서드 동작 과정 설명 \n\n1. getCandidateConfigurations(annotationMetadata, attributes); - AutoConfiguration의 후보들을 가져온다.\n2. removeDuplicates(configurations); - 중복을 제거한다.\n3. getExclusions(annotationMetadata, attributes); - 자동 설정에서 제외되는 설정에 대한 정보를 가져온다.\n4. configurations.removeAll(exclusions); - 제외되는 설정을 제거한다.\n5. getConfigurationClassFilter().filter(configurations); - 필터를 적용한다.\n\n출처 : https://velog.io/@realsy/Spring-Boot-AutoConfiguration-%EB%8F%99%EC%9E%91-%EC%9B%90%EB%A6%AC", "title": "AutoConfiguration 동작 원리를 설명해주세요."}, "be-120": {"id": "be-120", "content": "낙관적 락과 비관적 락은 데이터베이스 트랜잭션에서 동시성 제어를 위한 주요 기법입니다.\n데이터 무결성을 유지하면서 여러 트랜잭션이 동시에 데이터에 접근할 때 발생할 수 있는 충돌을 해결할 때 사용됩니다.\n\n**낙관적 락(Optimistic Lock)** 은 데이터 충돌이 적을 것으로 가정하고, 데이터를 읽을 때 락을 설정하지 않고 트랜잭션이 데이터를 수정할 때 충돌이 발생하지 않았는지 확인하는 방식입니다.\n보통 version과 같은 별도의 구분 컬럼을 사용해서 데이터가 변경되었는지 확인하며, 충돌이 발생하면 데이터베이스가 아닌 애플리케이션에서 직접 롤백하거나 재시도 처리를 해야 합니다.\n\n**비관적 락(Pessimistic Lock)** 은 데이터 충돌이 많을 것으로 가정하고, 트랜잭션이 시작될 때 공유락(Shared Lock, S-Lock) 또는 베타락(Exclusive Lock, X-Lock)을 설정하여 다른 트랜잭션이 해당 데이터에 접근하지 못하도록 하는 방식입니다.\n\n> S-Lock과 X-Lock은 다음과 같습니다.\n>\n> S-Lock: 다른 트랜잭션에서 읽기는 가능하지만 쓰기는 불가능합니다. <br/>\n> X-Lock: 다른 트랜잭션에서 읽기, 쓰기 모두 불가능합니다. <br/>\n> &nbsp;&nbsp;&nbsp;&nbsp;cf. MySQL은 [일관된 읽기(Consistent Nonlocking Reads)](https://dev.mysql.com/doc/refman/8.0/en/innodb-consistent-read.html)를 지원하여 X-Lock이 걸려있어도 단순 SELECT로 읽을 수 있습니다.\n\n## 두 방식의 차이점은 무엇인가요?\n\n첫 번째는 **충돌 가능성**입니다. 낙관적 락은 충돌이 자주 발생하지 않을 것이라고 가정하고, 비관적 락은 충돌이 자주 발생할 것이라고 가정합니다.\n\n두 번째는 **데이터베이스 락 사용 여부**입니다. 낙관적 락은 락을 사용하지 않고, 비관적 락은 트랜잭션이 시작될 때 락을 설정합니다.\n\n세 번째는 **성능**입니다. 낙관적 락은 락을 설정하지 않기 때문에 성능이 더 좋을 수 있습니다. 하지만 충돌이 발생할 경우 롤백하거나 재시도 처리를 해야 하기 때문에 성능이 떨어질 수 있습니다. 비관적 락은 락을 설정하기 때문에 다른 트랜잭션이 대기해야 하며, 이로 인해 성능이 저하될 수 있습니다.\n\n결론적으로 낙관적 락은 충돌이 발생하면 해결하는 방식이고, 비관적 락은 애초에 충돌을 방지하는 방식입니다.\n\n## 언제 어떤 락을 사용하는 것이 유리할까요?\n\n데이터 충돌이 자주 발생하거나 데이터 무결성이 중요한 경우에는 비관적 락을 사용하는 것이 유리할 수 있습니다.\n조회 작업이 많고 동시 접근 성능이 중요한 경우에는 낙관적 락을 사용하는 것이 유리할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 우르의 Lock & JPA Lock](https://www.youtube.com/watch?v=LDi5muN2kgI)\n- [[10분 테코톡] 우주의 낙관적인 락, 비관적인 락](https://www.youtube.com/watch?v=era8W7q3CeQ)\n- [Stack Overflow - Optimistic vs. Pessimistic locking](https://stackoverflow.com/questions/129329/optimistic-vs-pessimistic-locking)\n- [Baeldung - Optimistic Locking in JPA](https://www.baeldung.com/jpa-optimistic-locking)\n- [Baeldung - Pessimistic Locking in JPA](https://www.baeldung.com/jpa-pessimistic-locking)", "title": "낙관적 락과 비관적 락에 대해 설명해 주세요."}, "be-121": {"id": "be-121", "content": "**페이징 쿼리(Paging Query)** 는 전체 데이터를 부분적으로 나누어 데이터를 조회하거나 처리할 때 사용됩니다. 데이터를 상대적으로 작은 단위로 나누어 처리하기 때문에 데이터베이스나 애플리케이션의 리소스 사용 효율이 증가하며, 로직 처리 시간을 단축 시킬 수 있습니다. MySQL에서 페이징 쿼리는 일반적으로 LIMIT, OFFSET 구문을 사용하여 작성합니다.\n\n```sql\nselect *\nfrom subscribe\nlimit 500\noffset 0;\n```\n\n## LIMIT, OFFSET 방식 페이징 쿼리의 단점은 무엇이고, 어떻게 해결할 수 있나요?\n\nLIMIT, OFFSET 방식의 페이징 쿼리는 뒤에 있는 데이터를 읽을 수록 점점 응답 시간이 길어질 수 있는데요. 왜냐하면, DBMS는 지정된 OFFSET 수만큼 모든 레코드를 읽은 이후에 데이터를 가져오기 때문입니다. 이 문제를 해결하기 위해서 OFFSET을 활용하지 않는 페이징 쿼리를 사용하는 것이 대표적입니다. 예를 들어, 다음과 같은 테이블이 있다고 가정하겠습니다.\n\n```sql\n\ncreate table subscribe (\n   id int not null auto_increment,\n   deleted_at datetime null,\n   created_at datetime not null,\n   primary key(id),\n   key idx_deleted_at_id(deleted_at, id)\n);\n```\n\n이때, 특정 기간 동안 구독을 해제한 사용자를 조회하는 쿼리는 다음과 같습니다.\n\n```sql\nselect *\nfrom subscribe\nwhere\n    deleted_at >= ? and deleted_at < ?\n```\n\nOFFSET을 사용하지 않는 페이징은 이전 페이지의 마지막 데이터 값을 기반으로 다음 페이지를 조회합니다. 이때, 상황에 따라서 첫 페이지 조회 쿼리와 N 회차 쿼리의 모양이 다를 수 있습니다. 위 예제에서 첫 페이지를 조회하는 쿼리는 다음과 같이 작성할 수 있습니다.\n\n```sql\nselect *\nfrom subscribe\nwhere\n    deleted_at >= ? and deleted_at < ?\norder by deleted_at, id\nlimit 10;\n```\n\n그리고 첫 페이지 이후의 페이지는 이전에 조회된 페이지의 마지막 값을 기반으로 다음 페이지를 조회합니다. 만약, 이전 페이지의 마지막 값의 deleted_at이 '2024-01-01'이고, 식별자가 78이라면 다음과 같은 쿼리가 작성됩니다.\n\n```sql\nselect *\nfrom subscribe\nwhere\n   # deleted_at이 같은 케이스를 대응\n   (deleted_at = '2024-01-01 00:00:00' and id > 78) or\n   # 마지막 데이터 이후 데이터 조회\n   (deleted_at > '2024-01-01 00:00:00' and deleted_at < ?)\norder by deleted_at, id\nlimit 10;\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [기억보단 기록을 - 1. 페이징 성능 개선하기 - No Offset 사용하기](https://jojoldu.tistory.com/528)\n- [기억보단 기록을 - 2. 페이징 성능 개선하기 - 커버링 인덱스 사용하기](https://jojoldu.tistory.com/529?category=637935)\n- [기억보단 기록을 - 3-1. 페이징 성능 개선하기 - 검색 버튼 사용시 페이지 건수 고정하기\n](https://jojoldu.tistory.com/530?category=637935)\n- [기억보단 기록을 - 3-2. 페이징 성능 개선하기 - 첫 페이지 조회 결과 cache 하기\n](https://jojoldu.tistory.com/531?category=637935)\n\n", "title": "RDB에서 페이징 쿼리의 필요성을 설명해 주세요."}, "be-122": {"id": "be-122", "content": "멀티쓰레딩은 여러 프로세스가 동시에 실행되는 멀티 태스킹과 달리 \n**하나의 프로세스 내에서 여러 작업을 여러 쓰레드를 통해 동시에 실행**할 수 있도록 하는 방식입니다.\n\n## 멀티쓰레딩(Multi-Thread)의 주요 특징\n\n**1. 경량화된 실행 단위**\n- 낮은 오버헤드: 스레드는 같은 프로세스 내에서 실행되므로, 프로세스 간의 컨텍스트 스위칭에 비해 스레드 간 전환은 훨씬 가볍고 빠릅니다.\n- 빠른 전환: 각 스레드는 자신만의 스택과 레지스터(프로그램 카운터)를 갖지만, 코드나 힙 메모리 등은 공유하기 때문에 전환 시 재설정해야 할 데이터의 양이 적어 전환 속도가 빠릅니다.\n\n**2. 효율적인 데이터 공유**\n- 공유 메모리: 같은 프로세스 내의 스레드들은 힙 영역 등 주요 메모리 공간을 공유하므로, 데이터 전달이 빠르고 간편합니다.\n- 동기화 관리: 스레드 간의 데이터 공유는 IPC와 같은 복잡한 메커니즘 없이도 이루어지지만, 동시에 접근할 경우 동기화 문제는 여전히 존재합니다.\n  \n**3. 응답성 및 처리 성능 향상**\n- 병렬 처리: 멀티쓰레딩을 통해 I/O 작업과 CPU 집약적 작업을 분리하여 동시에 처리할 수 있으므로, 시스템 전체의 응답성이 향상됩니다.\n- 리소스 활용 최적화: CPU의 멀티코어 환경에서 각 스레드를 개별 코어에 할당하여 병렬 처리가 가능해지므로, 시스템 자원을 더욱 효율적으로 사용할 수 있습니다.\n\n멀티쓰레딩을 사용하면 프로세스 기반의 멀티태스킹보다 **낮은 비용의 컨텍스트 스위칭**과 효율적인 메모리 사용, 그리고 빠른 데이터 공유가 가능해집니다. 결과적으로, **I/O 작업이나 대기 작업을 별도의 스레드로 처리하여 주 스레드가 차단되지 않고** 사용자 입력이나 다른 중요한 작업에 빠르게 대응할 수 있게 됩니다.\n\n물론, 멀티쓰레딩도 완벽한 해결책은 아닙니다. 스레드들이 같은 메모리를 공유하다 보니 **경쟁 상태**나 **교착 상태**와 같은 동기화 문제가 발생할 수 있고, 이를 해결하는 과정이 복잡해지거나 디버깅이 어려워질 수 있습니다. 또한, 스레드 관리를 소홀히 하면 **시스템 자원이 과도하게 사용될 위험**도 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [매일메일 - 멀티 태스킹 시스템의 한계에 대해서 설명해주세요.](https://www.maeil-mail.kr/question/234)", "title": "멀티 쓰레딩에 대해서 설명해 주세요."}, "be-123": {"id": "be-123", "content": "**PRG 패턴** 은 Post/Redirect/Get 패턴의 약자로, 웹 애플리케이션에서 폼 제출 후 페이지 새로 고침이나 브라우저 뒤로 가기 등의 문제를 방지하기 위해 사용하는 디자인 패턴입니다. 일반적으로 멱등성이 보장되지 않는 POST 요청에 사용합니다. 예를 들어, 사용자가 웹 페이지에서 주문 버튼을 클릭하고 새로고침을 수행하면 2번의 POST 요청이 서버로 전달되는데요. 이러한 상황에서 PRG 패턴이 주로 사용됩니다.\n\n<p align = \"center\" />\n  \n<img src = \"https://upload.wikimedia.org/wikipedia/commons/3/3c/PostRedirectGet_DoubleSubmitSolution.png\" />\n\n출처 : 위키백과\n  \n</p>\n\nPRG 패턴은 다음과 같은 단계를 따릅니다. \n\n- 사용자가 폼을 제출하면 클라이언트는 서버에 POST 요청을 보냅니다. 서버는 이 요청을 처리하여 데이터베이스를 업데이트하거나 다른 작업을 수행합니다. (Post)\n- 서버는 POST 요청을 처리한 후, 클라이언트에게 새로운 URL로 리디렉션하라는 응답을 보냅니다. 이 리디렉션은 클라이언트에게 302 Found 상태 코드와 함께 새로운 URL을 포함한 Location 헤더를 반환하여 수행됩니다. (Redirect)\n- 클라이언트는 서버의 응답을 받아 새로운 URL로 GET 요청을 보냅니다. 서버는 이 GET 요청을 처리하여 최종 결과 페이지를 클라이언트에게 반환합니다. (Get)\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 호티의 Http Method](https://youtu.be/kt-i2falokE?feature=shared)\n- [PRG(Post-Redirect-Get) 패턴이란?](https://hstory0208.tistory.com/entry/Spring-PRGPost-Redirect-Get-%ED%8C%A8%ED%84%B4%EC%9D%B4%EB%9E%80)\n- [MDN - Redirections in HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections)\n- [토스페이먼츠 용어사전 - 리다이렉트(Redirect)](https://docs.tosspayments.com/resources/glossary/redirect)", "title": "PRG 패턴에 대해서 설명해 주세요."}, "be-124": {"id": "be-124", "content": "**Serial GC**는 JDK에 도입된 최초의 가바지 컬렉터이며, 단일 스레드로 동작하는 가장 단순한 형태입니다. 작은 힙 메모리와 단일 CPU 환경에 적합하며 Stop-The-World 시간이 가장 길게 발생합니다.\n\n**Parallel GC**는 Java 5부터 8까지 **default** 가비지 컬렉터로 사용되었으며, Serial GC와 달리 Young 영역의 GC를 멀티 스레드로 수행합니다. 높은 처리량에 초점을 두기 때문에 Throughput GC라고도 불립니다.\n\n**Parallel Old GC**는 Parallel GC의 향상된 버전으로, Old 영역에서도 멀티 스레드를 활용하여 GC를 수행합니다.\n\n**CMS(Concurrent Mark-Sweep) GC**는 Java 5부터 8까지 사용된 가비지 컬렉터로, 애플리케이션 스레드와 병렬로 실행되어 Stop-The-World 시간을 최소화하도록 설계되었습니다.\n하지만 메모리와 CPU 사용량이 많고, 메모리 압축을 수행하지 않아 메모리 단편화 문제가 있습니다. Java 9부터 deprecated 되고, Java 14에서 완전히 제거되었습니다.\n\n**G1(Garbage First) GC**는 Java 9부터 **default** 가비지 컬렉터이며, 기존의 GC 방식과 달리 힙을 여러 개의 region으로 나누어 논리적으로 Young, Old 영역을 구분합니다.\n처리량과 Stop-The-World 시간 사이의 균형을 유지하며 32GB보다 작은 힙 메모리를 사용할 때 가장 효과적입니다. GC 대상이 많은 region을 먼저 회수하기 때문에 garbage first라는 이름이 붙었습니다.\n\n**ZGC**는 Java 11부터 도입된 가비지 컬렉터로, 10ms 이하의 Stop-The-World 시간과 대용량 힙을 처리할 수 있도록 설계되었습니다.\n\n**Shenandoah GC**는 Red Hat에서 개발한 가비지 컬렉터로, Java 12부터 도입되었습니다. G1 GC와 마찬가지로 힙을 여러 개의 region으로 나누어 처리하며,\nZGC처럼 저지연 Stop-The-World와 대용량 힙 처리를 목표로 합니다.\n\n**Epsilon GC**는 Java 11부터 도입되었으며 GC 기능이 없는 실험용 가비지 컬렉터입니다.\n애플리케이션 성능 테스트에서 GC 영향을 분리하거나 GC 오버헤드 없이 메모리 한계를 테스트할 때 사용되지만, 프로덕션 환경에는 적합하지 않습니다.\n\n## G1 GC에서 Humongous 객체란 무엇이며 어떻게 처리되나요?\n\n**Humongous 객체**는 region 크기의 50% 이상을 차지하는 큰 객체를 의미합니다.\nHumongous 객체는 크기에 따라 하나 또는 여러 개의 연속된 region을 차지할 수 있고, region 내 잉여 공간은 다른 객체에 할당되지 않아 메모리 단편화가 발생할 수 있습니다.\n또한, Young 영역을 거치지 않고 바로 Old 영역에 할당되기 때문에 Full GC가 발생할 가능성이 높아집니다.\n이 문제를 해결하려면 `-XX:G1HeapRegionSize` 옵션을 사용하여 region 크기를 조정하거나, 큰 객체를 작은 객체로 분할하여 처리해 볼 수 있습니다.\n\n## 2vCPU, 1GB 메모리를 가진 Linux 서버에 JDK 17을 설치하면 어떤 가비지 컬렉터가 사용될까요?\n\nJDK 9부터 G1 GC가 default 가비지 컬렉터이지만, 서버 스펙에 따라 자동으로 결정됩니다.\n\nOpenJDK에서는 **CPU 코어 수가 2개 이상이고 메모리가 2GB 이상일 경우** 서버를 **Server-Class Machine**으로 인식합니다.\nServer-Class Machine이라면 가비지 컬렉터로 G1 GC가 선택되지만, 이 서버는 조건을 충족하지 않기 때문에 Serial GC가 선택됩니다.\nG1 GC를 사용하려면 서버를 스케일업하거나 `-XX:+UseG1GC` 옵션을 명시적으로 설정해야 합니다.\n\n> 실행 중인 JVM의 GC 확인 방법\n> ``` bash\n> sudo jcmd {jar PID} VM.info\n> ```\n> ![](https://github.com/user-attachments/assets/f0d372b9-6e89-4cff-90b5-9d8da3a9262b)\n> 또는\n> ``` bash\n> sudo jinfo {jar PID}\n> ```\n> ![](https://github.com/user-attachments/assets/c503df0d-6f64-4b9b-863d-c12bc4cce7e5)\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 조엘의 GC](https://www.youtube.com/watch?v=FMUpVA0Vvjw)\n- [Naver D2 - Java Garbage Collection](https://d2.naver.com/helloworld/1329)\n- [Oracle Docs Java 17 - Garbage-First (G1) Garbage Collector](https://docs.oracle.com/en/java/javase/17/gctuning/garbage-first-g1-garbage-collector1.html#GUID-ED3AB6D3-FD9B-4447-9EDF-983ED2F7A573)\n- [매일메일 - JVM에서 GC 대상 객체를 판단하는 기준은 무엇인가요?](https://www.maeil-mail.kr/question/155)\n- [최범균님 유튜브 - G1 GC 써 볼까?](https://www.youtube.com/watch?v=H4yuuYXK8_o)\n", "title": "GC 알고리즘은 어떤 것이 있나요?"}, "be-125": {"id": "be-125", "content": "**가상 메모리 관리 기법(Virtual Memory Management)** 은 프로그램의 일부만을 메모리에 적재하여 실제 사용 가능한 물리 메모리 양보다 큰 프로세스를 실행할 수 있도록 하는 기법입니다. 그리고, 가상 메모리 관리 기법 중 하나인 페이징은 메모리의 물리 주소 공간을 프레임 단위로 나눈 이후, 프로세스의 논리 주소 공간을 페이지로 나누어 프레임에 할당하는 방식입니다.\n\n프로세스를 메모리에 적재할 때, 실제로 필요할 때만 페이지를 메모리에 적재하는 것을 **요구 페이징(Demand Paging)** 이라 하는데요. 요구 페이징을 사용하는 운영체제에서 새로운 페이지를 할당하려고 하는데, 공간이 부족한 경우 메모리에 존재하는 다른 페이지와 신규 페이지를 교체해야합니다. 이때, 교체 대상을 결정하는 방법을 **페이지 교체 알고리즘(Page Replacement Algorithm)** 라고 합니다.\n\n## 페이지 교체 알고리즘의 종류를 간단하게 설명해 주세요. \n\n대표적인 페이지 교체 알고리즘은 FIFO, OPT, LRU, LFU, NUR이 존재합니다.\n\n- **FIFO 페이지 교체 알고리즘(First In First Out Page Replacement Algorithm)** 은 적재된 페이지의 순서대로 교체하는 알고리즘입니다. 단순히 먼저 적재되었다는 이유로 교체된다는 비효율을 개선하기 위해 2차 기회 페이지 교체 알고리즘과 같은 변형 알고리즘이 존재합니다.\n- **OPT 페이지 교체 알고리즘(Optimal Page Replacement Algorithm)** 은 앞으로 가장 나중에 사용될 페이지를 교체합니다. 하지만, 페이지의 미래 사용 빈도와 접근 패턴을 알기 어렵기 때문에 이론적 알고리즘으로 분류됩니다.\n- **LRU 페이지 교체 알고리즘(Least Recently Used Page Replacement Algorithm)** 은 가장 오래 사용되지 않은 페이지를 교체합니다. \n- **LFU 페이지 교체 알고리즘(Least Frequently Used Page Replacement Algorithm)** 은 가장 적게 사용된 페이지를 교체합니다. 사용 빈도가 같은 경우에는 다른 페이지 교체 알고리즘을 사용할 수 있습니다.\n- **NUR 페이지 교체 알고리즘(Not Used Recently Page Replacement Algorithm)** 은 최근에 사용된 적이 없는 페이지를 교체합니다. LRU, LFU 알고리즘과 유사한 성능이 보이면서, LRU, LFU의 메모리 오버헤드를 줄일 수 있습니다. LRU와 LFU는 페이지에 대한 추가적인 정보(사용 횟수, 마지막 접근 시간)를 관리해야 하는데요. NUR은 페이지 테이블 엔트리의 참조 비트와 수정 비트를 활용하여 교체 대상을 결정합니다.\n\nLRU, LFU, NUR, 그리고 FIFO의 변형 알고리즘은 OPT와 달리 과거의 데이터를 기반으로 미래의 메모리 접근 패턴을 예측하기 때문에 최적 근접 알고리즘으로 분류됩니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 채채의 가상 메모리](https://youtu.be/_SyFgWccEs8?feature=shared)\n- [널널한 개발자 TV - 가상 메모리 개요](https://youtu.be/-jlzaslp-w4?feature=shared)\n- [널널한 개발자 TV - 가상 메모리 페이징 기법의 구현 (※매우 중요)](https://youtu.be/X6tLar-qNHE?feature=shared)\n- [주니온TV 아무거나연구소 - 운영체제: 20. 페이징과 스와핑](https://youtu.be/2Kvp_Lozlcs?feature=shared)\n- [주니온TV 아무거나연구소 - 운영체제: 21. 가상 메모리와 디맨드 페이징](https://youtu.be/wJYo9K0QN2k?feature=shared)\n- [주니온TV 아무거나연구소 - 운영체제: 22. 페이지 교체 알고리즘](https://youtu.be/pzidDMimvg8?feature=shared)\n- [OS는 할껀데 핵심만 합니다. 17편 페이지 교체 알고리즘(FIFO, LRU, LFU , NUR, 2차 기회 알고리즘, 시계 알고리즘)](https://velog.io/@chappi/OS%EB%8A%94-%ED%95%A0%EA%BB%80%EB%8D%B0-%ED%95%B5%EC%8B%AC%EB%A7%8C-%ED%95%A9%EB%8B%88%EB%8B%A4.-17%ED%8E%B8-%ED%8E%98%EC%9D%B4%EC%A7%80-%EA%B5%90%EC%B2%B4-%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98FIFO-LRU-LFU-NUR-2%EC%B0%A8-%EA%B8%B0%ED%9A%8C-%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98-%EC%8B%9C%EA%B3%84-%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98)", "title": "페이지 교체 알고리즘에 대해서 설명해 주세요."}, "be-126": {"id": "be-126", "content": "**행 기반 데이터베이스(Row-oriented Database)** 는 데이터를 행 단위로 관리하는 DBMS입니다. 행 단위 읽기 맟 쓰기 연산에 최적화돼 있습니다. PostgreSQL, MySQL이 대표적인 행 기반 데이터베이스입니다. \n\n반면, **열 기반 데이터베이스(Column-oriented Database)** 는 열 기반으로 데이터를 관리한다는 점에서 행 기반 데이터베이스와 차이가 있습니다. 데이터를 조회할 때 필요한 열만 로드하기 때문에 디스크 I/O를 줄일 수 있으며, 같은 종류의 데이터가 연속적으로 저장되므로 압축 효율이 높습니다. 이러한 특징으로 인해 주로 데이터 분석에 사용됩니다. 대표적인 열 기반 데이터베이스로는 BigQuery, Redshift, Snowflake가 존재합니다.\n\n예를 들어, 다음과 같은 데이터가 존재한다고 가정하겠습니다.\n\n| Name | CreatedAt |\n| -- | -- |\n| **Atom** | **2024-01-23** |\n| **Prin** | **2024-02-01** |\n| **Gosmdochee** | **2024-02-03** |\n\n행 기반 데이터베이스의 경우, 아래와 같이 데이터를 관리합니다.\n\n```\n[Atom, 2024-01-23] [Prin, 2024-02-01] [Gosmdochee, 2024-02-03]\n```\n\n반면, 열 기반 데이터베이스의 경우, 아래와 같이 데이터를 관리합니다.\n\n```\n[Atom, Prin, Gosmdochee] [2024-01-23, 2024-02-01, 2024-02-03]\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [Data School - Row vs Column Oriented Databases](https://dataschool.com/data-modeling-101/row-vs-column-oriented-databases/)\n- [Amazon Redshift - 열 기반 스토리지](https://docs.aws.amazon.com/ko_kr/redshift/latest/dg/c_columnar_storage_disk_mem_mgmnt.html)\n- [SQL전문가 정미나 - 컬럼형 데이터베이스](https://youtu.be/S_M3iIxHTco?feature=shared)", "title": "열 기반 DB와 행 기반 DB의 차이점은 무엇인가요?"}, "be-127": {"id": "be-127", "content": "**트리(Tree)** 는 방향이 존재하는 그래프의 일종으로 부모 정점 밑에 여러 자식 정점이 연결되고, 자식 정점 각각에 다시 자식 정점이 연결되는 재귀적 형태의 자료구조입니다. 그 중에서 각 정점이 최대 2개의 자식 정점을 가지는 트리를 **이진 트리(Binary Tree)** 라고 합니다.\n\n## 이진 트리의 종류는 무엇이 있나요?\n\n정점이 채워져 있는 형태에 따라서 대표적으로 포화 이진 트리, 완전 이진 트리, 편향 이진 트리가 존재합니다.\n\n마지막 레벨까지 모든 정점이 채워져 있는 경우, 포화 이진 트리라고 부릅니다.\n\n```\n        1                --- level 1\n      /   \\\n    2       3            --- level 2\n   / \\     / \\\n  4   5   6   7          --- level 3\n\n```\n\n마지막 레벨을 제외하고 모든 정점이 채워져 있는 경우, 완전 이진 트리라고 부릅니다.\n```\n        1                --- level 1\n      /   \\\n    2       3            --- level 2\n   / \\     /\n  4   5   6              --- level 3\n\n```\n\n한 방향으로만 정점이 이어지는 경우, 편향 이진 트리라고 부릅니다.\n```\n    1                    --- level 1\n     \\\n      2                  --- level 2\n       \\\n        3                --- level 3\n         \\\n          4              --- level 4\n           \\\n            5            --- level 5\n\n```\n\n## 이진 트리의 특징과 활용 사례를 설명해 주세요.\n\n이진 트리의 대표적인 특징은 다음과 같습니다.\n\n- 이진 트리의 정점이 N개인 경우, 최악의 경우 높이가 (N - 1)이 될 수 있습니다.  \n- 포화 이진 트리와 완전 이진 트리의 높이는 log N입니다.\n- 높이가 h인 포화 이진 트리는 2^(h + 1) - 1개의 정점을 가집니다.\n\n이진 트리는 다른 자료 구조를 만드는 경우에 주로 활용되는데요. 대표적으로 힙(Heap), 이진 탐색 트리(Binary Search Tree)가 존재합니다.\n\n## 이진 트리의 탐색 방법은 무엇이 있나요?\n\n이진 트리를 탐색하기 위한 방법으로 중위 순회(in-order), 전위 순회(pre-order), 후위 순회(post-order), 층별 순회(level-order)가 존재합니다.\n\n- 중위 순회는 왼쪽 정점, 부모 정점, 오른쪽 정점 순서로 방문합니다.\n- 전위 순회는 부모 정점, 왼쪽 정점, 오른쪽 정점 순서로 방문합니다.\n- 후위 순회는 왼쪽 정점, 오른쪽 정점, 부모 정점 순서로 방문합니다.\n- 층별 순회는 시작 정점의 레벨을 순서대로 모두 방문하고, 이후에 다음 레벨의 정점을 순서대로 방문합니다. (층별로 방문)\n\n## 추가 학습 자료를 공유합니다.\n\n- [동빈나님 유튜브 - 코딩 테스트를 위한 트리(Tree) 자료구조 10분 핵심 요약](https://youtu.be/i5yHkP1jQmo?feature=shared)\n- [Eleanor Lim님 유튜브 - Tree의 종류](https://youtu.be/LnxEBW29DOw?feature=shared)\n- [Gunsystem님 유튜브 - 이진트리 탐색 운행법 (전위식, 중위식, 후위식)](https://youtu.be/6WTHpidiFjc?feature=shared)\n- [코드라떼 - AVL 트리 개념](https://www.codelatte.io/courses/java_data_structure/7NPGIERM1X8R4IEW)\n- [코드라떼 - Red-Black 트리 개념](https://www.codelatte.io/courses/java_data_structure/UN9UCFI8OJ7QGRCB)", "title": "이진 트리에 대해서 설명해 주세요."}, "be-128": {"id": "be-128", "content": "**객체 지향 프로그래밍(OOP, Object-Oriented Programming)** 은 상태(필드)와 행위(메서드)를 가진 객체를 중심으로 프로그램을 설계하는 프로그래밍 패러다임입니다. 객체에 역할과 책임을 부여하고, 이 객체들이 서로 협력하는 방식으로 프로그램을 구성합니다.\n\n객체 지향 프로그래밍의 특징으로는 캡슐화, 추상화, 다형성, 상속이 있습니다.\n\n**캡슐화(Encapsulation)** 는 객체의 상태와 행위를 하나의 단위로 묶는 것을 말합니다. 내부 구현은 숨기고 외부에서 접근할 수 있는 인터페이스만 제공함으로써 객체의 무결성을 보호하고 코드의 유지보수성을 높일 수 있습니다.\n\n**추상화(Abstraction)** 는 불필요한 세부 사항을 감추고 핵심적인 기능만 간추려내는 것을 말합니다. 객체의 공통적인 특징은 추출하여 인터페이스 또는 추상 클래스로 정의하고, 구체적인 세부 사항은 구현체에게 위임함으로써 객체의 핵심 기능에만 집중할 수 있습니다.\n\n**다형성(Polymorphism)** 은 하나의 인터페이스가 여러 형태로 동작할 수 있는 것을 말합니다. 오버로딩과 오버라이딩을 사용하여 같은 메서드명이더라도 객체에 따라 다르게 동작하도록 할 수 있습니다.\n\n**상속(Inheritance)** 은 상위 클래스의 특징을 하위 클래스가 물려받아 확장하는 것을 말합니다. 기존 기능을 수정하지 않고 새로운 기능을 추가할 수 있어 확장성이 뛰어나고, 중복을 제거하여 코드의 재사용성을 높일 수 있습니다.\n\n## TDA 원칙을 알고 계신가요?\n\n**TDA(Tell Don't Ask)** 원칙은 객체의 데이터를 직접 요청하지 말고, 객체에게 필요한 동작을 수행하도록 메시지를 보내라는 원칙입니다.\nTDA 원칙을 따르면 캡슐화를 지킬 수 있고, 객체 스스로 데이터를 다루기 때문에 객체의 응집도를 높이고 객체 간 결합도를 낮출 수 있습니다.\n\n``` java\n// 위반 예시 (Bad)\npublic class Account {\n\n    private BigDecimal balance;\n    \n    public Account(BigDecimal balance) {\n        this.balance = balance;\n    }\n\n    public BigDecimal getBalance() {\n        return this.balance;\n    }\n    \n    public void setBalance(BigDecimal balance) {\n        this.balance = balance;\n    }\n}\n\nAccount account = new Account(BigDecimal.TEN);\nBigDecimal withdrawalAmount = BigDecimal.ONE;\n\nBigDecimal balance = account.getBalance(); // 객체의 데이터를 직접 가져와서 사용\nif (balance.compareTo(withdrawalAmount) < 0) {\n    throw new IllegalStateException(\"잔액이 부족합니다.\");\n}\n\nbalance = balance.subtract(withdrawalAmount);\naccount.setBalance(balance);\n```\n\n``` java\n// 준수 예시 (Good)\npublic class Account {\n\n    private BigDecimal balance;\n\n    public Account(BigDecimal balance) {\n        this.balance = balance;\n    }\n\n    public void withdraw(BigDecimal withdrawalAmount) {\n        if (balance.compareTo(withdrawalAmount) < 0) {\n            throw new IllegalStateException(\"잔액이 부족합니다.\");\n        }\n        this.balance = balance.subtract(withdrawalAmount);\n    }\n}\n\nAccount account = new Account(BigDecimal.TEN);\nBigDecimal withdrawalAmount = BigDecimal.ONE;\n\naccount.withdraw(withdrawalAmount); // 객체에 메시지 전달\n```\n\n## 추상화에서 추상 클래스와 인터페이스의 차이는 무엇인가요?\n\n**추상 클래스(Abstract Class)** 는 공통된 기능을 재사용하려는 목적으로 사용됩니다. 일반 메서드와 추상 메서드를 포함할 수 있고, 인스턴스 변수를 가질 수 있습니다.\n\n**인터페이스(Interface)** 는 구현을 강제하려는 목적으로 사용됩니다. 추상 메서드와 JDK 8부터 default 메서드를 포함할 수 있고, 상수만 가질 수 있습니다.\n\nis-a 관계이거나 코드의 재사용이 중요한 경우 추상 클래스를 사용하고, can-do 관계이거나 다중 상속이 필요한 경우 인터페이스를 사용할 수 있습니다.\n\n## 다형성에서 오버로딩과 오버라이딩의 차이는 무엇인가요?\n\n**오버로딩(Overloading)** 은 클래스 내에서 같은 이름의 메서드를 여러 개 정의하는 것을 말합니다. 중요한 점은 매개변수의 개수, 타입, 순서가 달라야 합니다. 반환 타입만 다른 경우는 오버로딩이 성립하지 않습니다.\n\n**오버라이딩(Overriding)** 은 상위 클래스의 메서드를 하위 클래스에서 재정의하는 것을 말합니다. 상위 클래스의 메서드 시그니처(메서드명, 매개변수 타입, 개수, 순서)와 반환 타입이 동일해야 하며, 접근 제어자는 상위 클래스와 같거나 더 넓은 범위로 변경할 수 있습니다.\n\n한마디로 정리하면, 오버로딩은 같은 기능을 다르게 사용하는 것, 오버라이딩은 상속받은 기능을 변경하는 것입니다.\n\n## 다이아몬드 문제에 대해 설명해 주세요.\n\n**다이아몬드 문제(Diamond Problem)** 는 다중 상속에서 발생하는 모호성 문제를 의미합니다.\n\n<img src=\"https://i.postimg.cc/0yMn2YmB/diamond-problem.png)](https://postimg.cc/tsbWBVB3\" width=200>\n\n예를 들어, A 클래스에 `hello()` 메서드가 있고, B와 C 클래스는 A 클래스를 상속받아 `hello()` 메서드를 오버라이딩합니다.\n이때 B, C 클래스를 상속받는 D 클래스에서 `hello()` 메서드를 호출하면 어떤 클래스의 메서드를 호출해야 할지 모호해지는 문제가 발생합니다.\n\nC++와 같이 다중 상속을 지원하는 언어는 이러한 문제를 적절히 해결해야 하며, Java에서는 클래스에 대한 다중 상속을 지원하지 않고 인터페이스에서만 허용됩니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 구름의 상속과 조합](https://www.youtube.com/watch?v=hL0gdGJgI4k)\n- [GeeksforGeeks - Introduction of Object Oriented Programming](https://www.geeksforgeeks.org/introduction-of-object-oriented-programming/)\n- [Martin Fowler - Tell Dont Ask](https://martinfowler.com/bliki/TellDontAsk.html)\n- [Serdar A. - An interview question about override default method in java interface and fix Diamond Problem](https://serdaralkancode.medium.com/an-interview-question-about-override-default-method-in-java-interface-and-fix-diamond-problem-4c6d838424e3)\n", "title": "객체 지향 프로그래밍이란 무엇이고, 어떤 특징이 있나요?"}, "be-129": {"id": "be-129", "content": "**널 오브젝트 패턴(Null Object Pattern)** 이란 객체가 존재하지 않을 때, 널을 전달하는 것이 아닌 아무 일도 하지 않는 객체를 전달하는 기법입니다. 예를 들어, 개발하다 보면 아래와 같이 널 체크 코드를 작성할 때가 많은데요. \n\n```java\npublic void doSomething(MyObject obj) {\n  if(obj == null) {\n    throw new Exception();\n  }\n\n  obj.doMethod();\n}\n```\n\n이러한 유형의 코드가 여러 곳에서 계속 반복해서 등장하게 된다면 코드를 복잡하게 만들 수도 있습니다. 널 오브젝트 패턴은 널 값을 아무런 행위도 하지 않는 객체로 다뤄 널 체크 코드를 간소화합니다.\n\n```java\nclass MyNullObject implements MyObject {\n\n  @Override\n  public void doMethod() {\n    // 아무것도 하지 않음\n  }\n}\n\nclass MyRealObject implements MyObject {\n\n  @Override\n  public void doMethod() {\n      System.out.println(\"무엇인가 수행합니다.\")\n  }\n}\n\npublic void doSomething(MyObject obj) {\n  obj.doMethod();\n}\n```\n\n값이 널인 경우에만 사용되는 것이 아닌 특별한 케이스에서 모두 응용할 수 있습니다. 가령, 스택이라는 자료구조를 만들 때 용량이 0인 경우, ZeroCapacityStack을 만들 수 있습니다. 널 오브젝트 패턴은 반복적인 널 체크 코드를 간소화하고 협력을 재사용하는데 용이하다는 장점이 있지만, 오히려 예외를 탐지하기 어려운 상황을 만들 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [기계인간 John Grib - 널 오브젝트 패턴(Null Object Pattern)](https://johngrib.github.io/wiki/pattern/null-object/)\n- [백명석님 클린 코더스 - Function Structure Part2](https://youtu.be/cgiDv1XFWsk?si=pjUVVS87MxEDgqZz)\n- [마틴파울러 닷컴 - Special Case](https://martinfowler.com/eaaCatalog/specialCase.html)", "title": "널 오브젝트 패턴이란 무엇인가요?"}, "be-13": {"id": "be-13", "content": "Spring은 Spring Framework의 핵심 모듈들을 기반으로 한 프레임워크로 엔터프라이즈 애플리케이션 개발을 지원하기 위한 대규모 오픈 소스 프로젝트입니다. \nSpring Framework를 사용하기 위해서는 설정 파일 작성을 통한 스프링 컨테이너 구성, 필요한 빈 객체 등록 및 의존성 설정, 데이터베이스 연결, 트랜잭션 관리 등 다양한 설정을 개발자가 직접 수동으로 구성해야 했습니다.\n따라서 프로젝트 초기화 과정에서 많은 설정과 의존성을 추가하게 되며 프로젝트는 시작하는데 시간이 많이 걸렸습니다. 또한 스프링을 통해 웹 애플리케이션을 구축하기 위해서는 별도의 WAS를 설치하고 설정해야 했습니다.\n\nSpring Boot는 Spring의 문제점을 해결해주고, 더 쉽고 빠르게 스프링 애플리케이션을 개발할 수 있도록 해주는 도구입니다.\nSpring Boot를 사용하면 Spring에서 제공하는 여러 기능들을 자동으로 설정하여 개발자가 보다 쉽게 사용할 수 있도록 해줍니다.\n\n### Spring Boot의 주요 특징\n\n1. 자동 설정(Auto Configuration)\n    - Spring Boot는 애플리케이션의 설정을 자동으로 구성합니다.\n    - @EnableAutoConfiguration, @SpringBootApplication 어노테이션을 통해 자동 설정을 활성화합니다.\n\n2. 의존성 관리 간소화\n    - 특정 기능을 쉽게 추가할 수 있도록 여러 개의 라이브러리와 의존성을 하나의 패키지로 묶어 제공하는 starter 의존성 통합 모듈을 제공합니다.\n    - 예: spring-boot-starter-web, spring-boot-starter-data-jpa, spring-boot-starter-security\n\n3. 내장 서버\n    - Tomcat, Jetty, Undertow와 같은 내장 웹 서버를 제공하여, 애플리케이션을 독립 실행형 JAR 파일로 배포하고, 바로 실행할 수 있게 합니다.\n    - 배포를 위해 War 파일을 생성해서 Tomcat에 배포할 필요 없으며, JAR 파일에는 모든 의존성 라이브러리가 포함되어 있어 외부 서버 없이도 애플리케이션을 실행할 수 있습니다.", "title": "Spring과 Spring Boot의 차이를 말해주세요."}, "be-130": {"id": "be-130", "content": "**서버리스(Serverless)** 란 클라우드 업체에서 직접 인프라를 관리하고 동적으로 크기를 조정하면서 유지 관리하는 방식을 의미합니다. 만약, AWS EC2를 사용해도 OS 관리 및 보안, 파일 시스템 관리는 직접 해야 했는데요. 서버리스에서는 클라우드 업체가 이 모든 것을 직접 맡아서 관리합니다. 서버리스를 도입한다면, 직접 컴퓨터를 관리할 필요가 없고, 유연하게 확장할 수 있으며 사용하지 않은 용량에 대해서는 비용을 지불하지 않을 수 있다는 이점을 얻을 수 있습니다. AWS Lambda(서버리스 컴퓨팅), S3(스토리지), SQS(메시지 큐)가 서버리스의 예시입니다.\n\n## 서버리스 아키텍처에서 백엔드 코드는 어떻게 개발하나요?\n\n서버리스 아키텍처에서 백엔드 코드는 **FaaS(Function as a service)** 를 활용하여 개발할 수 있습니다. FaaS는 특정 이벤트가 발생했을 때만 함수가 실행되는 방식을 의미합니다. 예를 들어, `GET /hello` 이라는 API 경로에 호출(이벤트)이 발생할 때, 이를 처리할 수 있는 함수를 잠시 실행하고 결과를 클라이언트에게 응답합니다. 개발자는 비즈니스 로직을 작성하고, 클라우드 인프라에 코드 조각(함수)을 배포하면 됩니다.\n\n혹은 **BaaS(Backend as a service)** 를 활용할 수도 있는데요. BaaS를 활용하면 클라우드 제공업체에서 만든 인증, 소셜 서비스 등의 완성된 백엔드 기능을 사용할 수 있습니다. 예를 들어, Firebase Authentication을 활용하면 비교적 적은 코드로 로그인 기능을 구현할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [요즘 IT - 진짜 서버리스 vs 가짜 서버리스](https://yozm.wishket.com/magazine/detail/2168/)\n- [AWS - 서버리스 컴퓨팅이란 무엇인가요?](https://aws.amazon.com/ko/what-is/serverless-computing/)\n- [Vingle의 AWS 기반 서버리스 마이크로 서비스 구현 사례 - 이상현 TechnicalLeader (빙글)](https://youtu.be/CM47-1UpgOc?si=ZIIeBArpZKl9EyKY)\n- [천만 사용자를 위한 서버리스 기반 클라우드 아키텍처 구성하기](https://youtu.be/RkB1OtJR1ag?si=TUpavK_HRSe1pRzg)\n- [당근 테크 블로그 - AWS Lambda@Edge에서 실시간 이미지 리사이즈 & WebP 형식으로 변환](https://medium.com/daangn/lambda-edge%EB%A1%9C-%EA%B5%AC%ED%98%84%ED%95%98%EB%8A%94-on-the-fly-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EB%A6%AC%EC%82%AC%EC%9D%B4%EC%A7%95-f4e5052d49f3)\n\n\n\n", "title": "서버리스란 무엇인가요?"}, "be-131": {"id": "be-131", "content": "~ToMany 관계에서 Fetch Join과 페이징을 함께 사용하면 OutOfMemoryError가 발생할 수 있다는 점을 주의해야 합니다. 예를 들어, 아래와 같이 Product(1)-ProductCategory(N) 관계가 있을 때, ProductJpaRepository의 findProductWithSlice 처럼 Fetch Join과 페이징을 함께 사용하는 경우에 OOM이 발생할 수 있습니다.\n\n```java\n@Entity\n@Getter\n@NoArgsConstructor(access = AccessLevel.PROTECTED)\nclass Product {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @OneToMany(mappedBy = \"product\", cascade = CascadeType.PERSIST)\n    private List categories = new ArrayList();\n\n    // ... 중략\n}\n\n@Entity\n@Getter\n@AllArgsConstructor\n@NoArgsConstructor(access = AccessLevel.PROTECTED)\nclass ProductCategory {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    private Product product;\n\n    @ManyToOne(fetch = FetchType.LAZY)\n    private Category category;\n}\n\ninterface ProductJpaRepository extends JpaRepository {\n\n\n    @Query(\"\"\"\n                 select p\n                 from Product p\n                 join fetch p.categories pc\n                 join fetch pc.category c\n                 order by p.id desc\n            \"\"\")\n    Slice findProductWithSlice(Pageable pageable);\n}\n\n```\n\n## 왜 OOM이 발생할 수 있나요?\n\n실제로 findProductWithSlice를 호출하면 서버에서 다음과 같은 경고 메시지를 보여주는데요. \n\n```\nfirstResult/maxResults specified with collection fetch; applying in memory\n```\n\n실행되는 쿼리를 확인해도 페이징 쿼리가 발생하지 않습니다.\n\n```sql\n    select\n        p.id,\n        pc.product_id,\n        pc.id,\n        c.id,\n        c.name \n    from\n       product p \n    join\n       product_category pc \n       on p.id = pc.product_id \n    join\n       category c \n       on c.id = pc.category_id \n    order by p.id desc\n```\n\nProductCategory를 조인하면 Product의 결과도 함께 증가합니다. (카티션 프로덕트) 따라서, 페이징을 위해 설정한 값이 의도한 대로 동작하기 어려워 JPA는 전체 결과를 메모리에 적재한 다음에 가공하여 페이징을 수행합니다. 이때, 수많은 데이터가 메모리에 적재된다면 OOM이 발생할 가능성이 있습니다.\n\n\n## 이 문제는 어떻게 해결해 볼 수 있을까요?\n\n단순히 Fetch Join을 사용하지 않으면 됩니다. 하지만, Fetch Join을 사용하지 않으면  ProductCategory 리스트를 조회하기 위해서 N + 1 쿼리가 발생할 수 있습니다.\n\n```java\nSlice result = productJpaRepository.findProductWithSlice(pageRequest);\nresult.forEach(product -> System.out.println(product.getCategories())); // N + 1\n```\n\n이를 해결하기 위해서는 `@BatchSize`와 default_batch_fetch_size 옵션을 사용할 수 있는데요. 이 기능은 Parent 엔티티(Product)의 Child 엔티티 컬렉션(ProductCategory)을 조회할 때, 영속성 컨텍스트에서 관리하는 Parent 엔티티의 식별자를 IN 절에 추가하여 Child 엔티티를 조회하는 기능입니다.\n\n\n```java\n@Entity\n@Getter\n@NoArgsConstructor(access = AccessLevel.PROTECTED)\nclass Product {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @BatchSize(size = 10)\n    @OneToMany(mappedBy = \"product\", cascade = CascadeType.PERSIST)\n    private List categories = new ArrayList();\n\n    // ... 중략\n}\n```\n\n예를 들어, 위와 같이 categories 위에 `@BatchSize`를 추가하면 다음과 같은 쿼리가 발생합니다.\n\n```sql\n    select\n        pc.product_id,\n        pc.id,\n        pc.category_id \n    from\n        product_category pc \n    where\n        pc.product_id in (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [테코블 - JPA Pagination, 그리고 N + 1 문제](https://tecoble.techcourse.co.kr/post/2021-07-26-jpa-pageable/)\n- [자바봄 - fetch join 과 pagination 을 같이 쓸 때 [HHH000104: firstResult/maxResults specified with collection fetch; applying in memory]](https://javabom.tistory.com/104)\n- [LG유플러스 기술 블로그 - JPA 조회 성능 개선한 이야기](https://techblog.uplus.co.kr/jpa-%EC%A1%B0%ED%9A%8C-%EC%84%B1%EB%8A%A5-%EA%B0%9C%EC%84%A0%ED%95%9C-%EC%9D%B4%EC%95%BC%EA%B8%B0-2999c9210522)", "title": "JPA Fetch Join과 페이징을 함께 사용할 때 주의점을 설명해 주세요."}, "be-132": {"id": "be-132", "content": "**Gradle**은 Java, Kotlin, Scala 등 JVM에서 실행되는 언어에서 자주 사용되는 빌드 자동화 도구입니다.\n기존의 Ant와 Maven의 단점을 보완하여 증분 빌드, 빌드 캐시, 데몬 프로세스를 활용해 빌드 속도를 최적화하고, 멀티 프로젝트를 쉽게 관리할 수 있도록 설계되었습니다. 또한, 다양한 플러그인과 커스텀 태스크를 사용해 확장성을 높일 수 있으며, Groovy 또는 Kotlin DSL을 사용해 유연한 빌드 스크립트를 작성할 수 있습니다.\n\n## 빌드 자동화 도구를 왜 사용할까요?\n\n1. 컴파일, 테스트, 패키징, 배포와 같은 반복 작업을 자동화하여 개발 생산성을 높일 수 있습니다.\n2. 일관된 빌드 환경을 제공하여 어떤 환경에서나 동일한 빌드 결과를 보장할 수 있습니다.\n3. 증분 빌드, 빌드 캐시, 병렬 처리 등을 통해 빌드 속도를 최적화할 수 있습니다.\n4. 테스트 누락 등 수동 작업 시 발생할 수 있는 휴먼 에러를 방지할 수 있습니다.\n5. 외부 라이브러리를 자동으로 관리하여 의존성 버전 충돌을 줄일 수 있습니다.\n6. CI/CD와 연동하여 빌드 후 패키징, 배포까지 연속적으로 처리할 수 있습니다.\n\n## Maven과 Gradle의 차이점을 설명해 주세요.\n\n가장 큰 차이점은 빌드 스크립트 작성 방식과 빌드 속도입니다.\n\nMaven은 XML 기반(pom.xml)의 정형화된 방식으로 작성하지만, Gradle은 Groovy 또는 Kotlin DSL을 사용해 더 유연하고 가독성이 좋은 빌드 스크립트를 작성할 수 있습니다.\n그리고 Maven은 항상 전체 프로젝트를 빌드하는 방식이라 빌드 속도가 느리지만, Gradle은 증분 빌드와 빌드 캐시를 지원해서 훨씬 빠르게 동작합니다.\n\n> 자세한 차이는 아래의 표를 참고해 주세요.\n> \n||Maven|Gradle|\n|--|--|--|\n|빌드 스크립트|XML|Groovy/Kotlin DSL|\n|빌드 속도|느림|빠름|\n|의존성 관리|기본적인 의존성 관리|동적 버전 관리, 의존성 캐싱 최적화|\n|확장성|한정적인 플러그인 기능|다양한 플러그인, 커스텀 태스크|\n|Android 지원|공식적으로 지원 X|Android 공식 빌드 도구|\n|멀티 프로젝트 빌드|상속 방식, 설정이 복잡함|설정 주입 방식, 멀티 프로젝트 관리 최적화|\n\n## Dependency Configuration이 무엇이고 어떤 종류가 있을까요?\n\n**Dependency Configuration**은 애플리케이션에 필요한 의존성의 사용 범위를 정의하는 설정입니다. 사용 범위를 명확히 구분하는 이유는 빌드 성능 개선과 불필요한 의존성을 제거해서 빌드 결과물의 크기를 최적화하기 위함입니다.\n\n- **implementation**은 컴파일 및 런타임 시점에 모두 필요한 의존성입니다.\n해당 의존성이 현재 모듈에서만 필요할 때 사용하고, 일반적인 라이브러리나 프레임워크를 추가할 때 주로 사용합니다.\n- **api**는 implementation과 비슷하지만, 다른 모듈에서도 접근할 수 있는 의존성을 정의할 때 사용합니다.\n예를 들어, a -> b -> c의 의존성이 있을 때, a에서 c를 사용하려면 b에서 c를 api로 추가해야 합니다.\n- **compileOnly**는 컴파일 시점에만 필요한 의존성으로, Lombok과 같은 라이브러리에서 사용합니다.\n- **annotationProcessor**는 컴파일 시점에 실행되는 어노테이션 프로세서를 추가할 때 사용합니다.\n예를 들어, MapStruct와 Lombok과 같이 컴파일 시점에 어노테이션을 기반으로 특정 프로세스를 수행하는 라이브러리에서 사용합니다.\n- **runtimeOnly**는 런타임 시점에만 필요한 의존성입니다.\n예를 들어, 데이터베이스 드라이버는 컴파일 시점에 필요하지 않지만, 애플리케이션이 실행될 때만 필요하므로 runtimeOnly로 설정합니다.\n- **testImplementation**, **testCompileOnly**, **testRuntimeOnly**와 같이 'test'가 포함된 설정은 테스트 코드에서만 사용되는 의존성을 추가할 때 사용합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 루나의 Gradle](https://www.youtube.com/watch?v=ntOH2bWLWQs)\n- [[10분 테코톡] 프린의 Gradle](https://www.youtube.com/watch?v=jSInFhiz1kY)\n- [Gradle Docs - The Java Plugin](https://docs.gradle.org/8.5/userguide/java_plugin.html) \n- [Gradle - Gradle and Maven Comparison](https://gradle.org/maven-and-gradle/)", "title": "Gradle에 대해 설명해 주세요."}, "be-133": {"id": "be-133", "content": "**ThreadLocal**은 Java에서 각 스레드마다 독립적인 변수를 저장할 수 있도록 도와주는 클래스입니다.\n보통 여러 스레드가 공유 자원을 사용하면 동시성 문제가 발생할 수 있는데, ThreadLocal을 사용하면 스레드별로 데이터를 분리할 수 있어 동기화 없이 안전하게 활용할 수 있습니다.\n각 스레드는 자신만의 ThreadLocalMap을 가지고 있고 ThreadLocal을 키로 사용하여 값을 저장합니다. 즉, 하나의 스레드에서 여러 개의 ThreadLocal을 사용할 수 있으며,\nThreadLocal은 현재 스레드의 ThreadLocalMap을 제어하는 역할을 합니다.\n\nSpring 생태계에서는 ThreadLocal을 사용하여 트랜잭션 동기화 관리(`TransactionSynchronizationManager`), 사용자 인증 정보 관리(`SecurityContextHolder`),\n웹 요청의 attribute 관리(`RequestContextHolder`) 등의 기능을 제공하고 있습니다.\n\n## ThreadLocal의 장점은 무엇인가요?\n\n각 스레드는 ThreadLocal에 접근할 때 다른 스레드와 격리된 값을 가질 수 있습니다. 그리고 공유 자원이 없기 때문에 synchronized 키워드 등을 사용해서 동기화할 필요가 없습니다.\n\n## ThreadLocal을 사용할 때 주의할 점은 무엇인가요?\n\n스레드풀을 사용하면 스레드가 재사용됩니다. 이때 ThreadLocal에 이전 스레드의 값이 남아있으면 재사용된 스레드가 올바르지 않은 데이터를 참조할 수 있습니다. \n이를 방지하려면 스레드가 끝나는 시점에 `remove()` 메서드를 호출하여 ThreadLocal에 저장된 값을 제거해야 합니다.\n\n비동기 작업을 수행할 때 ThreadLocal이 예상대로 동작하지 않을 수 있습니다. 예를 들어, `@Async` 어노테이션을 사용하면 새로운 스레드에서 비동기 작업이 실행되는데,\n비동기 스레드는 기존 스레드에서 ThreadLocal에 저장한 값을 참조할 수 없습니다.\n이 문제는 Spring 4.3 이상에서 제공하는 **TaskDecorator**를 사용하여 기존 스레드의 ThreadLocal 값을 비동기 스레드에 복사하는 방식으로 해결할 수 있습니다.\n\n## ThreadLocal을 대체할 수 있는 방법이 있나요?\n\nThreadLocal 대신 메서드 인자로 값을 전달하거나 ConcurrentHashMap과 같이 thread-safe한 자료구조를 사용하는 방법이 있습니다.\nSpring에서는 `@RequestScope` 어노테이션을 사용하여 HTTP 요청 별로 데이터를 관리할 수 있습니다.\n\n## NamedThreadLocal을 알고 계신가요?\n\n**NamedThreadLocal**은 Spring에서 제공하는 ThreadLocal의 확장 클래스로, 디버깅을 쉽게 하기 위해 이름을 부여할 수 있도록 설계되었습니다.\n기본적인 기능은 ThreadLocal과 같지만, 여러 개의 ThreadLocal을 사용할 때 이름을 명확히 설정하면 어떤 목적의 ThreadLocal인지 구분할 수 있어 디버깅이 용이합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [G마켓 - Thread의 개인 수납장 ThreadLocal](https://dev.gmarket.com/62)\n- [Baeldung - An Introduction to ThreadLocal in Java](https://www.baeldung.com/java-threadlocal)\n- [강남언니 - Spring 의 동기, 비동기, 배치 처리시 항상 context 를 유지하고 로깅하기](https://blog.gangnamunni.com/post/mdc-context-task-decorator/)\n- [우아한형제들 - 로그 및 SQL 진입점 정보 추가 여정](https://techblog.woowahan.com/13429/)\n", "title": "ThreadLocal에 대해 설명해 주세요."}, "be-134": {"id": "be-134", "content": "자바의 ThreadPoolExecutor를 기준으로 설명해 드리겠습니다. **스레드 풀 포화 정책(Saturation Policies)** 이란 말 그대로 스레드 풀이 포화 상태인 경우의 행동을 결정하는 정책을 의미합니다. ThreadPoolExecutor 설정에는 상시 유지하는 스레드의 수인 corePoolSize, 작업 대기열 크기인 workQueueSize, 스레드를 추가할 수 있는 최대 수인 maxPoolSize가 존재하는데요. 스레드가 maxPoolSize까지 늘어나고 대기열까지 꽉 찬 상태를 포화 상태라고 합니다. 이때 새로운 작업 요청이 들어오면, RejectedExecutionHandler의 구현체인 포화 정책이 실행됩니다.\n\n## 포화 정책의 종류에는 무엇이 존재하나요?\n\n포화 정책 종류는 RejectedExecutionHandler의 구현체를 기준으로 AbortPolicy, CallerRunsPolicy, DiscardOldestPolicy, DiscardPolicy가 존재합니다.\n\n- AbortPolicy는 포화 상태일 경우, RejectedExecutionException을 발생시킵니다.\n- DiscardPolicy는 포화 상태일 경우, 신규 요청을 무시합니다.\n- DiscardOldestPolicy는 포화 상태일 경우, 작업 대기열에서 가장 오래된 요청을 버리고 신규 요청을 대기열에 추가합니다.\n- CallerRunsPolicy는 포화 상태일 경우, 요청 스레드에서 해당 작업을 실행합니다. \n\n기본적으로 제공되는 포화 정책은 4가지지만, 직접 RejectedExecutionHandler 인터페이스를 구현하여 커스텀 포화 정책을 만들 수 있습니다.\n\n```java\nclass CustomPolicy implements RejectedExecutionHandler {\n\n    @Override\n    public void rejectedExecution(Runnable r, ThreadPoolExecutor executor) {\n        // ... 중략\n    }\n}\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 조조그린의 Thread Pool](https://youtu.be/um4rYmQIeRE?feature=shared)\n- [Baeldung - Guide to RejectedExecutionHandler](https://www.baeldung.com/java-rejectedexecutionhandler)\n- [스레드풀 포화 정책(Saturation Policy) 알아보기](https://hellobrocolli.tistory.com/201)", "title": "스레드 풀 포화 정책이란 무엇인가요?"}, "be-135": {"id": "be-135", "content": "예외 종류에 따른 트랜잭션 롤백은 개발 환경에 따라 다르게 동작합니다.\n\n## Spring 트랜잭션 예외 처리 동작\n\n- **Checked Exception**\n    기본적으로 Checked Exception이 발생하더라도 트랜잭션을 롤백하지 않습니다. Checked Exception은 **컴파일 시점에 예외 처리를 강제하는 예외**로, 개발자가 예외 발생 가능성을 예상하고 이를 적절히 처리할 수 있는 **정상적인** 예외 상황이라고 가정하기 때문입니다.\n\n- **Unchecked Exception(RuntimeException, Error)**\n    Spring은 기본적으로 Unchecked Exception 또는 Error가 발생하면 트랜잭션을 롤백합니다. 이는 Unchecked Exception이 보통 **프로그래머의 실수나 시스템적인 문제로 인한 회복하기 어려운 상황(`NullPointerException`, `IllegalArgumentException` 등)** 이라고 가정하기 때문입니다. \n    Spring은 JDBC, JPA, Hibernate 등 하위 데이터 액세스 계층에서 발생하는 다양한 예외를 모두 공통의 Unchecked Exception인 `DataAccessException` 계층으로 변환하여 처리합니다. 이를 통해 일관된 예외 처리 전략을 수립할 수 있습니다.\n\n기본 동작과 별개로 **@Transactional** 의 `rollbackFor`나 `noRollbackFor` 속성을 사용하여 특정 Checked Exception에 대해서도 롤백을 유도하거나, 반대로 Unchecked Exception에 대해 롤백하지 않도록 설정할 수 있습니다.\n\n반면, 자바(EE) 환경에서는 컨테이너가 관리하는 트랜잭션(CMT)과 개발자가 직접 관리하는 프로그래밍 방식의 트랜잭션 제어 모두 존재하며, 이들 환경에서는 트랜잭션 롤백 동작이 Spring과는 다르게 동작할 수 있습니다.\n\n- **컨테이너 관리 트랜잭션(CMT) 환경 (EJB, CDI 등)**\n    기본적으로 Unchecked Exception이 발생하면 컨테이너가 자동으로 트랜잭션을 롤백합니다. Checked Exception은 기본적으로 롤백을 트리거하지 않으며, 필요하면 `@ApplicationException(rollback=true)` 등의 어노테이션으로 롤백을 강제할 수 있습니다.\n        \n- **프로그램 방식의 트랜잭션 제어**\n    개발자가 트랜잭션의 시작, 커밋, 롤백 등을 직접 관리해야 합니다. 이 경우, 예외가 발생하면 예외 종류와 관계없이 개발자가 상황에 맞게 명시적으로 `rollback()`을 호출하는 방식으로 트랜잭션을 종료합니다.\n\n## 추가 학습 자료를 공유합니다.\n- [Spring Docs - Rolling Back a Declarative Transaction](https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html)\n- [백기선 - 자바 공부를 어떻게 하길래, \"언체크드 예외 발생시 트랜잭션 롤백?\"](https://www.youtube.com/watch?v=_WkMhytqoCc)\n", "title": "어떤 예외가 발생하면 트랜잭션을 롤백하나요?"}, "be-136": {"id": "be-136", "content": "데이터베이스에서 데이터를 삭제하는 방법은 크게 **물리 삭제(Hard Delete)** 와 **논리 삭제(Soft Delete)** 가 존재합니다. 물리 삭제는 DELETE 명령어를 통해 직접 데이터를 삭제하는 방식이며, 논리 삭제는 UPDATE 명령을 사용하여 삭제를 여부를 나타내는 컬럼을 수정하는 방식을 의미합니다. 즉, 물리 삭제는 실제로 데이터를 삭제하는 반면 논리 삭제는 데이터가 삭제되었음을 표시만 한다는 점에서 차이가 있습니다.\n\n```sql\n# 물리 삭제 처리\ndelete from member where id = 1;\n\n# 논리 삭제 처리와 조회\nupdate member set deleted_at = curdate() where id = 1;\nselect * from member where deleted_at is null;\n```\n\n## 어떤 방식을 선택하는 것이 가장 좋은가요?\n\n방식마다 장단점이 존재하기 때문에 상황에 맞는 선택을 하는 것이 옳다고 생각합니다.\n\n물리 삭제의 경우에는 실제로 데이터를 삭제하기 때문에 저장 공간을 새로 확보할 수 있으며, 테이블의 크기를 줄여 검색 속도 향상을 기대할 수 있습니다. 하지만, 데이터를 다시 복구하기 어렵다는 점과 삭제된 데이터가 비즈니스 의사결정에 사용되기 어렵다는 단점이 있습니다.\n\n논리 삭제는 데이터를 삭제하지 않기 때문에 데이터 복구에 용이하고, 비즈니스 의사결정에 사용될 수 있습니다. 하지만, 테이블에 데이터가 많아져 성능에 악영향을 줄 수 있고, 논리 삭제된 데이터를 제외하지 않고 조회하는 실수가 발생할 수 있다는 단점이 존재합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [JPA에서 Soft Delete를 구현하는 방법](https://engineerinsight.tistory.com/172)\n- [Soft Delete vs Hard Delete](https://www.becomebetterprogrammer.com/soft-delete-vs-hard-delete/#Are_Soft_Deletes_Bad)\n\n\n\n\n", "title": "논리 삭제와 물리 삭제의 차이점은 무엇인가요?"}, "be-137": {"id": "be-137", "content": "**템플릿 메서드 패턴(Template Method Pattern)** 은 기능의 뼈대와 구현을 분리하는 행위 디자인 패턴입니다. 템플릿 메서드 패턴은 실행 단계의 절차를 결정하는 상위 클래스와 실행 단계를 구현하는 하위 클래스로 구성됩니다.\n\n```java\npublic abstract class Student {\n  \n    public abstract void study();\n    public abstract void watchYoutube();\n    public abstract void sleep();\n\n    // 템플릿 메서드\n    final public void doDailyRoutine() {\n       study();\n       watchYoutube();\n       sleep();\n    }\n}\n\nclass BackendStuduent extends Student {\n\n    @Override\n    public void study() {\n        System.out.println(\"영한님 JPA 강의를 수강합니다.\");\n    }\n\n    @Override\n    public void watchYoutube() {\n        System.out.println(\"개발바닥 유튜브를 시청합니다.\");   \n    }\n\n    @Override\n    public void sleep() {\n        System.out.println(\"7시간 잠을 잡니다.\");   \n    }\n}\n```\n\n템플릿 메서드 패턴은 공통 로직을 상위 클래스에 모아 중복 코드를 줄일 수 있으며, 코드의 재사용성을 높일 수 있다는 장점이 있습니다. 하지만, 하위 클래스를 개발할 때 상위 클래스의 내용을 알기 전까지 어떠한 방식으로 동작할지 예측하기 어렵고, 상위 클래스 수정이 발생하는 경우 모든 하위 클래스를 변경해야 하는 단점이 존재합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [라인 기술 블로그 - 템플릿 메서드 패턴으로 모순 없는 상태 보장하기](https://engineering.linecorp.com/ko/blog/templete-method-pattern)\n- [얄팍한 코딩사전 - 템플릿 메소드(Template Method) 패턴](https://youtu.be/JgOtZfly6DE?feature=shared)\n- [Refactoring GURU - 템플릿 메서드 패턴](https://refactoring.guru/ko/design-patterns/template-method)\n- [마량 - Template Method(템플릿 메소드) | 프레임워크 설계의 기초 | [디자인패턴]](https://youtu.be/b-7VOcm-i_E?feature=shared)", "title": "템플릿 메서드 패턴이란 무엇인가요?"}, "be-138": {"id": "be-138", "content": "NoSQL 데이터베이스의 유형은 키-값, 문서 지향, 열 지향, 그래프, 시계열이 있습니다.\n\n**키-값 데이터베이스(Key-value Database)** 는 키를 고유한 식별자로 사용하는 키-값 쌍의 형태로 데이터를 저장합니다.\n구조가 단순하고, 빠른 읽기 및 쓰기 성능을 제공합니다.\nRedis, Amazon DynamoDB가 대표적인 예시이고, 세션 저장, 캐시, 실시간 순위 등으로 사용할 수 있습니다.\n\n**문서 지향 데이터베이스(Document-oriented Database)** 는 JSON, BSON, XML 등의 형식으로 데이터를 저장합니다.\n유연한 스키마를 가지고 있으며, 복잡한 데이터 구조를 쉽게 표현할 수 있습니다.\nMongoDB, CouchDB가 대표적인 예시이고, 콘텐츠 관리 시스템, 사용자 프로필 저장 등으로 사용할 수 있습니다.\n\n**열 지향 데이터베이스(Column Family Database)** 는 데이터를 열 단위로 저장합니다.\n대량의 데이터를 처리하는 데 적합하며, 행마다 각기 다른 수의 열과 여러 데이터 유형을 가질 수 있습니다.\nApache Cassandra, HBase가 대표적인 예시이고, 대규모 데이터 분석, 로그 수집 등으로 사용할 수 있습니다.\n\n**그래프 데이터베이스(Graph Database)** 는 노드, 엣지 구조로 구성된 그래프로 데이터를 저장합니다.\n복잡한 관계를 표현하는 데 사용되며, 레이블(그룹화된 노드)을 통해 쿼리를 쉽게 작성하고 효율적으로 실행할 수 있습니다.\nNeo4j, Amazon Neptune이 대표적인 예시이고, 소셜 네트워크 분석, 추천 시스템 등으로 사용할 수 있습니다.\n\n**시계열 데이터베이스(Time Series Database)** 는 시간에 따라 변화하는 데이터를 저장합니다.\n타임스탬프가 있는 메트릭, 이벤트 등을 처리하기 위해 사용되며, 시간 경과에 따른 변화를 측정하는데 최적화되어 있습니다.\nInfluxDB, Prometheus, TimescaleDB가 대표적인 예시이고, IoT 데이터 수집, 금융 데이터 분석 등으로 사용할 수 있습니다.\n\n## 실시간 채팅 앱에 적합한 NoSQL을 사용한다면 어떻게 구성하실 건가요?\n\n> 개인의 경험과 지식에 따라 다르게 답변할 수 있습니다. 아래는 하나의 예시로 참고해주세요.\n\n실시간 채팅 앱에서는 메시지를 빠르게 주고받는 처리 속도와, 유연하고 수평 확장이 가능한 저장 구조가 중요하다고 생각합니다.  \n먼저, 실시간 메시지 전송은 Redis의 Pub/Sub 기능을 사용하겠습니다. 이 기능은 낮은 지연 시간으로 사용자 간 메시지를 브로드캐스트할 수 있기 때문입니다.\n\nRedis는 영구 저장보다 캐시나 메시지 브로커 역할에 더 적합하므로 실제 메시지를 영구 저장할 때는 MongoDB를 사용하겠습니다.\nMongoDB는 문서 지향 데이터베이스로서 채팅 메시지나 사용자 정보 등을 JSON 형식으로 유연하게 저장할 수 있습니다.\n특히, 샤딩 기능으로 수평 확장이 가능하기 때문에 사용자 수가 증가하거나 메시지 양이 많아져도 성능 저하 없이 안정적으로 확장할 수 있다고 생각합니다.\n\n## 추가 학습 자료를 공유합니다.\n- [AWS - Types of NoSQL databases](https://docs.aws.amazon.com/whitepapers/latest/choosing-an-aws-nosql-database/types-of-nosql-databases.html)\n- [MongoDB - What Is NoSQL?](https://www.mongodb.com/ko-kr/resources/basics/databases/nosql-explained)\n- [매일메일 - 관계형 데이터베이스와 비 관계형 데이터베이스의 차이점은 무엇인가요?](https://www.maeil-mail.kr/question/131)\n- [우아한형제들 - 배민쇼핑라이브를 만드는 기술: 채팅 편](https://techblog.woowahan.com/5268/)\n", "title": "NoSQL 데이터베이스의 유형에는 어떤 것들이 있나요?"}, "be-139": {"id": "be-139", "content": "**테스트 격리(Test Isolation)** 는 각 테스트가 서로 독립적으로 실행되도록 보장하는 것을 말합니다. 즉, 어떤 테스트가 실행되더라도 다른 테스트의 결과나 상태에 영향을 주거나 받지 않아야 한다는 의미입니다.\n\n테스트 격리가 중요한 이유는 격리가 제대로 이루어지지 않으면 비결정적 테스트가 발생할 수 있기 때문입니다. **비결정적(Non-deterministic) 테스트**는 같은 테스트를 여러 번 실행했을 때 항상 같은 결과를 내지 않는 테스트를 말합니다. 예를 들어, 테스트가 데이터베이스와 같은 공유 자원에 의존할 경우 실행 순서나 다른 테스트의 실행 여부에 따라 성공 또는 실패 결과가 달라질 수 있습니다. 비결정적 테스트는 실패했을 때 실제 코드의 문제인지, 비결정적 요인 때문인지 판단하기 어려워집니다. 따라서 테스트가 항상 동일한 조건에서 예측 가능한 결과를 낼 수 있도록 격리하는 것이 중요합니다.\n\n## Spring에서 같은 데이터베이스를 사용하는 테스트는 어떻게 격리할 수 있을까요?\n\n``` java\n@DirtiesContext(classMode = DirtiesContext.ClassMode.AFTER_EACH_TEST_METHOD)\n@SpringBootTest\nclass MyIntegrationTest {\n    // ...\n}\n```\n\nSpring의 테스트 컨텍스트는 애플리케이션 컨텍스트를 캐싱해서 각각의 테스트에서 재사용합니다. `@DirtiesContext` 어노테이션을 사용하면 테스트마다 새로운 애플리케이션 컨텍스트를 로드하여 완전한 격리를 보장할 수 있습니다. 하지만 애플리케이션 컨텍스트를 매번 새로 로드하는 것은 비용이 크고 시간이 오래 걸리는 작업이기 때문에 성능이 저하된다는 단점이 있습니다.\n\n<br/>\n\n``` java\n@Sql(\"/truncate.sql\")\n@SpringBootTest\nclass MyIntegrationTest {\n    // ...\n}\n```\n\n`@Sql` 어노테이션을 사용하면 테스트 실행 전 또는 후에 특정 SQL 스크립트를 실행할 수 있습니다. 이때 `TRUNCATE` DDL을 사용하여 테이블 자체를 비움으로써 테스트 간 독립된 테이블을 사용할 수 있습니다. 하지만 테이블이 추가될 때마다 SQL 스크립트를 수정해야 하기 때문에 유지보수 비용이 발생한다는 단점이 있습니다.\n\n<br/>\n\n``` java\n@Transactional\n@SpringBootTest\nclass MyIntegrationTest {\n    // ...\n}\n```\n\n`@Transactional` 어노테이션을 사용하면 테스트가 실행된 후 트랜잭션을 롤백하여 데이터베이스 상태를 원래대로 유지할 수 있습니다. 이 방법을 사용할 때는 몇 가지 주의할 점이 있습니다.\n\n1. 의도치 않은 트랜잭션 적용으로 프로덕션 환경과 다른 조건에서 테스트될 수 있습니다. 예를 들어, OSIV를 꺼두고 `@Transactional`도 없는 상태에서 지연로딩된 엔티티를 조회하면 LazyInitializationException이 발생하지만, 테스트에서는 트랜잭션이 열려 있어서 예외가 발생하지 않습니다. 따라서 실제로는 실패할 코드가 테스트에서는 성공하는 거짓 음성이 나타날 수 있습니다.\n    >거짓 양성(False Positive): 프로덕션 코드는 정상 동작하지만 테스트는 실패\n    >\n    >거짓 음성(False Negative): 프로덕션 코드는 실패하지만 테스트는 통과\n\n2. `@SpringBootTest`의 WebEnvironment가 `DEFINE_PORT` 또는 `RANDOM_PORT`일 경우, 별도의 스레드에서 서블릿 컨테이너가 실행되기 때문에 테스트의 트랜잭션 롤백이 적용되지 않습니다.\n\n3. 프로덕션 코드의 트랜잭션 전파 레벨을 `REQUIRES_NEW`로 설정했을 경우 새로운 트랜잭션을 생성하기 때문에 테스트 트랜잭션과 무관하여 롤백되지 않습니다.\n\n4. 비동기 메서드는 새로운 스레드에서 실행되기 때문에 롤백되지 않습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [Martin Fowler - Eradicating Non-Determinism in Tests](https://martinfowler.com/articles/nonDeterminism.html)\n- [우아한테크코스 Tecoble - 인수테스트에서 테스트 격리하기](https://tecoble.techcourse.co.kr/post/2020-09-15-test-isolation/)\n- [기억보다 기록을 - 테스트 데이터 초기화에 @Transactional 사용하는 것에 대한 생각](https://jojoldu.tistory.com/761)\n- [반려생활 - @Transactional 없애려다 오픈소스 라이브러리까지 만든 이야기](https://blog.ban-life.com/transactional-%EC%97%86%EC%95%A0%EB%A0%A4%EB%8B%A4-%EC%98%A4%ED%94%88%EC%86%8C%EC%8A%A4-%EB%9D%BC%EC%9D%B4%EB%B8%8C%EB%9F%AC%EB%A6%AC%EA%B9%8C%EC%A7%80-%EB%A7%8C%EB%93%A0-%EC%9D%B4%EC%95%BC%EA%B8%B0-5426116036bb)\n", "title": "테스트 격리란 무엇인가요?"}, "be-14": {"id": "be-14", "content": "데이터 액세스 기술을 사용하는 Spring 기반 애플리케이션을 더 쉽게 구축할 수 있습니다.\n\n애플리케이션에 대한 데이터 액세스 계층을 구현하는 것은 상당히 번거로울 수 있습니다. 가장 간단한 쿼리를 실행하려면 너무 많은 상용구 코드를 작성해야 합니다. 페이지 매김, Auditing, 기타 자주 필요한 옵션을 추가하면 결국 길을 잃게 됩니다.\n\nSpring Data JPA는 실제로 필요한 만큼의 노력으로 데이터 액세스 계층의 구현을 크게 개선하는 것을 목표로 합니다. 개발자는 다양한 기술을 사용하여 리포지토리 인터페이스를 작성하면 Spring이 자동으로 이를 연결해 줍니다. 심지어 사용자 정의 파인더를 사용하거나 예제를 통해 쿼리를 작성하면 Spring이 쿼리를 작성해줍니다.\n\n1. 더 이상 DAO 구현이 필요하지 않습니다. 인터페이스를 확장함으로써 표준 DAO에서 사용할 수 있는 표준 데이터 액세스에 가장 적합한 CRUD 방법을 얻을 수 있습니다.\n2. 사용자 정의 액세스 메서드 및 쿼리\n    - 인터페이스에서 새로운 메소드를 정의하기만 하면 됩니다.\n    - `@Query` 주석을 사용하여 JPQL 쿼리 제공\n    - Spring Data의 고급 사양 및 Querydsl 지원을 사용\n    - JPA Named 쿼리를 통해 사용자 정의 쿼리 사용\n3. Automatic 사용자 정의 쿼리: 정의된 모든 메서드를 분석하고 메서드 이름에서 쿼리를 자동으로 생성 하려고 시도합니다\n4. Transaction Configuration: 클래스 수준에서 읽기 전용 `@Transactional` 주석을 사용하고, 읽기 전용이 아닌 메서드에 대해 재정의됩니다.", "title": "JPA를 사용하는 이유를 설명해주세요."}, "be-140": {"id": "be-140", "content": "**SQL 인젝션(SQL Injection)** 은 웹 애플리케이션에서 사용자의 입력값이 SQL 쿼리에 안전하게 처리되지 않을 때 발생하는 보안 취약점입니다.\n공격자는 이 취약점을 이용해 쿼리를 조작하여 인증을 우회하거나, 데이터를 조작하거나, 테이블 자체를 삭제할 수도 있습니다.\n\n예를 들어, 로그인 검증 시 아래와 같은 코드를 사용한다고 가정해 보겠습니다.\n```java \npublic boolean login(String username, String password) {\n    String sql = \"SELECT * FROM users WHERE username = '\" + username + \"' AND password = '\" + password + \"'\";\n\n    try (Connection conn = DriverManager.getConnection(\"url\");\n         Statement stmt = conn.createStatement();\n         ResultSet rs = stmt.executeQuery(sql)) {\n        return rs.next();\n    } catch (SQLException e) {\n        throw new RuntimeException(\"Database error\", e);\n    }\n}\n```\n\n사용자가 로그인 폼에 아래와 같이 입력한다면\n```\nusername: admin' -- \npassword: (아무거나)\n```\n\n생성되는 쿼리는 다음과 같이 변형됩니다.\n\n``` sql\nSELECT * FROM users WHERE username = 'admin' -- ' AND password = '1q2w3e4r!';\n```\n\n`--` 이후는 주석 처리되므로, 비밀번호 조건은 무시되어 `admin` 사용자에 대한 정보가 반환됩니다.\n이처럼 공격자는 SQL 쿼리를 조작하여 인증을 우회하거나 데이터베이스의 정보를 탈취할 수 있습니다.\n\n이 외에도 공격자는 다음과 같은 페이로드를 사용할 수 있습니다.\n- `' OR '1'='1`: 항상 참이 되는 조건\n- `' UNION SELECT * FROM accounts --`: 다른 테이블의 정보 조회\n- `'; DROP TABLE users; --`: 테이블 삭제\n\n## SQL 인젝션을 방지하는 방법은 무엇인가요?\n\n1. PreparedStatement를 사용하면 place holder(`?`)에 값을 바인딩하고 내부적으로 이스케이프 처리하기 때문에 SQL 인젝션을 방지할 수 있습니다.\n    ```java\n    String sql = \"SELECT * FROM users WHERE username = ? AND password = ?\";\n    PreparedStatement pstmt = conn.prepareStatement(sql);\n    pstmt.setString(1, username);\n    pstmt.setString(2, password);\n    ```\n2. JPA, Hibernate와 같은 ORM 프레임워크를 사용하면 SQL 쿼리를 직접 작성하지 않고도 데이터베이스와 상호작용할 수 있습니다.\n3. 사용자 입력에 대해 공격에 사용되는 SQL 구문의 포함 여부를 검증합니다.\n4. 웹 애플리케이션에서 사용하는 데이터베이스 계정에 최소한의 권한만 부여합니다.\n5. SQL 오류나 예외 메시지를 사용자에게 직접 노출하지 않도록 합니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 로비의 SQL 인젝션](https://www.youtube.com/watch?v=qzas_-u4Nxk) \n- [코딩애플 - SQL injection 공격](https://www.youtube.com/watch?v=FoZ2cucLiDs)\n- [한국재정정보원 - 웹 취약점과 해킹 매커니즘 #6 SQL Injection 보안대책](https://www.fis.kr/ko/major_biz/cyber_safety_oper/attack_info/security_news?articleSeq=2588)\n", "title": "SQL 인젝션에 대해 설명해 주세요."}, "be-141": {"id": "be-141", "content": "**최종적 일관성(Eventual Consistency)** 이란 분산 시스템에서 고가용성을 유지하기 위해서 사용하는 일관성 모델입니다. 데이터가 수정되면, 그 변경 내용은 비동기적으로 다른 노드에 전파되기 때문에 일시적으로 각 노드의 데이터가 다를 수 있습니다. 하지만 시간이 지나면 모든 노드에 변경 사항이 전달되어 결국에는 모든 노드가 동일한 데이터를 가지게 되는 것을 의미합니다.\n\n만약, 사용자가 특정 노드에 데이터를 수정하면 다른 노드에 변경 사항이 복제되는 상황을 가정하겠습니다.\n\n<p align = \"center\"> \n\n<figure>\n    <img src=\"https://cloud.google.com/static/datastore/docs/articles/images/balancing-strong-and-eventual-consistency-with-google-cloud-datastore/eventual-consistency.png?hl=ko\">\n    <figcaption>이미지 출처 : <a href = \"https://cloud.google.com/datastore/docs/articles/balancing-strong-and-eventual-consistency-with-google-cloud-datastore?hl=ko#what-is-eventual-consistency\"> Google Cloud</a> </figcaption>\n</figure>\n\n</p>\n\n위 구성은 복제를 수행하고 있는 노드에 대해 조회 연산을 허용하여 높은 가용성을 유지할 수 있으며, 최종적으로는 모든 노드가 같은 데이터를 가지고 있는 최종적 일관성을 달성할 수 있습니다. 하지만, 일시적인 데이터 불일치가 발생하여 클라이언트는 오래된 데이터를 읽을 수 있다는 단점이 있습니다.\n\n\n## 최종적 일관성과 강한 일관성의 차이는 무엇인가요? 🤔\n\n**강한 일관성(Strong Consistency)** 은 최종적 일관성과는 다르게, 특정 연산이 끝난 직후 모든 노드가 동일한 데이터를 갖도록 보장하는 것을 의미합니다. 즉, 사용자가 데이터를 수정한 직후 다른 노드에서 해당 데이터를 읽더라도, 반드시 최신 값을 얻게 됩니다.\n\n<p align = \"center\"> \n\n<figure>\n    <img src=\"https://cloud.google.com/static/datastore/docs/articles/images/balancing-strong-and-eventual-consistency-with-google-cloud-datastore/strong-consistency.png?hl=ko\">\n    <figcaption>이미지 출처 : <a href = \"https://cloud.google.com/datastore/docs/articles/balancing-strong-and-eventual-consistency-with-google-cloud-datastore?hl=ko#what-is-eventual-consistency\"> Google Cloud</a> </figcaption>\n</figure>\n\n</p>\n\n예를 들어, 위 구성에서는 복제가 완료되기 전까지 다른 노드의 읽기 연산을 차단하여 강한 일관성을 달성할 수 있습니다. 하지만, 클라이언트로부터의 요청을 처리할 수 없다는 점에서 가용성이 희생된다는 단점이 있습니다.\n\n\n## 추가 학습 자료를 공유합니다.\n\n- [System Design Interview Concepts – Eventual Consistency](https://acodersjourney.com/eventual-consistency/)\n- [분산 데이터베이스 탐구: 데이터 복제와 일관성](https://loosie.tistory.com/886)\n- [토스ㅣSLASH 24 - 보상 트랜잭션으로 분산 환경에서도 안전하게 환전하기](https://youtu.be/xpwRTu47fqY?feature=shared)\n", "title": "최종적 일관성이란 무엇인가요?"}, "be-142": {"id": "be-142", "content": "아래와 같이 `NOT IN`을 사용한 쿼리는 직관적이고 사용하기 쉽지만, 대규모 데이터셋에서 심각한 성능 저하를 일으킬 수 있습니다.\n```sql\nSELECT p \nFROM Post p\nWHERE p.id NOT IN :postIds\n```\n\n## 문제점\n1. `NOT IN`은 부정 조건으로, 대부분의 DBMS에서 전체 테이블 스캔이나 인덱스 풀 스캔을 유발합니다. 전체 데이터나 테이블을 스캔한 후 조건에 맞지 않는 레코드를 필터링 해야하기 때문에 데이터베이스 옵티마이저가 효율적인 실행 계획을 세우기 어렵습니다.\n2. 인덱스를 효과적으로 활용하지 못합니다. `IN` 절은 인덱스 Range Scan을 통해 빠르게 처리할 수 있지만, `NOT IN`은 인덱스 활용도가 현저히 떨어집니다.\n3. 대량의 값을 `IN` 절에 넣으면 실행 계획 생성이 늘어나고, 파싱 및 최적화 단계에서 추가적인 오버헤드가 발생합니다.\n4. NULL 값 처리 로직으로 인한 예상치 못한 결과가 발생할 수 있습니다. 예를 들어, `column NOT IN (1, 2, NULL)`은 항상 빈 결과를 반환합니다.\n\n## 최적화 방안\n\n### 1. NOT EXISTS 활용\n```sql\nSELECT p FROM Post p\nWHERE NOT EXISTS (\n    SELECT 1 FROM Post temp\n    WHERE temp.id = p.id AND temp.id IN :postIds\n)\n```\n`NOT EXISTS`는 행 단위로 평가되어 매칭되는 첫 행을 찾자마자 평가를 중단합니다. 이는 DBMS가 '존재하지 않음'을 확인하기 위해 특별히 최적화된 방식입니다. 대규모 데이터셋에서 가장 안정적이고 확장성 있는 성능을 제공합니다.\n   \n### 2. LEFT JOIN + IS NULL 패턴\n```sql\nSELECT p FROM Post p \nLEFT JOIN (\n    SELECT temp.id FROM Post temp WHERE temp.id IN :postIds\n) filtered ON p.id = filtered.id\nWHERE filtered.id IS NULL\n```\n이 방식은 서브쿼리 결과가 작을 때 특히 효율적입니다. 인덱스를 효과적으로 활용할 수 있으며, PK 인덱스를 사용한 JOIN 연산이 최적화됩니다.", "title": "NOT IN 쿼리를 사용할 때 발생할 수 있는 문제와 최적화 방법에 대해 설명해 주세요."}, "be-143": {"
