은 방식</u> 이라고 생각합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 오찌, 야호의 DI와 IoC](https://youtu.be/8lp_nHicYd4?feature=shared)\n- [[10분 테코톡] 리건의 IoC와 DI](https://youtu.be/BO7QFUnVdjc?feature=shared)\n- [테코블 - 의존관계 주입(Dependency Injection) 쉽게 이해하기](https://tecoble.techcourse.co.kr/post/2021-04-27-dependency-injection/)", "title": "의존성 주입이란 무엇인가요?"}, "be-9": {"id": "be-9", "content": "`@ControllerAdvice`는 모든 컨트롤러에 대해 전역 기능을 제공하는 애너테이션입니다. \n`@ControllerAdvice`가 선언된 클래스에 `@ExceptionHandler`, `@InitBinder`, `@ModelAttribute`를 등록하면 예외 처리, 바인딩 등을 한 곳에서 처리할 수 있어, 코드의 중복을 줄이고 유지보수성을 높일 수 있습니다. \n`@ControllerAdvice`는 내부에 `@Component`가 포함되어 있어 컴포넌트 스캔 과정에서 빈으로 등록됩니다. `@RestControllerAdvice`는 내부에 `@ResponseBody`를 포함하여 `@ExceptionHandler`와 함께 사용될 때 예외 응답을 Json 형태로 내려준다는 특징이 있습니다.", "title": "ControllerAdvice에 대해 설명해주세요."}, "be-90": {"id": "be-90", "content": "테스트 케이스들이 프로덕션 코드를 실행한 정도를 나타낸 것을 **코드 커버리지(Code Coverage)** 라고 합니다. \n\n코드 커버리지는 측정하는 기준에 따라서 크게 **구문 커버리지(Statement Coverage)**, **조건 커버리지(Condition Coverage)**, **결정 커버리지(Decision Coverage)** 로 나뉩니다.\n\n구문 커버리지는 라인 커버리지라고도 불립니다. 단순히 프로덕션 코드의 라인이 실행된 것을 확인합니다. 예를 들어, 5줄의 코드를 포함하는 A 메서드를 테스트했는데, 5줄 모두 실행된 경우 구문 커버리지는 100%가 됩니다.\n\n결정 커버리지는 브랜치 커버리지라고도 불립니다. 이는 프로덕션 코드에 모든 조건식이 참이거나 거짓으로 평가되는 케이스가 최소 한 번씩 실행되는 것을 판단합니다. 예를 들어 아래와 같은 코드가 존재했을 때, 조건식이 참과 거짓으로 평가시킬 수 있는 테스트 케이스를 작성해야 결정 커버리지 기준을 만족합니다. 예를 들어, `productionCode(1, 1)`, `productionCode(0, 1)`인 경우, 결정 커버리지를 만족합니다. 결정 커버리지는 코드 내에서 실행 흐름이 분기되는 모든 경로를 테스트하는 것을 목표로합니다.\n\n```java\npublic void productionCode(int a, int b) {\n    if(a > 0 && b > 0) { // 조건식\n    }\n}\n```\n\n조건 커버리지는 메서드 내부의 모든 조건식이 참과 거짓으로 모두 평가되는 것을 의미합니다. 예를 들어, 위 코드에서 결정 커버리지는 `a > 0 && b > 0`을 참과 거짓으로 평가할 수 있는 케이스가 있어야 하는 반면에, 조건 커버리지는 각 `a > 0`, `b > 0`이 참과 거짓으로 평가되는지 확인합니다. `productionCode(1, 0)`, `productionCode(0, 1)`를 입력하는 상황처럼 조건 커버리지는 만족하여도 다른 커버리지는 만족하지 못할 수 있는 상황도 존재합니다.\n\n## 커버리지가 높다고 무조건 좋을까요? 🤔\n\n커버리지가 높다는 것은 코드의 일부가 테스트에 의해 실행되어 검증되었다는 것을 의미합니다. 높은 커버리지는 일반적으로 코드의 안정성과 신뢰성을 높일 수 있지만, 이것이 무조건 항상 좋다고 말할 수는 없습니다.\n\n또한, 커버리지가 높다고 해서 모든 버그를 찾아낼 수 있는 것은 아닙니다. 커버리지가 높더라도 테스트 케이스가 부족하거나 부적절하게 작성되었다면 여전히 중요한 버그가 발생할 수 있습니다. 또한, 모든 코드를 테스트하는 것이 현실적이지 않을 수도 있습니다. 특히 예외 상황이나 경계 조건을 모두 다루기는 어려울 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [토스ㅣSLASH 21 - 테스트 커버리지 100%](https://youtu.be/jdlBu2vFv58?si=XDz67owhfCg64LgP)\n- [테코블 - 코드 커버리지(Code Coverage)가 뭔가요?](https://tecoble.techcourse.co.kr/post/2020-10-24-code-coverage/)\n- [요즘 IT - 개발자여, 테스트 커버리지에 집착 말자](https://yozm.wishket.com/magazine/detail/2471/)", "title": "코드 커버리지에 대해서 설명해주세요."}, "be-91": {"id": "be-91", "content": "개발자가 작성한 작은 코드 변경을 코드 베이스에 통합합니다. 변경한 부분이 통합되면, 자동으로 새로운 시스템을 빌드하고 현재 시스템에 존재하는 모든 테스트를 실행합니다. 만약 이전에 동작했던 어떤 부분이 망가졌다면, 개발자는 해당 부분을 다시 수정합니다. 이러한 일련의 과정을 포함하는 소프트웨어 개발 방식을 **지속적 통합(Continuous Integration)** 이라고 합니다. 지속적 통합의 핵심 목표는 소프트웨어의 품질을 개선하고, 새로운 소프트웨어의 변경 사항을 검증하는데 소요되는 시간을 단축 시키며, 버그를 조기에 발견하기 위함입니다. \n\n**지속적 배포(Continuous Deployment)** 는 지속적 통합을 통해서 빌드된 코드(빌드 아티팩트)를 프로덕션 환경에 자동으로 배포하는 것을 의미합니다. **지속적 전달(Continuous Delivery)** 은 빌드 아티팩트를 프로덕션 환경에 바로 배포하기 위해서 수동으로 작업해야 한다는 점에서 지속적 배포와 차이가 있습니다. CD 과정에는 빌드 아티팩트를 관리 및 저장하는 공간이 필요할 수도 있습니다. 예를 들어, AWS S3, Docker Registry, Nexus를 사용할 수 있습니다.\n\n일반적으로 위 방식들을 합쳐 CI/CD 파이프라인이라고 부르며, CI/CD 파이프라인을 구축하기 위한 도구로 Jenkins, Travis CI, Github Action 등이 존재합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 찬, 레넌의 CI/CD와 무중단 배포](https://youtu.be/sIPU_VkrguI?feature=shared)\n- [[10분 테코톡] 도비의 CI/CD와 Github Action](https://youtu.be/SKILL1pT6f4?feature=shared)\n- [JETBRAINS TeamCity - 지속적 통합 vs 전달 vs 배포](https://www.jetbrains.com/ko-kr/teamcity/ci-cd-guide/continuous-integration-vs-delivery-vs-deployment/)\n- [Red Hat - CI/CD란?](https://www.redhat.com/ko/topics/devops/what-is-ci-cd)\n", "title": "CI/CD 파이프라인에 대해서 설명해주세요."}, "be-92": {"id": "be-92", "content": "시스템은 크게 상태 변경과 조회 기능을 제공하는데요. 주문 취소, 결제 기능은 상태 변경에 해당되며, 주문서 조회, 사용자 조회 등이 조회에 해당됩니다. **명령 쿼리 책임 분리 패턴(Command Query Responsibility Segregation, CQRS)** 는 상태를 변경하기 위한 명령을 위한 모델과 상태를 제공하는 조회(Query)를 위한 모델을 분리하는 패턴을 의미합니다. 예를 들어, Order라는 리소스를 Order(명령용), OrderData(조회용) 2개의 모델로 나누어서 관리할 수 있습니다. 이때 OrderData를 이용해서 표현 계층에 데이터를 출력하는 데 사용하고, 애플리케이션에서는 Order를 활용해 변경을 수행할 수 있습니다.\n\n## CQRS 패턴의 장단점은 무엇인가요? 🤔\n\nCQRS 패턴을 따르면, 소프트웨어의 유지보수성을 높일 수 있습니다. 그리고, 모델별로 성능이나 요구사항에 맞는 데이터베이스나 데이터 접근 기술을 사용할 수 있습니다.\n\n예를 들어, 명령 모델은 트랜잭션이 지원되는 RDB를 사용하고, 조회 모델은 조회 성능이 높은 NoSQL을 사용할 수 있습니다. 단, 해당 방식은 명령 모델의 변경을 조회 모델로 전파하여 동기화시켜야 할 필요가 있을 수 있습니다. 또 다른 예시로, 단일 데이터베이스의 테이블에 대해 CQRS 패턴을 사용한다고 가정했을 때는 명령 모델은 도메인 모델을 구현하는데 유리한 JPA를 사용하고, 조회 모델에 대해서는 SQL 데이터 조회에 유리한 MyBatis를 사용할 수 있습니다.\n\n하지만, CQRS 패턴은 구현 코드가 많고, 더 많은 구현 기술이 필요하다는 점이 단점입니다. 따라서 단일 모델을 사용할 때 발생하는 복잡함 때문에 발생하는 구현 비용과 조회 전용 모델을 만들 때 발생하는 복잡함 때문에 발생하는 구현 비용을 비교해서 신중하게 도입을 결정해야 합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [최범균님 - CQRS 아는 척하기 1](https://youtu.be/xf0kXMTFJm8?feature=shared)\n- [최범균님 - CQRS 아는 척하기 2](https://youtu.be/H1IF3BUeFb8?feature=shared)\n- [우아콘2021 - B마트 전시 도메인 CQRS 적용하기](https://youtu.be/fg5xbs59Lro?feature=shared)\n- [우아콘2023 - 대규모 트랜잭션을 처리하는 배민 주문시스템 규모에 따른 진화](https://youtu.be/704qQs6KoUk?feature=shared)\n- [쿠팡 엔지니어링 - 대용량 트래픽 처리를 위한 쿠팡의 백엔드 전략](https://medium.com/coupang-engineering/%EB%8C%80%EC%9A%A9%EB%9F%89-%ED%8A%B8%EB%9E%98%ED%94%BD-%EC%B2%98%EB%A6%AC%EB%A5%BC-%EC%9C%84%ED%95%9C-%EC%BF%A0%ED%8C%A1%EC%9D%98-%EB%B0%B1%EC%97%94%EB%93%9C-%EC%A0%84%EB%9E%B5-184f7fdb1367)\n- [AWS 마이크로서비스의 데이터 지속성 지원 - CQRS 패턴](https://docs.aws.amazon.com/ko_kr/prescriptive-guidance/latest/modernization-data-persistence/cqrs-pattern.html)", "title": "CQRS 패턴이란 무엇인가요?"}, "be-93": {"id": "be-93", "content": "**우아한 종료(Graceful Shutdown)** 란 애플리케이션이 종료될 때 바로 종료하는 것이 아니라, 현재 처리하고 있는 작업을 마무리하고 리소스를 정리한 이후 종료하는 방식을 의미합니다. 서버 애플리케이션에서 일반적인 Graceful Shutdown은 SIGTERM 신호를 받았을 때, 새로운 요청은 차단하고 기존 처리 중인 요청을 모두 완료한 뒤에 프로세스를 종료합니다. 만약, 서버 애플리케이션이 요청을 처리하는 중에 즉각적으로 애플리케이션을 종료한다면 트랜잭션 비정상 종료, 데이터 손실, 사용자 경험 저하 문제가 발생할 수 있습니다. \n\n## SIGTERM과 SIGKILL의 차이점은 무엇인가요? 🤓\n\nSIGTERM과 SIGKILL은 유닉스 및 리눅스 운영체제에서 사용되는 프로세스 종료 시그널입니다.\n그중에서 SIGKILL은 프로세스를 강제 종료하는 신호입니다. 프로세스가 종료하기 이전에 수행되어야 하는 절차들을 실행하지 않고 즉시 종료합니다. 반면, SIGTERM은 프로세스가 해당 시그널을 핸들링할 수 있습니다. 따라서, 프로세스가 종료하기 이전에 수행되어야 하는 절차들을 안전하게 수행할 수 있습니다.\n\n\n## 스프링 환경에서 Graceful Shutdown을 하는 방법은 무엇인가요? 🤔\n\n```\nserver.shutdown=graceful\nspring.lifecycle.timeout-per-shutdown-phase=20s // 타임 아웃\n```\n\n스프링에서는 Graceful Shutdown 설정을 지원해 줍니다. 단, 한 가지 유의해야 할 부분이 있는데요. 기존 처리 중인 요청에서 데드락이나 무한 루프가 발생하면 프로세스가 종료되지 않을 수 있습니다. 스프링은 이러한 상황을 예방하기 위해서 타임아웃 설정을 지원합니다. 위 예시에서 기존 진행 중인 작업들의 완료가 20초를 넘기는 경우 프로세스를 바로 종료합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [JVM의 종료와 Graceful Shutdown](https://effectivesquid.tistory.com/entry/JVM%EC%9D%98-%EC%A2%85%EB%A3%8C%EC%99%80-Graceful-Shutdown)\n- [SpringBoot Graceful-Shutdown 개념과 동작 원리](https://velog.io/@byeongju/SpringBoot%EC%9D%98-Graceful-Shutdown)\n- [SIGKILL vs SIGTERM 리눅스 종료 신호](https://velog.io/@480/SIGKILL-vs-SIGTERM-%EB%A6%AC%EB%88%85%EC%8A%A4-%EC%A2%85%EB%A3%8C-%EC%8B%A0%ED%98%B8)", "title": "Graceful Shutdown의 필요성에 대해서 설명해주세요."}, "be-94": {"id": "be-94", "content": "데이터베이스에서 **정규화(Normalization)** 는 테이블을 정리하여 중복 데이터를 최소화하고, 데이터 무결성을 보장하는 과정을 의미합니다. 이를 통해 데이터 저장 용량을 줄이고, 삽입·갱신·삭제 이상(Anomaly) 현상을 해결할 수 있습니다. 정규화는 여러 단계가 존재하며, 대표적으로 1정규화(1NF), 2정규화(2NF), 3정규화(3NF), BCNF가 있습니다.\n\n## 각 정규화 단계를 설명해주세요. 🤔\n\n- **1 정규화(1NF)** 는 테이블 컬럼의 값이 원자값(Atomic Value)을 가지도록 정리하는 것을 의미합니다.\n- **2 정규화(2NF)** 는 1 정규화를 진행한 테이블에서 완전 함수 종속을 만족할 수 있도록 테이블을 분해하는 것인데요. 쉽게 표현하자면, 기본 키의 일부에만 종속된 속성이 없도록 분해하는 것을 의미합니다. A 속성을 통해서 B 속성의 값이 유일하게 정해지는 관계에서 A를 **결정자**라고 합니다. 가령 사용자 ID가 기본 키이며 값이 1입니다. 그리고, 사용자 ID 1번에 대응되는 유일한 이름 속성 값이 \"B\" 이라고 했을 때, 이름 속성의 결정자는 사용자 ID입니다. 2NF를 만족하기 위해서는 기본키의 부분 집합이 결정자가 될 수 없습니다.\n- **3 정규화(3NF)** 는 2 정규화를 진행한 테이블에서 이행적 종속을 제거하기 위해 테이블을 분해하는 것을 의미합니다. A가 B를 결정하고, B가 C를 결정하는 경우에는 A가 C의 결정자가 되는데요. 이를 **이행적 종속**이라고 합니다. 3NF을 만족하기 위해서는 이행적 종속이 제거되도록 테이블을 분리해야 합니다.\n- **BCNF 정규화** 는 3 정규화를 진행한 테이블의 모든 결정자가 반드시 후보키가 될 수 있도록 테이블을 분해하는 것을 의미합니다. BCNF를 만족하기 위해서는 후보키가 아닌 결정자가 존재하지 않도록 테이블을 분리해야 합니다.\n\n## 역정규화에 대해서 알고 계신가요? 🤓\n\n**역정규화(Denormalization)** 는 정규화된 데이터베이스에서 쓰기 성능을 희생하고 읽기 성능을 향상하기 위해 사용되는 전략입니다. 예를 들어, 전체 게시글의 수나 좋아요의 수를 계산해 특정 컬럼에 저장해서 읽기 성능을 항상 시킬 수 있습니다. 역정규화된 데이터베이스에서는 데이터의 중복을 허용하기 때문에 데이터의 일관성을 맞추기 위한 추가적인 작업이 필요합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 켈리의 정규화](https://youtu.be/mn7UTm0CbCc?feature=shared)\n- [망나니개발자 - 정규화(Normalization) 쉽게 이해하기](https://mangkyu.tistory.com/110)\n- [리디 기술 블로그 - 개발했더니 내 서재였던 건에 대하여](https://ridicorp.com/story/got-developed-as-a-my-library/?ref=codenary)\n\n\n", "title": "데이터베이스 정규화에 대해서 설명해주세요."}, "be-95": {"id": "be-95", "content": "Redis의 SET 명령어를 사용해서 분산 잠금을 구현할 수 있습니다. 가령, 1대 이상의 서버가 특정 Key에 대해서 SET 명령어에 NX 옵션을 추가하여 Redis에 전달하여 잠금 획득을 시도합니다. NX 옵션을 사용하면 특정 Key에 해당하는 값이 존재하지 않는 경우에만 값 추가 작업이 성공합니다. SET 작업을 성공적으로 수행한 서버는 잠금을 획득합니다. 잠금을 획득한 서버는 작업이 끝난 이후, Key에 해당하는 값을 제거하여 잠금을 해제합니다. \n\n## 잠금이 유실될 가능성이 있지 않나요? 🤔\n\n만약, 레플리케이션 구성으로 이루어져 있으면 잠금이 유실될 가능성이 존재합니다. 예를 들어, 마스터 노드가 존재하고 레플리카 노드에 주기적으로 데이터를 복제하는 구성이라고 가정하겠습니다. 이때, 특정 서버가 잠금을 획득하고 작업을 수행하는 도중에 마스터 노드에 장애가 발생하는 경우에는 레플리카 노드가 마스터 노드로 승격될 수 있습니다. (failover)\n\n위와 같은 가정에서 기존 마스터 노드가 가지고 있던 잠금용 데이터를 레플리카 노드가 가지고 있지 않은 상태라면, 작업을 처리하고 있는 서버의 잠금이 유실됩니다. 즉, 복제 지연으로 인해 분산 잠금의 상호 배제라는 특성을 잃게 됩니다. 이러한 문제를 해결하기 위해서 RedLock 알고리즘이 등장했습니다.\n\n## RedLock 알고리즘은 어떻게 동작하나요? 😀\n\nRedLock 알고리즘은 1대 이상의 단일 레디스 노드들을 이용하여 분산 잠금을 구현하는데요. 과반수 이상의 노드에 잠금을 획득한다면 잠금을 획득하는 것으로 간주합니다. 만약, 5개의 단일 레디스 노드가 존재한다고 가정하겠습니다. 작업 서버가 모든 노드에게 잠금 획득을 시도했는데, 3개(과반수) 노드에서 잠금을 획득다면, 분산 잠금을 획득한 것으로 판단합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [Redis - Distributed Locks with Redis](https://redis.io/docs/latest/develop/use/patterns/distributed-locks/)\n- [망나니개발자 - 레디스가 제공하는 분산락(RedLock)의 특징과 한계](https://mangkyu.tistory.com/311)\n- [컬리 기술 블로그 - 풀필먼트 입고 서비스팀에서 분산락을 사용하는 방법](https://helloworld.kurly.com/blog/distributed-redisson-lock/)\n- [와디즈 기술 블로그 - 분산 환경 속에서 ‘따닥’을 외치다](https://blog.wadiz.kr/%EB%B6%84%EC%82%B0-%ED%99%98%EA%B2%BD-%EC%86%8D%EC%97%90%EC%84%9C-%EB%94%B0%EB%8B%A5%EC%9D%84-%EC%99%B8%EC%B9%98%EB%8B%A4/)\n- [채널톡 기술 블로그 - Distributed Lock 구현 과정](https://channel.io/ko/blog/articles/abc2d95c)", "title": "분산 환경에서 Redis를 활용한 잠금은 어떻게 구현할 수 있나요?"}, "be-96": {"id": "be-96", "content": "**무중단 배포(Zero-Downtime Deployment)** 는 서비스에 다운 타임이 발생하지 않으면서, 새로운 버전의 애플리케이션을 서버에 배포하는 것을 의미합니다. 무중단 배포 패턴에는 대표적으로 순차적으로 배포하는 롤링 배포, 전체 서버를 통째로 바꾸는 블루/그린 배포, 트래픽을 순차적으로 이동시키는 카나리 배포가 존재합니다.\n\n## 각 배포 방식을 설명해 주시겠어요? 🤓\n\n- **롤링 배포(Roling Deployment)** 는 서버를 한 대씩 순차적으로 업데이트하는 가장 기본적인 방식입니다. 특정 시점에는 두 가지 버전이 공존하기 때문에 새로운 버전은 기존 버전 기능을 지원하는 등 **하위 호환성(Backward Compatibility)** 에 신경을 써야 합니다. 롤링 배포는 새로운 버전을 배포하기 위해서 새로운 서버를 생성하지 않습니다. 배포가 진행 중인 서버는 요청 처리가 불가하기 때문에 다른 서버에 전달되는 트래픽이 증가할 수 있습니다.\n- **블루/그린 배포(Blue/Green Deployment)** 는 기존의 서버와 동일한 스펙과 사이즈의 서버를 미리 준비하고, 신규 버전을 배포한 이후에 기존 서버는 폐기하고 트래픽을 신규 버전의 서버로 이전 시키는 방법입니다. 블루/그린 배포의 경우에는 기존의 버전을 가지고 있기(폐기 이전이라 가정) 때문에 롤백을 빠르게 수행할 수 있습니다. 하지만, 배포 과정에서 새로운 서버를 미리 준비해야 한다는 점에서 비용이 발생할 수 있습니다.\n- **카나리 배포(Canary Deployment)** 는 기존 버전의 서버와 새로운 버전의 서버들을 구성한 이후, 전체 트래픽의 퍼센티지로 관리하는 방법입니다. 예를 들어 트래픽을 기존 서버 70퍼, 신규 서버 30퍼로 나누고 점점 신규 서버로 트래픽을 보내어 나중엔 신규 서버가 100퍼센트가 되어 배포가 완료됩니다. 롤링 배포처럼 특정 시점에 다른 두 버전의 서버가 공존하기 때문에 하위 호환성을 신경 써야 합니다.\n\n## 어떤 상황에 각 배포 전략을 선택할 수 있을까요? 🤔\n\n- 배포를 위해 새로운 서버를 생성하는 비용을 감수하기 어려운 경우, 롤링 배포를 선택할 수 있습니다. 또한, 서버 API 구간에서 버그가 생겼을 때 이것을 수정하고 개발 서버에서 충분히 테스트한 이후 상용에 올려보고 싶을 때 롤링 배포가 유용할 수 있습니다. 서버 10대 중 1대만 버그를 수정해서 배포하고 디버그 레벨로 로깅을 하면서 수정한 버그가 해결됐는지 확인합니다. 만약 실제 상용 서버에서도 문제가 없다면 1대씩 순차적으로 롤링 배포를 진행합니다.\n- 대규모 업데이트가 있을 때는 블루/그린 배포를 선택할 수 있습니다. 예를 들어 전면적으로 기술 부채가 해결되거나 중요한 변화가 있을 때, 비용을 감수하고 블루/그린 배포를 채택하는 것이 유용할 수 있습니다.\n- 카나리 배포는 통계적으로 무언가 확인하고 싶은 것 (오류율, 성능)이 있을 때, 혹은 A/B 테스트를 하고 싶을 때 채택할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 테니의 무중단 배포](https://youtu.be/kgvBlruQEKU?si=VWHtoSkehtC22Kve)\n- [무중단 배포 아키텍처와 배포 전략 (Rolling, Blue/Green, Canary)](https://hudi.blog/zero-downtime-deployment/)\n- [테코블 - 무중단 배포](https://tecoble.techcourse.co.kr/post/2022-11-01-blue-green-deployment/)", "title": "무중단 배포가 무엇인가요?"}, "be-97": {"id": "be-97", "content": "테스트 코드에서 실제 의존성을 사용하기 어려운 경우, **테스트 더블(Test Double)** 을 사용할 수 있습니다. 테스트 더블은 의존성을 시뮬레이션하지만, 테스트에 더욱 적합하게 사용할 수 있도록 만듭니다. 실제 의존성을 포함하는 테스트는 외부 세계에 부수 효과를 유발할 수 있으며, 외부 세계에 의존적이기 때문에 비결정적인 동작을 유발할 수 있습니다. 또한, 실제 의존성을 포함하기 위해서 복잡한 설정이 필요한 경우도 존재합니다. 테스트 더블은 테스트로부터 외부 세계를 보호하고, 또 반대로 외부로부터 테스트를 보호하며, 복잡한 설정을 단순화할 수 있도록 해주는 가짜 의존성입니다.\n\n## 테스트 더블의 종류에는 무엇이 있나요? 🤔\n\n테스트 더블은 수행하는 역할에 따라서 더미, 스텁, 페이크, 스파이, 목으로 분류할 수 있습니다.\n\n- **더미(Dummy)** 는 아무런 동작도 하지 않으며, 인스턴스화된 객체만 필요한 경우에 사용됩니다.\n- **스텁(Stub)** 은 구현을 단순한 것으로 대체합니다. 테스트에 맞게 단순히 원하는 동작을 수행합니다.\n- **페이크(Fake)** 는 제품에는 적합하지 않지만, 실제 동작하는 구현을 제공합니다.\n- **스파이(Spy)** 는 호출된 내역을 기록합니다. 기록한 내용은 테스트 결과를 검증할 때 주로 사용되며, 스텁의 일종이기도 합니다.\n- **목(Mock)** 은 기대한 대로 상호작용하는지 행위를 검증합니다. 기대한 것처럼 동작하지 않는다면, 예외를 발생할 수 있습니다. 목 객체는 스텁이자 스파이기도 합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 더즈, 티키의 Classic TDD VS Mockist TDD](https://youtu.be/n01foM9tsRo?feature=shared)\n- [백명석님 - Test And Test Doubles](https://youtu.be/4q9d8Aye0nY?feature=shared&t=2169)\n- [파틴 파울러 닷컴 - 테스트 더블](https://martinfowler.com/bliki/TestDouble.html)\n- [기억보다 기록을 - 테스트 코드에서 내부 구현 검증 피하기](https://jojoldu.tistory.com/614)\n", "title": "테스트 더블에 대해서 설명해주세요."}, "be-98": {"id": "be-98", "content": "자바에서 클래스 정보를 가져오기 위해서 **Reflection API**를 사용할 수 있습니다. reflection 패키지에서 제공하는 클래스를 사용하면, JVM에 로딩되어 있는 클래스와 메서드의 정보를 읽어올 수 있습니다. 대표적으로 Class 클래스, Method 클래스, Field 클래스가 존재합니다.\n\nReflection API를 사용하면 구체적인 클래스의 타입을 몰라도, 클래스의 정보에 접근할 수 있습니다. 개발자는 이러한 특성을 이용하여 인스턴스를 감싸는 프록시를 만들거나, 사용자로부터 전달된 값을 처리할 메서드를 유연하게 선택하는 등 다양한 구현을 할 수 있습니다. Reflection API는 특히 프레임워크나 라이브러리를 개발하는 과정에서 사용되는 경우가 많습니다. 프레임워크나 라이브러리의 개발자는 사용자가 작성한 클래스에 대한 정보를 알 수 없기 때문입니다.\n\n## Reflection API의 단점은 무엇인가요? 🤓\n\nReflection API는 동적으로 클래스의 정보에 접근할 수 있다는 점에서 강력한 기능입니다.\n하지만, 일반적인 코드보다 복잡한 코드가 필요할 수 있습니다. 또한, 캡슐화가 약화되어 강결합으로 이어질 수 있습니다. 일반적인 메서드 호출과 Method 클래스의 invoke 호출의 성능을 비교했을 때, JIT 최적화가 어려워질 수 있어 일반적인 메서드 호출보다 성능이 저하될 가능성이 있습니다. 단, 이 부분은 사용 중인 JVM의 버전과 프로그램 상황에 따라 다를 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 파랑, 아키의 리플렉션](https://youtu.be/67YdHbPZJn4?feature=shared)\n- [테코블 - Reflection API 간단히 알아보자.](https://tecoble.techcourse.co.kr/post/2020-07-16-reflection-api/)\n- [백기선님 유튜브 - 자바, 리플렉션](https://youtu.be/Q-8FC09OSYg?si=UEDz8V9qWtQJQxAR)\n- [Oracle Java Magazine - Reflection for the modern Java programmer](https://blogs.oracle.com/javamagazine/post/java-reflection-introduction)\n- [Oracle Java Magazine - The performance implications of Java reflection](https://blogs.oracle.com/javamagazine/post/java-reflection-performance)", "title": "자바에서 클래스 정보는 어떻게 알아낼 수 있나요?"}, "be-99": {"id": "be-99", "content": "**연속 메모리 할당 기법(Continuous Memory Allocation)** 은 운영체제가 프로세스에 연속적인 메모리 공간을 할당하는 방법을 의미합니다. 연속 메모리 할당 기법을 사용하면, 하나의 프로세스는 메모리 주소 공간에서 연속적으로 존재하게 됩니다. \n\n연속 메모리 할당 기법은 크게 가변 크기 메모리 할당과 고정 크기 메모리 할당이 존재하는데요. 고정 크기 메모리 할당은 물리적인 메모리 공간을 고정된 크기로 나누어 프로세스에 고정된 크기만큼 할당합니다. 반면, 가변 크기 메모리 할당 방식은 프로세스의 크기에 맞춰 동적으로 메모리를 할당합니다.\n\n## 외부 단편화와 내부 단편화가 무엇인가요? 🤔\n\n**외부 단편화(External Fragmentation)** 는 프로세스를 할당하기 어려울 만큼 작은 메모리 공간들로 인해서 메모리가 낭비되는 현상입니다. 연속 메모리 할당 기법을 사용할 때 프로세스가 사용할 메모리 공간이 300MB라고 가정하겠습니다. 이때, 흩어져 있는 빈 공간들의 합은 300MB가 넘지만, 연속적인 300MB는 존재하지 않아 프로세스에 메모리를 할당하지 못하는 상황이 발생할 수 있습니다.\n\n**내부 단편화(Internal Fragmentation)** 는 메모리를 할당할 때 프로세스가 필요한 양보다 더 큰 메모리가 할당되는 상황에서 메모리 공간이 낭비되는 상황을 의미합니다. 고정 크기 할당 방식에서 프로세스가 사용할 메모리 공간이 300MB이지만 실제로 할당된 공간은 500MB인 경우, 200MB가 낭비됩니다.\n\n고정 크기 할당 방식은 고정된 크기만큼 프로세스에 공간을 할당하기 때문에 내부 단편화가 발생할 수 있습니다. 반면, 가변 크기 할당 방식은 필요한 크기만큼 프로세스에 할당하기 때문에 내부 단편화는 발생하지 않습니다. 단, 할당과 해제를 반복하다보면 외부 단편화가 발생할 수 있습니다.\n\n## 메모리에 빈 공간이 여러 개라면, 어디에 신규 프로세스를 배치해야 하나요? 🤓\n\n연속 메모리 할당 기법에서 사용할 수 있는 대표적인 방법으로 최초 적합, 최적 적합, 최악 적합 방식이 존재합니다.\n\n- **최초 적합(First Fit)** 은 운영체제가 메모리 내의 빈 공간을 순서대로 검색하고, 최초로 발견된 공간에 프로세스를 배치합니다.\n- **최적 적합(Best Fit)** 은 운영체제가 메모리 내의 빈 공간을 모두 검색하고, 적재될 수 있는 가장 작은 공간에 프로세스를 배치하는 방식입니다.\n- **최악 적합(Worst Fit)** 은 운영체제가 메모리 내의 빈 공간을 모두 검색하고, 적재될 수 있는 가장 큰 공간에 프로세스를 배치하는 방식입니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [한빛 미디어 컴퓨터 공학 기초 강의 - 연속 메모리 할당](https://youtu.be/bNFLpMUYqSE?feature=shared)\n- [리눅스로 공부하는 운영체제 - 메모리 할당 방식](https://wikidocs.net/232217)\n", "title": "연속 메모리 할당 기법에 대해서 설명해주세요."}}}};

/* ---------- 아주 작은 마크다운 렌더러 (오프라인 전용, 이 콘텐츠의 문법만 지원) ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderInline(text) {
  text = escapeHtml(text);
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/<br\s*\/?>/g, "<br>");
  return text;
}
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let i = 0;
  let listBuffer = null; // {type: 'ul'|'ol', items: []}
  function flushList() {
    if (!listBuffer) return;
    const tag = listBuffer.type;
    html += `<${tag}>` + listBuffer.items.map(it => `<li>${renderInline(it)}</li>`).join("") + `</${tag}>`;
    listBuffer = null;
  }
  let paraBuffer = [];
  function flushPara() {
    if (paraBuffer.length) {
      html += `<p>${paraBuffer.map(renderInline).join("<br>")}</p>`;
      paraBuffer = [];
    }
  }
  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      flushPara(); flushList();
      const lang = line.replace(/^```/, "").trim();
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      html += `<pre><code class="lang-${escapeHtml(lang)}">${escapeHtml(code.join("\n"))}</code></pre>`;
      i++;
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara(); flushList();
      const level = Math.min(h[1].length, 3);
      html += `<h${level}>${renderInline(h[2])}</h${level}>`;
      i++; continue;
    }
    const bq = line.match(/^>\s?(.*)$/);
    if (bq) {
      flushPara(); flushList();
      const quote = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, "")); i++; }
      html += `<blockquote>${quote.map(renderInline).join("<br>")}</blockquote>`;
      continue;
    }
    const ul = line.match(/^[-*]\s+(.*)$/);
    if (ul) {
      flushPara();
      if (!listBuffer || listBuffer.type !== "ul") { flushList(); listBuffer = { type: "ul", items: [] }; }
      listBuffer.items.push(ul[1]);
      i++; continue;
    }
    const ol = line.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      flushPara();
      if (!listBuffer || listBuffer.type !== "ol") { flushList(); listBuffer = { type: "ol", items: [] }; }
      listBuffer.items.push(ol[1]);
      i++; continue;
    }
    if (line.trim() === "") {
      flushPara(); flushList();
      i++; continue;
    }
    paraBuffer.push(line);
    i++;
  }
  flushPara(); flushList();
  return html;
}

/* ---------- 진행 상태 저장 (localStorage) ---------- */
const STORAGE_KEY = "maeil-mail-study-progress-v1";
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();
function isDone(id) { return !!progress[id]; }
function toggleDone(id) {
  if (progress[id]) delete progress[id]; else progress[id] = true;
  saveProgress(progress);
}

/* ---------- 상태 ---------- */
let currentSubject = "frontend";
let currentId = null;
let openCategories = new Set();

const sidebarEl = document.getElementById("sidebar");
const contentInner = document.getElementById("content-inner");
const searchEl = document.getElementById("search");
const progressSummaryEl = document.getElementById("progress-summary");
const toastEl = document.getElementById("toast");

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

function allItemIds(subject) {
  return Object.keys(DATA[subject].items);
}

/* 추천 학습 순서(카테고리 순서 + 카테고리 내 큐레이션 순서)를 그대로 이어붙인 코스 순서 */
function courseOrder(subject) {
  return DATA[subject].categories.flatMap(cat => cat.items);
}

function updateProgressSummary() {
  const ids = allItemIds(currentSubject);
  const done = ids.filter(isDone).length;
  progressSummaryEl.textContent = `${done} / ${ids.length} 완료`;
}

function matchesSearch(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return item.title.toLowerCase().includes(q) || item.content.toLowerCase().includes(q);
}

function renderSidebar() {
  const query = searchEl.value.trim();
  const section = DATA[currentSubject];
  sidebarEl.innerHTML = "";

  section.categories.forEach((cat, catIdx) => {
    const catItems = cat.items
      .map(id => section.items[id])
      .filter(item => item && matchesSearch(item, query));
    if (query && catItems.length === 0) return;

    const catKey = currentSubject + "-" + catIdx;
    const isOpen = query ? true : openCategories.has(catKey);

    const catEl = document.createElement("div");
    catEl.className = "category" + (isOpen ? " open" : "");

    const doneCount = cat.items.filter(id => section.items[id] && isDone(id)).length;
    const total = cat.items.length;
    const pct = total ? Math.round((doneCount / total) * 100) : 0;
    const allDone = total > 0 && doneCount === total;

    const head = document.createElement("div");
    head.className = "category-head";
    head.innerHTML = `
      <span class="cat-index">${String(catIdx + 1).padStart(2, "0")}</span>
      <span class="category-head-main">
        <span class="category-title">${escapeHtml(cat.name)}</span>
        <span class="category-progress-track"><span class="category-progress-fill" style="width:${pct}%"></span></span>
      </span>
      <span class="category-count${allDone ? " all-done" : ""}">${doneCount}/${total}</span>
      <span class="chevron">▶</span>
    `;
    head.addEventListener("click", () => {
      if (openCategories.has(catKey)) openCategories.delete(catKey);
      else openCategories.add(catKey);
      renderSidebar();
    });
    catEl.appendChild(head);

    if (cat.desc) {
      const desc = document.createElement("div");
      desc.className = "category-desc";
      desc.textContent = cat.desc;
      catEl.appendChild(desc);
    }

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "category-items";
    catItems.forEach(item => {
      const done = isDone(item.id);
      const itemEl = document.createElement("div");
      itemEl.className = "item" + (done ? " done" : "") + (item.id === currentId ? " active" : "");
      itemEl.innerHTML = `
        <input type="checkbox" ${done ? "checked" : ""} data-id="${item.id}" />
        <span class="item-title">${escapeHtml(item.title || item.id)}</span>
      `;
      itemEl.querySelector("input").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleDone(item.id);
        if (item.id === currentId) selectItem(item.id);
        else renderSidebar();
        updateProgressSummary();
      });
      itemEl.addEventListener("click", () => selectItem(item.id));
      itemsWrap.appendChild(itemEl);
    });
    catEl.appendChild(itemsWrap);
    sidebarEl.appendChild(catEl);
  });
}

function findCategory(subject, id) {
  return DATA[subject].categories.find(c => c.items.includes(id));
}

function selectItem(id) {
  currentId = id;
  const item = DATA[currentSubject].items[id];
  if (!item) return;
  const done = isDone(id);
  const category = findCategory(currentSubject, id);
  if (category) {
    const catIdx = DATA[currentSubject].categories.indexOf(category);
    openCategories.add(currentSubject + "-" + catIdx);
  }

  const order = courseOrder(currentSubject);
  const idx = order.indexOf(id);
  const prevItem = idx > 0 ? DATA[currentSubject].items[order[idx - 1]] : null;
  const nextItem = idx >= 0 && idx < order.length - 1 ? DATA[currentSubject].items[order[idx + 1]] : null;

  contentInner.innerHTML = `
    ${category ? `<div class="qa-breadcrumb">${escapeHtml(category.name)}</div>` : ""}
    <h2 class="qa-title">${escapeHtml(item.title || item.id)}</h2>
    <div class="qa-meta">
      <span class="qa-id">${item.id}</span>
      <button class="btn${done ? " is-done" : ""}" id="toggle-done-btn">${done ? "✅ 학습 완료" : "☐ 학습 완료로 표시"}</button>
    </div>
    <div class="md">${renderMarkdown(item.content)}</div>
    <div class="course-nav">
      ${prevItem ? `<button class="btn course-nav-btn prev" id="course-prev-btn"><span class="cn-label">◀ 이전</span><span class="cn-title">${escapeHtml(prevItem.title || prevItem.id)}</span></button>` : "<span></span>"}
      ${idx >= 0 ? `<span class="course-position">코스 ${idx + 1} / ${order.length}</span>` : ""}
      ${nextItem ? `<button class="btn course-nav-btn next" id="course-next-btn"><span class="cn-label">다음 ▶</span><span class="cn-title">${escapeHtml(nextItem.title || nextItem.id)}</span></button>` : "<span></span>"}
    </div>
  `;
  document.getElementById("toggle-done-btn").addEventListener("click", () => {
    toggleDone(id);
    selectItem(id);
    renderSidebar();
    updateProgressSummary();
  });
  const prevBtn = document.getElementById("course-prev-btn");
  if (prevBtn) prevBtn.addEventListener("click", () => selectItem(order[idx - 1]));
  const nextBtn = document.getElementById("course-next-btn");
  if (nextBtn) nextBtn.addEventListener("click", () => selectItem(order[idx + 1]));
  contentInner.parentElement.scrollTop = 0;
  renderSidebar();
}

function pickRandom() {
  const ids = allItemIds(currentSubject);
  if (ids.length === 0) return;
  const notDone = ids.filter(id => !isDone(id));
  const pool = notDone.length > 0 ? notDone : ids;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  selectItem(pick);
  if (notDone.length === 0) showToast("모든 문항을 학습했어요! 전체에서 무작위로 골랐습니다 🎉");
}

function startCourse() {
  const order = courseOrder(currentSubject);
  if (order.length === 0) return;
  const resumeAt = order.find(id => !isDone(id));
  if (resumeAt) {
    selectItem(resumeAt);
    showToast("추천 학습 순서로 이어서 시작합니다 📘");
  } else {
    selectItem(order[0]);
    showToast("모든 코스를 완료했어요! 처음부터 다시 시작합니다 🎉");
  }
}

document.getElementById("subject-toggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-subject]");
  if (!btn) return;
  currentSubject = btn.dataset.subject;
  document.querySelectorAll("#subject-toggle button").forEach(b => b.classList.toggle("active", b === btn));
  currentId = null;
  contentInner.innerHTML = '<div class="empty-state">왼쪽 목록에서 질문을 선택하거나, "랜덤 복습" 버튼을 눌러보세요.</div>';
  renderSidebar();
  updateProgressSummary();
});

searchEl.addEventListener("input", () => renderSidebar());
document.getElementById("random-btn").addEventListener("click", pickRandom);
document.getElementById("course-btn").addEventListener("click", startCourse);

renderSidebar();
updateProgressSummary();
</script>
</body>
</html>
