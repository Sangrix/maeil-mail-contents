되면 React는 해당 컴포넌트를 다시 렌더링해야 한다고 판단합니다. 이때 React는 내부적으로 업데이트 큐에 해당 변경 사항을 등록합니다.\n\n그다음 **Render 단계에서는 변경된 상태를 바탕으로 새로운 Virtual DOM 트리를 생성합니다.** 그후, 이전 Virtual DOM과 새 Virtual DOM을 비교하여 어떤 부분이 바뀌었는지를 분석합니다. 중요한 점은 이 시점에서는 실제 DOM에는 아무런 변경도 일어나지 않는다는 사실입니다. \n\n마지막으로 **Commit 단계에서는 이전 단계에서 분석된 변경 사항을 실제 DOM에 반영합니다.** React는 변경에 필요한 최소한의 작업을 적용하여 DOM을 업데이트합니다. 변경이 발생하지 않은 요소는 수정하지 않고 그대로 둡니다. 이 단계에서 사용자에게 화면의 변화가 실제로 나타나게 됩니다.\n\n## setState()가 호출될 때마다 매번 리렌더링이 발생하나요? 🤔\n아니요. React의 `auto batching` 기능으로 인해, 여러 개의 상태 변경이 자동으로 하나의 batch로 묶여서 처리됩니다. \n\n```jsx\nfunction App() {\n  const [a, setA] = useState(0);\n  const [b, setB] = useState(0);\n\n  const handleClick = () => {\n    setA(a + 1);\n    setB(b + 1); // 이 둘은 하나로 합쳐져서 리렌더 1번\n  };\n\n  return <button onClick={handleClick}>Click</button>;\n}\n```\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[react.dev] 렌더링 그리고 커밋](https://ko.react.dev/learn/render-and-commit)\n- [[react.dev] state 업데이트 큐](https://ko.react.dev/learn/queueing-a-series-of-state-updates)", "title": "React의 리렌더링 과정에 대해 설명해주세요."}, "fe-142": {"id": "fe-142", "content": "> 개인의 경험과 생각을 기반으로 대답해야 하는 질문입니다. 아래 답변은 참고용으로만 읽어주세요. 🙂\n\n먼저, 가장 중요한 것은 **지연이 실제로 발생하고 있다는 객관적인 수치를 확보한 뒤, 이를 기반으로 백엔드 개발자와 커뮤니케이션하는 것**입니다. 예를 들어, DevTools의 Network 탭에서 API 응답 시간 데이터를 수집하거나, Sentry 또는 Datadog과 같은 모니터링 도구를 통해 성능 데이터를 정리하여 공유할 수 있습니다. 이렇게 수치 기반으로 소통하여 단순히 “느리다”는 피드백이 아니라 “특정 API가 평균 3초 이상 소요된다”는 식의 구체적인 요청을 전달하여 백엔드 API의 성능 개선이 필요하다는 점을 설득할 것입니다.\n\n하지만 현실적으로 백엔드 API의 성능이 단기간에 개선되기 어려운 상황도 존재합니다. 이럴 경우, 프론트엔드 단에서 사용성을 유지할 수 있는 다양한 전략을 적용할 것입니다.\n\n가장 기본적인 대응은 **로딩 상태를 사용자에게 명확하게 전달하는 것**입니다. 예를 들어, 로딩 스피너나 Skeleton UI를 사용하여 시스템이 응답 중임을 사용자에게 알려줌으로써 ‘멈춘 것 같다’는 인상을 방지하고 체감 대기 시간을 줄일 것입니다.\n\n또한, **prefetch 전략**을 고려해볼 것입니다. 사용자가 특정 페이지나 기능을 요청하기 전에 필요한 데이터를 미리 받아놓아 응답 지연 시간을 최대한 줄이기 위해 노력할 것입니다. 예를 들어, 사용자가 마우스를 올렸을 때 해당 페이지 데이터를 백그라운드에서 가져오거나, 이전 페이지에서 다음 페이지에 필요한 데이터를 미리 요청해두는 방식으로 prefetch를 수행할 수 있습니다.\n\n이와 함께, **이미 받아온 API 응답을 캐싱하여 재사용하는 전략**도 고려할 수 있습니다. 예를 들어, React Query나 SWR과 같은 라이브러리를 사용하면 API 응답을 캐시하여 재사용할 수 있습니다. 이를 통해 동일한 요청을 수 초 내에 다시 수행할 경우에 서버에 재요청하지 않고 캐시된 데이터를 빠르게 제공할 수 있습니다.", "title": "백엔드 API의 응답이 느려 사용성에 악영향이 발생하는 상황에서 어떻게 대응하실 건가요?"}, "fe-143": {"id": "fe-143", "content": "> 개인의 경험과 생각을 기반으로 대답해야 하는 질문입니다. 아래 답변은 참고용으로만 읽어주세요. 🙂\n\n외부 라이브러리가 간혹 예상치 못한 버그나 비정상적인 동작으로 인해 전체 기능에 영향을 주는 경우가 있습니다. 이럴 때 단순히 라이브러리를 비난하기보다는, 문제의 **원인을 명확하게 파악하고, 영향도를 분석한 뒤, 가능한 범위 내에서 안정적인 대응 전략을 택하는 것이 중요합니다.**\n\n먼저 가장 우선적으로 해야 할 일은 **문제가 발생한 원인을 확실히 좁히는 작업**입니다. 예를 들어, 최근에 라이브러리 버전이 변경되었는지 확인하거나, 특정 컴포넌트에서만 문제가 발생하는지 등을 확인해 문제 범위를 좁힙니다. 이 과정에서 Git 히스토리나 GitHub 이슈를 참고하면 도움이 됩니다. 이를 통해 실제로 버그가 해당 라이브러리에서 기인한 것인지, 아니면 잘못된 사용 방식 때문인지를 명확하게 구분합니다.\n\n다음으로는 **해당 문제가 사용자에게 어떤 영향을 주는지 파악하고, 임시적인 우회 방법이 있는지를 검토**합니다. 예를 들어, CSS 레이아웃이 깨지는 버그라면 해당 스타일만 덮어씌우는 방식으로 임시 조치가 가능할 수 있습니다. 기능 자체가 완전히 작동하지 않는 경우에는 동일한 목적의 다른 라이브러리로 일시적으로 대체하거나, 문제 되는 부분만 직접 구현하는 방법도 고려할 수 있습니다. 이런 대응 방식은 특히 배포 일정이 임박했을 때 적합한 해결책입니다.\n\n만약 문제 해결에 시간이 오래 걸릴 것으로 판단되면, **기획자, PO, QA와 같은 이해관계자에게 상황을 공유하고, 예상되는 영향과 대응 계획을 명확히 설명**해야 합니다. 이를 통해 원래의 프로젝트 계획에 예상치 못한 차질이 발생하지 않게 예방합니다. 또, 동료 개발자들에게 이슈를 공유하여 더 나은 해결 방법을 함께 도출할 수도 있습니다.\n\n장기적인 관점에서는 **라이브러리 측에 버그 리포트를 제출하거나, 필요하다면 PR을 통해 직접 기여하는 방식**도 있습니다. 혹은, 긴급한 상황에서는 포크하여 수정한 뒤 사용할 수도 있습니다. 단, 이런 경우에는 추후 되돌리기 위해 변경 사항을 잘 문서화해두는 것이 중요합니다.\n", "title": "예상치 못하게 외부 라이브러리의 버그로 인해 기능에 문제가 생겼다면, 어떤 절차로 해결하실 건가요?"}, "fe-144": {"id": "fe-144", "content": "> 아래의 코드에서 최초 마운트 및 버튼 클릭 시, console.log가 어떤 순서로 출력되는지 설명해주세요. 🙂\n\n```jsx\nimport { useState, useEffect } from 'react';\n\nfunction Parent() {\n  const [count, setCount] = useState(0);\n\n  console.log('1');\n\n  useEffect(() => {\n    console.log('2');\n    return () => {\n      console.log('3');\n    };\n  }, [count]);\n\n  return (\n    <div>\n      <p>카운트: {count}</p>\n      <button onClick={() => setCount((prev) => prev + 1)}>+1</button>\n      <Child value={count} />\n    </div>\n  );\n}\n\nfunction Child({ value }) {\n  console.log('4');\n\n  useEffect(() => {\n    console.log('5');\n    return () => {\n      console.log('6');\n    };\n  }, []);\n\n  return <p>자식 값: {value}</p>;\n}\n\nexport default Parent;\n```\n\n<details>\n  <summary>답변 보기</summary>\n<br />\n  \n## 최초 마운트 시\n`1 -> 4 -> 5 -> 2`\n\n1.\t`Parent` 함수가 실행되면서 `\"1\"`이 출력됩니다.\n2. `Parent` 실행 도중 내부의 `Child` 함수가 호출되므로 `\"4\"`가 출력됩니다.\n3.\t이후, 마운트 후 실행되는 `useEffect` 콜백들이 실행됩니다. 먼저 `Child`의 `useEffect` 콜백이 실행되어 `\"5\"`가 출력됩니다.\n4.\t이어서 `Parent`의 `useEffect` 콜백이 실행되어 `\"2\"`가 출력됩니다\n\n\n## 버튼 클릭 시\n`1 -> 4 -> 3 -> 2`\n\n사용자가 버튼을 클릭하면 `setCount`를 통해 `count` 상태가 변경되고, `Parent` 컴포넌트가 다시 렌더링됩니다. 이때 `console.log`의 흐름은 다음과 같습니다.\n\n1. `Parent` 함수가 다시 실행되어 `\"1\"`이 출력됩니다.\n2. `Parent` 내부 `Child` 함수도 다시 실행되어 `\"4\"`가 출력됩니다.\n3. 그후 `Parent`의 `useEffect` 콜백이 실행되기 전에 cleanup 함수가 먼저 호출되어 `\"3\"`이 출력됩니다.\n4. 그런 다음 Parent의 `useEffect` 콜백이 다시 실행되며 `\"2\"`가 출력됩니다.\n\n`Child`의 `useEffect`는 빈 배열을 의존성으로 가지고 있으므로 처음 마운트될 때만 실행되고, 리렌더시에는 실행되지 않습니다. 따라서 `\"5\"`이나 `\"6\"`은 출력되지 않습니다.\n\n</details>", "title": "다음 리액트 코드의 실행 순서에 대해 설명해주세요."}, "fe-145": {"id": "fe-145", "content": "쿠키와 세션은 **클라이언트와 서버 간의 상태를 유지하기 위해 사용하는 대표적인 방식**들입니다. 웹은 기본적으로 상태를 저장하지 않는 Stateless한 구조이기 때문에, 사용자의 로그인 정보나 장바구니와 같은 클라이언트 정보를 유지하려면 별도의 상태 관리 방식이 필요합니다. 이때 주로 활용되는 방식이 쿠키와 세션입니다.\n\n먼저, **쿠키는 클라이언트 측에 저장되는 데이터입니다.** 서버가 클라이언트에게 응답할 때 `Set-Cookie` 헤더를 통해 데이터를 전달하고, 이후 클라이언트는 요청 시 해당 쿠키를 자동으로 포함하여 서버로 전송하게 됩니다. 쿠키는 브라우저에 저장되기 때문에 서버에서는 별도의 저장 공간을 차지하지 않으며, 지속적인 상태 유지가 가능합니다. 유효 기간을 설정하여 자동 만료되도록 할 수도 있습니다. 쿠키는 클라이언트 측에 상태를 저장하기 때문에 서버는 세션처럼 별도의 저장소를 유지하지 않아도 된다는 장점이 있습니다. 하지만 탈취될 경우 쿠키에 포함된 개인정보가 노출되는 보안 상 단점이 존재합니다.\n\n반면 **세션은 서버 측에 저장되는 데이터입니다.** 사용자가 서버에 처음 인증을 수행할 때 고유한 세션 ID가 생성되고, 이 ID가 클라이언트에 전달됩니다. 이후 클라이언트는 이 세션 ID를 서버로 전송하며, 서버는 해당 ID를 통해 사용자 상태 정보를 조회합니다. 세션은 서버에 저장되기 때문에 보안 면에서 쿠키보다 안전하지만, 서버 자원을 차지하고 확장에 불리하다는 단점이 있습니다.\n\n## 쿠키 대신 LocalStorage나 SessionStorage를 사용해도 되지 않나요?\n말씀하신대로 LocalStorage와 SessionStorage는 모두 브라우저에 데이터를 저장하는 방식으로, 쿠키와 유사한 점이 있습니다.\n\n하지만 자동으로 서버에 전송되지 않는다는 차이점이 있습니다. 또한, 두 저장소는 자바스크립트를 통해 접근이 가능하므로 XSS에 더욱 취약할 수 있습니다. 반면, 쿠키는 매 요청에 자동으로 포함되며 `HttpOnly` 설정을 통해 XSS를 예방할 수 있습니다. 따라서 인증 상태를 관리할 때에는 쿠키를 사용하는 경우가 많습니다.\n\n## 로그인 구현 시 세션 방식은 주로 어떤 경우에 채택하나요?\n보안의 중요도가 높은 서비스에서 많이 사용합니다. 세션 ID는 서버에 저장되고 클라이언트에는 참조만 전달되어 토큰 기반 방식보다 탈취 시 위험성이 낮고, 대응에도 용이합니다.\n\n또한, 원격 로그아웃 기능이 필요한 경우에도 사용됩니다. 예를 들어, 동시 로그인 가능 기기 수를 제한해야 하거나, 강제 로그아웃을 구현해야 하는 경우가 있습니다. 이처럼 서버 측에서 사용자별 로그인 상태를 관리해야 하는 경우 유용하게 활용될 수 있습니다. \n\n다만, 서버 자원을 많이 사용하고 분산 시스템에서는 세션 동기화가 필요하다는 단점이 있으므로 트레이드 오프를 고려하여 선택해야 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[얄팍한 코딩사전] 쿠키, 세션, 캐시가 뭔가요?](https://www.youtube.com/watch?v=OpoVuwxGRDI)", "title": "쿠키와 세션에 대해 설명해주세요."}, "fe-146": {"id": "fe-146", "content": "스택을 활용하면 브라우저의 뒤로가기/앞으로가기 기능을 효율적으로 구현할 수 있습니다. 이를 위해 다음과 같은 두 가지 스택이 필요합니다.\n\n* **backStack (뒤로가기 스택)**: 사용자가 방문한 페이지들이 차례대로 쌓이며, 가장 위에 있는(top) 페이지가 현재 페이지에 해당합니다. 이 스택은 뒤로가기 기능을 담당합니다.\n* **forwardStack (앞으로가기 스택)**: 뒤로가기를 한 뒤 다시 앞으로 이동할 수 있도록 이전에 방문했던 페이지들을 보관합니다.\n\n이 두 스택을 활용한 동작 흐름은 다음과 같습니다.\n\n### 1. 새로운 페이지 방문 시\n* 현재 페이지를 `backStack`에 push합니다.\n* 이전의 forward 경로는 더 이상 유효하지 않으므로 `forwardStack`은 초기화됩니다.\n\n### 2. 뒤로가기 버튼 클릭 시\n* 현재 페이지를 `backStack`에서 pop하여 `forwardStack`에 push합니다.\n* 이때, `backStack`의 top에 위치하게 된 페이지가 새로운 현재 페이지가 됩니다.\n\n### 3. 앞으로가기 버튼 클릭 시\n* `forwardStack`에서 페이지를 pop하여 `backStack`에 다시 push합니다.\n* 이때, `backStack`의 top에 위치하게 된 페이지가 새로운 현재 페이지가 됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[노마드코더] 개발자라면 무조건 알아야하는 자료구조!](https://www.youtube.com/watch?v=Nk_dGScimz8)", "title": "스택을 활용하여 브라우저의 뒤로가기/앞으로가기 기능을 구현하는 방법을 설명해주세요."}, "fe-147": {"id": "fe-147", "content": "React의 Error Boundary는 비동기 코드에서 발생한 오류를 잡을 수 없습니다. 그 이유는 **비동기 에러는 렌더링 시점의 콜스택이 모두 비워진 후에 발생하기 때문**입니다.\n\nReact는 컴포넌트를 렌더링할 때 하나의 연속된 콜스택 흐름 안에서 작업을 처리하며, Error Boundary도 이 렌더링 흐름 중에 실행됩니다. 따라서 Error Boundary는 동기적인 렌더링 과정 중에 발생한 오류를 감지할 수 있습니다.\n\n하지만 `Promise`, `setTimeout`과 같은 비동기 작업은 렌더링이 끝난 후, 즉 렌더링 시점의 콜스택이 모두 비워진 후에 수행됩니다. 따라서 Error Boundary는 해당 시점에 발생하는 오류를 잡을 수 없습니다.\n\n이러한 점 때문에, 비동기 에러는 별도로 직접 처리해야 합니다. 예를 들어, 비동기 함수 내부에서 `try-catch`로 감싸서 에러를 핸들링할 수 있습니다. 또는, `setState`를 이용해 에러 상태를 관리하거나, 이를 활용해 동기 에러를 다시 던져 에러 바운더리가 감지하도록 만들 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[행복한 시지프] ErrorBoundary 가 포착할 수 없는 에러와 그 이론적 원리 분석](https://happysisyphe.tistory.com/66)\n- [[React] 에러 경계의 소개](https://ko.legacy.reactjs.org/docs/error-boundaries.html#introducing-error-boundaries)", "title": "React의 Error Boundary는 왜 비동기 에러를 잡지 못하나요?"}, "fe-148": {"id": "fe-148", "content": "Yarn과 Yarn Berry는 모두 패키지 매니저이지만, 큰 차이점이 존재합니다. 바로, 버전과 구조의 차이입니다. Yarn은 version 1.x 시리즈를 의미하며, npm과 유사한 구조를 가집니다. Yarn Berry는 version 2.x 이상을 의미하며, 완전히 새롭게 재설계된 버전입니다.\n\n## Yarn과 Yarn Berry는 어떤 점에서 다른가요? 🤔\n\n가장 큰 부분은 **Plug'n'Play(PnP) 방식**이라고 말씀드릴 수 있습니다.\n\nYarn은 `node_modules`를 통해 의존성을 관리합니다. 반면, **Yarn Berry는 PnP 방식을 기본으로 채택**하여, `node_modules` 없이 `.pnp.cjs` 파일을 따로 생성하여 의존성을 관리합니다. 이로 인해 설치 속도가 빠르고 디스크 공간을 절약할 수 있습니다.\n\n또한 **Zero-Install 지원**한다는 점에서 다릅니다. Yarn Berry는 Zero-Install을 지원하여, 의존성을 저장소에 커밋할 수 있습니다. 이를 통해 CI/CD에서 별도의 설치 과정 없이 바로 코드를 실행할 수 있습니다.\n\n## CI/CD에서 별도의 설치 과정 없이 바로 코드를 실행할 수 있다고 하셨는데 어떻게 가능한 건가요? 🤔\n\nYarn Berry는 모든 의존성을 `.yarn/cache` 폴더에 압축된 형태로 저장합니다. 이 압축 파일들을 Git 저장소에 직접 커밋합니다. `.pnp.cjs` 파일도 함께 커밋되어 의존성 매핑 정보를 포함합니다. 그리하여 CI/CD 파이프라인에서의 동작에서 yarn install의 과정이 생략 될 수 있습니다.\n\n### 예시\n```yaml\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v2\n      - uses: actions/setup-node@v2\n      - run: yarn test  # yarn install 없이 바로 실행 가능\n\n# 기존 방식\n- run: yarn install  #이 단계가 필요\n- run: yarn test\n```\n\n그리하여 CI/CD에서 yarn install 단계가 생략되어 빌드 시간이 크게 단축되고, 모든 개발자와 CI 환경에서 정확히 동일한 의존성을 사용할 수 있습니다.\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[toss tech] 토스에서의 Yarn Berry](https://toss.tech/article/node-modules-and-yarn-berry)\n", "title": "Yarn과 Yarn Berry의 차이점에 대해서 설명해주세요."}, "fe-149": {"id": "fe-149", "content": "Next.js의 **미들웨어는 요청이 완료되기 전에 코드를 실행할 수 있게 해주는 기능**입니다. 미들웨어는 `middleware.ts` 파일로 프로젝트 루트나 `src` 디렉토리에 위치합니다. 서버 사이드에서 실행되며, 요청이 라우트 핸들러나 페이지에 도달하기 전에 동작합니다.\n\n사용 예시를 들자면, 인증 및 권한 검사나 리다이렉션 처리, 요청/응답 헤더 수정 등 입니다.\n\nEdge Runtime에서 실행되어 매우 빠른 성능을 제공하며, 그렇기에 Node.js API의 일부만 사용 가능합니다.\n\n\n## Edge Runtime이란 무엇인가요? 🤔\n\n**Edge Runtime은 서버리스 환경에서 실행되는 경량화된 JavaScript 런타임**입니다. CDN의 엣지 노드에서 코드를 실행하여 사용자와 가장 가까운 위치에서 빠른 응답을 제공합니다.\n\n전 세계 여러 지역에 분산된 엣지 서버에서 코드를 실행하기에, 콜드 스타트가 거의 없고 매우 빠른 응답 시간을 가지고 있습니다.\n\n그렇기에 fs나 워커 스레드 같은 기능들은 사용이 불가능하며, `fetch`나 `URL`, `URLSearchParams` 같은 기능들이 사용 가능합니다. \n\n## 실제로 Middleware를 사용하신 적이 있나요? 🤔\n\n실제 프로젝트에서는 주로 인증 검사와 리다이렉션 로직을 미들웨어로 구현했습니다.\n\n예를 들어, 로그인하지 않은 사용자가 대시보드에 접근하려 할 때 로그인 페이지로 리다이렉트시킴으로써 서버단에서 처리하며 보안성을 높였습니다.\n\n\n## 📚 추가 학습 자료를 공유합니다.\n\n- [한글 번역 공식 문서](https://nextjs-ko.org/docs/app/building-your-application/routing/middleware)", "title": "Next.js Middleware에 대해서 설명해주세요."}, "fe-15": {"id": "fe-15", "content": "자바스크립트 함수에는 여러가지 특징들이 있습니다.\n\n첫번째 특징은 자바스크립트 함수는 **일급 객체**라는 점입니다.  \n자바스크립트에서 함수는 값처럼 취급될 수 있으며, 변수에 할당하거나, 다른 함수의 인자로 전달하거나, 함수의 반환값으로 사용할 수 있습니다.\n\n```js\nconst sayHello = function() { return 'Hello'; };\nconsole.log(sayHello()); // 'Hello'\n\nconst executeFunction = function(fn) {\n  return fn();\n};\nconsole.log(executeFunction(sayHello)); // 'Hello'\n```\n이를 통해 매우 유연하게 코드를 작성할 수 있으며, 고차 함수를 포함한 다양한 패턴을 구현할 수 있습니다.\n\n\n두번째 특징은 **익명 함수**와 **함수 표현식**입니다.  \n자바스크립트에서는 **이름 없는 함수, 즉 익명 함수**를 정의할 수 있습니다. 익명 함수는 함수 표현식에서 주로 사용되며, 필요에 따라 함수에 이름을 지정하지 않아도 됩니다.\n\n```js\nconst add = function(a, b) {\n  return a + b;\n};\nconsole.log(add(2, 3)); // 5\n```\n\n세번째 특징은 **호이스팅**입니다.  \n함수 선언식을 통해 선언한 함수는 코드가 실행되기 전에 호이스팅되어, 함수 선언 이전에 호출할 수 있습니다. 반면, 함수 표현식은 변수에 할당된 후에 사용할 수 있습니다.\n\n```js\nconsole.log(declaredFunction()); // 'Declared Function'\nfunction declaredFunction() {\n  return 'Declared Function';\n}\n\n// 함수 표현식은 할당 후에만 사용할 수 있음\nconst expressedFunction = function() {\n  return 'Expressed Function';\n};\nconsole.log(expressedFunction()); // 'Expressed Function'\n```\n\n네번째는 **클로저**입니다.  \n자바스크립트 함수로는 클로저를 구현할 수 있습니다. 클로저는 함수가 **자신이 선언된 환경(스코프)** 을 기억하고, 해당 환경에 접근할 수 있는 기능(혹은 특징)입니다. 이를 통해 함수는 자신이 선언된 당시 스코프 내의 변수를 참조할 수 있습니다.\n\n```js\nfunction outer() {\n  const outerVar = 'I am outer!';\n  \n  return function inner() {\n    return outerVar; // 외부 변수에 접근 가능\n  };\n}\nconst innerFunction = outer();\nconsole.log(innerFunction()); // 'I am outer!'\n```\n\n\n다음으로는 **고차 함수**입니다.  \n자바스크립트에서는 함수가 일급 객체이기 때문에, 고차 함수, 즉 **다른 함수를 인자로 받거나 반환하는 함수**를 정의할 수 있습니다. 이는 함수형 프로그래밍 패턴을 가능하게 합니다.\n\n```js\nfunction multiplyBy(factor) {\n  return function(num) {\n    return num * factor;\n  };\n}\nconst double = multiplyBy(2);\nconsole.log(double(5)); // 10\n```\n\n마지막으로 **화살표 함수**입니다.  \n화살표 함수는 더 간결한 문법을 제공하고, 특히 this 바인딩에서 기존 함수와 다른 동작을 합니다.\n화살표 함수는 선언된 위치의 this 값을 유지하므로, 일반 함수와 달리 별도로 this를 바인딩할 필요가 없습니다.\n\n```js\nconst obj = {\n  value: 42,\n  method: function() {\n    setTimeout(() => {\n      console.log(this.value); // 42 (Arrow 함수는 obj의 this를 유지)\n    }, 1000);\n  }\n};\nobj.method();\n```\n\n", "title": "자바스크립트 함수에 대해서 아는대로 설명해주세요."}, "fe-150": {"id": "fe-150", "content": "크게 보면 **Performance, Lighthouse, Network, Memory, 그리고 Coverage 탭**을 중점적으로 살펴볼 수 있습니다.\n\n우선, **Performance 탭**에서는 First Contentful Paint (FCP), Largest Contentful Paint (LCP), Time to Interactive (TTI), Total Blocking Time (TBT), 그리고 Cumulative Layout Shift (CLS)와 같은 지표를 확인할 수 있습니다.\n\n이 지표들은 각각 사용자가 첫 콘텐츠를 볼 수 있는 시점, 메인 콘텐츠가 로딩 완료되는 시점, 그리고 페이지와 정상적으로 상호작용할 수 있게 되는 시점 등을 보여줍니다. 이러한 지표들은 사용자 경험 품질을 정량적으로 진단하는 데 매우 중요하므로, 수치에 이상이 있을 경우 개선해야 합니다.\n\n또한, **Lighthouse 탭**을 활용해서 앱을 전체적으로 스캔해볼 수 있습니다. 여기서는 Performance, Accessibility, Best Practices, SEO 영역별로 종합 점수를 확인하고, 특히 퍼포먼스 점수 하락 요인을 분석해서 개선할 포인트를 찾습니다.\n\n다음으로 **Network 탭**에서는, 각 리소스의 다운로드 크기나 Time to First Byte(TTFB) 시간을 중점적으로 체크합니다. 이를 통해 서버 응답 지연이나, 비효율적으로 무거운 리소스가 있는지 확인할 수 있습니다.\n\n추가로 앱의 장기 사용성까지 고려한다면, **Memory 탭**에서 Heap Snapshot을 찍어 메모리 누수가 있는지 분석하고, 불필요하게 유지되는 객체(특히 'Detached DOM Tree')가 남아있는지를 확인할 수 있습니다.\n\n마지막으로 **Coverage 탭**을 이용해, 현재 불필요하게 로드되고 사용되지 않는 JavaScript나 CSS가 많은 경우를 찾아서, 코드 스플리팅이나 번들 최적화를 진행해볼 수 있습니다.\n\n## FCP는 몇 초 이하면 양호하다고 판단하나요? 🤔\n\nFCP는 사용자가 **첫 번째 콘텐츠를 볼 수 있는 시점**을 의미합니다. Google Web Vitals 기준으로는 **1.8초 이하를 'Good'으로 평가하고 있습니다.**\n\n1.8초를 넘기기 시작하면 사용자 입장에서 '느리다'고 체감하기 시작하고,\n특히 3초를 초과하면 이탈률이 급격히 올라가는 경향이 있기 때문에 항상 1.8초를 목표로 최적화를 진행하고 있습니다.\n\n## LCP가 느릴 때 개선 방법에 대해서 알고 계신가요? 🤔\n\nLCP는 **페이지 내 가장 큰 요소가 렌더링 완료되는 시점**을 의미합니다. 해당 수치가 느릴 경우 주로 다음 방법으로 최적화를 진행해볼 수 있습니다.\n\n첫번째로 **크리티컬 렌더링 리소스 최적화**입니다. LCP 요소(대부분 메인 이미지나 Hero Text)가 늦게 내려오는 경우가 많기 때문에, 해당 리소스를 서버에서 우선순위를 높게 주거나 `preload`를 적용합니다.\n\n두번째로는 **이미지 최적화**입니다. 이미지를 WebP 포맷으로 변환하거나, 이미지 사이즈 자체를 줄이는 방법을 사용합니다.\n\n마지막으로 **Lazy Loading 적용**이 있습니다. LCP에 해당하지 않는 나머지 리소스는 `loading=\"lazy\"`를 적용해서 불필요한 리소스 로딩을 막습니다.\n\n\n## 📚 추가 학습자료를 공유합니다.\n\n- [[web.dev] 최대 콘텐츠 렌더링 시간 최적화](https://web.dev/articles/optimize-lcp?hl=ko)", "title": "퍼포먼스를 분석할 때 Chrome DevTools에서 어떤 지표를 체크해야 하나요?"}, "fe-16": {"id": "fe-16", "content": "먼저, 두 속성 모두 스크립트를 비동기적으로 로드한다는 공통점이 있습니다. 하지만 실행 시점에서 중요한 차이가 있습니다.\n\n### async 속성\n`async` 속성에는 다음과 같은 특징들이 존재합니다.\n1. 스크립트를 비동기적으로 다운로드합니다.\n2. 다운로드가 완료되면 즉시 실행됩니다.\n3. HTML 파싱과 병렬로 진행되지만, 스크립트 실행 시 HTML 파싱이 잠시 중단됩니다.\n4. 여러 async 스크립트가 있을 경우, 다운로드가 완료되는 순서대로 실행됩니다.\n\n### defer 속성\n`defer` 속성에는 다음과 같은 특징들이 존재합니다.\n1. 스크립트를 비동기적으로 다운로드합니다.\n2. HTML 문서 파싱이 완전히 끝난 후에 실행됩니다.\n3. DOMContentLoaded 이벤트 발생 직전에 실행됩니다.\n4. 여러 defer 스크립트가 있을 경우, HTML에 작성된 순서대로 실행됩니다.\n\n따라서, 실행 순서가 중요한 스크립트나 메인 어플리케이션의 로직을 담고 있는 스크립트의 경우 `defer`를 사용하고, 독립적으로 실행되는 스크립트(ex. Google Analytics)의 경우  `async`를 사용하는 것이 적절합니다.\n\n이러한 차이를 이해하고 적절히 활용하면 웹 페이지의 로딩 성능을 최적화하는 데 큰 도움이 됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[zorefcode] #shorts Async vs Defer](https://www.youtube.com/shorts/3peCiMg332o)\n- [[JAVASCRIPT.INFO] defer, async 스크립트](https://ko.javascript.info/script-async-defer)", "title": "script 태그에서 async와 defer의 차이점에 대해서 설명해주세요."}, "fe-17": {"id": "fe-17", "content": "**CommonJS**와 **ES Module(ESM)** 은 자바스크립트에서 모듈을 관리하고 불러오는 두 가지 주요 방식입니다.\n\n먼저 **CommonJS**는 주로 Node.js 환경에서 사용되며, 모듈을 동기적으로 불러옵니다. 즉, 모듈이 로드될 때까지 다음 코드가 실행되지 않는 방식입니다. CommonJS는 `require` 키워드를 사용해 모듈을 가져오고, `module.exports`를 통해 내보냅니다. 이 방식은 주로 서버측에서 사용 됐지만, 클라이언트 환경에서도 번들러를 통해 사용할 수 있습니다.\n\n반면, **ES Module**은 자바스크립트의 공식 표준 모듈 시스템으로, ECMAScript 2015(ES6)부터 도입되었습니다. ESM은 브라우저와 Node.js 환경에서 모두 사용할 수 있으며, 모듈을 비동기적으로 로드합니다. 모듈을 가져올 때는 `import` 키워드를 사용하고, 내보낼 때는 `export`를 사용합니다. 또한, ESM은 정적 분석이 가능해, 트리 쉐이킹과 같은 최적화 작업에도 유리합니다.\n\n정리하자면, **CommonJS**는 주로 동기적이고 서버 측에서 많이 사용되며,**ESM**은 비동기적이고 브라우저와 서버 모두에서 사용할 수 있다는 차이점이 있습니다.\n\n하지만 Node.js에서도 최근에는 ESM 사용이 증가하고 있는 추세입니다. Node.js는 버전 12부터 네이티브로 ESM을 지원하기 시작했으며, 브라우저와 서버 간의 모듈 호환성을 위해 풀스택 애플리케이션 개발에서도 ESM이 많이 사용되고 있습니다. 특히 ESM은 비동기적 로딩과 트리 쉐이킹 같은 최적화 작업에 유리하다는 점에서 점점 더 선호되고 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[F-Lab] CommonJS와 ES Module의 차이점과 선택 기준](https://f-lab.kr/insight/commonjs-vs-esmodule-20240523?gad_source=1&gclid=Cj0KCQiAs5i8BhDmARIsAGE4xHw456mxRuIRHB_nInt-AwSkh_kP1qQULB2miyZ8AqenmZQQr8IwcmIaAnrIEALw_wcB)\n- [[yceffort] commonjs란 무엇인가?](https://yceffort.kr/2023/05/what-is-commonjs)", "title": "CommonJS와 ES Module의 차이점에 대해서 설명해주세요."}, "fe-18": {"id": "fe-18", "content": "이벤트 전파는 DOM에서 이벤트가 발생했을 때, 그 이벤트가 어떤 방식으로 전파되는지를 설명하는 개념입니다. 이벤트 전파는 크게 세 단계로 나뉘는데, 캡처링(Capturing), 타겟(Target), 그리고 **버블링(Bubbling)** 입니다.\n\n첫번째로 **캡처링 단계**에 대해서 설명 드리겠습니다.\n이벤트가 DOM 트리의 최상위 요소(`document`)에서 시작하여, 이벤트가 발생한 요소(타깃 요소)로 향해 내려가는 단계입니다. 이 과정에서 상위 요소들에 이벤트 리스너가 있으면 그 순서대로 실행될 수 있습니다.\n\n두번째로는 **타겟 단계**입니다. 이벤트가 실제로 발생한 타겟 요소에 도달하는 단계입니다. 타겟 요소에 등록된 이벤트 리스너가 이 시점에 실행됩니다.\n\n마지막으로 **버블링 단계**입니다. 타겟 요소에서 이벤트가 발생한 후, 다시 DOM 트리의 상위 요소들로 이벤트가 전파되어 올라가는 단계입니다. 이 과정에서 상위 요소들에 등록된 이벤트 리스너들이 실행될 수 있습니다.\n\n기본적으로 대부분의 이벤트는 버블링을 통해 전파되지만, `addEventListener()`의 세 번째 인자로 `{ capture: true }`를 전달하면, 캡처링 단계에서도 이벤트를 처리할 수 있습니다.\n\n이벤트 전파는 웹 페이지에서 요소 간의 상호작용을 제어하는 데 중요한 역할을 합니다. 다만 이러한 이벤트 전파가 정상 동작에 방해가 되는 경우, `event.stopPropagation()` 메서드를 사용하여 특정 단계에서 이벤트의 전파를 중단할 수 있습니다.\n\n정리해서 말씀 드려보자면, 이벤트 전파는 DOM 구조에서 이벤트가 어떻게 상위와 하위 요소 간에 전달되는지를 정의하는 메커니즘이며, 이를 통해 복잡한 사용자 상호작용을 효율적으로 관리할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[JAVASCRIPT.INFO] 버블링과 캡처링](https://ko.javascript.info/bubbling-and-capturing)\n- [[Inpa Dev] 한눈에 이해하는 이벤트 흐름 제어](https://inpa.tistory.com/entry/JS-%F0%9F%93%9A-%EB%B2%84%EB%B8%94%EB%A7%81-%EC%BA%A1%EC%B3%90%EB%A7%81)", "title": "이벤트 전파(event propagation)에 대해서 설명해주세요."}, "fe-19": {"id": "fe-19", "content": "웹 애플리케이션 성능 최적화에는 여러 가지 방법이 있습니다.\n\n우선, **코드 스플리팅을 통해 자바스크립트 파일을 필요한 부분만 나누어 로드**할 수 있습니다. 이렇게 하면 모든 코드를 한꺼번에 불러오는 대신, 사용자가 즉시 필요한 부분만 먼저 로드하여 페이지 로딩 속도를 개선할 수 있습니다.\n\n또한, **레이지 로딩 기법을 사용하여, 페이지에 있는 이미지나 비디오 같은 무거운 리소스를 사용자가 실제로 볼 때만 로드하는 방식**을 적용할 수 있습니다. 예를 들어, 사용자가 페이지를 스크롤할 때 하단의 이미지가 필요해지면 그때 비로소 이미지를 불러오는 것입니다. 이렇게 하면 불필요한 리소스 로딩을 줄여 성능을 높일 수 있습니다.\n\n이미지에 대해서는 **파일의 물리적인 크기를 알맞게 줄이거나 WebP와 같은 가벼운 포맷으로 변환하는 방법**이 있습니다. 이를 통해 불필요한 용량을 줄이고 로딩 속도를 향상시킬 수 있습니다.\n\n또한, **캐싱을 활용하면, 한 번 로딩된 리소스를 다시 다운로드하지 않고 브라우저가 캐시된 데이터를 재사용하여 성능을 크게 향상**시킬 수 있습니다. 적절한 캐시 정책을 설정하는 것이 매우 중요합니다.\n\n자바스크립트 로딩 시에는 **비동기 로딩(async)** 이나 **지연 로딩(defer)** 을 적용하여 자바스크립트가 DOM을 차단하지 않도록 할 수 있습니다. 이를 통해 페이지가 로딩되는 동안에도 자바스크립트 파일을 병렬로 불러오거나, 적절한 타이밍에 로드하게 되어 사용자 경험이 더 쾌적해질 수 있습니다.", "title": "웹 애플리케이션의 성능을 최적화할 수 있는 방법들에 대해서 아는대로 설명해주세요."}, "fe-2": {"id": "fe-2", "content": "`reflow`와 `repaint`는 웹 페이지가 렌더링 되는 과정에서 발생하는 중요한 작업들입니다.\n\n먼저, reflow에 관해 설명하겠습니다.\n`reflow`는 **브라우저가 페이지의 레이아웃을 다시 계산하는 과정**을 말합니다.\nDOM의 구조가 변경되거나 CSS 스타일이 변경되면, 브라우저는 각 요소가 화면에 어떻게 배치될지 다시 계산해야 합니다.\n이 과정은 모든 자식 요소와 관련된 부모 요소까지 영향을 주기 때문에 비용이 많이 드는 작업입니다.\n예를 들어, CSS에서 요소의 `width`나 `height` 속성을 변경하면, 브라우저는 해당 요소뿐만 아니라 연관된 모든 요소의 배치를 다시 계산해야 합니다. \n\n반면에, repaint는 **요소의 모양이나 스타일이 변경될 때 발생**합니다.\n요소의 레이아웃은 그대로이고, 색상이나 배경 등의 스타일만 변경되는 경우를 말합니다. `background-color` 같은 속성을 예로 들 수 있습니다.\n이 경우 브라우저는 요소의 모양만 다시 그리면 되기 때문에 reflow보다는 비용이 덜 들지만, 여전히 성능에 영향을 줄 수 있습니다.\n\nreflow는 `레이아웃을 다시 계산하는 과정`이고, repaint는 그 `계산 결과를 화면에 다시 그리는 과정`이라고 할 수 있습니다.\n이 둘을 잘 이해하고 관리한다면 성능 최적화에 큰 도움이 됩니다.\n\n## 둘을 잘 관리하는 것이 성능 최적화에 도움이 된다고 하셨는데, 최적화 방법에는 무엇이 있을까요? 🤔\n\n크게 3가지 최적화 방법에 대해 설명드리겠습니다.\n\n첫 번째로 **reflow를 유발하는 CSS 속성 사용을 최소화**하는 것입니다.  \n`width`, `height`, `margin`, `padding`, `border` 등의 속성은 요소의 레이아웃을 다시 계산하게 하므로 reflow를 일으킵니다. 가능한 한 미리 CSS에서 스타일을 설정해 초기 로드 시에만 계산이 이루어지도록 하고, 이후에는 변경하지 않는 것이 좋습니다.\n\n두 번째로 **CSS 애니메이션 최적화**입니다.  \n애니메이션에 `transform`과 `opacity` 속성만을 사용하는 것이 성능에 유리합니다. 이 두 속성은 GPU 가속을 사용할 수 있어 reflow를 일으키지 않고 repaint만 발생시키므로 CPU 자원을 적게 사용합니다.\n\n마지막으로 **`will-change` 속성 사용**입니다.  \nCSS의 `will-change` 속성을 사용하여 브라우저에 특정 요소가 변경될 것이라고 미리 언질을 줄 수 있습니다. 예를 들어, `will-change: transform`으로 미리 GPU에서 요소를 준비하게 하여 reflow 및 repaint에 미치는 영향을 줄일 수 있습니다. 하지만 `will-change` 속성은 너무 자주 사용하면 메모리 낭비가 발생하므로 필요한 요소에만 적용해야 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[프론트맨] 프론트엔드 개발자 면접 단골 질문 6 | 리플로우와 리페인트](https://www.youtube.com/watch?v=HgEZ07U_OSc)", "title": "reflow와 repaint의 차이점에 대해서 설명해주세요."}, "fe-20": {"id": "fe-20", "content": "**디바운스(debounce)** 와 **쓰로틀(throttle)** 은 **이벤트 핸들러가 너무 자주 실행되지 않도록 조절하는 기법**입니다. 이 두 가지 방법은 비슷해 보이지만, 동작 방식에 차이가 있습니다.\n\n**디바운스**는 이벤트가 연속적으로 발생할 때, **마지막 이벤트가 발생한 후 일정 시간이 지나야 이벤트 핸들러가 실행**되는 방식입니다. 이를 통해 불필요하게 많은 이벤트 호출을 방지할 수 있습니다. 예를 들어, 검색창에 사용자가 키를 입력할 때마다 검색 요청을 보내면 부하가 지나치게 커지기 때문에, 사용자가 입력을 멈춘 후 일정 시간이 지나면 검색 요청을 보내는 방식으로 디바운스를 적용할 수 있습니다.\n\n**쓰로틀**은 **일정 시간 간격 동안 발생한 이벤트 중 첫 번째 또는 마지막 이벤트만 처리**하는 방식입니다. 즉, 이벤트가 계속해서 발생하더라도 설정된 시간 동안은 한 번만 이벤트 핸들러가 실행됩니다. 예를 들어, 사용자가 연속 클릭을 한다면 클릭할 때마다 이벤트가 발생하는데, 이를 매번 처리하면 부하가 불필요하게 커지니, 쓰로틀을 적용해 일정 간격 내 한 번만 처리하게 할 수 있습니다.\n\n## 디바운스와 쓰로틀 중에서 무한 스크롤 구현 시 어떤 방식을 선택하실 건가요? 그 이유는 무엇인가요? 🤔\n\n무한 스크롤 구현 시에는 **쓰로틀**을 사용하는 것이 더 적합합니다.\n\n먼저, 스크롤은 연속적인 동작이며 사용자가 페이지 하단에 도달했을 때 즉각적인 반응을 기대합니다. **쓰로틀**은 스크롤이 **하단에 위치하게 된 순간 즉시 추가 데이터 요청을 수행**하므로, 사용자에게 더 자연스러운 스크롤 경험을 제공할 수 있습니다. \n\n반면, **디바운스**를 사용할 경우, 사용자가 반복적으로 스크롤한다면 **마지막 스크롤이 멈춘 후에야 데이터를 불러오기 시작하므로 지연**이 발생할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[zerocho] 쓰로틀링과 디바운싱](https://www.zerocho.com/category/JavaScript/post/59a8e9cb15ac0000182794fa)", "title": "디바운스와 쓰로틀에 대해서 각각 설명해주세요."}, "fe-21": {"id": "fe-21", "content": "리액트에서 index를 key로 사용하는 것이 권장되지 않는 이유는 배열의 요소들이 추가되거나 삭제될 때, 배열의 순서가 바뀌는 경우 문제가 발생할 수 있기 때문입니다.\n\n리액트는 key를 통해 리스트에서 어떤 요소가 변경, 추가, 삭제되었는지를 추적합니다. 그러나 index를 key로 사용하면 배열의 순서가 변경될 때 리액트가 요소들을 잘못 인식할 수 있습니다. 예를 들어, 배열에 새로운 요소가 추가되면 그 뒤에 있는 요소들의 인덱스가 모두 바뀌게 됩니다. 리액트는 이를 새로운 요소로 인식해 불필요하게 재렌더링을 하거나, 요소의 상태를 잘못 처리할 수 있습니다.  \n\n이로 인해 성능 문제가 발생하거나, 사용자 입력 상태 같은 요소가 의도치 않게 초기화되는 등 예기치 않은 버그가 생길 수 있습니다. 그래서 배열의 순서나 요소 변경에 영향을 받지 않는 고유한 값을 key로 사용하는 것이 좋습니다.\n\n다만, 수정/삭제 등의 변경이 절대 발생하지 않는 정적인 리스트라면 index를 사용해도 무방합니다.\n\n\n## key로 사용할 고유 값을 생성하는 방법에는 어떤 것들이 있나요? 🤔\n\nkey로 사용할 고유한 값을 생성하는 방법에는 여러 가지가 있습니다. 주로 데이터의 유일성을 보장하고 변하지 않는 값을 사용하는 것이 중요합니다.\n\n서버의 데이터베이스에서 제공하는 고유 ID를 사용하는 것이 가장 권장됩니다. 만약 이 방법이 불가능할 경우, `${item.title}_${item.username}`와 같은 형태로 여러 필드를 결합하여 고유 값을 생성할 수 있습니다. 혹은, 렌더링 이전 시점에 UUID 혹은 랜덤 값을 생성하여 고유 값을 부여할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[Robin Porkorny]Index as a key is an anti-pattern](https://robinpokorny.medium.com/index-as-a-key-is-an-anti-pattern-e0349aece318)\n- [[Jeongkuk Seo] 배열의 index를 key로 쓰면 안되는 이유](https://medium.com/sjk5766/react-%EB%B0%B0%EC%97%B4%EC%9D%98-index%EB%A5%BC-key%EB%A1%9C-%EC%93%B0%EB%A9%B4-%EC%95%88%EB%90%98%EB%8A%94-%EC%9D%B4%EC%9C%A0-3ce48b3a18fb)\n- [[Stack Overflow] How to create unique keys for React elements?](https://stackoverflow.com/questions/39549424/how-to-create-unique-keys-for-react-elements)", "title": "리액트에서 index를 key값으로 사용하면 안되는 이유에 대해서 설명해주세요."}, "fe-22": {"id": "fe-22", "content": "자바스크립트에서 호이스팅이 가능한 이유는 자바스크립트 엔진이 코드를 실행하기까지 **두 단계의 과정을 거치기 때문**입니다.\n\n이 두 단계는 **컴파일 단계**와 **실행 단계**이며, 이 과정에서 호이스팅이 발생하게 됩니다. 구체적으로 말씀드려보겠습니다.\n\n첫번째로 **컴파일 단계**입니다.\n\n\n자바스크립트 엔진은 스크립트를 실행하기 전에 먼저 **컴파일 단계**를 거칩니다. 이 과정에서 **함수 및 변수 선언을 한 부분이 메모리에 할당**됩니다.\n이때 변수와 함수 선언을 미리 메모리에 올려두기 때문에 실제 코드에서 선언된 위치보다 앞에서 접근이 가능해지는 것입니다.\n\n`let`, `const`가 아닌 `var`를 통해 선언되면, 컴파일 단계에서 변수가 메모리에 올라가며, 이때 값은 undefined로 초기화됩니다. 이후 실행 단계에서 코드가 진행되면서 실제 할당된 값이 대입됩니다.\n\n```js\nconsole.log(myVar); // undefined\nvar myVar = 5;\nconsole.log(myVar); // 5\n```\n\n위의 예시에서 myVar 변수 선언이 코드의 최상단으로 \"호이스팅\"되어 컴파일 단계에서 메모리에 먼저 올라가고, 초기값은 undefined로 설정됩니다.\n\n따라서 console.log(myVar)의 첫 번째 출력에서 undefined가 나오는 것입니다.\n\n두번째로 **실행 단계**입니다.\n\n실행 단계란 **실제 코드가 실행되는 과정**으로, 컴파일 단계에서 메모리에 할당된 변수와 함수가 실행됩니다. 여기서 변수가 할당된 값을 가지게 되고, 함수가 호출되면 그 안의 코드가 수행됩니다.\n\n정리해서 말씀 드리겠습니다.\n자바스크립트에서 호이스팅이 가능한 이유는 자바스크립트 엔진이 코드를 단순히 한 줄씩 바로 해석하고 실행하지 않고, 먼저 컴파일 단계에서 코드를 파악하고 필요한 메모리를 확보하는 과정을 거치기 때문입니다.\n\n이를 통해 코드 내에서 선언 위치와 상관없이 변수를 사용할 수 있는 유연성을 제공합니다.", "title": "자바스크립트에서 어떻게 호이스팅이 가능한지에 대해서 설명해주세요."}, "fe-23": {"id": "fe-23", "content": "`useEffect`와 `useLayoutEffect`는 모두 렌더링된 후에 특정 작업을 수행하기 위해 사용됩니다.\n하지만 실행되는 **타이밍**과 **용도**가 다릅니다.\n\n먼저, ```useEffect```는 **렌더링이 완료되는 시점**에 **비동기적**으로 실행됩니다. 즉, 화면이 실제로 사용자에게 그려진 후에 ```useEffect```가 실행되는 방식입니다. 그래서 ```useEffect```는 보통 데이터를 가져오는 작업이나 이벤트 리스너 추가 등 렌더링 후에 화면에 직접적인 영향을 주지 않는 작업에 주로 사용됩니다.\n\n반면에 ```useLayoutEffect```는 **렌더링 후 DOM이 업데이트되기 직전의 시점**에 **동기적**으로 실행됩니다. 여기서 **동기적**이라는 것은 화면에 내용이 그려지기 전에 모든 레이아웃 관련 작업이 완료된다는 의미입니다. 예를 들어, **DOM의 크기를 측정**하거나 **위치를 조정해야 할** 때 ```useLayoutEffect```를 사용하면 즉각적으로 그 변경사항이 반영되어 화면 깜빡임이나 불필요한 재렌더링을 방지할 수 있습니다.\n\n정리하면, **렌더링 후 실행되는 비동기 작업**에는 ```useEffect```가 적합하고, 레이아웃 작업이나 DOM 조작과 같이 **화면이 그려지기 전에 완료되어야 하는 작업**에는 ```useLayoutEffect```가 적합합니다.  \n\n예를 들면, ```useEffect```는 사용자 데이터를 API로부터 가져오는 상황에 자주 사용합니다. 데이터가 렌더링 후에 설정되면 화면이 자연스럽게 업데이트되는 것입니다.\n\n```jsx\nuseEffect(() => {\n  fetchData().then(data => setData(data));\n}, []);\n```\n```useLayoutEffect```는 DOM의 크기를 측정해서, 다른 요소의 위치를 조정해야 할 때 유용합니다. 예를 들어, 어떤 요소의 높이를 측정해 그 높이에 맞춰 레이아웃을 맞추고 싶을 때 사용합니다:\n\n```jsx\nuseLayoutEffect(() => {\n  const height = ref.current.offsetHeight;\n  setHeight(height);\n}, []);\n```\n\n단, ```useLayoutEffect``` 사용 시 **성능 면에서 주의할 점**이 있습니다. ```useLayoutEffect```는 동기적으로 실행되기 때문에 너무 많은 작업이 실행되면 렌더링이 느려질 수 있습니다. 따라서 보통은 ```useEffect```를 기본적으로 사용하고, 화면에 영향을 주는 작업만 ```useLayoutEffect```로 처리하는 것이 좋습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[F-Lab] React의 useEffect와 useLayoutEffect 이해하기](https://f-lab.kr/insight/understanding-useeffect-and-uselayouteffect-in-react-20240618?gad_source=1&gclid=Cj0KCQiAs5i8BhDmARIsAGE4xHxS3kYk36u3puO4sBg1VUM0jPwZPrMBYk7CUGUq3wzBdt6Md0nOxRcaAgVjEALw_wcB)", "title": "useEffect와 useLayoutEffect의 차이점에 대해서 설명해주세요."}, "fe-24": {"id": "fe-24", "content": "**웹 접근성**은 **장애인과 고령자 등 신체적 제약이 있는 사용자를 포함해, 모든 사용자가 웹 페이지를 동등하게 이용할 수 있도록 보장**하는 개념입니다. 마치 공공건물에 휠체어 경사로를 설치해 이동이 불편한 사람도 이용할 수 있게 하는 것처럼, 웹 페이지 역시 디지털 경사로를 마련해 누구나 접근할 수 있어야 합니다. 다만 접근성은 단순히 장애인만을 위한 것이 아닙니다. 네트워크 속도가 느리거나 밝은 햇빛 아래 화면을 보는 등 일상적인 제약 상황에서도, **모든 사용자가 제약 없이 웹을 사용할 수 있도록 하는 것**이 웹 접근성의 궁극적인 목표입니다.\n\n웹 접근성 개선에는 다양한 방법이 있습니다. 우선, **단순하고 명확한 HTML 구조**와 **시맨틱 태그**가 필요합니다. 여기서, 시맨틱 태그는 웹 페이지의 구조와 의미를 명확하게 전달해 스크린 리더가 콘텐츠를 쉽게 이해하도록 도와줍니다.  \n또한, **ARIA 속성을 활용**하여 스크린 리더가 동적 콘텐츠나 복잡한 UI 요소를 올바르게 인식할 수 있게 만들 수 있습니다.  \n마지막으로, **키보드로도 페이지를 탐색할 수 있도록 포커스를 명확히 지정**하여 키보드 사용자가 필요한 정보에 접근하기 쉽게 해야 합니다.\n\n이러한 웹 접근성 개선을 통해서 장애가 있는 사용자를 포함한 모든 사용자들에게 더 나은 사용자 경험을 제공할 수 있습니다.\n\n### 말씀해주신 방법으로 개선하면 웹 접근성은 완벽해지는 걸까요? 🤔\n모든 장애 유형을 완벽히 대응하는 것은 현실적으로 어렵습니다. 장애마다 고려해야 할 요소가 다르고, 이를 100% 만족시키는 것이 어렵기 때문입니다. 따라서, **단순히 많은 항목을 충족하는 데 매몰되기보다는, 우리 서비스에서 각 장애 유형 별로 사용자가 어떤 경험을 하고 있는지 파악**하는 것이 중요합니다. 예를 들면, 스크린 리더로 탐색해보며 시각 장애 사용자가 어떤 경험을 하고 있는지 파악할 수 있습니다. 이러한 정보를 기반으로 우선순위를 정렬하고, 기업의 상황에 맞게 점진적으로 접근성을 개선해 나가는 것이 지속 가능하고 현실적인 방식일 것입니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 블링의 웹 접근성](https://www.youtube.com/watch?v=yLZZi5E7NTU)", "title": "웹 접근성의 개념과 개선 방법에 대해 설명해주세요."}, "fe-25": {"id": "fe-25", "content": "**SSR(Server Side Rendering)** 방식은 **서버에서 완성된 정적 HTML을 클라이언트에 내려주는 방식**입니다. 클라이언트 측에서는 해당 HTML을 파싱만 하여 화면을 그리게 됩니다.  \n반면, **CSR(Client Side Rendering)** 방식은 **브라우저가 서버로부터 비어있는 뼈대 HTML을 받아온 후, 필요한 자바스크립트 번들을 다운로드하고 번들을 실행하여 동적으로 컨텐츠를 채우는 방식입니다**.  \n\nNext.js에서는, SSR 방식으로 정적인 html을 내려주어 초기 화면을 빠르게 렌더한 이후, hydration을 통해 이벤트 리스너 부착 등의 자바스크립트 작업을 수행하여 정적인 화면을 동적으로 전환하는 작업을 수행하기도 합니다.\n\n### SSR의 장점은 무엇인가요? 🤔\n\n**SEO(검색 엔진 최적화)** 측면에서 유리합니다. 화면이 동적으로 그려지는 CSR에 비해 크롤러가 컨텐츠를 쉽게 인식하며, 초기 로드가 상대적으로 빨라 우선순위가 부여되어 상위에 노출될 가능성이 높아지기 때문입니다. 이런 점에서 SSR은 블로그나 커머스 등 SEO가 중요한 웹 애플리케이션에 특히 적합합니다.  \n또한, SSR 방식에서는 사용자가 **빠른 초기 로딩 속도**를 경험할 수 있습니다. CSR과 달리 SSR에서는 번들을 다운로드 받거나 번들을 실행하여 동적으로 화면을 그려야 할 필요가 없기 때문입니다.  \n\n### SSR의 단점은 없나요? 🧐\n전통적인 SSR 방식에서는 클라이언트 사이드 라우팅이 불가능하기 때문에 빠르고 매끄러운 페이지 전환 경험을 제공하기 어렵습니다. 또한, 단순히 정적인 리소스를 내려주는 것이 아니라, 요청 시마다 페이지를 동적으로 구성해서 내려주어야 하는 경우에는 WAS 서버 구동으로 인해 서버 비용이 증가할 수 있다는 단점이 있습니다.\n\nNext.js를 통한 최신의 방식으로 SSR을 구현할 경우에는 다음과 같은 단점이 있습니다.  \n첫째, **hydration을 통해 동적인 화면으로 전환할 경우 상호작용 초기화가 비교적 느립니다**. 이는 페이지가 표시되기까지 걸리는 시간(TTV)과 상호작용까지 걸리는 시간(TTI) 사이에 격차가 발생한다는 의미입니다. 그 사이에 사용자가 버튼을 클릭해도 동작하지 않는 등의 답답한 상황을 겪을 수 있습니다.  \n둘째, 상대적으로 **구현 복잡도가 높습니다**. 현대의 웹앱은 SSR과 CSR을 동시에 사용하는 경우가 많습니다. 이때 클라이언트 사이드 로직과 서버 사이드의 로직을 구분해가면서 구현해야 하기 때문에 상대적으로 구현 복잡도가 높습니다.   \n\n## 📚 추가 학습 자료를 공유합니다.\n- [[드림코딩] 서버사이드 렌더링 (개발자라면 상식으로 알고 있어야 하는 개념 정리 ⭐️)](https://www.youtube.com/watch?v=iZ9csAfU5Os)", "title": "SSR(Server Side Rendering)에 대해 설명해주세요."}, "fe-26": {"id": "fe-26", "content": "**Flexbox**와 **Grid**는 페이지에서 **레이아웃을 구성할 때 자주 사용되는 CSS 속성**입니다. 두 속성 모두 화면 요소를 배치하고 정렬하는 데에 사용되지만 몇가지 차이점이 존재합니다.\n\n첫번째로 Flexbox는 **1차원 레이아웃이지만, Grid는 2차원 레이아웃**입니다.  \n**Flexbox**는 **1차원 레이아웃 속성**으로, row 또는 column 중 하나를 기준으로 요소를 정렬하고 배치하는 데 최적화되어 있습니다. 주로 행이나 열 중 하나의 방향으로 정렬해야 할 때 유용하며, 복잡한 행과 열을 모두 포함하는 레이아웃에서는 다소 한계가 있습니다.  \n반면 **Grid**는 **2차원 레이아웃 속성**으로, 행과 열을 모두 사용해 요소를 배치할 수 있습니다. 따라서 복잡한 레이아웃을 구성하거나, 웹페이지의 전체적인 구조를 잡는 데 적합합니다.\n\n두번째는 **사용 목적의 차이**입니다.  \n**Flexbox**는 **콘텐츠 중심으로, 콘텐츠가 추가되거나 줄어들 때 유연하게 대처**하기 좋습니다.\n예를 들어, 수평 또는 수직 방향으로 콘텐츠를 정렬하고 간격을 조절하는 데 유용하며, 버튼 그룹, 내비게이션 바 등 한 줄의 콘텐츠가 주가 되는 구성에 적합합니다.  \n**Grid**는 **레이아웃 중심으로 페이지 구조를 구성하는 데 최적화**되어 있습니다. 예를 들어, 카드 레이아웃, 갤러리 형식 등 명확하게 구분된 영역을 기반으로 레이아웃을 구성할 때 Grid가 효과적입니다.\n\n마지막으로는 **기본 동작의 차이입니다**.  \n**Flexbox**에서는 주로 요소가 **컨테이너의 크기나 위치에 맞춰 자동으로 정렬**됩니다. Flexbox의 justify-content와 align-items 속성을 사용해, 주 축 방향으로 요소들을 배치하고 여백을 조절할 수 있습니다.  \n**Grid**는 **행과 열을 사전에 정의하고 그 격자(grid cell)에 요소를 배치하는 방식**입니다. Grid에서는 grid-template-rows, grid-template-columns와 같은 속성으로 행과 열의 크기를 정의하고, 각 요소의 위치를 세밀하게 설정할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[1분코딩] CSS Flexbox와 Grid의 차이점 간략하게 정리해보기](https://www.youtube.com/watch?v=B1zuZDA4LOM)\n- [[1분코딩] CSS Flexbox와 CSS Grid, 한번에 정리!](https://www.youtube.com/watch?v=eprXmC_j9A4)", "title": "CSS Flexbox와 Grid의 차이점에 대해서 설명해주세요."}, "fe-27": {"id": "fe-27", "content": "**프론트엔드 E2E(End-to-End) 테스트**는 **애플리케이션의 사용자 경험을 처음부터 끝까지 시뮬레이션하여 테스트하는 방식**입니다. 단위 테스트나 통합 테스트와 달리, E2E 테스트는 사용자 관점에서 전체 애플리케이션이 의도한 대로 작동하는지 검증합니다. 브라우저 환경에서 실제 사용자 동작을 흉내 내어 다양한 시나리오를 테스트하며, 버튼 클릭, 페이지 이동, 데이터 입력 등을 포함합니다. 보통 E2E 테스트는 **Cypress, Playwright**과 같은 도구를 이용해 작성합니다.\n\nE2E 테스트를 진행하면 사용자와 동일한 방식으로 애플리케이션을 테스트하므로, **사용자에게 직접적인 영향을 미치는 오류를 조기에 발견**할 수 있습니다. 이는 프로덕트의 안정성을 높이고, 실제 배포 후 발생할 수 있는 리스크를 줄이는 데 도움이 됩니다. 따라서 E2E 테스트는 중요한 사용자 흐름이나 비즈니스 로직이 포함된 페이지에 적용하면 효과적입니다.\n\n### 유닛 테스트로도 충분히 안정성을 높일 수 있지 않나요? 🤔\n\n**유닛 테스트는 개별적인 코드 조각이 제대로 작동하는지는 확인하지만, 전체 시스템의 흐름과 사용자가 실제로 겪는 경험을 확인하지는 않습니다**. 예를 들어, 로그인 기능의 유닛 테스트는 올바른 사용자 정보를 입력했을 때 인증이 성공하는지를 확인할 수 있지만, 로그인 이후의 페이지 이동, 세션 유지, 렌더링 등은 확인하지 못합니다.\n\n반면, **E2E 테스트는 애플리케이션을 사용자 관점에서 처음부터 끝까지 검사하여, 모든 시스템이 통합적으로 잘 작동하는지** 확인합니다. 이는 UI 상호작용, API 호출, 화면 전환 등 여러 구성 요소가 함께 작동하는 과정에서 발생할 수 있는 문제를 탐지할 수 있습니다. E2E 테스트를 통해 사용자가 실제로 겪게 될 시나리오를 점검함으로써, 전체 시스템 관점에서의 오류를 조기에 발견할 수 있습니다.\n\n따라서 **유닛테스트와 E2E 테스트를 상호 보완적으로 함께 활용**하는 것이 좋습니다. 유닛 테스트는 개별 컴포넌트를 신속하고 정확하게 검사하여 디버깅 시간을 줄이고, 코드의 작은 변화가 의도한 대로 작동하는지 확인합니다. 반면, E2E 테스트는 애플리케이션의 중요한 사용자 흐름을 점검하여 배포 후 발생할 수 있는 치명적인 문제를 예방합니다. 이처럼 두 테스트를 함께 활용하면 애플리케이션의 안정성과 신뢰성을 극대화할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[kakao entertainment] E2E 테스트 도입 경험기](https://fe-developers.kakaoent.com/2023/230209-e2e/)\n- [[10분 테코톡] 헤다의 프론트엔드 테스트 종류](https://www.youtube.com/watch?v=MN7Pw4mK6lU&t=53s)", "title": "프론트엔드 E2E 테스트에 대해서 설명해주세요."}, "fe-28": {"id": "fe-28", "content": "크게 세 가지의 방법을 말씀드릴 수 있습니다.  \n\n첫째, **이미지 포맷 최적화**입니다. 전통적인 JPEG나 PNG 대신, 압축 효율이 높은 WebP 또는 AVIF와 같은 최신 포맷으로 변환할 수 있습니다. 이 포맷들은 이미지 품질을 유지하면서도 파일 크기를 크게 줄여줍니다. 단, 일부 구버전의 브라우저에서는 최신 이미지 포맷을 지원하지 않지 않으므로, 호환성을 고려할 필요가 있습니다.\n\n둘째, **이미지 사이즈 조정**입니다. 화면에 노출되는 크기에 비해 이미지가 과도하게 큰 경우 이미지를 작게 리사이징할 수 있습니다. 필요한 크기에 맞게 잘라 서버에서 내려줄 수 있습니다. 또한, 다양한 디바이스 해상도에 대응하기 위해 Responsive Images 기술, 즉 `srcset`과 `sizes` 속성을 활용할 수 있습니다. 이 경우, 브라우저가 현재 화면 크기에 최적화된 이미지를 선택하여 로드할 수 있습니다.\n\n셋째, **지연 로딩(Lazy Loading**)입니다. 사용자가 화면에 스크롤할 때 해당 위치에 도달하는 이미지가 로드되도록 설정하는 방법입니다. 지연 로딩을 통해 초기 로딩 속도를 개선할 수 있습니다. HTML `loading=\"lazy\"` 속성을 통해 구현할 수 있으며, 이를 통해 불필요한 이미지 로드를 방지할 수 있습니다.\n\n마지막으로, **CDN(Content Delivery Network**)입니다. CDN을 적용하면 사용자가 지리적으로 가까운 서버에서 이미지를 다운로드하게 되어 로딩 속도를 단축시킬 수 있습니다.\n\n이러한 방법을 상황에 맞게 적용하면 이미지 로딩 속도를 향상시켜 사용자 경험을 크게 개선할 수 있습니다.\n\n### WebP나 AVIF는 모든 브라우저에서 지원하지 않는다고 하셨는데, 호환성 문제를 어떻게 해결할 수 있을까요? 🤔\n\n호환성 문제에 대비하기 위해 **HTML의 ```<picture>``` 요소를 통해 fallback 이미지를 적용**할 수 있습니다. `<picture>` 요소 내부에 WebP나 AVIF와 같은 고효율 포맷을 우선 설정하고, 브라우저가 이를 지원하지 않을 경우 JPEG나 PNG와 같은 기본 포맷을 로드하도록 할 수 있습니다.\n\n구체적인 예시는 아래와 같습니다.\n```html\n<picture>\n  <source srcset=\"image.avif\" type=\"image/avif\">\n  <source srcset=\"image.webp\" type=\"image/webp\">\n  <img src=\"image.jpg\" alt=\"Image description\">\n</picture>\n```\n이 코드에서 브라우저는 AVIF를 우선 시도하고, 지원하지 않으면 WebP를, 둘 다 지원하지 않으면 마지막 img 태그의 jpg 이미지를 로드하게 됩니다.\n", "title": "이미지 크기가 클 경우 렌더링 속도가 느려질 텐데, 이를 개선하기 위한 방법들을 설명해주세요."}, "fe-29": {"id": "fe-29", "content": "**낙관적 업데이트**는 **성공적인 상태 업데이트가 이뤄질 거라는 가정 하에 서버 응답 이전에 UI를 미리 업데이트하는 방법**입니다. 사용자 요청을 서버가 성공적으로 처리할 거라고 미리 예상하고, UI를 즉각적으로 변경해서 사용자에게 **빠른 반응**을 보여줍니다.\n\n낙관적 업데이트의 대표적인 예시로 **좋아요 기능**을 들 수 있습니다.\n예를 들어, 사용자가 좋아요 버튼을 클릭하면 서버 응답을 기다리지 않고, 화면에 바로 좋아요 클릭에 대한 상태를 보여주는 것입니다. 서버 응답이 성공적으로 돌아오면 그대로 두고, 혹시나 실패하면 UI에서 해당 좋아요 상태를 다시 해제하거나 오류 메시지를 보여주는 방식입니다.\n\n**낙관적 업데이트의 장점**은, 서버 응답 속도와 관계 없이 즉각적인 피드백을 제공해서 사용자들이 시스템을 빠르게 쓸 수 있다는 점입니다.\n특히 네트워크 상태가 좋지 않거나 응답 시간이 길어도 사용자 경험에는 영향을 덜 미치게 됩니다.\n\n다만, 서버에서 오류가 발생하면 잠시동안 화면에 잘못된 정보가 표시될 수 있습니다. 따라서 이 경우를 대비한 오류 핸들링(롤백) 로직을 같이 설계해야 하는 주의점이 있습니다.\n\n## 좋은 사용성을 위해서는 낙관적 업데이트를 가능한 한 많이 적용하는 것이 좋겠네요? 🤔\n\n많은 곳에 낙관적 업데이트를 적용하는 게 항상 좋은 건 아닙니다. 낙관적 업데이트는 **요청이 성공할 가능성이 높고, 사용자 경험을 즉시 개선하는 데 큰 장점이 있을 때** 사용하는 게 적합합니다.\n\n예를 들어 결제나 거래 내역과 같이 중요한 데이터를 다루는 경우에는 낙관적 업데이트가 오히려 사용자 경험을 저해할 수 있습니다. 낙관적 업데이트를 적용했을 때, **요청에 실패한다면 민감도 높은 정보가 순간적으로 잘못 표시**되면서 사용자 경험을 크게 저해할 수 있기 때문입니다.\n\n또한 **네트워크 환경이 불안정한 경우에는 요청에 대한 실패율이 높아지기 때문에 잦은 롤백**이 발생할 수 있습니다. 이 경우 역시 사용자 경험을 저해할 수 있기 때문에 오히려 서버 응답을 기다리는 것이 더 나은 판단일 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[Tecoble] 낙관적 업데이트로 사용자 경험을 개선해보자!](https://tecoble.techcourse.co.kr/post/2023-08-15-how-to-improve-ux-with-optimistic-update/)\n", "title": "낙관적 업데이트에 관하여 설명해주세요."}, "fe-3": {"id": "fe-3", "content": "**실행 컨텍스트**는 자바스크립트에서 코드가 실행되는 환경을 의미합니다.\n자바스크립트 엔진이 코드를 실행할 때, 그 코드가 실행될 때의 환경을 정의하고 관리하기 위해 존재하는 것이 실행 컨텍스트입니다.\n\n실행 컨텍스트는 크게 **전역 실행 컨텍스트**와 **함수 실행 컨텍스트**로 나눌 수 있습니다.\n\n**전역 실행 컨텍스트**는 자바스크립트가 처음 실행될 때 생성되는 컨텍스트입니다.\n이 전역 컨텍스트는 프로그램이 종료될 때까지 유지되며, 전역에 선언된 변수나 함수가 모두 포함됩니다. 전역 컨텍스트에서 선언된 변수와 함수는 프로그램 내 어디서든 접근이 가능합니다.\n\n기본적으로 자바스크립트는 싱글 스레드이기 때문에, 전역 실행 컨텍스트는 1개만 존재합니다.\n\n**함수 실행 컨텍스트**는 함수가 호출될 때마다 생성 되는 컨텍스트를 의미합니다.\n각 함수는 자신만의 실행 컨텍스트를 가지며, 이 컨텍스트 내에서 선언된 변수와 함수는 해당 함수 내에서만 유효합니다. 함수가 종료되면 그 실행 컨텍스트도 함께 사라집니다.\n\n## 실행 컨텍스트는 어떤 구성 요소로 이루어져 있나요? 🤔\n\n실행 컨텍스트는 크게 `변수 객체`, `스코프 체인`, `this` 라는 구성 요소로 이루어져 있습니다.\n\n첫째, **변수 객체**란 실행 컨텍스트 내에서 사용되는 변수와 함수 선언을 저장하는 공간입니다. 전역 컨텍스트에서는 전역 객체가 변수 객체의 역할을 하고, 함수 컨텍스트에서는 **활성 객체**가 변수와 매개변수를 관리합니다.\n\n둘째, **스코프 체인**입니다. 현재 실행 중인 컨텍스트와 외부 렉시컬 환경의 연결을 유지합니다.\n변수를 참조할 때 현재 컨텍스트에서 찾지 못하면 외부 환경으로 범위를 넓혀가며 변수를 찾습니다.\n\n마지막으로, **this**입니다. **this**는 실행 컨텍스트에 따라 참조하는 객체가 달라집니다.\n전역 컨텍스트에서는 this가 전역 객체를 가리키며, 함수 컨텍스트에서는 함수 호출 방법에 따라 달라집니다.\n\n실행 컨텍스트는 이러한 구성 요소를 바탕으로 자바스크립트 코드가 실행되는 동안의 환경을 관리하고, 코드 실행 시 변수의 유효 범위나 함수 호출의 맥락을 결정 짓습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 하루의 실행 컨텍스트](https://www.youtube.com/watch?v=EWfujNzSUmw)\n", "title": "실행 컨텍스트에 대해서 설명해주세요"}, "fe-30": {"id": "fe-30", "content": "자바스크립트는 **싱글 스레드 언어**입니다. 즉, 한 번에 하나의 작업만을 처리할 수 있는 **단일 콜 스택**을 가집니다. 하지만 브라우저나 Node.js 환경이 제공하는 비동기 처리 메커니즘 덕분에 여러 작업을 동시에 수행할 수 있습니다.\n\n자바스크립트는 브라우저의 **Web API**나 Node의 **libuv**, **이벤트 루프**, **태스크 큐**를 이용하여 비동기 작업을 동시에 처리합니다.  \n\n비동기 작업이 발생하면, 해당 작업(타이머, 네트워크 요청 등)은 브라우저의 **Web API**에 위임됩니다. 예를 들어, `setTimeout`이나 `fetch`와 같은 작업이 수행되면 자바스크립트 엔진은 이 작업들을 Web API에 넘기고 다른 코드 실행을 이어갑니다. Web API에서 비동기 작업이 완료되면, 그 작업은 **태스크 큐**에 들어가 대기합니다.\n\n이후 **이벤트 루프**가 콜 스택이 비어있는지 확인한 뒤 **태스크 큐**에서 대기 중인 작업을 콜 스택으로 가져와 실행합니다. 이러한 구조 덕분에 자바스크립트는 싱글 스레드임에도 비동기적으로 작업을 처리하여 다양한 작업을 효율적으로 관리할 수 있습니다. 이 메커니즘 덕분에 UI 인터랙션이 끊기지 않으며, 대기 시간이 필요한 작업도 동시에 실행되는 것과 같이 동작하게 됩니다.\n\n## 앞서 말씀하신 태스크 큐의 종류에는 어떤 게 있나요? 🤔\n\n자바스크립트의 태스크 큐는 크게 **매크로태스크 큐**와 **마이크로태스크 큐**로 나뉩니다. 이들 큐는 비동기 작업의 우선순위를 관리하고, 이벤트 루프가 적절한 시점에 콜백을 실행하기 위해 사용됩니다.\n\n첫째, **매크로태스크 큐**는 일반적인 비동기 작업의 콜백이 저장되는 큐입니다.  \n`setTimeout`, `setInterval`, I/O 작업, 이벤트 핸들러 등은 작업 완료 후 매크로태스크 큐에 콜백을 대기시킵니다. 매크로태스크 큐는 이벤트 루프의 한 번의 반복마다 하나의 태스크만 처리되므로, UI 업데이트나 다른 작업과 균형 있게 진행됩니다.\n\n둘째, **마이크로태스크 큐**는 더 높은 우선순위가 필요한 비동기 작업들이 대기하는 큐입니다.   \n`Promise.then`, `MutationObserver` 등의 비동기 콜백이 여기에 저장됩니다. 이벤트 루프는 매크로태스크를 실행하기 전에 항상 마이크로태스크 큐를 먼저 확인하고, 모든 마이크로태스크를 처리한 후 매크로태스크로 넘어갑니다. 이 방식으로 마이크로태스크 큐의 작업은 높은 우선순위로 처리됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [jewoo.song - [Javascript] 자바스크립트의 호출 스택과 이벤트 루프](https://iamsjy17.github.io/javascript/2019/07/20/how-to-works-js.html)", "title": "자바스크립트는 싱글 스레드 언어인데, 어떻게 동시에 여러 작업들을 수행하나요?"}, "fe-31": {"id": "fe-31", "content": "**interface**는 **객체의 형태를 확장**하는 데 용이한 반면, **type**은 튜플, 인터섹션, 유니온 등을 이용하여 더 **복잡한 타입 정의 및 조합을 표현**하는 데 용이합니다.\n\n먼저, **interface**는 선언 병합을 지원해 여러 번 선언할 수 있어, 주로 객체 타입을 **확장**할 때 유리합니다. 동일한 이름을 가진 interface를 여러 번 선언하면, 이 속성들이 자동으로 합쳐집니다. 예를 들면 다음과 같습니다.\n\n```ts\ninterface Person {\n  age: number;\n  name: string;\n  isBirthday: boolean;\n}\n\ninterface Person {\n  address: string;\n}\n\nconst person1: Person = {\n  age: 1,\n  name: \"abcd\",\n  isBirthday: false,\n  address: \"1010\",\n};\n``` \n위 코드에서 Person interface를 여러 번 선언할 수 있으며, 결과적으로 하나의 interface로 병합됩니다.\n\n반면, **type**으로 선언한 경우에는 동일한 이름을 중복 선언하면 에러가 발생합니다. 대신, **type**은 튜플과 같은 **복잡한 타입 표현**이 가능하며, **복잡한 타입 조합**을 위해 인터섹션(&)과 유니온(|) 연산자를 지원합니다.\n\n예를 들어, type을 이용해 여러 타입을 조합하는 방식은 다음과 같습니다.\n\n```ts\ntype BasicInfo = {\n  name: string;\n  age: number;\n};\n\ntype ContactInfo = {\n  email: string;\n  phone: string;\n};\n\n// 인터섹션 타입 (&)을 사용해 두 타입을 결합하여 하나의 타입으로 생성\ntype PersonInfo = BasicInfo & ContactInfo;\n\nconst person2: PersonInfo = {\n  name: \"John\",\n  age: 30,\n  email: \"john@example.com\",\n  phone: \"123-456-7890\",\n};\n```\n\n정리하자면, **interface**는 선언 병합을 통해 여러 번 선언이 가능하여 주로 객체 타입을 **확장**하는 데 유리하며, **type**은 튜플 등 복잡한 타입을 사용하고 유연한 연산자를 통해 복잡한 타입 조합을 **표현**하는 데 적합합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[F-Lab] 타입스크립트에서 타입과 인터페이스의 차이점 이해하기](https://f-lab.kr/insight/typescript-type-vs-interface-20240801?gad_source=1&gad_source=1&gclid=Cj0KCQiAs5i8BhDmARIsAGE4xHwNInBLKRs3N4UC8MmWPHxUB6qvBo9LhNWqlFQJ0zHBGlwgZL5j6tkaAm5oEALw_wcB)", "title": "타입스크립트의 타입과 인터페이스의 차이점을 설명해주세요."}, "fe-32": {"id": "fe-32", "content": "**시맨틱 마크업**은 HTML 요소를 사용하는 방식으로, 단순히 시각적 목적이 아닌 **요소의 의미를 잘 나타내도록 작성**하는 방식을 말합니다. 예를 들어, `<div>`와 `<span>` 같은 비시맨틱 태그가 아닌, `<header>`, `<footer>`, `<article>`, `<section>` 같은 시맨틱 태그를 사용하여 문서 구조와 콘텐츠의 역할을 명확하게 하는 것입니다. \n\n**시맨틱 마크업**이 중요한 이유는 크게 두 가지입니다.\n\n첫째, **접근성을 개선하기 위함입니다.** 시맨틱 요소들은 스크린 리더와 같은 접근성 도구에서 콘텐츠의 구조를 더욱 잘 해석할 수 있게 해 주어 시각장애인이나 노인 등 다양한 사용자층이 사이트를 효과적으로 탐색할 수 있게 합니다. 이러한 요소를 올바르게 사용하면, 더 많은 사람들에게 접근 가능한 웹 환경을 제공할 수 있습니다.\n\n둘째, **SEO(검색 엔진 최적화)에 유리합니다**. 검색 엔진은 HTML의 시맨틱 구조를 통해 페이지의 구성을 파악합니다. 그렇기에 시맨틱 마크업을 적절히 적용하면, 검색 엔진이 페이지를 올바르게 파악할 수 있고, 그에 따라 검색 결과에서 페이지가 더 잘 노출될 가능성이 높아집니다.\n\n따라서 시맨틱 마크업은 단순한 코드 작성 컨벤션을 넘어, **웹 접근성**과 **SEO**를 위한 중요한 요소로, 현대 웹 개발에서 필수적인 기술이라고 할 수 있습니다.\n\n## CSR(Client Side Rendering)에서도 시맨틱 마크업이 SEO에 영향을 미친다고 보시나요? 만약 그렇다면, 왜 그렇다고 생각하시나요? 🤔\n\n CSR 환경에서는 시맨틱 마크업이 SEO에 주는 영향이 다소 제한적일 수 있지만, 여전히 중요한 역할을 한다고 생각합니다.\n\nCSR에서는 대부분의 콘텐츠가 클라이언트 측에서 렌더링되기 때문에, 검색 엔진이 페이지를 크롤링할 때 페이지의 초기 콘텐츠만 인식할 가능성이 큽니다. 그렇더라도 **최근 검색 엔진들은 JavaScript 렌더링을 지원하는 방향으로 진화하고 있으며, 페이지의 시맨틱 구조를 어느 정도 파악**할 수 있습니다. 따라서 시맨틱 마크업을 제대로 적용하면 CSR에서도 검색 엔진이 콘텐츠의 중요한 부분을 더 쉽게 인식하게 되어 검색 결과에 긍정적인 영향을 미칠 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[요즘 IT] 알아두면 쓸모 있는 '시맨틱 마크업' 개념 정리](https://yozm.wishket.com/magazine/detail/2495/)", "title": "시맨틱 마크업이란 무엇이며, 왜 중요한가요?"}, "fe-33": {"id": "fe-33", "content": "`undefined`와 `null`은 **둘 다 '값이 없다'는 의미를 담고 있지만, 그 쓰임새와 의미에는 차이점이 존재**합니다.\n`undefined`는 자바스크립트에서 자동으로 할당되는 값입니다.\n\n변수는 선언했지만, 아직 아무 값도 할당하지 않았을 때, 자바스크립트는 그 변수에 `undefined`라는 값을 자동으로 부여합니다.\n예를 들어 `let a;`라는 변수를 선언만 하고 값을 넣지 않으면, 자바스크립트가 자동으로 `a`에 `undefined`을 할당하게 됩니다.\n\n반면에 `null`은 개발자가 의도적으로 할당하는 값입니다.\n특정 변수에 값이 없음을 명확하게 표현하기 위해 개발자가 `null`을 넣어줄 수 있습니다.\n예를 들어 `let b = null;` 이라고 할 경우, 이는 b라는 변수에 일부러 값이 비어 있다는 의도를 나타내기 위해 `null`을 넣은 것입니다.\n\n정리해서 말씀 드려보자면, `undefined`는 값을 **아직 할당하지 않은 상태를 나타내고, 자바스크립트가 자동으로 부여하는 값**입니다.\n\n반면, `null`은 **의도적으로 값을 비워 둔 상태를 나타내며, 개발자가 직접 할당하는 값**입니다.\n또한, 느슨한 비교(`==`)에서는 `null`과 `undefined`가 같게 처리되지만, 엄격한 비교(`===`)에서는 다르게 취급됩니다.\n\n### undefined와 null이 메모리 관리와 관련해서 어떻게 처리되는지 알고 계신가요? 🤔\n\n`null`은 개발자가 명시적으로 메모리를 해제하고자 할 때 사용하는 방법입니다.\n객체를 참조하던 변수를 `null`로 설정하면, 해당 변수는 더 이상 그 객체를 가리키지 않으므로 참조가 끊어집니다.\n이렇게 참조가 끊기면 JavaScript의 가비지 컬렉터는 이 객체가 더 이상 사용되지 않는다고 판단해 메모리에서 이를 제거할 수 있습니다.\n예를 들어, 대용량 데이터를 담고 있는 객체가 있다고 할 때, 더 이상 사용하지 않는다면 그 객체를 `null`로 설정하여 가비지 컬렉션 대상이 되도록 유도할 수 있습니다.\n\n반면에 `undefined`는 자바스크립트 엔진이 자동으로 할당하는 값으로, 메모리 해제와 직접적인 관련은 없습니다.\n변수가 `undefined` 상태라고 해서 가비지 컬렉션 대상이 되는 것은 아니며, 이 값 자체가 메모리 해제를 유도하는 것은 아닙니다.\n`undefined`는 단지 \"값이 정의되지 않음\"을 나타낼 뿐이며, 변수 값을 `undefined`로 설정한다고 해서 자바스크립트가 이를 해제 대상으로 인식하지 않습니다.\n예를 들어, `let a;`로 선언된 변수 `a`는 기본적으로 `undefined` 상태이지만, 메모리 해제를 유도하지는 않습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[Inpa Dev] 재미있게 확실히 이해하는 null / undefined / NaN 차이](https://inpa.tistory.com/entry/%F0%9F%93%9A-null-undefined-NaN)", "title": "undefined와 null의 차이점에 대해서 설명해주세요."}, "fe-34": {"id": "fe-34", "content": "React의 `useEffect`는 컴포넌트의 특정 시점에 자동으로 호출되는 훅으로, 크게 컴포넌트가 **마운트**, **업데이트**, **언마운트**되는 시점에 호출됩니다.\n\n먼저, `useEffect`는 **컴포넌트가 마운트될 때, 즉, 처음 렌더링되고 나서 호출됩니다**. 이때 데이터 초기화나 외부 API 호출, 구독 설정 등의 작업을 실행할 수 있습니다. 이처럼 `useEffect`는 컴포넌트가 처음 마운트될 때 필요한 초기 작업을 수행할 수 있도록 해줍니다.\n\n또한, `useEffect`는 **의존성 배열에 지정된 값이 변경될 때**마다 다시 호출됩니다. 이때, `useEffect`의 return 값으로 지정된 클린업 함수가 이전 props 및 state와 함께 먼저 호출된 후, 본문의 실행 로직이 업데이트된 props 및 state와 함께 실행됩니다.  \n두 번째 인자로 주어지는 의존성 배열은 `useEffect`가 어떤 상태나 props의 변화에 반응할지를 결정합니다. 예를 들어 `useEffect(() => {...}, [count])`처럼 `count` 상태가 의존성 배열에 있을 경우, `count` 값이 변경될 때마다 `useEffect`가 호출됩니다. 이를 통해 특정 상태나 props가 변경될 때마다 필요한 동작을 수행하도록 할 수 있으며, 컴포넌트의 변화에 따라 동적으로 실행되는 로직을 설정할 수 있습니다.  \n**단, 의존성 배열을 넘기지 않을 경우에는 매 렌더링마다 호출**됩니다.\n\n마지막으로, **컴포넌트가 언마운트될 때  `useEffect`의 return 값으로 지정된 클린업 함수가 호출**됩니다. 이 정리 함수를 이용하여 이벤트 리스너 제거, 타이머 해제, 구독 취소 등의 작업을 수행할 수 있습니다. 이를 통해 `useEffect`를 통해 발생한 부수효과를 정리하는 것입니다.\n\n요약하자면, `useEffect`는 컴포넌트가 **처음 렌더링된 후**, **의존성 배열의 값이 변경될 때**, 그리고 **컴포넌트가 언마운트될 때** 호출됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[React] effect 정리가 업데이트 시마다 실행되는 이유](https://ko.legacy.reactjs.org/docs/hooks-effect.html#explanation-why-effects-run-on-each-update)\n- [[React] 외부 시스템과 연결](https://ko.react.dev/reference/react/useEffect#connecting-to-an-external-system)", "title": "useEffect가 호출되는 시점에 대해 설명해 주세요."}, "fe-35": {"id": "fe-35", "content": "자바스크립트의 `Promise`는 **비동기 작업을 관리하고, 해당 작업의 성공 또는 실패 결과를 나중에 사용할 수 있도록 하는 객체**입니다. 정리해서 말씀드려보자면, `Promise`는 비동기 작업의 완료 여부를 약속해주는 개념이라고 할 수 있습니다.\n\n자바스크립트는 **비동기 처리를 위한 콜백 함수**를 많이 사용합니다. 하지만 콜백 함수는 코드가 복잡해짐에 따라 콜백이 중첩되는 **\"콜백 지옥\"** 문제를 야기할 수 있습니다. Promise는 이러한 비동기 처리의 가독성을 높이고, 코드의 흐름을 명확하게 관리할 수 있도록 도와주는 방식입니다.\n\nPromise는 다음과 같은 **3가지 상태**를 가지는데요.\n첫번째로는 비동기 작업이 아직 완료되지 않은 초기 상태를 나타내는 `Pending`, 두번째로는 비동기 작업이 성공적으로 완료되어 값을 반환한 상태인 `Fulfilled`, 그리고 마지막으로 비동기 작업이 실패하여 오류를 반환한 상태인 `Rejected`입니다.\n\n`Promise` 객체는 비동기 작업을 수행할 함수를 인자로 받아서 실행하며, 이 함수는 `resolve()`와 `reject()`라는 두 가지 콜백을 받습니다.\n\n`resolve()`는 비동기 작업이 성공했을 때 값을 전달하여 `Promise`를 `fulfilled` 상태로 전환하고, \n`reject()`는 비동기 작업이 실패했을 때 오류를 전달하여 `Promise`를 `rejected` 상태로 전환합니다.\n\n`Pending` 상태에서 `Fulfilled`나 `Rejected` 상태로 전환되면, 이후에는 다른 상태로 전환되지 않으며, 그 결과 값을 통해 해당 작업의 성공 여부를 알 수 있습니다.\n\n`Promise`는 **코드의 가독성을 높이고, 비동기 작업의 흐름을 제어**하는 데에 매우 유용합니다. 특히 여러 개의 `Promise`를 순차적으로 연결할 수도 있고 `Promise.all()` 이나 `allSettled()` 같은 메서드를 통해 병렬로 비동기 작업을 처리할 수도 있습니다.\n\n## 그럼 Promise의 단점은 없나요? 🤔\n\n`Promise`는 비동기 작업의 가독성을 높이는데에 도움이 되지만 크게 2가지의 단점이 있습니다.\n\n첫번째로는 **복잡한 에러 처리**입니다.  \n`Promise`는 단일 체인에서는 에러 처리가 간단하지만, 여러 Promise가 중첩되거나 서로 다른 비동기 흐름에서 에러가 발생할 경우 복잡도가 증가할 수 있습니다. 예를 들어, `then()` 체인 내의 중간 단계에서 오류가 발생하면 `catch` 블록에서 이를 캐치할 수 있지만, 특정 단계에서만 발생하는 에러를 세밀하게 다루기가 어렵습니다. 따라서 비동기 흐름에서 발생하는 다양한 에러를 모두 처리하려면 코드가 복잡해질 수 있습니다.\n\n두번째로는 **콜백 지옥을 완전히 해결하지는 못한다**는 점입니다.  \n`Promise`는 콜백 지옥 문제를 어느 정도 해결하지만, 비동기 작업이 복잡하게 중첩되면 여전히 콜백과 유사하게 여러 `then()` 메서드가 연속해서 사용되며 가독성이 떨어질 수 있습니다. 여러 `Promise`를 순차적으로 실행해야 할 때 `then()` 체인을 계속 사용하면 코드의 들여쓰기 구조가 복잡해지고 이해하기 어려워지는 문제점이 있습니다. 이는 `async/await`을 통해 개선할 수 있습니다.", "title": "자바스크립트 Promise에 대해서 아는 대로 설명해주세요."}, "fe-36": {"id": "fe-36", "content": "**ES6(ECMAScript 2015)는 자바스크립트의 최신 버전**으로, 2015년에 공식 발표되었습니다. ES6는 코드의 가독성과 유지보수성을 높이고, 현대 웹 애플리케이션의 요구를 반영하기 위한 여러 기능들을 제공합니다. 주요 변경사항을 몇 가지 설명해 드리겠습니다.\n\n첫째, **`let`과 `const` 키워드가 추가**됐습니다. `let`은 변수 선언, `const`는 상수 선언에 사용됩니다. `var`와 달리 `let`과 `const`는 블록 스코프를 가지므로 코드의 안정성이 더 높습니다. 또한, 변수 선언 이전에 접근했을 때 `undefined`가 할당되지 않고, `ReferenceError`가 발생한다는 점에서도 차이가 있습니다.\n\n둘째, **화살표 함수(Arrow Function)가 도입**되었습니다. 기존의 함수 정의 방식보다 간결하고 가독성이 좋습니다. 또한 this의 바인딩을 호출 문맥과 일치시키기 때문에 함수 내부에서의 혼란이 줄었습니다.\n\n셋째, **클래스 문법이 추가**되었습니다. 이를 통해 객체 지향 프로그래밍의 핵심 개념인 생성자, 상속, 메서드 오버라이딩 등을 자바스크립트에서 활용할 수 있게 되었습니다.\n\n넷째, **템플릿 리터럴이 추가**되었습니다. 문자열 내에 변수를 손쉽게 삽입할 수 있어, 기존의 문자열 연결 방식보다 가독성과 유연성이 향상되었습니다.\n\n그 외에도, 구조 분해 할당, Spread Operator와 Rest Parameter, `Promise` 등 중요한 기능들이 ES6를 기점으로 추가되었습니다.\n\n## 이제 ES6 이전 버전의 문법은 몰라도 괜찮을까요? 🤔\n ES6 이전 버전의 자바스크립트 문법과 특징을 이해하는 것이 여전히 중요하다고 생각합니다. 그 이유는 다음과 같습니다.\n\n첫째, 기존 **코드베이스와의 호환성** 때문입니다. 많은 기존 자바스크립트 프로젝트와 라이브러리들은 ES6 이전 버전의 문법을 사용하고 있습니다. 이러한 코드를 유지보수하거나 활용하려면 ES6 이전 문법에 대한 이해가 필요합니다.\n\n둘째, 대규모 프로젝트의 경우 ES6 도입을 위해서는 **점진적인 마이그레이션**이 필요한데, 이 과정에서 ES6 이전 문법과 ES6 문법이 혼재되어 사용될 수 있습니다. 따라서 이전 버전 문법에 대한 이해가 필요합니다.\n\n끝으로, ES6 기능을 구형 브라우저에서 사용하려면 **폴리필이나 트랜스파일러를 활용**해야 하는데, 이때에도 ES6 이전 문법에 대한 기본적인 이해가 필요할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n\n[[w3schools] ES6 추가된 기능](https://www.w3schools.com/js/js_es6.asp)  \n[[Dabel Tech Blog] ES6 이후의 변경점 총 정리](https://dabletech.oopy.io/bddc4a6e-1d91-4b62-b426-d5f01debc968)\n", "title": "ES6에 대해서 아는 대로 설명해 주세요."}, "fe-37": {"id": "fe-37", "content": "**함수 선언식**과 **함수 표현식**은 **자바스크립트에서 함수를 정의**하는 두 가지 방법으로, 이 둘의 주요 차이점은 **호이스팅**에 있습니다.\n\n**함수 선언식**은 이름이 있는 함수입니다. **함수 선언식**은 자바스크립트 엔진이 코드를 실행하기 전에 메모리에 로드하기 때문에 **호이스팅이 발생**합니다. 즉, 함수 선언식으로 정의된 함수는 코드 내 어디서든 호출할 수 있습니다.\n\n```js\nconsole.log(add(2, 3)); // 5\n\nfunction add(a, b) {\n    return a + b;\n}\n```\n\n여기서 `add` 함수는 선언된 위치보다 앞에서 호출해도 정상 작동합니다. 이는 자바스크립트 엔진이 실행 전에 함수 선언을 미리 메모리에 로드했기 때문입니다.\n\n그에 반해 **함수 표현식**은 **변수에 익명 함수를 할당**하는 방식으로, 할당된 변수명으로 호출할 수 있습니다. 함수 표현식은 호이스팅이 되지 않으며, 변수에 할당된 이후에만 호출할 수 있습니다. 따라서 코드의 흐름상 변수가 선언된 후에만 해당 함수를 사용할 수 있습니다.\n\n```js\nconsole.log(multiply(2, 3)); // not defined 에러 발생\n\nconst multiply = function (a, b) {\n    return a * b;\n};\n```\n\n정리해서 말씀 드려보자면 함수 선언식은 호이스팅이 되어 코드의 어디서든 호출이 가능하지만, 함수 표현식은 변수에 할당된 후에만 사용할 수 있습니다.", "title": "함수 선언식과 함수 표현식의 차이점에 대해서 설명해주세요."}, "fe-38": {"id": "fe-38", "content": "`resolve()`와 `fulfilled`는 Promise에서 비동기 처리시 사용되는 값들이지만, 차이점이 존재합니다.\n간단히 말씀드리면, `resolve()`는 Promise를 **완료**시키는 함수이고, `fulfilled`는 해당 `Promise`가 **완료된 상태**를 뜻합니다.\n\n`resolve()`는 `Promise`가 성공적으로 끝났을 때 결과 값을 넘겨주는 함수입니다. 예를 들어 어떤 비동기 작업이 잘 끝났을 때, `resolve()`를 호출해서 \"이 작업이 끝났고 결과는 이것이다\"라고 전달하게 됩니다. 이렇게 `resolve()`가 호출되면, `Promise`의 상태는 '이행됨' 상태로 바뀌는데, 이를 `fulfilled`라고 부릅니다.\n\n예를 들어, `new Promise((resolve, reject) => { resolve('완료'); })`처럼 `resolve()`를 호출하면, 이 `Promise`의 상태는 `fulfilled`로 변경됩니다. 이처럼 `resolve()`는 `fulfilled` 상태로 전환시키는 역할을 합니다.\n\n따라서 `resolve()`는 `Promise`를 성공적으로 **마무리 짓는 행위**라고 볼 수 있고, `fulfilled`는 그 결과로 발생하는 **완료된 상태**를 의미합니다.\n \n## resolve에서 작업이 실패할 수도 있나요? 🤔\n\n`resolve()`가 실패하는 상황은 발생하지 않습니다. `resolve()`는 `Promise`를 '이행(`fulfilled`)'으로 만드는 함수이기 때문에, 성공적인 결과를 전달할 때 사용되며 실패 자체와는 관련이 없습니다. 만약 `Promise`가 실패한다면, `resolve()`가 호출조차 되지 않고 `reject()`가 호출됩니다.\n\n비동기 작업이 성공적으로 완료되면 `resolve()`가 호출되어 `fulfilled` 상태가 되고, 오류나 실패가 발생하면 `resolve()`가 아닌 `reject()`가 호출되어 `rejected` 상태가 됩니다.\n\n추가로, `then()`은 `resolve()`된 값을 처리하고, `catch()`는 `reject()`된 오류를 처리하는 식으로 `Promise`의 결과를 다루게 됩니다.", "title": "Promise의 resolve()와 fulfilled에 대해서 설명해주세요."}, "fe-39": {"id": "fe-39", "content": "### Error Boundary란?\n**Error Boundary**는 React **컴포넌트에서 발생하는 오류를 잡아내고, 전체 애플리케이션이 다운되는 것을 방지하기 위한 특수한 컴포넌트**입니다. 일반적으로 클라이언트에서 오류가 발생할 때 표시할 UI를 제공하여, 애플리케이션의 신뢰성과 사용자 경험을 높이는 데 활용됩니다. 클래스형 컴포넌트의 `componentDidCatch`와 `getDerivedStateFromError` 두 가지 라이프사이클 메서드를 사용하여 오류 발생 시의 행동을 정의할 수 있습니다. Error Boundary는 **클래스형 컴포넌트에서만 사용**할 수 있습니다.\n\n### Error Boundary가 필요한 이유\nReact는 기본적으로 비동기 작업에서 발생하는 오류를 자동으로 처리하지 않으므로, 오류가 발생할 경우 페이지 전체가 하얗게 변하거나 사용자 입장에서 알 수 없는 화면이 표시되는 상황이 발생할 수 있습니다. 이는 사용자 경험을 크게 저해하고, 특히 대규모 애플리케이션에서 신뢰성에 큰 문제가 됩니다. **Error Boundary**는 이러한 문제를 해결하여 **에러가 발생한 영역에서 대체 UI를 표시하고, 애플리케이션의 나머지 부분은 정상적으로 동작하도록** 도와줍니다. Error Boundary를 적절히 배치하면, 오류가 발생한 컴포넌트만 대체 UI로 전환되어 애플리케이션의 안정성을 유지하고, 사용자에게 오류 메시지나 대체 화면을 제공하여 더 나은 사용자 경험을 제공합니다. 더불어 Error Boundary는 오류 발생 시의 대체 UI 로직을 **선언형으로** 작성할 수 있게 하여 코드의 가독성과 유지 보수성을 높이는 데 도움이 됩니다. \n\n## 선언형으로 처리한다는 게 무슨 의미이며, 그게 왜 유지 보수성에 도움이 되나요? 🤔\n선언형으로 처리한다는 의미는, **개발자가 “무엇을 해야 하는지”를 정의하는 방식**으로, “어떻게 할지”에 대한 세부적인 절차를 직접 작성하지 않아도 된다는 것을 뜻합니다. 예를 들어, Error Boundary에서 “이 컴포넌트가 오류를 감지하면 특정 대체 UI를 보여준다”와 같은 목적을 코드 상에서 명시함으로써, 실제로 오류가 발생할 때 실행되는 세부적인 절차는 컴포넌트가 알아서 처리하게 됩니다.\n\n유지 보수성에 도움이 되는 이유는, **선언형 코드가 명령형 코드에 비해 직관적이고 간결하여 가독성이 높기 때문**입니다. Error Boundary를 예로 들면, 특정 Error Boundary로 감싼 영역이 어떤 방식으로 에러를 처리할지 한 눈에 알 수 있습니다. 또한, 비즈니스 로직과 에러 처리 로직이 명확하게 분리되어 코드의 복잡성이 낮아집니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n* [[리액트 공식문서] error boundary로 렌더링 오류 포착하기](https://ko.react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary)\n* [[카카오 엔터테인먼트] 정호일님 - React의 Error Boundary를 이용하여 효과적으로 에러 처리하기](https://fe-developers.kakaoent.com/2022/221110-error-boundary/)\n", "title": "Error Boundary가 무엇이며, 이를 사용하는 이유는 무엇인가요?"}, "fe-4": {"id": "fe-4", "content": "tanstack-query에서 `staleTime`과 `gcTime`은 데이터를 캐싱하고 관리하는 데 중요한 두 가지 설정 값입니다.\n먼저 요약해서 말씀 드려보자면, `staleTime`은 **데이터가 얼마나 오래 '신선한 상태'로 유지되는지**를 정하는 시간이고, `gcTime`은 **해당 쿼리를 사용하는 곳이 없게 된 이후에도 캐시 데이터를 얼마 동안 유지할지**를 정하는 시간입니다.\n\n먼저, `staleTime`은 데이터를 처음 가져온 후에 그 **데이터를 '신선한' 상태로 간주하는 시간**을 말합니다.\n`staleTime` 내에는 같은 쿼리에 대한 새로운 네트워크 요청이 일어나지 않고, 캐시 데이터를 그대로 사용하게 됩니다. 예를 들어, `staleTime`을 5분으로 설정하면, 데이터를 가져오고 나서 5분 동안은 이 데이터가 '신선하다'고 판단해서 refetch가 트리거되더라도 추가 네트워크 요청 없이 캐시 데이터를 계속 사용합니다. 그리고 `staleTime`이 지난 후 refetch가 트리거된다면 새로운 요청을 보내 데이터를 갱신하게 됩니다. \n`staleTime`의 기본값은 0입니다. \n\n\n반면에 `gcTime`은 **해당 쿼리가 더 이상 사용되지 않을 때, 캐시 데이터가 메모리에 얼마나 더 남아 있을지를 정하는 시간**입니다.  \n`staleTime`이 지나면 데이터는 '오래된' 상태가 되지만, 여전히 캐시된 데이터는 사용이 가능합니다. 이 캐시 데이터는 새로운 요청을 보내 신선한 데이터를 받아오기 이전에 임시로 기존 데이터를 표시하는 데 활용됩니다.  \n다만, 해당 쿼리가 사용되지 않게 된 시점으로부터 `gcTime`으로 설정된 시간이 지나면 캐시에서 데이터가 삭제됩니다. 예를 들어, `gcTime`을 10분으로 설정하면, 해당 쿼리를 사용하는 컴포넌트가 모두 언마운트된 시점으로부터 10분 후에 캐시에서 데이터가 삭제됩니다. tanstack-query에서 설정한 기본 `gcTime`은 5분입니다.\n\n정리해서 말씀드려보자면, `staleTime`은 **데이터를 처음 가져온 후 얼마 동안 네트워크 요청 없이 캐시된 데이터를 사용할지**를 정하는 시간이고, `gcTime`은 해당 **쿼리가 사용되지 않게 된 후에도 캐시에 유지될** 시간을 정하는 겁니다. 이렇게 각각의 설정을 통해 데이터를 더 효율적으로 관리하고, 불필요한 네트워크 요청을 줄이면서도 최신 데이터를 가져올 수 있도록 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[tanstack-query 공식문서] caching example](https://tanstack.com/query/v5/docs/framework/react/guides/caching)\n- [[tanstack-query 공식문서] staleTime property](https://tanstack.com/router/latest/docs/framework/react/api/router/RouteOptionsType#staletime-property)", "title": "tanstack-query에서 stale time과 gc time의 차이점에 대해서 설명해주세요"}, "fe-40": {"id": "fe-40", "content": "**CORS는 서로 다른 출처(origin)에서 제공되는 리소스에 접근할 수 있도록 허용하는 정책입니다.**  \n기본적으로 브라우저에는 보안 상의 이유로 **동일 출처 정책(Same-Origin Policy)** 이 적용되어 있습니다. 해당 리소스가 같은 출처에서 제공되는 것이 아니라면 브라우저가 이를 차단하도록 되어 있습니다. 다시 말해, 다른 출처의 서버에 요청을 보낼 경우, 해당 요청에 대한 응답에 접근할 수 없도록 막습니다. 이러한 정책은 보안을 강화하지만, 이로 인해 **합법적인 요청까지 차단될 수 있습니다**. 그러한 상황을 해결하기 위해 CORS가 개발되었습니다.\n\n**CORS를 적용하는 법**을 설명드리겠습니다. 서버 측에서 **Access-Control-Allow-Origin** 헤더를 설정하면, 특정 출처에서의 접근을 허용할 수 있습니다. 예를 들어, `Access-Control-Allow-Origin: *`로 모든 출처에 대해 허용하거나 특정 출처만 선택적으로 허용할 수 있습니다. 추가로, **Access-Control-Allow-Methods**와 **Access-Control-Allow-Headers** 헤더를 통해 HTTP 메소드나 특정 헤더를 허용할 수도 있습니다. 이는 서버에서 수행되는 동작이므로, 프론트엔드 개발자는 일반적으로 서버 개발자에게 클라이언트의 도메인을 허용하도록 요청해야 합니다.\n\n## 동일 출처 정책(Same-Origin Policy)은 어떤 공격을 막기 위해 존재하는 건가요? 🤔\n\n**동일 출처 정책**은 주로 **크로스사이트 요청 위조(CSRF)** 공격의 위력을 낮추기 위해 존재합니다.\n\n**CSRF 공격**은 악성 웹사이트가 사용자의 요청을 도용하여, 의도치 않은 요청을 서버에 보내게 만드는 공격입니다. 예를 들어, 피해자가 공격자의 웹 사이트에 들어왔을 때 해당 사용자의 요청인 것처럼 타 사이트에 GET 요청을 보내 사용자의 개인정보를 탈취할 수 있습니다. SOP는 악성 사이트에서 임의로 다른 출처의 서버로 요청을 보내거나, 응답에 접근하는 것을 막아, CSRF 공격의 효과를 줄여줍니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[toss payments] CORS(교차 출처 리소스 공유)](https://docs.tosspayments.com/resources/glossary/cors)", "title": "CORS(Cross-Origin Resource Sharing)는 무엇이며 왜 필요한가요?"}, "fe-41": {"id": "fe-41", "content": "React에서 불필요한 리렌더링을 방지하는 방법에 대해 설명드리겠습니다.\n\n첫째, **React.memo**를 활용하여 컴포넌트를 메모이제이션할 수 있습니다. 이는 컴포넌트의 props가 변경되지 않으면 컴포넌트를 리렌더링하지 않도록 합니다. 특히 부모 컴포넌트가 자주 업데이트되는 상황에서 유용합니다.\n```js\nconst MemoizedComponent = React.memo(MyComponent);\n```\n<br />\n\n둘째, **useMemo**와 **useCallback** 훅을 사용하여 각각 값과 함수를 메모이제이션할 수 있습니다. `useMemo`는 계산 비용이 많이 드는 연산 결과를, `useCallback`은 자식 컴포넌트에 전달되는 콜백 함수를 메모이제이션합니다.\n```\nconst memoizedValue = useMemo(() => computeExpensiveValue(a, b), [a, b]);\nconst memoizedCallback = useCallback(() => doSomething(a, b), [a, b]);\n```\n<br/>\n\n마지막으로, **React DevTools의 Profiler**를 활용하여 불필요한 리렌더링이 발생하는 컴포넌트를 식별하고 최적화할 수 있습니다.\n\n이러한 최적화는 성능 문제가 실제로 발생할 때 적용하는 것이 좋으며, 과도한 최적화는 코드의 복잡성을 증가시킬 수 있다는 점을 항상 고려해야 합니다.\n\n## useCallback과 useMemo와 같은 메모이제이션은 되도록 많은 곳에 적용할수록 성능이 좋아지나요? 🤔\n\n아니요, 메모이제이션을 무분별하게 적용하는 것은 오히려 성능에 부정적인 영향을 미칠 수 있습니다. 메모이제이션도 결국 또다른 비용이 발생하는 작업이기 때문입니다. React는 이전 값을 메모리에 저장해야 하므로 메모리 비용이 발생하고, 의존성 배열의 각 항목을 비교하는 작업을 수행해야 하기도 합니다.\n\n```jsx\n// 이런 간단한 함수의 경우 메모이제이션이 오히려 불필요합니다.\nconst handleClick = useCallback(() => {\n  console.log('clicked');\n}, []);\n\n// 반면, 복잡한 연산의 경우 메모이제이션이 효율적입니다.\nconst expensiveValue = useMemo(() => {\n  return complexCalculation(items);\n}, [items]);\n```\n\n복잡한 계산이 필요한 경우, 컴포넌트가 자주 리렌더링되는 경우 등 성능 최적화가 필요한 경우에만 메모이제이션이 성능에 도움이 됩니다. 따라서 성능 최적화는 실제 병목이 발생하는 지점을 React DevTools Profiler로 확인하고, 선별적으로 적용하는 것이 바람직합니다.", "title": "리액트에서 컴포넌트가 불필요하게 리렌더링되는 상황을 방지하기 위한 방법을 설명해 주세요."}, "fe-42": {"id": "fe-42", "content": "리액트의 **동시성 모드**는 여러 작업을 **비동기적으로 동시에 처리하면서도 중간에 더 중요한 작업이 들어오면 우선순위를 바꿔서 그 작업을 먼저 처리하는 기능**을 의미합니다. 예전 리액트는 스택 구조로 이루어졌습니다. 즉 한 번 렌더링을 시작하면 끝까지 멈추지 않고 다 처리해야 했습니다. 하지만 동시성 모드에서는 중간에 멈추거나 작업을 잠시 뒤로 미뤄둘 수 있어서 중요한 작업을 먼저 끝낼 수 있게 되었습니다.\n\n이 동시성을 활용하여 리액트는 중요한 작업과 덜 중요한 작업을 나눠서, 덜 중요한 작업은 백그라운드에서 진행하고 중요한 부분은 바로 사용자에게 보여줍니다. 예를 들어 검색창에 뭔가를 입력하고 있을 때, 그에 맞춰 검색 결과가 업데이트되더라도, 리액트가 해당 작업을 백그라운드에서 처리하게 해서 화면이 느려지지 않게 할 수 있습니다.\n\n## 동시성을 활용한 기능에는 무엇이 있나요? 🤔\n\n첫번째로 `startTransition`이란 기능을 이용하면 특정 상태 업데이트를 “덜 중요한 작업”으로 분류해서, 사용자가 클릭하거나 입력하는 반응 같은 중요한 업데이트가 우선적으로 처리 됩니다. 또 `useDeferredValue`라는 훅을 사용하면 값의 업데이트를 잠깐 지연시킬 수 있어서, 사용자가 뭔가 빠르게 입력할 때마다 리렌더링되지 않게 최적화할 수 있습니다.\n\n동시성 모드의 장점은 사용자와 상호작용하는 부분이 훨씬 매끄럽게 느껴진다는 것입니다. 예를 들어, 사용자가 스크롤할 때 다른 무거운 작업이 있다 하더라도, 동시성 모드 덕분에 스크롤이 우선적으로 부드럽게 작동하게 만들 수 있습니다.\n\n\n## 동시성 기능을 활용할때 주의할 점은 없을까요? 🧐\n\n주의할 점은 모든 컴포넌트에 이 동시성 모드를 무분별하게 적용하면 오히려 성능이 떨어질 수 있다는 점입니다. 그래서 필요한 부분에만 이 동시성 모드를 잘 활용하는 것이 중요하다고 볼 수 있습니다.\n\n## 그럼 동시성이 필요한 부분은 언제인가요? 🤔\n\n동시성이 필요한 상황은 주로 **사용자와의 상호작용이 빈번하고 응답성이 중요한 경우**입니다.\n\n첫 번째 예로, **검색 필터링**이나 **자동 완성** 같은 기능이 있습니다. 사용자가 검색어를 입력할 때마다 결과가 업데이트되는 경우, 모든 입력마다 화면이 리렌더링된다면 앱이 느려지고 입력할 때마다 끊김을 느낄 수 있습니다. 이때 동시성 모드를 사용하면 검색어 입력 자체가 더 중요한 작업이 되어 검색 결과 업데이트는 백그라운드에서 처리되므로, 입력이 빠르고 부드럽게 유지됩니다.\n\n두 번째로, **무거운 데이터나 리스트를 로딩하는 경우**에 유용합니다. 예를 들어 긴 스크롤 목록을 보면서 네트워크를 통해 데이터를 로딩할 때, 새로운 항목을 추가로 불러오는 작업보다 사용자가 현재 보고 있는 화면의 스크롤이 더 중요한 작업입니다. 이때 동시성을 사용하면 로딩은 백그라운드로 넘기고, 스크롤을 최우선으로 부드럽게 렌더링할 수 있습니다.\n\n또한, **애니메이션이 포함된 화면 전환이나 중요도가 높은 사용자 입력 작업**도 동시성을 고려할 만한 케이스입니다. 사용자가 버튼을 클릭했을 때 UI가 즉각적으로 반응하고, 이후에 비동기 작업이 처리되도록 설정해 주면 클릭 시의 지연 없이 상호작용이 자연스러워집니다.", "title": "리액트 동시성 모드(Concurrent Mode)에 관해서 설명해주세요."}, "fe-43": {"id": "fe-43", "content": "`Suspense`와 기존 로딩 상태 관리 방식인 `useEffect()`와 loading state는 로딩 상태를 관리하는 방식에서 근본적인 차이가 있습니다. 기존 방식에서는 데이터를 불러올 때 `useEffect()` 훅을 사용하고, 로딩 상태를 관리하기 위해 `isLoading`이라는 별도의 상태 변수를 만들어야 합니다. 예를 들어, 데이터를 불러오는 동안엔 `isLoading`을 `true`로 설정하고, 데이터가 다 불러온다면 `false`로 바꾸는 식입니다. 그래서 조건에 따라 로딩 UI를 보여주는 식으로 작동합니다. 이 방식은 간단한 상황에서는 충분히 유효하지만, 여러 개의 비동기 데이터를 다룰 때에는 조건부 렌더링 로직이 복잡해질 수 있습니다.\n\n반면, `Suspense`는 로딩 중인 컴포넌트를 직접 렌더링하지 않고, `Suspense` 컴포넌트의 `fallback` 속성으로 로딩 UI를 정의하게끔 합니다. 데이터를 기다리는 동안에는 `fallback`으로 정의된 UI만 보여주고, 데이터가 모두 준비되면 `Suspense`에 감싸진 컴포넌트를 자연스럽게 표시합니다. 이렇게 로딩 상태를 선언적으로 관리할 수 있기 때문에, 전체적인 코드가 단순해지고 유지보수도 쉬워집니다.\n\n## Suspense의 단점은 무엇일까요? 🤔\n\n여러 개의 `Suspense` 컴포넌트를 중첩하거나 트리 구조로 사용할 경우, 각 `Suspense`가 독립적으로 로딩 상태를 관리하기 때문에 데이터 준비 시점이 다를 수 있습니다. 그 결과 로딩 화면(fallback)이 여러 번 표시되거나 비일관적인 UI 경험이 발생할 수 있습니다. 이를 적절히 제어하기 위해서는 트리의 구조와 데이터 로딩 흐름을 신중하게 설계해야 합니다.\n\n또한 `Suspense`는 `Promise` 기반의 비동기 작업만 지원합니다. 따라서 일반적인 `fetch` 요청에 바로 적용할 수 있는 것이 아니라, 이를 위해 추가적인 라이브러리를 사용하거나 `Suspense`와 호환되는 형태로 `Promise`를 관리해야 합니다.\n\n\n", "title": "useEffect를 이용하여 로딩 상태 관리하는 방법과 Suspense를 활용하는 방법에 대한 차이점을 설명해주세요."}, "fe-44": {"id": "fe-44", "content": "\n`localStorage`와 `sessionStorage는` 브라우저에서 제공하는 클라이언트 측 저장소 API로, 둘 다 데이터를 키-값 쌍 형태로 저장합니다.\n\n차이점은 **데이터의 지속성**과 **범위**에 있습니다.\n\n`localStorage는` 데이터를 영구적으로 저장합니다.\n브라우저를 닫거나 장치를 재부팅해도 데이터가 유지되며, 동일한 도메인 내의 모든 탭에서 데이터를 공유할 수 있습니다.\n\n사용 예로는 다크모드 같은 테마 설정이나 장바구니 데이터와 같이 장기적으로 유지해야 하는 데이터 저장에 적합합니다.\n\n`sessionStorage`는 데이터가 현재 브라우저 세션 동안만 유지되며, 브라우저 탭이나 창을 닫으면 데이터가 삭제됩니다.\n또한, 같은 도메인이라도 탭 간에는 데이터를 공유하지 않습니다.\n\n사용 예로는 로그인 후 인증 데이터를 일시적으로 저장하거나, 특정 탭에서만 사용할 데이터를 관리하는 데에 있습니다.\n\n결론적으로, localStorage는 장기 데이터 저장에, sessionStorage는 탭 단위로 데이터를 관리하거나 일시적인 데이터 저장에 적합합니다.\n\n## localStorage와 sessionStorage를 사용했을때 문제점은 없을까요? 🤔\n\nlocalStorage와 sessionStorage 둘다 보안 관점에서는 주의가 필요합니다.\nlocalStorage에 민감한 데이터를 저장하면 영구적으로 유지되므로 보안 위험이 큽니다.\n\n반대로, sessionStorage는 세션 종료 시 데이터가 자동 삭제되기 때문에 민감한 데이터를 임시 저장하는 데 더 적합하지만 여전히 보안적인 문제는 남아있습니다.\n\n## 스토리지를 사용했을때 발생하는 보안 문제는 어떻게 해결할 수 있나요? 🧐\n\n브라우저 저장소는 데이터를 암호화하거나 보호할 방법이 기본적으로 제공되지 않기 때문에 민감한 데이터를 직접 저장하지 않는 것이 가장 중요합니다.\n\n그러므로 가장 직관적인 방법은 민감한 데이터는 스토리지에 저장하지 않는 것입니다.\n\n인증 토큰이나 사용자 비밀번호는 localStorage 또는 sessionStorage에 저장하지 않고, `HTTP-Only 쿠키`를 사용합니다. 이렇게 하면 자바크스립트에서 접근할 수 없으므로 XSS 공격에 대한 위험을 줄일 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[제로초] 로컬스토리지, 세션스토리지](https://www.zerocho.com/category/HTML&DOM/post/5918515b1ed39f00182d3048)\n- [[Inpa Dev] [JS] LocalStorage / SessionStorage (vs 쿠키와 비교)](https://inpa.tistory.com/entry/JS-📚-localStorage-sessionStorage)\n", "title": "localStorage와 sessionStorage의 차이점에 대해서 설명해주세요."}, "fe-45": {"id": "fe-45", "content": "**TanStack Query**는 **서버 상태 관리의 복잡성을 극복하기 위해** 사용하는 라이브러리입니다. 여기서 **서버 상태**란 **서버에서 제공하는 데이터**로, 클라이언트에서 직접 수정할 수 없고 네트워크 요청과 같은 비동기 작업을 통해 가져오거나 갱신해야 하는 데이터를 의미합니다.\n\nTanStack Query를 사용하는 주요 이유는 다음과 같습니다.\n\n첫째, **효율적인 캐싱 처리 기능**을 제공합니다. 이를 통해 동일한 데이터를 반복적으로 요청하지 않아 네트워크 비용을 절감하고, 캐싱된 데이터를 즉시 제공해 더 나은 사용자 경험을 제공할 수 있습니다.\n\n둘째, **비동기 데이터 관리의 복잡성을 줄여줍니다**. TanStack Query는 데이터의 가져오기(fetch), 갱신(refetch), 무효화(invalidate) 등의 작업을 선언적으로 처리할 수 있어 코드가 간결해지고 유지보수가 용이해집니다.\n\n셋째, **에러 및 로딩 상태 관리를 단순화**합니다. `useQuery()`와 `useMutation()` 훅을 사용하면 서버 데이터와 관련된 로딩, 성공, 실패 상태를 명확하고 직관적으로 처리할 수 있어 로직이 깔끔해집니다.\n\n이처럼 TanStack Query는 서버 상태 관리에서 발생하는 복잡한 문제를 해결하고 개발자가 비즈니스 로직에 더 집중할 수 있도록 도와줍니다.\n\n## TanStack Query를 사용할 때 발생할 수 있는 단점이나 한계는 무엇인가요? 🤔\n\nTanStack Query는 서버 상태 관리를 간편하게 해주지만, 사용 시 몇 가지 단점 및 한계가 있습니다.\n\n첫째, **캐싱 전략 관리의 복잡성**입니다. TanStack Query는 강력한 캐싱 기능을 제공하지만, `staleTime`, `gcTime` 같은 옵션을 잘못 설정하면, 데이터 갱신 타이밍이 적절하지 않아 최신 데이터가 사용자에게 노출되지 않거나 불필요한 요청이 발생할 수 있습니다.\n\n둘째, **초기 학습 곡선이 존재**합니다. Query Key 설계, 데이터 무효화 등 다양한 개념을 이해하고 적절히 활용해야 하므로 초기에 학습해야 하는 지식의 양이 많습니다.\n\n마지막으로, **클라이언트 상태와 서버 상태 간 의존 관계가 복잡한 경우**, TanStack Query만으로는 해결하기 어려울 수 있습니다. 이때는 Redux, Zustand 등 별도의 상태 관리 라이브러리가 필요할 수 있습니다.\n\n## 📚 추가 자료를 공유합니다.\n- [제작자가 소개하는 Tanstack Query [영문]](https://www.youtube.com/watch?v=seU46c6Jz7E)\n- [[HIGHJOON DEV] (번역) Practical React Query](https://highjoon-dev.vercel.app/blogs/1-practical-react-query)\n", "title": "Tanstack Query를 사용하는 이유를 설명해 주세요."}, "fe-46": {"id": "fe-46", "content": "**번들러**는 **다양한 파일과 모듈을 하나의 배포 가능한 번들로 묶는 역할**을 합니다. 번들러가 필요한 주요 이유는 다음과 같습니다.\n\n첫째, **네트워크 요청 성능을 개선**하기 위해서입니다. 다수의 개별 파일에 대해 모두 네트워크 요청을 수행할 경우, 성능에 부정적인 영향이 있을 수 있습니다. 번들러는 **다수의 파일을 하나 또는 소수의 파일로 묶어 네트워크 요청을 최적화**합니다. 예를 들어, 애플리케이션이 수백 개의 JavaScript, CSS, 이미지 파일을 사용한다면, HTTP 요청 수가 증가해 로딩 속도가 느려질 수 있습니다. 이때 번들러는 이들을 효율적으로 묶어 소수의 파일로 만듦으로써 네트워크 요청 수를 줄여줍니다.\n\n둘째, **번들러는 트랜스파일링을 통해 더 효율적이고 호환성 있는 애플리케이션**을 만드는데 기여합니다.\n먼저, **트랜스파일링을 통해 코드를 최적화**합니다. 예를 들어, `Dead Code Elimination`과 `Tree Shaking`과 같은 방법을 통해 사용되지 않는 코드와 불필요한 모듈을 제거해 번들 크기를 줄이고 로딩 성능을 개선합니다.  \n또한, 번들러는 **호환성을 높이기 위해 최신 JavaScript 문법과 기능을 구형 브라우저에서도 실행 가능하도록 변환**합니다. 예를 들어, ES6 이상의 모듈, 비동기 함수, 옵셔널 체이닝 같은 최신 기능은 지원하지 않는 브라우저에서 문제가 될 수 있는데, 번들러는 이를 ES5로 변환하여 호환성을 보장합니다. 이때 Babel 같은 트랜스파일러와 연계하여 처리하기도 합니다. \n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 썬의 모듈 번들러와 빌드도구](https://www.youtube.com/watch?v=9b89f21Sizs)", "title": "webpack, rollup과 같은 번들러는 왜 필요한지 설명해주세요."}, "fe-47": {"id": "fe-47", "content": "`이벤트 버블링`은 이벤트가 발생했을 때 가장 안쪽의 타겟 요소에서 시작하여 부모 요소로 전파되는 방식입니다. 예를 들어, 버튼을 클릭했을 때 버튼 자체에서 이벤트가 발생한 후 이 이벤트가 상위 요소인 div, body, document, window로 전파되는 과정을 거치게 됩니다. **기본적으로 브라우저는 이벤트 전파를 버블링 단계에서 처리하도록 설계**되어 있습니다.\n\n반면, `이벤트 캡처링`은 이와 반대 방향으로 진행됩니다. 즉, 이벤트가 최상위 부모 요소에서부터 시작해 점점 타겟 요소로 내려오면서 전파됩니다. 예를 들어, window에서 이벤트가 시작되어 document, body, div를 거쳐 버튼에 도달하게 되는 방식입니다. 기본적으로 캡처링 단계는 비활성화되어 있지만, addEventListener 함수의 세 번째 옵션으로 캡처링을 활성화할 수 있습니다. 이 옵션에 true를 설정하면 캡처링 단계에서 이벤트를 처리할 수 있습니다.\n\n버블링과 캡처링은 각각의 특성 덕분에 서로 다른 상황에서 유용하게 활용됩니다. 버블링은 특히 `이벤트 위임` 같은 패턴에서 활용도가 높습니다. 예를 들어, 동적으로 추가되는 자식 요소가 있는 상황에서는 부모 요소에 이벤트 리스너를 등록하여 자식 요소들의 이벤트를 효율적으로 관리할 수 있습니다. 이렇게 하면 각각의 자식 요소마다 이벤트 리스너를 따로 등록할 필요가 없으므로 성능적인 이점이 생깁니다. 예를 들어, 리스트 항목(li)의 클릭 이벤트를 처리할 때 부모 요소인 ul에 리스너를 하나만 등록하여 모든 li의 클릭 이벤트를 처리할 수 있습니다.\n\n한편, 캡처링은 부모 요소에서 자식 요소보다 먼저 이벤트를 처리해야 할 때 유용합니다. 예를 들어, 페이지의 전체적인 트래킹이나 로깅 기능을 구현할 때 캡처링 단계에서 이벤트를 처리하면 자식 요소에서의 추가 이벤트 처리 여부와 관계없이 부모에서 로직을 먼저 실행할 수 있습니다.\n\n## 이런 이벤트 버블링과 캡처링 과정에서 발생할 수 있는 문제는 없을까요? 🤔\n\n이벤트 버블링과 캡처링 과정에서 발생할 수 있는 문제는, 이벤트 중첩으로 인해 동일 이벤트가 중복 처리되는 상황, 캡처링 단계에서 불필요한 이벤트가 처리되는 성능 문제, 이벤트 위임 시 타겟 오작동 등 다양한 사례가 있습니다.\n\n하지만 이러한 문제들을 제어하기 위해 두 가지 주요 메서드를 사용할 수 있습니다.\n\n첫째, `stopPropagation` 메서드를 호출하면 특정 이벤트가 현재 단계에서 멈추고 더 이상 부모나 자식으로 전파되지 않도록 할 수 있습니다. 이는 복잡한 UI 구조에서 불필요한 이벤트 처리를 방지할 때 유용합니다.\n\n둘째, `preventDefault` 메서드를 사용하면 링크 클릭 시 페이지 이동이나 폼 제출과 같은 브라우저의 기본 동작을 방지할 수 있습니다.", "title": "이벤트 버블링과 캡처링에 대해 설명해주세요."}, "fe-48": {"id": "fe-48", "content": "리액트에서 **컴포넌트는 UI를 구성하는 독립적이고 재사용 가능한 코드 조각**이라고 설명드릴 수 있습니다. 컴포넌트는 특정 기능이나 UI 요소를 캡슐화합니다. 잘 만들어진 컴포넌트는 주로 단일 책임 원칙을 따릅니다. \n\n리액트 내에서 컴포넌트는 크게 **클래스형**과 **함수형**으로 나눌 수 있는데, 최근에는 Hooks의 도입으로 함수형 컴포넌트가 주로 사용되고 있습니다. 함수형 컴포넌트는 더 간결하고 이해하기 쉬운 코드를 작성할 수 있게 해줍니다.\n\n컴포넌트의 주요 장점은 **재사용성**과 **유지보수성**입니다. 예를 들어, 버튼 컴포넌트를 한 번 만들면 여러 페이지에서 다양한 스타일과 기능으로 재사용할 수 있습니다. 또한 컴포넌트는 props를 통해 부모로부터 데이터를 전달받을 수 있어, 동적인 UI를 손쉽게 구현할 수 있습니다.\n\n## 컴포넌트 설계 시 중요하게 고려해야 하는 사항에는 어떤 것들이 있나요? 🤔\n\nReact 컴포넌트 설계 시에는 다음과 같은 사항들을 고려해야 합니다.\n\n첫째, **하나의 컴포넌트가 너무 많은 책임을 갖지 않도록 해야 합니다.** 컴포넌트의 역할이 명확하도록 설계해야 합니다. 물론, 이를 고려하지 않아도 정상 작동은 하겠지만, 추후의 유지보수성을 고려해야 하는 상황이라면 하나의 컴포넌트가 너무 많은 책임을 가지지 않도록 하는 것이 중요합니다. 대표적인 예시로, 비즈니스 로직과 UI 로직을 철저히 분리하는 것을 들 수 있습니다.\n\n둘째, **재사용성을 고려**해야 합니다. 만약 특정 컴포넌트가 여러 상황에서 재사용될 가능성이 높다면 유연하게 설계해야 추후 재사용이 용이합니다. props를 통해 필요한 데이터와 동작을 주입받아 다양한 상황에서 쉽게 재사용될 수 있도록 하는 것이 좋습니다. 이를 '컴포넌트가 춤을 춘다'고 비유적으로 표현하기도 합니다.\n\n셋째, **성능 최적화**를 고려해야 합니다. 불필요한 리렌더링을 방지하기 위해 메모이제이션을 적절히 활용하고, 컴포넌트의 크기를 적절히 유지해야 하는 것이 좋습니다.\n\n사실, 이밖에도 고려해야 할 상황이 정말 많으며, 앞서 말씀드린 사항들이 모든 상황에 똑같이 적용되는 것도 아닙니다. 가장 중요한 것은, **각각의 상황에 맞는 컴포넌트를 만드는 것**이라고 생각합니다. 유지보수성, 성능, 재사용성 등이 어떠한 상황에서는 중요할 수도, 어떠한 상황에서는 중요하지 않을 수도 있습니다. 이를 적절하게 판단하여 **당장의 상황에 부합하는 최적의 컴포넌트**를 만들어 내기 위해 고민하는 태도가 중요합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [토스ㅣSLASH 22 - Effective Component 지속 가능한 성장과 컴포넌트](https://www.youtube.com/watch?v=fR8tsJ2r7Eg)\n- [[10분 테코톡] 호프의 프론트엔드에서 컴포넌트](https://www.youtube.com/watch?v=aAs36UeLnTg)", "title": "리액트에서 컴포넌트란 무엇인가요?"}, "fe-49": {"id": "fe-49", "content": "타입스크립트를 사용하는 주요 이유로 크게 세 가지를 들 수 있습니다.\n\n첫째, **정적 타이핑을 통해 코드의 안정성을 크게 향상**시킬 수 있습니다. 개발 시 타입 오류를 런타임으로 실행하기 이전에 발견할 수 있어 런타임 에러를 줄이고, 코드의 품질을 개선할 수 있습니다. 이러한 장점은 특히 대규모 프로젝트에서 두드러집니다.\n\n둘째, **개발자의 생산성을 높여줍니다**. IDE의 자동완성 기능과 인텔리센스가 더 많은 정보를 제공할 수 있게 되기 때문에 코드 작성 속도가 빨라지고, 리팩토링이 쉬워집니다. 또한 명시적인 타입 정의가 마치 문서화의 역할을 하여 코드의 가독성과 이해도가 높아집니다.\n\n셋째, **객체지향 프로그래밍의 일부 기능을 자바스크립트에 추가**합니다. 인터페이스, 제네릭, 열거형 등 현대적인 기능을 지원하여 더욱 구조화되고 확장 가능한 코드를 작성할 수 있습니다.\n\n정리하면 타입스크립트는 자바스크립트의 한계를 극복하고, 안정성, 생산성, 기능성을 향상시키는 데 큰 도움이 됩니다.\n\n## 타입스크립트를 도입하지 않는 것이 더 나은 경우도 있나요? 🤔\n타입스크립트를 도입하지 않는 것이 더 적합한 프로젝트는 주로 **개발 속도**와 **간단함**이 중요한 소규모 프로젝트입니다. 예를 들어, **프로토타입 제작**이나 **단순한 랜딩 페이지**처럼 빠른 개발 주기가 요구되고 복잡한 로직이 없는 경우, 타입스크립트를 설정하고 사용하는 것이 오히려 과도한 비용이 될 수 있습니다.\n\n또한, 팀 내에 **타입스크립트에 대한 경험이 부족하거나 러닝 커브를 극복할 시간이 없는 경우**에도 도입을 신중히 고려해야 합니다. 타입스크립트는 초기 설정과 코드 작성이 더 엄격하기 때문에, 팀이 익숙하지 않다면 생산성이 오히려 저하될 수 있습니다.\n\n마지막으로, **기존 자바스크립트 프로젝트가 매우 방대하고, 타입스크립트로 전환하는 데 드는 비용이나 리소스를 감당할 수 없는 경우**에도 도입이 적합하지 않을 수 있습니다. 이런 경우, 점진적 도입 또는 순수 자바스크립트를 유지하면서 코드 리뷰와 테스트 강화로 대안을 마련할 수 있습니다.\n\n## 타입스크립트를 새롭게 도입하는 것을 추진할 때, 팀원들을 어떻게 설득하실 건가요? 🧐\n\n타입스크립트의 장점과 실질적 이점을 명확히 전달하는 것이 중요하다고 생각합니다. 먼저, **타입스크립트가 런타임 에러를 줄이고 코드 안정성을 강화한다**는 점을 강조할 것입니다. 특히, 유지보수 비용이 큰 프로젝트나 복잡한 코드베이스가 있는 상황이라면, 타입 시스템이 협업과 코드 품질을 어떻게 개선할 수 있는지 실제 사례를 통해 차이점을 보여줄 것입니다.\n\n다음으로, **초기 학습 곡선과 도입에 대한 부담을 완화할 수 있는 점진적 도입 전략**을 제안할 것 같습니다. 예를 들어, 신규 코드에만 타입스크립트를 부분 도입하거나, 주요 모듈에 한정해 적용하는 방법을 제안해볼 것 같습니다. 또한, 팀이 학습에 부담을 느끼지 않도록 공식 문서, 타입스크립트 핸드북, 그리고 교육 자료를 제공하여 점진적으로 학습할 수 있는 여건이 마련되도록 노력할 것입니다.\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[코딩애플] 타입스크립트 쓰는 이유 & 필수 문법 10분 정리](https://www.youtube.com/watch?v=xkpcNolC270)\n- [[10분 테코톡] 시지프의 타입스크립트 도약하기](https://www.youtube.com/watch?v=kMuJz6N-Grw)\n\n", "title": "타입스크립트를 사용하는 이유를 설명해주세요."}, "fe-5": {"id": "fe-5", "content": "자바스크립트의 **이벤트 루프**는 자바스크립트가 싱글 스레드 기반 언어임에도 불구하고 **비동기 작업을 처리할 수 있게 해주는** 중요한 메커니즘입니다.\n\n자바스크립트는 기본적으로 한 번에 하나의 작업만 처리할 수 있습니다. 하지만 이벤트 루프가 **콜 스택**과 **태스크 큐**를 매개하면서 비동기 작업이 완료되면 그 결과를 처리할 수 있게 도와줍니다. 여기서, **콜 스택**은 현재 실행 중인 함수들이 쌓이는 곳이고, **태스크 큐**는 비동기 작업이 완료될 때 그 결과를 대기시키는 곳입니다.\n\n이벤트 루프의 동작을 설명하기 위해 간단한 예로 `setTimeout(callback, 0)`을 들어 보겠습니다. `setTimeout(callback, 0)`을 호출하면, 이 콜백 함수는 바로 실행되는 것이 아니라 웹 API에 의해 타이머가 설정되고, 그 타이머가 0밀리초 후에 만료되면 콜백 함수가 태스크 큐에 추가됩니다.\n그 후 콜 스택이 비어 있는 시점에 이벤트 루프가 태스크 큐에서 대기 중인 `callback`을 꺼내서 실행합니다.\n\n따라서 `setTimeout(callback, 0)`을 호출해도 현재 실행 중인 모든 동기 작업들이 완료된 후에야 그 콜백이 실행됩니다. 이 때문에 `setTimeout(callback, 0)`을 사용하면 코드의 실행을 다음 이벤트 루프 사이클로 미뤄집니다.\n\n이와 같이 **이벤트 루프**는 자바스크립트의 **비동기 작업**을 처리하는 데 있어서 매우 중요한 역할을 합니다.\n이벤트 루프 덕분에 자바스크립트는 UI 업데이트나 사용자 입력 처리를 수행하면서도, 비동기 작업을 블로킹 없이 효율적으로 처리할 수 있습니다.\n\n## 앞서 말씀하신 태스크 큐의 종류에는 무엇이 있나요? 🤔\n\n태스크 큐는 **매크로태스크 큐**와 **마이크로태스크 큐**로 나뉩니다.\n\n**매크로태스크 큐**는 `setTimeout()`, `setInterval()`과 같은 일반적인 비동기 작업들이 대기하는 큐입니다. 매크로태스크 큐의 작업은 이벤트 루프가 콜 스택과 마이크로태스크 큐의 작업을 모두 처리한 후, 하나씩 처리합니다.\n\n**마이크로태스크 큐**는 `Promise.then()`과 같이 중요도가 높은 작업들이 대기하는 큐입니다. 마이크로태스크 큐는 매크로태스크 큐보다 우선순위가 높습니다. 이벤트 루프는 콜 스택이 비어있는 시점에 매크로태스크를 실행하기 이전에 마이크로태스크 큐에 있는 모든 작업들을 먼저 처리합니다.\n\n이처럼 태스크 큐는 크게 `마이크로태스크 큐`와 `매크로태스크 큐`로 이뤄져 있으며, `마이크로태스크 큐` 작업은 `매크로태스크 큐` 작업보다 우선적으로 실행됩니다.\n\n\n\n\n\n\n\n", "title": "이벤트 루프에 대해서 설명해주세요."}, "fe-50": {"id": "fe-50", "content": "`서버 컴포넌트`는 리액트 18 버전에서 도입된 새로운 기능입니다. 기본적으로 클라이언트에서 실행되는 기존의 리액트 컴포넌트와 다르게 **서버에서만 렌더링되는 컴포넌트**를 말합니다. 서버에서만 실행되기 때문에 브라우저 쪽 번들 크기를 줄이고, 초기 로딩 속도를 개선하는 데 큰 장점이 있습니다.\n\n예를 들어, 서버 컴포넌트는 데이터베이스나 API에서 데이터를 가져오는 작업을 서버에서 처리하고, 그 결과를 클라이언트로 보낼 수 있어서 클라이언트와 서버 간의 데이터 통신을 줄일 수 있습니다. 그래서 클라이언트는 필요한 HTML과 JSON만 전달받아 렌더링하면 됩니다.\n\n또한, 서버 컴포넌트는 **보안 측면에서도 강점이 있습니다**. 데이터베이스 연결 정보나 API 키 같은 민감한 정보를 클라이언트로 보내지 않아도 되는 구조라 안전하게 데이터를 다룰 수 있습니다.\n\n리액트에서는 서버 컴포넌트를 클라이언트 컴포넌트와 함께 사용할 수 있도록 설계했습니다. 클라이언트 컴포넌트는 인터랙션이 필요한 UI를 담당하고, 서버 컴포넌트는 데이터 중심의 UI를 담당하는 식으로 역할을 분리할 수 있습니다.\n\n결론적으로, 서버 컴포넌트는 **성능 최적화와 보안 개선, 그리고 개발자 경험 측면에서 많은 이점을 가져다줄 수 있는 기능**이라고 말씀드릴 수 있습니다.\n\n## 서버 컴포넌트의 단점은 없을까요? 🤔\n\n첫 번째로는 **서버 의존성 증가**입니다. 서버 컴포넌트는 이름 그대로 서버에서 실행되기 때문에, 서버가 반드시 필요합니다. 따라서 서버가 다운되거나 응답 시간이 느려지면 클라이언트에서도 영향을 받게 됩니다.\n특히, 정적 사이트나 서버리스 환경에서 작업하려는 경우에는 사용할 수 없거나 제약이 있을 수 있습니다.\n\n두번째로는 **사용자 경험**과 **인터랙션 문제**입니다.\n서버 컴포넌트는 클라이언트 컴포넌트와 결합해서 사용해야 하는데, 이 과정에서 복잡한 사용자 인터랙션(예: 실시간 업데이트, 드래그 앤 드롭 등)을 처리하기 어렵습니다.\n서버 컴포넌트는 주로 정적인 데이터나 렌더링에 적합하기 때문에, 클라이언트 쪽의 인터렉션이 필요한 경우에는 한계가 있을 수 있습니다.\n\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [리액트 공식 문서](https://ko.react.dev/reference/rsc/server-components)\n- [React 18: 리액트 서버 컴포넌트 준비하기](https://tech.kakaopay.com/post/react-server-components/)", "title": "서버 컴포넌트에 대해서 설명해주세요."}, "fe-51": {"id": "fe-51", "content": "`Streaming SSR`은 서버에서 렌더링된 HTML을 한 번에 완성해서 보내는 방식이 아니라, 준비된 부분부터 점진적으로 스트리밍해서 클라이언트에 전달하는 기술입니다. 이를 통해 사용자는 페이지의 중요한 콘텐츠를 더 빠르게 확인할 수 있습니다.\n\n기존 SSR은 서버에서 모든 데이터를 처리한 뒤 완전한 HTML을 전송하는 반면, Streaming SSR은 서버가 데이터를 준비하는 즉시 HTML 조각을 스트림 형태로 보내고, 클라이언트는 이를 실시간으로 렌더링합니다. React 18에서는 `renderToPipeableStream API`를 통해 구현할 수 있으며, 이 API는 서버에서 HTML을 조각 단위로 스트리밍할 수 있도록 지원합니다. 예를 들어, onShellReady 옵션을 사용해 스트림을 응답으로 바로 전송할 수 있습니다.\n\n```js\nrenderToPipeableStream(<App />, {\n  onShellReady() {\n    res.setHeader('Content-Type', 'text/html');\n    stream.pipe(res);\n  },\n});\n  ````\n\n이 방식의 가장 큰 장점은 초기 로딩 시간을 단축할 수 있다는 점입니다. HTML의 일부라도 준비되는 즉시 클라이언트가 렌더링을 시작하므로 TTFB(Time to First Byte)가 개선됩니다. 특히 데이터가 많거나 복잡한 대규모 애플리케이션에서 효과적이며, 사용자가 중요한 콘텐츠를 먼저 확인할 수 있어 전반적인 사용자 경험도 향상됩니다. 다만, 클라이언트에서 부분적으로 전송된 HTML을 제대로 Hydration할 수 있도록 설계가 필요하며, SEO나 캐싱 정책과의 호환성도 신중히 고려해야 합니다.\n\n이러한 특징과 장점을 통해 Streaming SSR은 기존 SSR의 한계를 극복하며, 더욱 빠르고 효율적인 웹 페이지 렌더링을 가능하게 만듭니다.\n\n## 스트리밍된 데이터와 리액트의 Hydration 과정에서 발생할 수 있는 문제는 무엇인가요? 🤔\n\n주요한 문제점은 렌더링 되는 HTML과 리액트의 **상태 불일치**라고 말씀드릴 수 있습니다.\n\nHTML과 리액트 상태의 불일치 문제는 스트리밍된 HTML이 서버에서 먼저 클라이언트로 전송되고, 리액트가 실행되기 전까지는 그냥 정적인 상태로만 보여지는 데서 시작됩니다. 이후 Hydration 과정에서 이 HTML에 리액트의 상태와 이벤트 핸들러가 결합되는데, 이때 서버와 클라이언트 사이 데이터가 맞지 않으면 문제가 생길 수 있습니다.\n\n예를 들어, 서버에서 렌더링된 데이터가 클라이언트에서 Hydration 시점에 변경되어 있다면 리액트가 경고를 띄우거나, 예상치 못한 UI 동작이 나타날 수 있습니다. 또, 비동기 데이터 처리를 Suspense로 하고 있다면, 데이터가 늦게 로드되면서 UI가 달라질 가능성도 있습니다.\n\n## 그럼 이러한 불일치 문제를 해결하려면 어떻게 해야하나요? 🧐\n\n이런 문제를 막으려면, 서버와 클라이언트에서 동일한 데이터 소스를 사용해야 합니다. 예를 들어, Tanstack Query 같은 라이브러리를 활용하면 데이터를 동기화하기가 훨씬 수월해집니다. 또, Suspense와 fallback을 잘 활용하면, 데이터가 아직 준비되지 않았을 때도 안정적인 화면을 보여줄 수 있습니다. 이렇게 하면 사용자 입장에서 데이터가 로드되기 전에 UI가 흔들리는 문제를 줄일 수 있습니다.\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [renderToPipeableStream 관련 공식 문서](https://ko.react.dev/reference/react-dom/server/renderToPipeableStream)", "title": "Streaming SSR에 관하여 설명해주세요."}, "fe-52": {"id": "fe-52", "content": "**HTTP(Hypertext Transfer Protocol) 는 웹 상에서 클라이언트와 서버 간 데이터를 주고받는 데 사용되는 통신 규약**입니다. 클라이언트가 서버에 요청을 보내고, 서버가 이에 대한 응답을 반환하는 방식으로 동작합니다. HTTP는 **비연결성(stateless)** 을 특징으로 하여 한 번의 요청-응답이 끝나면 연결이 종료됩니다. 또한, 통신이 안전하게 연결될 수 있도록 TCP 연결을 사용합니다.\n\nHTTP는 HTML, JSON 등 **다양한 데이터 포맷**을 전달할 수 있습니다. 요청과 응답에는 **URL 경로, 각종 메서드, 상태 코드와 헤더** 등 정해진 몇 가지 정보를 포함합니다.\n\nHTTP의 보안을 강화한 버전인 **HTTPS(Hypertext Transfer Protocol Secure)** 는 HTTP에 TLS/SSL 프로토콜에 따라 데이터를 암호화하여 전송합니다. 이를 통해 보안 상 중요한 정보들을 안전하게 보호하여 통신을 주고 받습니다.\n\n## HTTP와 함께 자주 언급되는 RESTFul API은 무엇인가요?  🤔\n\n**RESTful API는 REST(Representational State Transfer) 스타일을 준수하여 설계된 API**를 의미합니다. 여기서 **REST는 웹의 리소스를 클라이언트와 서버가 일관된 방식으로 처리할 수 있도록 하는 설계 원칙**입니다.\n\n기본적으로 REST에서는 리소스를 고유한 URI로 표현하고, HTTP 메서드(GET, POST, PUT, DELETE 등)를 사용해 행위를 표현합니다. 예를 들어, /users URI에 GET 요청을 보내면 사용자 목록을 가져오는 API로 동작할 수 있습니다.\n\n다음은 REST의 핵심 규칙들입니다.\n1.\t**클라이언트-서버 분리**: 클라이언트와 서버 간 역할을 명확히 분리합니다.\n2.\t**무상태성(Stateless)**: 서버는 클라이언트의 상태를 저장하지 않으며, 각 요청은 독립적으로 처리합니다.\n3.\t**일관된 인터페이스(Uniform Interface)**: 고유한 URI로 리소스를 식별하고 일관된 인터페이스를 통해 클라이언트와 서버가 간단하고 예측 가능하게 통신할 수 있게 합니다.\n4.\t**캐시 가능성**: 가능하다면, 서버의 응답 시간을 개선하기 위해 리소스 캐싱을 지원합니다.\n\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[토스 페이먼츠 개발자 센터] HTTP 프로토콜](https://docs.tosspayments.com/resources/glossary/http-protocol)\n- [[IBM] REST, RESTful API 란 무엇인가요?](https://www.ibm.com/kr-ko/topics/rest-apis)\n- [[Naver D2] 그런 REST API로 괜찮은가](https://www.youtube.com/watch?v=RP_f5dMoHFc)\n- [[생활코딩] 기계들의 대화법 - REST API](https://www.youtube.com/watch?v=PmY3dWcCxXI)\n", "title": "HTTP란 무엇인지 설명해 주세요."}, "fe-53": {"id": "fe-53", "content": "Body와 Header의 가장 큰 차이는 **정보(데이터)의 역할**입니다.\n\n**Header**는 **데이터의 메타 정보**를 담습니다. 즉,  데이터 자체가 아니라 데이터에 대한 컨텍스트 정보를 포함합니다. 이로써 **수신자가 데이터를 어떻게 처리해야 할지 지침을 제공**하는 역할을 합니다. 예를 들어, HTTP 요청이나 응답에서 Header에는 `Content-Type`, `Authorization`, `Cache-Control`과 같은 정보가 포함됩니다. 이는 정보의 유형, 인증 정보, 캐시 설정 등 컨텍스트 정보를 전달합니다. \n\n반면 **Body는 전송하려는 실제 데이터**를 의미합니다. HTTP 요청에서 서버로 전달하는 JSON 데이터나 폼 데이터가 이에 해당됩니다. 일반적으로 헤더에 비해 복잡하고 용량이 큰 데이터를 포함합니다.   \n\n즉, Header는 네트워크 통신에서 안내 역할을, Body는 본질적인 데이터를 전달하는 역할을 맡고 있습니다. 이 둘의 조화가 효율적인 통신을 가능하게 합니다.\n\n## Header 크기에 제한이 있나요? 🤔\nHTTP 표준을 정의하는 문서인 HTTP RFC에 따르면, Header의 명시적인 크기 제한은 정해져 있지 않습니다. 다만, Apache, Nginx와 같은 웹서버 단에서 Header의 크기를 제한하고 있는 경우가 많습니다. 일반적으로, 8KB-16KB로 설정되어 있습니다. 이러한 제한값을 초과할 경우, 일반적으로 응답코드 `413(Content Too Large)`를 응답합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] HTTP 헤더](https://developer.mozilla.org/ko/docs/Web/HTTP/Headers)\n", "title": "네트워크 통신에서 Body(Payload)와 Header의 차이는 무엇인가요?"}, "fe-54": {"id": "fe-54", "content": "**제로 런타임 CSS**는 CSS-in-JS의 단점을 보완하기 위해 등장한 방식입니다. 기존에 많이 쓰이던 CSS-in-JS 방식은 스타일을 컴포넌트 안에서 작성해서 동적으로 생성합니다. 이러한 방식은 런타임에서 CSS를 만들다 보니 성능 문제가 생길 가능성이 있습니다.\n\n예를 들어, 사용자가 페이지를 로딩할 때마다 CSS를 동적으로 계산해서 DOM에 삽입하면, 브라우저가 이를 처리하는 데 시간이 걸리게 됩니다. 특히, 앱이 커질수록 성능이 떨어질 수 있고, CSS를 캐싱하기도 어려운 문제가 존재합니다. 그래서 나온 방식이 **빌드 시점에 CSS를 미리 다 만들어 놓는 제로 런타임 CSS 방식**입니다.\n\n기존 CSS-in-JS 방식은 사용자가 앱을 실행할 때 CSS를 동적으로 생성했는데, 이 과정이 성능에 부담을 주는 경우가 있었습니다.\n특히 렌더링이 복잡한 페이지에서 스타일 생성이 많아질수록 느려질 가능성이 큽니다. 동적으로 생성되는 CSS는 정적인 파일처럼 브라우저가 캐싱할 수 없어서, 매번 렌더링 될때마다 새롭게 계산해야 하기도 합니다. 또한 런타임에서 필요한 모든 스타일을 생성하려다 보니, 사용되지 않는 CSS 코드까지 포함되는 경우가 발생합니다.\n\n반면에 제로 런타임 CSS는 앱이 실행되기 전에, 빌드 시점에 모든 스타일을 정적인 CSS 파일로 변환하는 방식입니다. 이렇게 된다면 런타임에 추가로 CSS를 생성하지 않으니 로딩 속도가 더 빠르고, 사용되지 않는 CSS는 빌드 과정에서 제거되기 때문에 최종 파일 크기가 작아집니다.\n\n## 제로 런타임 CSS의 단점은 무엇이 있나요? 🤔\n\n런타임에서 **동적으로 생성해야 하는 스타일을 구현하기가 까다롭습니다**. 예를 들어, 사용자 입력값에 따라 스타일이 달라지는 경우엔 추가 로직을 작성해주어야 합니다. 또한 스타일을 빌드 시점에 모두 처리해야 하다 보니, 빌드 시간이 기존보다 길어질 수 있습니다.\n\n\n## 추가 학습 자료를 공유합니다.\n\n[제로 런타임 css중 하나인 vanilla-extract의 공식 홈페이지](https://vanilla-extract.style/)", "title": "제로 런타임 css란 무엇인가요?"}, "fe-55": {"id": "fe-55", "content": "자바스크립트에서 클래스의 **Public, Private, Protected** 접근제어자는 클래스 멤버의 접근 범위를 제어하는 데 사용됩니다.\n\n**Public**은 별도 키워드를 붙이지 않았을 때 기본 적용되는 접근제어자로, 클래스 외부에서도 자유롭게 접근 가능합니다. 예를 들어, `this.name = \"John”;`처럼 선언된 멤버는 Public으로 간주됩니다. 이는 클래스 외부에서 객체를 통해 직접 접근할 수 있습니다.\n\n**Private**은 멤버 앞에 `#` 키워드를 붙여 적용하는 접근제어자로, 클래스 내부에서만 접근 가능하게 됩니다. 예를 들어, `this.#secret = \"hidden”;`처럼 선언된 멤버는 Private으로 간주됩니다 . Private 멤버는 객체를 통한 외부 접근이 불가능하며, 상속받은 클래스에서도 사용할 수 없게 됩니다.\n\n**Protected**는 자바스크립트 언어 차원에서 지원하지 않지만, 관습적으로 `_`를 접두어로 사용해 개발자 간 약속으로 처리합니다. 예를 들어, `this._secret = ‘hidden’;`과 같은 방식으로 선언하여 Protected임을 나타냅니다. 이는 상속받은 클래스에서 접근하는 것은 허용하지만 클래스 외부에서는 사용하지 말라는 의미를 나타냅니다. 즉, 클래스 외부에서 객체를 통한 접근은 하지 않을 것을 개발자들 간에 약속하는 것입니다. 이는 언어 차원의 강제성은 없습니다.\n\n접근제어자를 활용하면 코드의 캡슐화를 통해 데이터 보호와 유지보수를 향상시킬 수 있습니다.\n\n\n## 타입스크립트에서는 접근제어자와 관련해 어떤 차이점이 존재하나요? 🤔\n\n첫째, **타입스크립트에서는 자바스크립트에서 지원하지 않는 접근제어자 키워드들을 제공**하기 때문에 더욱 명시적인 방식으로 접근제어자를 선언할 수 있습니다.\n\n`public` 키워드를 이용하여 **Public 멤버**임을 선언할 수 있습니다. 아무 키워드를 붙이지 않을 때와 동작은 동일하지만 그 의미를 명시적으로 나타낼 수 있게 해줍니다.   \n\n`#` 키워드 대신 `private` 키워드를 이용하여 **Private 멤버**임을 선언할 수 있습니다.  \n\n`_` 키워드 컨벤션 대신 `protected` 키워드를 이용하여 **Protected 멤버**임을 선언할 수 있습니다. \n\n**예시**  \n```ts\nclass Foo {\n  public a: string; // 상속 클래스 접근 O / 외부 접근 O\n  private b: number; // 상속 클래스 접근 X / 외부 접근 X\n  protected c: boolean; // 상속 클래스 접근 O / 외부 접근 X\n\n  constructor(a: string, b: number, c: boolean) {\n    this.a = a;\n    this.b = b;\n    this.c = c;\n  }\n}\n```\n\n둘째, **타입스크립트에서는 파라미터 프로퍼티(Parameter Properties) 기능을 제공**합니다. 이는 생성자 매개변수에 접근제어자를 붙이면 해당 변수를 멤버로 자동 선언하고 초기화되는 기능입니다. 이로 인해 코드를 간결하게 작성할 수 있습니다.\n\n**예시** \n```ts\nclass Foo {\n  constructor(public a: string, private b: number, protected c: boolean) {\n    // 이 부분을 채우지 않아도 자동으로 멤버 선언 및 초기화\n  } \n}\n```\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[타입스크립트 공식 문서] Member Visibility](https://www.typescriptlang.org/docs/handbook/2/classes.html#member-visibility)\n- [[타입스크립트 공식 문서] Parameter Properties](https://www.typescriptlang.org/docs/handbook/2/classes.html#parameter-properties)", "title": "자바스크립트 클래스의 접근제어자에 대해 설명해주세요."}, "fe-56": {"id": "fe-56", "content": "**px은 화면의 물리적인 픽셀 단위를 기준으로 한 고정 단위**입니다. 이 값은 절대적인 크기를 나타내며, 요소의 크기가 고정되어 디바이스의 해상도나 사용자 설정에 영향을 받지 않습니다. 예를 들어, `font-size: 16px`으로 설정하면 항상 16픽셀 크기로 표시됩니다. 픽셀 단위는 간단하고 정확한 제어를 제공하지만, 사용자의 접근성 설정(예: 브라우저에서 텍스트 크기 확대)에 따라 조정되지 않아 유연성이 떨어질 수 있습니다.\n\n**em은 해당 요소에 현재 적용된(즉, 부모 요소 또는 현재 요소의) font-size를 기준으로 하는 상대 단위**입니다. 기본적으로, 브라우저의 초기 폰트 크기가 16px이므로, 상속받은 기본값이 없을 경우 1em은 16px로 계산됩니다. 그러나 상위 요소에 따라 상대적으로 크기가 결정되므로, 계층 구조가 깊어질수록 값이 누적되어 예기치 않은 크기로 설정될 수 있습니다. 예를 들어, 부모 요소가 `font-size: 20px`이고 자식 요소가 `font-size: 1.5em`으로 설정되면, 자식의 실제 폰트 크기는 30px이 됩니다.\n\n**rem은 root em을 의미하며, 최상위 HTML 요소의 font-size를 기준으로 계산**됩니다. 이는 em과 달리 요소 계층에 따라 크기가 누적되지 않으며, 전역적인 기준을 따릅니다. 예를 들어, HTML의 font-size가 16px로 설정되어 있다면, 1rem은 항상 16px로 계산됩니다. 따라서 rem은 전역적으로 일관된 상대적인 크기를 설정할 때 유용하며, 접근성 측면에서도 사용자 설정에 잘 대응한다는 장점이 있습니다.\n\n## em과 rem이 모두 상대 단위라면, rem을 사용하지 않고 em을 사용해야 하는 경우는 언제인가요? 🤔\nrem을 항상 사용하지 않고 em을 사용하는 경우는 **특정 상황에서 해당 컨텍스트에 따라 상대적인 크기를 지정해야 하는 경우**입니다. em은 부모 요소 또는 현재 요소의 font-size를 기준으로 크기가 결정되므로, 구성 요소 간의 비례적인 크기를 쉽게 조정할 수 있습니다. 예를 들어, 버튼 안의 텍스트와 패딩을 비율로 정의하고 싶을 때, 각각의 속성에 em을 사용하면 텍스트 크기를 조정될 때 패딩이 자연스럽게 비례적으로 조정되도록 할 수 있습니다.\n\n반면, rem은 루트 요소를 기준으로 고정된 상대 크기를 제공하기 때문에 전역적인 일관성에는 적합하지만, 특정 컨텍스트에 맞춘 비례 조정이 필요한 경우에는 부적합할 수 있습니다.\n\n## 📚 추가 학습자료를 공유합니다.\n- [[DaleSeo] CSS 상대 단위 - em과 rem](https://www.daleseo.com/css-em-rem/)\n- [[드림코딩] 프론트엔드 필수 반응형 CSS 단위 총정리 (EM과 REM) | Responsive CSS Units](https://www.youtube.com/watch?v=7Z3t1OWOpHo)", "title": "길이 단위 px, em, rem에 대해 각각 설명해주세요."}, "fe-57": {"id": "fe-57", "content": "**데이터 속성은 사용자 정의 데이터를 HTML 요소에 저장하기 위해 사용되는 속성**입니다. 선언 방법은 `data-`로 시작하는 속성을 HTML 태그에 추가하면 됩니다. 예를 들어, `<div data-user-id=\"12345\" data-role=\"admin\"></div>`와 같이 사용할 수 있습니다. 여기서 `data-user-id`와 `data-role`이 데이터 속성에 해당합니다.\n\n자바스크립트를 통해 데이터 속성에 접근하려면 `dataset` 객체를 활용합니다. 중요한 점은 HTML의 데이터 속성 이름이 JS의 camelCase 형식으로 매핑된다는 것입니다. 예를 들어, `data-user-id`는 `dataset.userId`로, `data-role`은 `dataset.role`로 접근할 수 있습니다. 예를 들어 앞선 예제에서 `해당요소.dataset.userId`를 호출하면 `“12345”`라는 값이 반환됩니다.\n\n또한, CSS에서도 데이터 속성을 활용할 수 있습니다. `attr()` 함수나 속성 선택자를 통해 데이터 속성의 값을 기반으로 스타일을 적용할 수 있습니다.\n```css\n/* attr() 함수를 사용하여 접근 */\narticle::before {\n  content: attr(data-parent);\n}\n\n/* 속성 선택자를 사용하여 접근 */\narticle[data-columns=\"3\"] {\n  width: 400px;\n}\n```\n\n## 데이터 속성은 언제 활용하나요? 🤔\n\n**DOM 요소에 특정 데이터를 바인딩하고, 자바스크립트 로직에서 해당 데이터를 활용하기 위해 사용**됩니다. 예를 들어, 버튼 클릭 이벤트에서 특정 데이터를 전달하거나, 데이터를 기반으로 UI를 동적으로 변경해야 할 때 유용합니다. 이렇게 하면 HTML과 자바스크립트 간 데이터 상호작용을 간단하게 구현할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] 데이터 속성 사용하기](https://developer.mozilla.org/ko/docs/Learn/HTML/Howto/Use_data_attributes)", "title": "HTML 데이터 속성(data-)은 무엇인가요?"}, "fe-58": {"id": "fe-58", "content": "`event.target`과 `event.currentTarget`은 모두 이벤트 객체의 속성이며, 각각 **\"이벤트가 실제로 발생한 요소\"** 와 **\"이벤트 리스너가 연결된 요소\"** 를 가리킵니다. 이 둘의 차이점을 이해하려면 이벤트 버블링을 알아야 합니다. 이벤트는 특정 요소에서 발생한 후 부모 요소들로 전파되는 과정(버블링)을 거치는데, 이 과정에서 `target`과 `currentTarget`이 다르게 동작합니다.\n\n예를 들어, 부모 요소에 이벤트 리스너를 등록했지만 자식 요소에서 이벤트가 발생하여 버블링된 상황에서, `target`은 \"이벤트가 발생한 요소\"인 자식 요소를 가리킵니다. 반면, `currentTarget`은 \"이벤트 리스너가 연결된 요소\"인 부모 요소를 가리킵니다.\n\n쉽게 말해, `target`은 “사용자가 직접 상호작용한, 즉 이벤트가 발생한 요소”를, `currentTarget`은 “그 이벤트를 듣고 있는 요소”를 나타냅니다. 예를 들어, `<div>` 안에 `<button>`이 있고, `<div>`에 이벤트 리스너가 부착되어 있다면, 버튼을 클릭했을 때 `target`은 `<button>`을, `currentTarget`은 `<div>`를 반환합니다.\n\n이 차이는 이벤트 위임이나 이벤트 전파 처리 시 중요합니다. `target`과 `currentTar
