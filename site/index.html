id": "be-143", "content": "JDBC에서 Statement와 PreparedStatement는 모두 SQL 실행을 담당하지만, 사용 방식과 성능, 보안 측면에서 차이가 존재합니다.\n\nStatement 클래스는 문자열 연결을 이용해 SQL을 동적으로 구성해야 합니다. 이러한 특성으로 인해 SQL 인젝션 공격에 취약하다는 단점이 있습니다.\n\n```java\nStatement stmt = conn.createStatement();\nResultSet rs =  30\")\" >stmt.executeQuery(\"select * from users where age > 30\");\n```\n\n반면, PreparedStatement는 동적으로 파라미터를 바인딩할 수 있는 기능을 제공합니다. 값을 바인딩하면 내부적으로 이스케이프 처리하기 때문에 SQL 인젝션 공격을 방지할 수 있습니다.\n\n```java\nString sql = \"select * from users where age > ?\";\nPreparedStatement pstmt = conn.prepareStatement(sql);\npstmt.setInt(1, 30);\nResultSet rs = pstmt.executeQuery();\n```\n\n또한, 쿼리 구조를 미리 확정하고 플레이스홀더를 활용하여 값을 바인딩하는 PreparedStatement를 사용하면 SQL 구문 분석 결과를 캐싱할 수 있어 반복 실행 시 Statement보다 성능이 높은 것으로 알려져 있습니다. \n\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 코코닥의 JDBC](https://youtu.be/ONYVhJGl48U?feature=shared)\n- [PreparedStatement란?](https://umbum.dev/580/)\n- [MySQL JDBC Statement Caching](https://vladmihalcea.com/mysql-jdbc-statement-caching/)\n- [stackoverflow - PreparedStatements and performance](https://stackoverflow.com/questions/687550/preparedstatements-and-performance)\n- [Oracle Java Tutorial - Using Prepared Statements](https://docs.oracle.com/javase/tutorial/jdbc/basics/prepared.html)\n\n\n\n", "title": "Statement와 PreparedStatement의 차이점은 무엇인가요?"}, "be-144": {"id": "be-144", "content": "**이벤트 소싱(Event Sourcing)** 은 데이터의 최종 상태를 저장하는 대신, 상태를 변경시킨 이벤트들의 이력을 저장하는 방식을 의미합니다. 예를 들어, 체스 프로그램을 개발할 때 체스판의 상태를 데이터베이스에 저장하는 방법은 크게 두 가지가 있습니다.\n\n- 첫 번째 방법은 체스판의 상태를 그대로 옮겨서 저장하는 방식입니다. 1a 컬럼에 검은색 폰을 나타내는 bp라는 값을 설정할 수 있습니다.\n- 두 번째 방법은 체스의 기보를 저장하는 방식입니다. '검은색 폰이 1a로 이동했다.'라는 이벤트를 기록합니다. 순서대로 쌓여있는 이벤트를 매 순간 재생(replay)하여 체스판의 최종 상태를 나타낼 수 있습니다.\n\n이때, 후자의 방식처럼 모든 상태 변경을 이벤트로 저장하는 방식을 이벤트 소싱이라고 합니다.\n\n## 이벤트 소싱의 장단점은 무엇인가요?\n\n이벤트 소싱은 모든 이벤트를 저장하기 때문에 언제든지 특정 상태를 재현할 수 있습니다. 최종 상태를 저장하는 방법에서는 과거 기록을 재현하기 어렵지만, 이벤트 소싱을 사용하면 과거의 상태를 재현하는 데 용이합니다. 또한, 특정 문제 상황에 대한 재현과 테스트가 용이하며, 시간에 따라서 비즈니스 로직이 달라지는 경우에 새로운 규칙에 따라서 이벤트를 재생할 수 있기 때문에 비즈니스 로직 변경에 유연하다는 장점이 있습니다.\n\n하지만, 모든 이벤트를 재생해야하기 때문에 읽기 성능이 약화될 수 있습니다. 이는 중간 계산 결과를 따로 저장하는 스냅샷이라는 개념을 사용할 수 있지만, 전통적인 최종 상태를 저장하는 방식에 비해서는 읽기 성능이 떨어질 수 있습니다. 또한, 이벤트를 계속 추가되기만 하기 때문에 상대적으로 대용량의 데이터를 처리해야한다는 단점이 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [이벤트 소싱(Event Sourcing) 개념](https://mjspring.medium.com/%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EC%86%8C%EC%8B%B1-event-sourcing-%EA%B0%9C%EB%85%90-50029f50f78c)\n- [Event Sourcing 맛보기 - 이론편](https://sabarada.tistory.com/231)\n- [이벤트 소싱을 활용해 확장 가능한 사내 플랫폼 만들기 | 당근 SERVER 밋업 2회](https://youtu.be/jTl9WUHDuBc?feature=shared)\n- [스프링캠프 2017 [Day2 A2] : 이벤트 소싱 소개 (이론부)](https://youtu.be/TDhknOIYvw4?feature=shared)\n- [스프링캠프 2017 [Day2 A3] : Implementing EventSourcing & CQRS (구현부)](https://youtu.be/12EGxMB8SR8?feature=shared)\n\n", "title": "이벤트 소싱이란 무엇인가요?"}, "be-145": {"id": "be-145", "content": "**참조 지역성의 원리(Locality of reference)** 는 CPU가 메모리에 접근할 때 주된 경향을 바탕으로 만들어진 원리며, 주로 캐시 메모리의 적중률을 높여 CPU의 메모리 접근 횟수를 줄이는 데 이용됩니다. 참조 지역성의 원리는 크게 시간 지역성과 공간 지역성이 존재하는데요.\n\n- **시간 지역성(Temporal locality)** 이란 CPU는 최근에 접근했던 메모리 공간에 다시 접근하려는 경향이 있다는 것을 의미합니다. \n- **공간 지역성(Spatial locality)** 이란 CPU는 접근한 메모리 공간 근처에 접근하려는 경향이 있다는 것을 의미합니다. \n\n프로그래밍에서 지역 변수에 값을 저장하면 나중에 다시 지역 변수에 접근할 가능성이 높은 것이 시간 지역성의 예시이며, CPU가 인텔리제이 프로그램을 실행할 때는 인텔리제이 프로그램이 모여 있는 공간 근처를 집중적으로 접근하는 것이 공간 지역성의 예시입니다.\n\n## 다음 코드를 어떻게 개선해 볼 수 있을까요?\n\n```java\npublic class LocalityTest {\n\n     @Test\n     void test() {\n        int size = 10240;\n        int[][] array = new int[size][size];\n\n        long beforeTime = System.currentTimeMillis();\n\n        for (int j = 0; j < size; j++) {\n            for (int i = 0; i < size; i++) {\n                array[i][j]++;\n            }\n        }\n\n        long afterTime = System.currentTimeMillis();\n        long diffTime = afterTime - beforeTime;\n       \n        System.out.println(\"수행시간(m) : \" + diffTime); // 577ms\n    }\n}\n```\n\n위 코드는 2차원 배열의 열을 먼저 순회하면서 값을 증가하는 프로그램입니다. 자바에서 2차원 배열은 내부적으로는 1차원 배열(int[])에 대한 참조 배열입니다. array[i]는 각각 독립된 int[] 객체이며, 이들은 메모리상에 반드시 연속적으로 배치되는 것이 보장되지 않습니다. \n\nCPU 캐시는 공간 지역성 원리에 근거를 두어 물리적인 메모리 공간상에 인접한 데이터를 미리 캐싱합니다. 하지만, 열을 먼저 순회하고 행에 접근하게 된다면 물리적인 메모리상에서 멀리 떨어져 있는 데이터를 읽게 되어 캐시 히트율이 떨어집니다. 이 코드를 개선하기 위한 가장 쉬운 방법은 행에 먼저 접근하여 캐시 히트율을 높이는 것입니다.\n\n```java\npublic class LocalityTest {\n\n     @Test\n     void test() {\n        int size = 10240;\n        int[][] array = new int[size][size];\n\n        long beforeTime = System.currentTimeMillis();\n\n        for (int i = 0; i < size; i++) {\n            for (int j = 0; j < size; j++) {\n                array[i][j]++;\n            }\n        }\n\n        long afterTime = System.currentTimeMillis();\n        long diffTime = afterTime - beforeTime;\n       \n        System.out.println(\"수행시간(m) : \" + diffTime); // 28ms\n    }\n}\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 썬의 캐싱](https://youtu.be/H4J-8pPMvEU?feature=shared)\n- [[10분 테코톡] 저문, 라온의 Cache & Redis](https://youtu.be/tVZ15cCRAyE?feature=shared)\n- [한빛미디어 컴퓨터 공학 기초 강의 - 캐시 메모리](https://youtu.be/qLCP0PwRp_w?feature=shared)", "title": "참조 지역성의 원리란 무엇인가요?"}, "be-146": {"id": "be-146", "content": "Bean으로 객체를 관리하는 이유는 애플리케이션의 설계, 확장성, 유지보수 측면에서 많은 이점을 제공하기 때문입니다.\n\n### 1. 의존성 관리 자동화\n빈으로 등록된 객체들은 Spring 컨테이너(BeanFactory, ApplicationContext)가 자동으로 의존성을 주입해줍니다. 개발자가 직접 객체를 생성하고 의존성을 연결할 필요가 없어집니다. 또 컨테이너가 빌드 시점에 순환 의존성을 감지하여 설계 오류를 조기에 발견할 수 있습니다.\n```kotlin\n@Service\nclass OrderService(\n    private val productRepository: ProductRepository,  // 자동 주입\n    private val paymentGateway: PaymentGateway        // 자동 주입\n)\n```\n\n### 2. 싱글톤 패턴 구현\n기본적으로 Spring은 빈을 싱글톤으로 관리하여 메모리 사용을 최적화하고, 불필요한 객체 생성을 방지합니다.\n```kotlin\n// 아래 두 userRepository는 동일한 인스턴스\n@Service\nclass UserService(private val userRepository: UserRepository)\n\n@Service\nclass AuthService(private val userRepository: UserRepository)\n```\n\n### 3. 생명주기 관리\nSpring은 빈의 초기화와 소멸 과정을 자동으로 관리합니다. 이를 통해 리소스 할당 및 해제를 체계적으로 처리할 수 있습니다.\n\n```kotlin\n@Component\nclass DatabaseConnection {\n    @PostConstruct\n    fun initialize() {\n        // 초기화 로직\n    }\n    \n    @PreDestroy\n    fun cleanup() {\n        // 리소스 정리 로직\n    }\n}\n```\n\n### 4. AOP(관점 지향 프로그래밍) 지원\n빈으로 관리되는 객체들은 트랜잭션 관리, 로깅, 보안 등의 공통 관심사를 쉽게 적용할 수 있습니다.\n```kotlin\n@Service\nclass TransferService(private val accountRepository: AccountRepository) {\n    @Transactional  // AOP를 통한 트랜잭션 관리\n    fun transferMoney(from: String, to: String, amount: BigDecimal) {\n        // 송금 로직\n    }\n}\n```\n\n### 5. 테스트 용이성\n빈으로 관리되는 컴포넌트는 모킹(mocking)이나 테스트용 구현체로 쉽게 대체할 수 있어 단위 테스트와 통합 테스트가 용이합니다.\n\n```kotlin\n@SpringBootTest\nclass UserServiceTest {\n    @MockBean\n    lateinit var userRepository: UserRepository\n    \n    @Autowired\n    lateinit var userService: UserService\n    \n    @Test\n    fun testGetUser() {\n        // given\n        val userId = 1L\n        whenever(userRepository.findById(userId)).thenReturn(User(userId, \"Test User\"))\n        \n        // when\n        val result = userService.getUser(userId)\n        \n        // then\n        assertEquals(\"Test User\", result.name)\n    }\n}\n```\n\n### 6. 설정의 중앙화\n애플리케이션의 구성 요소들을 Bean으로 관리함으로써 설정을 중앙화하고 일관된 방식으로 관리할 수 있습니다.\n```kotlin\n@Configuration\nclass AppConfig {\n    @Bean\n    fun dataSource(): DataSource {\n        return HikariDataSource().apply {\n            jdbcUrl = \"jdbc:postgresql://localhost:5432/mydb\"\n            username = \"user\"\n            password = \"password\"\n            maximumPoolSize = 10\n        }\n    }\n}\n```\n\n## 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 주디의 Spring Bean](https://www.youtube.com/watch?v=3gURJvJw_T4)\n- [스프링 탄생 배경, Bean이란?, Bean을 관리하는 컨테이너란?](https://www.youtube.com/watch?v=ShR5CmEUyRY)", "title": "Spring에서 객체를 Bean으로 관리하는 이유를 설명해주세요."}, "be-147": {"id": "be-147", "content": "**명령어 파이프라이닝(instruction pipelining)** 은 CPU가 여러 명령어를 동시에 처리하기 위해 각 명령어를 여러 단계로 분할하고, 각 단계를 다른 명령어와 겹쳐서 실행하는 방법입니다. 전통적인 CPU는 한 번에 하나의 명령어를 처리하는 반면, 파이프라인 기법을 사용하는 CPU는 여러 명령어를 각기 다른 단계에서 동시에 처리할 수 있습니다.\n\n<p align = \"center\">\n\n  <img src = \"https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Fivestagespipeline.png/960px-Fivestagespipeline.png\" />\n\n출처 : 위키 백과\n</p>\n\n## 파이프라인 위험에 대해서 알고 계시나요?\n\n파이프라이닝은 높은 성능을 가져오지만, 때로는 성능 향상에 실패하기도 하는데요. 이를 **파이프라인 위험(pipeline hazard)** 이라고 합니다. 파이프라인 위험에는 크게 데이터 위험, 제어 위험, 구조적 위험이 존재합니다.\n\n- **데이터 위험(data hazard)** 이란 데이터 의존적인 두 명령어를 동시에 실행하는 경우, 파이프라인이 제대로 작동하지 않는 것을 의미합니다. 예를 들어, 명령어 B가 명령어 A의 연산 결과인 R에 의존하는 경우, 명령어 A의 결과 저장 단계가 완료되어야 명령어 B가 R을 사용할 수 있습니다.\n- **제어 위험(control hazard)** 이란 분기(branch)나 조건문 등으로 인해 다음에 실행할 명령어가 무엇인지 결정되지 않아 파이프라인이 멈추게 되는 것을 의미합니다. 분기 예측 기법이 사용되기도 하지만, 예측에 실패하면 계산된 파이프라인은 모두 버려야 해서 성능 저하가 발생합니다.\n- **구조적 위험(structural hazard)** 이란 한 명령어가 자원을 사용하면, 해당 자원이 필요한 다른 명령어는 멈추게 되어 파이프라인이 제대로 작동하지 않는 것을 의미합니다. 서로 다른 명령어가 동시에 ALU, 레지스터와 같은 CPU 자원을 사용하려 할 때 발생합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [안될과학 유튜브 - '컴퓨터'의 구조는 어떻게 되어있을까? CPU와 메모리! [안될과학 - 랩미팅 15화]](https://youtu.be/SiC74U8aJbM?feature=shared)\n- [bRd 3D 유튜브 - CPU는 어떻게 작동할까?](https://youtu.be/Fg00LN30Ezg?feature=shared)\n- [한빛미디어 컴퓨터 공학 기초 강의 - 명령어 사이클과 인터럽트](https://youtu.be/3Yz7OnVUM28?feature=shared)\n- [한빛미디어 컴퓨터 공학 기초 강의 - 명령어 병렬 처리 기법](https://youtu.be/Btsa_U-f26k?feature=shared)\n\n\n\n", "title": "명령어 파이프라이닝에 대해서 설명해 주세요."}, "be-148": {"id": "be-148", "content": "쿠키와 세션은 HTTP의 **무상태(stateless)** 특성을 보완하여 사용자 상태를 유지하는 메커니즘이지만, 여러 측면에서 중요한 차이가 있습니다.\n\n## 데이터 저장 위치\n**쿠키는 클라이언트 측 브라우저**에 저장되는 반면, **세션은 서버 측에 저장**됩니다. 세션은 서버에 데이터를 저장하고 세션 ID만 쿠키를 통해 클라이언트에 전달합니다.\n\n## 보안성\n쿠키는 클라이언트에 저장되므로 사용자가 직접 접근하거나 수정할 수 있어 보안에 취약합니다. 반면 세션은 중요 정보가 서버에 저장되어 상대적으로 안전합니다.\n\n## 용량 제한\n쿠키는 일반적으로 브라우저당 도메인별로 4KB 정도로 제한되어 있습니다. 세션은 서버 리소스에 따라 다르지만 쿠키보다 훨씬 많은 데이터를 저장할 수 있습니다.\n\n## 라이프사이클\n쿠키는 개발자가 설정한 만료 시간까지 유지되며, 만료 시간을 설정하지 않으면 브라우저를 닫을 때 삭제됩니다. 세션은 서버의 설정에 따라 관리되며 일정 시간 요청이 없으면 만료되는 경우가 많습니다.\n\n## 성능 영향\n쿠키는 모든 HTTP 요청에 함께 전송되므로 쿠키가 많을수록 네트워크 트래픽이 증가합니다. 세션은 서버 메모리를 사용하므로, 서버에서 관리하는 사용자의 세션이 많을수록 서버 부하가 증가할 수 있습니다.\n\n일반적으로 사용자 선호 설정이나 로그인 하지 않은 유저의 장바구니와 같은 비민감 정보는 쿠키에, 로그인 정보와 같은 중요 데이터는 세션에 저장하는 것이 적합합니다. 최근에는 JWT와 같은 토큰 기반 인증 방식이 많이 사용되고 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [쿠키와 세션의 차이점 및 보안 고려사항 - F-Lab](https://f-lab.kr/insight/cookie-vs-session)\n- [[Web] 쿠키(Cookie)와 세션(Session)의 차이, 쿠키란? 세션이란?](https://code-lab1.tistory.com/298)", "title": "쿠키와 세션의 차이에 대해서 설명해주세요."}, "be-149": {"id": "be-149", "content": "## 메모리 사용량 차이\n- **스레드**: 각 스레드는 자체 스택 메모리를 필요로 하며, JVM에서 기본적으로 약 1MB의 스택 크기를 할당합니다. 이 메모리는 스레드가 생성될 때 예약되며 스레드가 종료될 때까지 유지됩니다.\n- **코루틴**: 코루틴은 스레드 내에서 실행되며 자체 스택을 필요로 하지 않습니다. 일반적으로 코루틴은 단지 몇 KB의 메모리만 사용합니다.\n\n## 컨텍스트 스위칭 비용\n- **스레드**: 스레드 간 전환은 운영체제 수준의 컨텍스트 스위칭을 필요로 하며, 이는 CPU 레지스터, 메모리 맵 등의 상태를 저장하고 복원하는 비용이 큽니다.\n- **코루틴**: 코루틴 간 전환은 운영체제의 개입 없이 사용자 공간(user space)에서 발생하며, 단순히 실행 지점과 로컬 변수 상태만 heap 메모리에 저장하면 됩니다.\n\n## 생성 및 관리 비용\n- **스레드**: 새 스레드를 생성하는 것은 운영체제에 시스템 호출을 필요로 하며, 커널 수준의 리소스가 할당됩니다.\n- **코루틴**: 코루틴 생성은 단순한 객체 할당과 유사하며, 운영체제 리소스를 직접 소비하지 않습니다.\n\n## 일시 중단 메커니즘\n- **스레드**: 스레드는 블로킹 작업(I/O 등) 중에는 완전히 차단되어 다른 작업을 수행할 수 없습니다.\n- **코루틴**: 코루틴은 일시 중단 지점(`suspend` 함수)에서 실행을 중단하고 기본 스레드를 해제하여 다른 코루틴이 사용할 수 있게 합니다. 이로써 수천 개의 코루틴을 소수의 스레드에서 효율적으로 실행할 수 있습니다.\n\n## 코드 예시로 비교\n\n### 스레드 방식\n```kotlin\n// 1000개의 스레드를 생성하면 약 1GB의 메모리가 필요함\nfor (i in 1..1000) {\n    Thread {\n        // 각 스레드마다 작업 수행\n        Thread.sleep(1000) // 스레드 블로킹\n        println(\"Task $i completed\")\n    }.start()\n}\n```\n\n### 코루틴 방식\n```kotlin\nrunBlocking {\n    // 1000개의 코루틴을 생성해도 몇 MB의 메모리만 사용\n    for (i in 1..1000) {\n        launch {\n            // 각 코루틴마다 작업 수행\n            delay(1000) // 코루틴만 일시 중단, 스레드는 다른 코루틴 실행 가능\n            println(\"Task $i completed\")\n        }\n    }\n}\n```\n\n## 추가 학습 자료를 공유합니다.\n- [코루틴은 왜 빠른 걸까요?](https://todaycode.tistory.com/179)\n- [[Coroutine] 1. 코루틴은 어떻게 스레드 작업을 최적화 하는가?](https://kotlinworld.com/139)\n- [kakaopay - 코루틴과 Virtual Thread 비교와 사용\n](https://tech.kakaopay.com/post/coroutine_virtual_thread_wayne/)", "title": "어떤 이유로  코루틴을 사용한 작업 처리가 기존 스레드 방식보다 가벼운지 설명해주세요."}, "be-15": {"id": "be-15", "content": "- **JPA는 기술 명세**입니다. \n자바 애플리케이션에서 관계형 데이터베이스를 사용하는 방식을 정의한 **인터페이스**입니다.\nJPA는 단순한 명세이기 때문에 인터페이스와 규약만 정의하며, 실제 구현체는 제공하지 않습니다.\n- **Hibernate는 JPA의 구현체** 중 하나입니다. \nJPA가 정의한 `javax.persistence.EntityManager`와 같은 인터페이스를 직접 구현한 라이브러리입니다.\nJPA의 구현체 중 하나일 뿐이므로, DataNucleus, EclipseLink 등 다양한 JPA 구현체로 대체할 수 있습니다.\n- **Spring Data JPA는 JPA를 쉽게 사용할 수 있도록 지원하는 모듈**입니다.\n**JPA를 한 단계 추상화시킨 Respository 라는 인터페이스를 제공**합니다. 개발자가 Respository 인터페이스에 정해진 규칙대로 메서드를 만들어주기만 하면, 해당 메서드 이름에 적합한 쿼리를 날리는 구현체를 만들어 자동으로 Bean으로 등록해줍니다.\n    \n    Spring Data JPA는 JPA를 기반으로 하며, 반복적인 코드 작성을 줄이고 데이터 접근 계층을 단순화 합니다. \n    이 때 JPA를 추상화 했다는 의미는, Spring Data JPA의 Repository 의 구현에서 JPA를 사용하고 있다는 것입니다.\n    예를 들어 Respository 인터페이스의 기본 구현체인 `SimpleJpaResporitory` 는 내부적으로 `EntityManager` 를 사용합니다.", "title": "JPA, Hibernate, Spring Data JPA 의 차이가 무엇인가요?"}, "be-150": {"id": "be-150", "content": "**싱글턴 패턴(Singleton Pattern)** 이란 생성자를 여러 차례 호출해도 실제로 생성되는 객체를 하나로 유지하는 것을 의미합니다. 객체가 최초로 생성된 이후에 생성자나 객체 생성 메서드는 기존에 만들어진 객체를 반환합니다. \n\n```java\npublic class Singleton {\n\n  private static final Singleton INSTANCE = new Singleton();\n\n  // 생성자 호출 제한\n  private Singleton() { ... }\n\n  public static Singleton getInstance() {\n    return INSTANCE;\n  }\n}\n```\n\n## 싱글턴 패턴의 장단점은 무엇인가요?\n\n싱글턴 패턴은 하나의 객체를 여러 상황에서 재사용할 수 있기 때문에 메모리 낭비를 방지할 수 있습니다. 또한, 여러 다른 객체가 하나의 인스턴스에 쉽게 접근할 수 있어 편리하다는 장점이 있습니다.\n\n하지만, 싱글턴은 전역 객체를 생성한다는 특성상 코드의 복잡도를 높이고, 테스트하기 어려운 코드를 만들 수 있는 단점이 있습니다.\n\n- 상황에 따라 더욱 복잡한 구현이 필요할 수 있습니다. 예를 들어, 싱글턴 객체를 지연 초기화(lazy initialization) 하고 싶을 때 여러 스레드가 동시에 생성자에 접근하면 두 개 이상의 객체가 생성될 수 있으므로 동시성 문제를 고려해야 합니다.\n- 테스트에서는 싱글턴 객체의 상태를 초기화하는 과정이 필요합니다. 예를 들어, 1번 테스트에서 싱글턴 객체를 수정한 경우, 2번 테스트는 싱글턴의 상태를 초기화한 후 테스트를 실행해야 합니다.\n- 싱글턴 객체가 인터페이스를 구현하지 않은 경우, 테스트 환경에서 가짜 구현체로 대체하여 주입하기 어렵습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 아서의 싱글턴 패턴과 정적 클래스](https://youtu.be/5oUdqn7WeP0?si=Jx8Pd_dGDmHgCGma)\n- [테코블 - 싱글톤(Singleton) 패턴이란?](https://tecoble.techcourse.co.kr/post/2020-11-07-singleton/)\n- [Double-checked Locking Pattern (DCLP) 을 쓰지 말아야 하는 이유\n](https://herdin.github.io/2020/12/25/about-double-check-locking)\n- [싱글톤(SingleTon) 패턴 구현방법 6가지, Bill Pugh Solution](https://haon.blog/java/singleton/)\n- [Enum은 싱글톤이니 Redis Key로 사용해도 문제 없겠지?\n](https://goodgid.github.io/TIL-Precautions-when-using-Enum-as-Redis-Key/)\n- [이펙티브 자바 - private 생성자나 열거 타입으로 싱글턴임을 보증하라.](https://incheol-jung.gitbook.io/docs/study/effective-java/undefined/2020-03-20-effective-3item)", "title": "싱글턴 패턴이란 무엇인가요?"}, "be-151": {"id": "be-151", "content": "**레이어드 아키텍처(Layered Architecture)** 란 소프트웨어를 관심사별로 여러 계층으로 나누어 수직적으로 배열한 것을 의미합니다. 여기서 관심사란 유사한 책임들을 의미합니다. 예를 들어, 데이터베이스 접근과 관련된 책임들을 하나의 관심사로 볼 수 있습니다.\n\n레이어드 아키텍처의 대표적인 구성에는 3가지 레이어가 존재하는데요. 표현 계층, 도메인 계층, 데이터 소스 계층이 이에 해당합니다. 레이어의 종류와 수는 프로젝트 상황마다 달라질 수 있습니다. \n\n- **표현 계층(Presentation Layer)** 은 사용자 입력을 처리하기 위해 존재합니다.\n- **도메인 계층(Domain Layer)** 은 비즈니스와 관련된 로직을 수행하기 위해 존재합니다.\n- **데이터 소스 계층(Data Source Layer)** 은 데이터베이스 접근 및 데이터 조작과 관련된 작업을 수행하기 위해 존재합니다.\n\n레이어드 아키텍처를 사용하면 특정 레이어만 독립적으로 확장하거나 변경할 수 있으며, 특정 레이어만 별도로 테스트 환경을 구축하여 테스트할 수 있다는 장점이 있습니다.\n\n## 싱크홀 안티 패턴에 대해서 알고 계시나요?\n\n일반적으로 레이어드 아키텍처에서 요청은 상위 레이어(표현 계층)에서 중간 레이어를 거쳐 하위 레이어(데이터 소스 계층)로 전달되는데요. 이때, 중간 레이어는 아무 일도 하지 않음에도 불구하고 요청을 무작정 중간 레이어를 통과시키는 것을 **싱크홀 안티 패턴(Achitecture Sinkhole Anti-Pattern)** 이라고 합니다. 이는 불필요하게 요청을 전달받고, 다시 전달만 하는 중간 코드를 작성하고, CPU 및 메모리 자원을 낭비한다는 문제가 있습니다.\n\n```java\n@Service\npublic class OrderService {\n\n  private OrderDao orderDao;\n\n  // 아무 일도 수행하지 않음\n  public OrderResponse getOrder(Long orderId) {\n      return orderDao.getOrderById(orderId);\n  }\n}\n```\n\n하지만 이를 무조건 피해야 하는 것은 아니라고 생각합니다. 상위 레이어가 직접 하위 레이어에 접근하는 방식을 허용하면 일관성이 약해져 추가적인 소통과 문서가 필요할 수 있기 때문입니다. 따라서, 프로젝트와 팀의 상황에 맞게 트레이드오프를 고려하여 팀만의 규칙을 만드는 것이 중요하다고 생각합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[KSUG Seminar] 조영호님 - 애플리케이션 아키텍처와 객체지향](https://youtu.be/26S4VFUWlJM?si=ZO05ehkhQOVfQk5z)\n- [백명석님 클린코더스 - Architecture](https://youtu.be/sYPsm93qIkY?si=ZqdpHu_ydVT1bAa1)\n- [백명석님 클린코더스 - Architecture UseCase](https://youtu.be/5DVIUl5DoUo?si=FMjQP8Jp6M5t1fCL)\n- [[소프트웨어 아키텍처 101] 아키텍처 스타일 - 레이어드 아키텍처 스타일](https://velog.io/@d5h22kim/%EC%86%8C%ED%94%84%ED%8A%B8%EC%9B%A8%EC%96%B4-%EC%95%84%ED%82%A4%ED%85%8D%EC%B2%98-101-%EC%95%84%ED%82%A4%ED%85%8D%EC%B2%98-%EC%8A%A4%ED%83%80%EC%9D%BC-%EB%A0%88%EC%9D%B4%EC%96%B4%EB%93%9C-%EC%95%84%ED%82%A4%ED%85%8D%EC%B2%98-%EC%8A%A4%ED%83%80%EC%9D%BC)\n- [[10분 테코톡] 누누, 다즐의 클린 아키텍처](https://youtu.be/Ql7CoQminoM?si=vWPVu7lC-dYaX_Qj)\n", "title": "레이어드 아키텍처란 무엇인가요?"}, "be-152": {"id": "be-152", "content": "**헬스체크(Health Check)** 는 현재 서버의 상태가 정상인지 파악하는 것을 의미합니다. API 엔드포인트를 호출하거나 특정 포트로 TCP 연결을 시도하는 방식을 사용할 수 있으며, 스프링 액추에이터(Spring Actuator)를 활용하여 헬스체크 기능을 사용할 수 있습니다.\n\n## 헬스체크의 필요성은 무엇인가요?\n\n서버가 헬스체크 기능을 제공하면 최신 코드를 배포할 때 신규 배포가 정상적으로 이뤄졌는지 확인할 수 있으며, 장애를 감지하여 대응할 수 있다는 이점이 있습니다.\n\n<p align = \"center\">\n<img src = \"https://github.com/user-attachments/assets/3f459456-e9e9-49fb-a7d7-507ea93091bb\" />\n</p>\n\n장애 대응의 예시로, 로드 밸런서가 존재하고 트래픽 분산 대상 서버 2대(A, B)가 있을 때, A 서버의 헬스체크 결과가 비정상으로 판단되면 로드 밸런서는 A 서버를 트래픽 분산 대상에서 제외하고, 이후 B 서버로만 요청을 전달할 수 있습니다.\n\n비정상 서버는 CPU, 메모리, I/O 자원이 고갈되었거나 내부 오류 상태일 가능성이 높습니다. 이러한 상태에서 요청이 전달되면, 정상 서버가 존재함에도 사용자는 오류 응답을 받을 수 있습니다. 또한, 클라이언트가 재시도를 수행할 경우 전체 트래픽이 증가할 위험도 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [IT 엔지니어를 위한 네트워크 입문 - 로드밸런서 헬스체크](https://zigispace.net/1222)\n- [토스 기술 블로그 - Spring Boot Actuator의 헬스체크 살펴보기](https://toss.tech/article/how-to-work-health-check-in-spring-boot-actuator)\n\n\n", "title": "헬스체크에 대해서 설명해 주세요."}, "be-16": {"id": "be-16", "content": "```java\n@Override\npublic boolean isNew(T entity) {\n\n    if(versionAttribute.isEmpty()\n          || versionAttribute.map(Attribute::getJavaType).map(Class::isPrimitive).orElse(false)) {\n        return super.isNew(entity);\n    }\n\n    BeanWrapper wrapper = new DirectFieldAccessFallbackBeanWrapper(entity);\n\n    return versionAttribute.map(it -> wrapper.getPropertyValue(it.getName()) == null).orElse(true);\n}\n\n```\n\n새로운 Entity인지 여부는 JpaEntityInformation의 `isNew(T entity)`에 의해 판단됩니다. 다른 설정이 없으면 JpaEntityInformation의 구현체 중 JpaMetamodelEntityInformation 클래스가 동작합니다. `@Version`이 사용된 필드가 없거나 `@Version`이 사용된 필드가 primitive 타입이면 AbstractEntityInformation의 `isNew()`를 호출합니다.\n`@Version`이 사용된 필드가 wrapper class이면 null여부를 확인합니다.\n\n\n```java\npublic boolean isNew(T entity) {\n\n    Id id = getId(entity);\n    Class<ID> idType = getIdType();\n\n    if (!idType.isPrimitive()) {\n        return id == null;\n    }\n\n    if (id instanceof Number) {\n        return ((Number) id).longValue() == 0L;\n    }\n\n    throw new IllegalArgumentException(String.format(\"Unsupported primitive id type %s\", idType));\n}\n```\n\n`@Version`이 사용된 필드가 없어서 AbstractEntityInformation 클래스가 동작하면\n`@Id` 어노테이션을 사용한 필드를 확인해서 primitive 타입이 아니라면 null 여부, Number의 하위 타입이면 0인지 여부를 확인합니다.`@GeneratedValue` 어노테이션으로 키 생성 전략을 사용하면 데이터베이스에 저장될 때 id가 할당됩니다. 따라서 데이터베이스에 저장되기 전에 메모리에서 생성된 객체는 id가 비어있기 때문에 `isNew()`는 true가 되어 새로운 entity로 판단합니다.\n\n## 직접 ID를 할당하는 경우에는 어떻게 동작하나요? 🤔\n\n키 생성 전략을 사용하지 않고 직접 ID를 할당하는 경우 새로운 entity로 간주되지 않습니다.\n이 때는 엔티티에서 `Persistable<T>` 인터페이스를 구현해서 JpaMetamodelEntityInformation 클래스가 아닌 JpaPersistableEntityInformation의 `isNew()`가 동작하도록 해야 합니다.\n\n```java\npublic class JpaPersistableEntityInformation<T extends Persistable<ID, ID> \n        extends JpaMetamodelEntityInformation<T, ID> {\n\n    public JpaPersistableEntityInformation(Class<T> domainClass, Metamodel metamodel, \n            PersistenceUnitUtil persistenceUnitUtil) {\n        super(domainClass, metamodel, persistenceUnitUtil);\n    }\n\n    @Override\n    public boolean isNew(T entity) {\n        return entity.isNew();\n    }\n\n    @Nullable\n    @Override\n    public ID getId(T entity) {\n        return entity.getId();\n    }\n}\n```\n\n## 새로운 Entity인지 판단하는게 왜 중요할까요? 🤓\n\n```java\n@Override\n@Transactional\npublic <S extends T> S save(S entity) {\n\n    Assert.notNull(entity, \"Entity must not be null\");\n\n\tif (entityInformation.isNew(entity)) {\n\t\tentityManager.persist(entity);\n\t\treturn entity;\n\t} else {\n\t\treturn entityManager.merge(entity);\n\t}\n}\n```\n\nSimpleJpaRepository의 `save()` 메서드에서 `isNew()`를 사용하여 persist를 수행할지 merge를 수행할지 결정합니다. 만약 ID를 직접 지정해주는 경우에는 신규 entity라고 판단하지 않기 때문에 merge를 수행합니다. 이때 해당 entity는 신규임에도 불구하고 DB를 조회하기 때문에 비효율적입니다. 따라서, 새로운 entity인지 판단하는 것은 중요한 부분입니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [save()시 식별자가 존재하는 경우 어떻게 동작할까?](https://ttl-blog.tistory.com/807)\n- [Persistable - 새로운 엔티티 판별 여부 설정](https://ttl-blog.tistory.com/852)\n- [save메서드로 살펴보는 persist와 merge 개념](https://umanking.github.io/2019/04/12/jpa-persist-merge/)", "title": "Spring Data JPA에서 새로운 Entity인지 판단하는 방법은 무엇일까요?"}, "be-17": {"id": "be-17", "content": "ddl-auto 옵션은 스프링 부트 애플리케이션에서 Hibernate와 같은 JPA 구현체를 사용할 때 데이터베이스 스키마 관리를 제어하는 설정입니다. 이 옵션은 `application.properties` 또는 `application.yml` 파일에서 설정할 수 있으며, 다양한 값에 따라 데이터베이스 스키마에 대해 다른 동작을 수행합니다. ddl-auto 옵션에는 none, validate, update, create, create-drop 등이 존재합니다.\n\n\n## 각 옵션에 대한 설명을 해주시겠어요? 🤔\n\n`none`으로 설정하면 데이터베이스 스키마와 관련된 어떠한 작업도 수행하지 않습니다. 데이터베이스 스키마를 수동으로 관리하고 싶을 때 유용하며, 프로덕션 환경에서 주로 사용됩니다.\n\n`validate`는 애플리케이션이 시작될 때, 엔티티 매핑이 데이터베이스 스키마와 일치하는지 검증하며 스키마 변경은 따로 수행하지 않습니다. 프로덕션 환경에서 엔티티와 데이터베이스 스키마가 일치하는지 확인하고 싶을 때 사용합니다.\n\n`update`는 엔티티 매핑과 데이터베이스 스키마를 비교하여 필요한 경우 스키마를 업데이트합니다. 기존 데이터는 유지되지만, 새로운 엔티티나 변경된 엔티티 필드는 스키마에 반영됩니다. 해당 옵션은 엔티티에 변경이 발생할 때 자동으로 스키마를 업데이트하고 싶을 때 유용합니다. 프로덕션 환경에서는 예기치 않은 스키마 변경을 방지하기 위해 주의가 필요합니다.\n\n`create`는 애플리케이션이 시작될 때 기존 스키마를 삭제하고 새로 생성합니다. 데이터가 모두 삭제되며 엔티티 매핑을 기반으로 새로운 스키마가 생성됩니다. 개발 초기에 빈 데이터베이스 스키마를 반복적으로 생성해야 할 때 유용합니다. 기존 데이터가 모두 삭제되므로 프로덕션 환경에서는 사용하지 않습니다.\n\n`create-drop`은 `create`와 유사하지만, 애플리케이션이 종료될 때 스키마를 삭제한다는 점이 다릅니다. 해당 옵션은 테스트 환경에서 일시적인 데이터베이스 스키마가 필요한 경우 유용하며, 매 테스트 실행 시마다 깨끗한 데이터베이스 상태를 유지하고자 할 때 사용됩니다. 프로덕션 환경에서는 사용하지 않습니다.\n\n## 프로덕션 환경에서 스키마 변경은 어떻게 해야하나요? 🤓\n\n스키마 변경이 필요할 때는 적절한 데이터베이스 마이그레이션 도구(Flyway, Liquibase 등)를 사용하여 제어된 방식으로 스키마를 관리하거나, 사용자가 없는 새벽에 스키마 변경 작업을 수동으로 진행하는 것이 더욱 안전할 수 있습니다.\n\n\n", "title": "JPA의 ddl-auto 옵션은 각각 어떤 동작을 하고 어떤 상황에서 사용해야 할까요?"}, "be-18": {"id": "be-18", "content": "엔티티 매니저에 대해 알기 위해선 영속성 컨텍스트에 대해 알아야 합니다. 영속성 컨텍스트는 엔티티를 영구 저장하는 환경으로 1차 캐싱, 쓰기 지연, 변경 감지를 통해 \n영속 로직을 효율적으로 할 수 있게 해줍니다. 이러한 효율적인 영속 로직 수행을 위해서 엔티티는 영속성 컨텍스트에 관리되어야 합니다. \n이런 작업을 도와주는 것이 바로 엔티티 매니저입니다. 엔티티 매니저는 엔티티의 상태를 변경하고, 영속성 컨텍스트와 상호작용함으로써 영속 로직을 수행하는 역할을 가지고 있습니다.\n\n\n## 조금 더 구체적으로 엔티티 매니저의 역할을 설명해 주실 수 있을까요? 🤔\n\n엔티티는 영속성 컨텍스트와 관련하여 4가지 상태(비영속, 영속, 준영속, 삭제)를 가질 수 있는데요. 엔티티 매니저는 persist, merge, remove, close 메서드를 이용하여 엔티티의 상태를 변경할 수 있습니다. 또한, 엔티티 매니저는 영속성 컨텍스트의 1차 캐시로부터 엔티티를 조회할 수 있으며, 쓰기 지연 저장소에 있는 쿼리들을 flush하여 DB와 동기화시킬 수 있습니다. 또한 JPQL이나 Native Query를 이용해 직접 DB로부터 데이터를 불러올 수도 있습니다.\n\n\n## 엔티티의 각 상태에 대해서 설명해주세요. 😀\n\n```java\nMember member = new Member(\"산초\");\n```\n\n비영속 상태는 엔티티 객체가 새로 생성되었지만, 아직 영속성 컨텍스트와 연관되지 않은 상태입니다. 이 상태에서는 데이터베이스와 전혀 관련이 없으며, 엔티티 객체는 메모리 상에만 존재합니다.\n\n\n```java\nem.persist(member);\nem.merge(detagedMember);\nem.find(Member.class, 1L);\n```\n영속 상태는 엔티티 객체가 영속성 컨텍스트에 관리되고 있는 상태입니다. 이 상태에서는 엔티티의 변경 사항이 자동으로 데이터베이스에 반영됩니다.\n\n```java\nem.detach(member);\nem.clear();\nem.close();\n```\n\n준영속 상태는 엔티티 객체가 한 번 영속성 컨텍스트에 의해 관리되었지만, 현재는 영속성 컨텍스트와 분리된 상태입니다. 이 상태에서는 엔티티 객체의 변경 사항이 더 이상 데이터베이스에 반영되지 않습니다.\n영속성 컨텍스트 종료, 트랜잭션 종료 등으로도 준영속 상태로 전환됩니다.\n\n```java\nem.remove(member);\n```\n\n삭제 상태는 엔티티 객체가 영속성 컨텍스트에서 제거된 상태입니다. 이 상태에서는 엔티티 객체가 데이터베이스에서 삭제됩니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 산초의 영속성 컨텍스트와 EntityManager](https://youtu.be/c4rDrirE7Bc?si=qIfCIt_iNK_6iLen)\n- [[10분 테코톡] 잉, 페퍼의Spring Data JPA 삽질일지](https://youtu.be/kJexMyaeHDs?si=QherUvedvbJJ5DjF)\n\n\n", "title": "엔티티 매니저에 대해 설명해주세요."}, "be-19": {"id": "be-19", "content": "JPA N + 1 문제는 연관 관계가 설정된 엔티티를 조회할 경우에, 조회된 데이터 개수(N)만큼 연관관계의 조회 쿼리가 추가로 발생하는 현상입니다. 예를 들어, 블로그 게시글과 댓글이 있는 경우, 게시글을 조회한 후 각 게시글마다 댓글을 조회하기 위한 추가 쿼리가 발생할 수 있습니다. 이를 N + 1 문제라고 합니다.\n\n## findAll 메서드의 글로벌 패치 전략 별 N + 1 문제 상황에 대해서 설명해주세요. 🤓\n\n> spring data jpa에서 제공하는 repository의 findAll 메서드입니다!\n\n글로벌 패치 전략을 즉시로딩으로 설정하고 findAll()을 실행하면 N + 1 문제가 발생합니다. 이는 findAll()은 `select u from User u`라는 JPQL 구문을 생성해서 실행하기 때문입니다. JPQL은 글로벌 패치 전략을 고려하지 않고 쿼리를 실행합니다. 모든 User를 조회하는 쿼리 실행 후, 즉시로딩 설정을 보고 연관관계에 있는 모든 엔티티를 조회하는 쿼리를 실행합니다. \n\n글로벌 패치 전략을 지연 로딩으로 설정하고 findAll()을 실행하면 N + 1 문제가 발생하지 않습니다. 이는 연관관계에 있는 엔티티를 실제 객체 대신에 프록시 객체로 생성하여 주입하기 때문입니다. 하지만 프록시 객체를 사용할 경우에 실제 데이터가 필요하여 조회하는 쿼리가 발생하고 N + 1 문제가 발생할 수 있습니다. \n\n## N + 1 문제는 어떻게 해결할 수 있을까요? 🤔\n\nN + 1 문제를 해결하기 위해서는 `fetch join`, `@EntityGraph`를 사용해 볼 수 있습니다. `fetch join`은 연관 관계에 있는 엔티티를 한번에 즉시 로딩하는 구문입니다. `@EntityGraph`도 비슷한 효과를 만들어내며, 쿼리 메서드에 해당 어노테이션을 추가해 사용할 수 있습니다.\n\n```sql\nselect distinct u\nfrom User u\nleft join fetch u.posts\n```\n\n```java\n@EntityGraph(attributePaths = {\"posts\"}, type = EntityGraphType.FETCH)\nList<User> findAll();\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [JPA 모든 N+1 발생 케이스과 해결책](https://velog.io/@jinyoungchoi95/JPA-%EB%AA%A8%EB%93%A0-N1-%EB%B0%9C%EC%83%9D-%EC%BC%80%EC%9D%B4%EC%8A%A4%EA%B3%BC-%ED%95%B4%EA%B2%B0%EC%B1%85)\n- [JPA Pagination, 그리고 N + 1 문제](https://tecoble.techcourse.co.kr/post/2021-07-26-jpa-pageable/)", "title": "JPA의 N + 1 문제에 대해서 설명해주세요."}, "be-2": {"id": "be-2", "content": "## RAID(Reduntant Array of Independent Disks)\n\nRAID는 수 많은 데이터들을 안전하게 저장하거나 성능을 높이기 위해 여러 하드 디스크나 SSD를 마치 하나의 장치처럼 사용하는 기술입니다.\n\n## RAID 구성 방식에 대해서 설명해주세요. 🤓\n\n`RAID-0` 은 여러 보조기억장치에 데이터를 나누어 저장하는 구성 방식입니다. 데이터를 저장할 때 하드 디스크는 각 장치에 번갈아 데이터를 저장합니다. 이때 줄무늬처럼 분산되어 저장된 데이터를 스트라이프라고 하며 분산하여 저장하는 방식을 스트라이핑이라고도 합니다.\n\n데이터를 분산하여 저장하기 때문에 저장된 데이터를 읽고 쓰는 속도가 빨라집니다.  하나의 대용량 저장 장치를 사용하면 여러 번에 걸쳐 읽고 써야하는 데이터를 동시에 읽고 쓸 수 있기 때문입니다. 가령, 4TB 저장 장치 한개 읽기 속도보다 RAID 0 구성으로된 1TB 장치 네 개 읽기 속도가 더욱 빠릅니다. 하지만, 저장된 정보가 안전하지 않다는 단점이 존재합니다.\n\n`RAID-1` 은 복사본을 만드는 구성이며 미러링이라고도 부릅니다.  디스크에 문제가 발생해도 복구가 가능합니다. 하지만 하드 디스크 개수가 한정되었을 때, 사용 가능한 용량이 적어지며 `RAID-0`에 비해 쓰기 속도가 느립니다.\n\n`RAID-4`는 복사본을 만드는 대신 오류를 검출하고 복구하기 위한 정보를 저장한 장치를 두는 구성 방식입니다. `RAID-1` 보다 적은 하드 디스크로도 데이터를 안전하게 보관할 수 있습니다. 다만, 새로운 데이터가 저장될 때마다 패리티 저장 디스크에도 데이터를 써야 하므로 병목 현상이 발생할 수 있다는 단점이 있습니다.\n\n`RAID-5` 는 `RAID-4`의 병목 현상을 극복하기 위해 패리티 정보를 분산하여 저장합니다. 그리고, `RAID-6` 는 서로 다른 두 개의 패리티를 두는 방식입니다. `RAID-6`는 오류 검출 및 복구 수단이 두 개가 생기므로, `RAID-4`나 `RAID-5` 보다 안전합니다. 하지만, 패리티가 두 개이므로 쓰기 속도는 `RAID-5`보다 느립니다.\n\n## RAID를 직접 구성 해보신 적이 있나요? 🤔\n\n> 예시입니다! 각자 경험하신 프로젝트 상황에 맞는 대답을 준비해주세요.\n\nRAID를 직접 구성한 적은 없습니다. 하지만, 매일메일 서비스의 백엔드를 구축하면서 AWS RDS를 사용했는데요. AWS RDS는 필요한 스토리지 용량에 따라 자동으로 데이터를 여러 Amazon EBS 볼륨에 스트라이핑하여 성능을 강화하는 것으로 알고 있습니다. \n\n참고 : [Amazon RDS DB 인스턴스 스토리지 작업](https://docs.aws.amazon.com/ko_kr/AmazonRDS/latest/UserGuide/USER_PIOPS.StorageTypes.html)\n", "title": "RAID 기술에 대해서 설명해주세요."}, "be-20": {"id": "be-20", "content": "Checked Exception은 **컴파일 시점에 확인**되며, **반드시 처리해야 하는 예외**입니다. 자바에서는 `IOException`, `SQLException` 등이 이에 속합니다. Checked Exception을 유발하는 메서드를 호출하는 경우, 메서드 시그니처에 `throws`를 사용하여 호출자에게 예외를 위임하거나 메서드 내에서 try-catch를 사용하여 해당 예외를 반드시 처리해야합니다.\n\nUnchecked Exception은 **런타임 시점에 발생**하는 예외로, 컴파일러가 처리 여부를 강제하지 않습니다. 자바에서는 `RuntimeException`을 상속한 예외들이 해당됩니다. 일반적으로 프로그래머의 실수나 코드 오류로 인해 발생합니다.\n\n## 각각 언제 사용해야 할까요? 🤔\n\n> 정답이 없는 영역이라고 생각해요. 자신의 주관을 만들면서 학습해봐도 좋을 것 같아요!\n\nChecked Exception은 외부 환경과의 상호작용에서 발생할 가능성이 높은 예외에 적합합니다. 예를 들어, 파일 입출력, 네트워크 통신 등에서 발생할 수 있는 예외는 Checked Exception으로 처리하는 것이 좋습니다. 이러한 예외는 예측 가능하며, 호출하는 쪽에서 적절히 처리할 수 있는 여지가 있습니다.\n\nUncheked Exception은 코드 오류, 논리적 결함 등 프로그래머의 실수로 인해 발생할 수 있는 예외에 적합합니다. 예를 들어, null 참조 또는 잘못된 인덱스 접근 등은 호출자가 미리 예측하거나 처리할 수 없기 때문에 Unchecked Exception으로 두는 것이 좋습니다.\n\n## Error와 Exception의 차이는 무엇인가요? 🤓\n\nError는 주로 JVM에서 발생하는 심각한 문제로, `OutOfMemoryError`, `StackOverflowError` 등 시스템 레벨에서 발생하는 오류입니다. 이는 일반적으로 프로그램에서 처리하지 않으며, **회복이 어려운 오류**에 속하며, 애플리케이션 코드에서 복구할 수 없는 심각한 문제를 나타냅니다. \n\n반면, Exception은 프로그램 실행 중 발생할 수 있는 오류 상황을 나타냅니다. 대부분의 경우 **회복 가능성**이 있으며, 프로그램 내에서 예외 처리를 통해 오류 상황을 제어할 수 있습니다. Exception은 다시 `Checked Exception`과 `Unchecked Exception`으로 나눌 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 케로의 예외처리](https://youtu.be/mrrEPbGF6hQ?si=CKhaV9Gwu4Qx97Y1)\n- [기억보단 기록을 - 좋은 예외(Exception) 처리](https://jojoldu.tistory.com/734)\n- [custom exception을 언제 써야 할까?](https://tecoble.techcourse.co.kr/post/2020-08-17-custom-exception/)", "title": "자바에서 Checked Exception과 Unchecked Exception에 대해서 설명해주세요."}, "be-21": {"id": "be-21", "content": "일급 컬렉션(First-Class Collection)은 하나의 컬렉션을 감싸는 클래스를 만들고, 해당 클래스에서 컬렉션과 관련된 비즈니스 로직을 관리하는 패턴을 말합니다. 아래 코드 중에서 Order의 List 자료구조를 감싼 Orders가 일급 컬렉션의 예시입니다.\n\n```java\n// 일급 컬렉션\npublic class Orders {\n\n    private final List<Order> orders;\n\n    public Orders(List<Order> orders) {\n        validate(orders); // 검증 수행\n        ...\n    }\n\n    public void add(Order order) {\n        if (order == null) {\n            throw new IllegalArgumentException(\"Order cannot be null\");\n        }\n        orders.add(order);\n    }\n\n    public List<Order> getAll() {\n        return Collections.unmodifiableList(orders);\n    }\n\n    public double getTotalAmount() {\n        return orders.stream()\n                     .mapToDouble(Order::getAmount)\n                     .sum();\n    }\n}\n```\n\n```java\npublic class OrderService {\n  \n    private final Orders orders = new Orders();\n\n    public void addOrder(Order order) {\n        orders.add(order);\n    }\n\n    public Orders getOrders() {\n        return orders;\n    }\n\n    // 추가 비즈니스 로직...\n}\n```\n\n## 일급 컬렉션을 사용해야하는 이유는 무엇인가요? 😀\n\n일급 컬렉션 클래스에 로직을 포함하거나 비즈니스에 특화된 명확한 이름을 부여할 수 있습니다. 또한, 불필요한 컬렉션 API를 외부로 노출하지 않도록 할 수 있으며, 컬렉션을 변경할 수 없도록 만든다면 예기치 않은 변경으로부터 데이터를 보호할 수 있습니다. \n\n## 추가 학습 자료를 공유합니다.\n\n- [기억보단 기록을 - 일급 컬렉션의 소개와 써야할 이유](https://jojoldu.tistory.com/412)\n- [이유와 솔루션으로 정리하는 객체지향 생활체조 원칙](https://hudi.blog/thoughtworks-anthology-object-calisthenics/)\n", "title": "일급 컬렉션이 무엇인가요?"}, "be-22": {"id": "be-22", "content": "인덱스는 데이터베이스 테이블의 검색 속도를 향상시키기 위한 자료구조로 백과사전의 색인과 같습니다.\n저장되는 컬럼의 값을 사용하여 항상 정렬된 상태를 유지하는 것이 특징입니다.\n이러한 특징으로 인해 인덱스는 INSERT, UPDATE, DELETE의 성능이 희생된다는 것이 단점입니다.\n\n## 인덱스는 어떤 자료 구조로 이루어져있나요? 🤔\n\nMySQL InnoDB를 기준으로 설명드리자면, B+Tree와 같은 변형 B-Tree 자료구조를 이용해서 인덱스를 구현합니다.\n기본 토대는 B-Tree 인덱스이기 때문에 이를 기준으로 설명합니다.\nB-Tree 인덱스는 컬럼의 값을 변형하지 않고 인덱스 구조체 내에서 항상 정렬된 상태로 유지합니다.\n\nB-Tree(Balanced-Tree)에서는 크게 3가지 노드가 존재합니다.\n최상위에 하나의 루트 노드가 존재하며, 가장 하위 노드인 리프 노드가 존재합니다.\n이 두 노드의 중간에 존재하는 브랜치 노드가 존재합니다.\n최하위 노드인 리프 노드에는 실제 데이터 레코드를 찾아가기 위한 주소값을 가지고 있습니다.\n\nInnoDB 스토리지 엔진에서는 세컨더리 인덱스(프라이머리 인덱스를 제외한 모든 인덱스)의 리프 노드에는 레코드의 PK가 저장됩니다. 따라서 세컨더리 인덱스 검색에서는 레코드를 읽기 위해 PK를 가지고 있는 B-Tree를 다시 한번 검색해야합니다.\n\n## MySQL 스캔 방식은 어떤 게 있나요? 😀\n\nMySQL에는 크게 인덱스 레인지 스캔, 인덱스 풀 스캔, 루스 인덱스 스캔 방식이 있습니다.\n\n`인덱스 레인지 스캔`은 검색할 인덱스 범위가 결정되었을 경우 사용하며 가장 빠릅니다.\n  - 인덱스에서 조건을 만족하는 값이 저장된 시작 리프 노드를 찾습니다.(index seek)\n  - 시작 리프 노드부터 필요한 만큼 인덱스를 차례대로 읽습니다. (index scan)\n  - 인덱스 키와 레코드 주소를 이용해 저장된 페이지를 가져오고 레코드를 읽어옵니다.\n\n레코드를 읽어오는 과정에서 랜덤 IO가 발생할 수 있습니다. \n읽어야할 데이터 레코드가 전체 20-25%의 경우에는 풀 테이블 스캔(순차 IO를 이용)이 더욱 좋을 수 있습니다.\n\n`인덱스 풀 스캔`은 인덱스를 사용하지만 인덱스를 처음부터 끝까지 모두 읽는 방식입니다.\n- 인덱스를 ABC 순서로 만들었는데 조건절에 B 혹은 C로 검색하는 경우 사용됩니다.\n- 인덱스를 생성하는 목적은 아니지만, 그래도 풀 테이블 스캔보다는 낫습니다. (데이터 레코드까지 읽지 않는 경우)\n\n`루스 인덱스 스캔`은 듬성듬성하게 인덱스를 읽는 것을 의미합니다. (앞서 언급한 인덱스 레인지, 인덱스 풀 스캔은 `타이트 인덱스 스캔`으로 분류됩니다.)\n- 중간에 필요하지 않은 인덱스 키 값은 무시하고 다음으로 넘어가는 형태로 처리합니다.\n- group by, max(), min() 함수에 대해 최적화하는 경우에 사용됩니다.\n\n### 추가 학습 자료를 공유합니다.\n- [[Database] 인덱스(index)란?](https://mangkyu.tistory.com/96)\n- [[MySQL] 프라이머리 키(PK, Primary Key)에 대해 쉽고 완벽하게 이해하기](https://mangkyu.tistory.com/285)\n- [[MySQL] B-Tree로 인덱스(Index)에 대해 쉽고 완벽하게 이해하기](https://mangkyu.tistory.com/286)\n- [[10분 테코톡] 안돌의 INDEX](https://youtu.be/NkZ6r6z2pBg?feature=shared)\n- [[10분 테코톡] 초코칩&로키의 인덱스와 스캔 튜닝](https://youtu.be/_UI8YDU_mfg?feature=shared)\n", "title": "데이터베이스 인덱스에 대해서 설명해주세요."}, "be-23": {"id": "be-23", "content": "트랜잭션의 격리 수준은 동시에 여러 트랜잭션이 실행될 때 한 트랜잭션이 다른 트랜잭션의 연산에 영향을 받지 않도록 하는 정도를 말합니다. 낮은 격리 수준은 동시 처리 능력을 높이지만, 데이터의 일관성 문제를 발생시킬 수 있습니다. 반면, 높은 격리 수준은 데이터의 일관성을 보장하지만, 동시 처리 능력이 떨어질 수 있습니다. 즉, 데이터 정합성과 성능은 반비례합니다. 트랜잭션 격리 수준은 개발자가 트랜잭션 격리 수준을 설정할 수 있는 기능을 제공하는 기능입니다. \n\n\n## 트랜잭션 격리 수준은 어떤 것이 있고 각각 어떤 특징이 있나요? 🤔\n\n트랜잭션 격리 수준은 READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ가 존재합니다.\n\nREAD UNCOMMITTED는 커밋이 되지 않은 트랜잭션의 데이터 변경 내용을 다른 트랜잭션이 조회하는 것을 허용합니다. 또한 해당 격리 수준에서는 Dirty Read, Phantom Read, Non-Repeatable Read 문제가 발생할 수 있습니다.\n\nREAD COMMITTED는 커밋이 완료된 트랜잭션의 변경사항만 다른 트랜잭션에서 조회할 수 있도록 허용합니다. 특정 트랜잭션이 이루어지는 동안, 다른 트랜잭션은 해당 데이터에 접근할 수 없습니다. Dirty Read는 발생하지 않지만, Phantom Read, Non-Repeatable Read 문제\b가 발생할 수 있습니다.\n\nREPEATABLE READ는 한 트랜잭션에서 특정 레코드를 조회할 때 항상 같은 데이터를 응답하는 것을 보장합니다. 하지만,  SERIALIZABLE과 다르게 행이 추가되는 것을 막지는 않습니다. Non-Repeatable Read 문제가 발생하지 않지만, Phantom Read 문제가 발생할 수 있습니다. \n\nSERIALIZABLE은 특정 트랜잭션이 사용중인 테이블의 모든 행을 다른 트랜잭션이 접근할 수 없도록 잠급니다. 가장 높은 데이터 정합성을 가지지만 성능이 가장 낮습니다. MySQL의 경우 단순한 SELECT 쿼리가 실행되더라도 데이터베이스 잠금이 걸려 다른 트랜잭션에서 데이터에 접근할 수 없습니다.\n\n## 발생하는 문제를 기준으로 설명을 잘해주셨네요. 그런데 각 문제들은 어떤 문제들인가요? 🤓\n\n\nDirty Read는 한 트랜잭션이 다른 트랜잭션이 변경 중인 데이터를 읽는 경우 발생합니다. 다른 트랜잭션이 아직 커밋되지 않은 (즉, 롤백할 가능성이 있는) 데이터를 읽어서, 그 데이터가 나중에 롤백될 경우 트랜잭션의 결과가 변경될 수 있습니다. 이는 데이터의 일관성을 깨뜨릴 수 있습니다.\n\nPhantom Read는 한 트랜잭션이 동일한 쿼리를 두 번 실행했을 때, 두 번의 쿼리 사이에 다른 트랜잭션이 삽입, 갱신, 삭제 등의 작업을 수행하여 결과 집합이 달라지는 경우를 말합니다. 이로 인해 한 트랜잭션 내에서 일관성 없는 결과를 가져올 수 있습니다.\n\nNon-Repeatable Read는 같은 트랜잭션 안에서 동일한 쿼리를 실행했을 때, 다른 결과를 얻는 경우를 의미합니다. 예를 들어, 한 트랜잭션이 같은 데이터를 두 번 읽을 때, 첫 번째 읽기와 두 번째 읽기 사이에 다른 트랜잭션이 해당 데이터를 변경했을 경우 발생할 수 있습니다.\n\n### 추가 학습 자료를 공유합니다.\n\n- [[MySQL] 트랜잭션의 격리 수준(Isolation Level)에 대해 쉽고 완벽하게 이해하기](https://mangkyu.tistory.com/299)\n- [wiki - Isolation (database systems)](https://en.wikipedia.org/wiki/Isolation_(database_systems))\n- [MySQL의 팬텀 리드를 재연하기](http://stackoverflow.com/questions/42794425/unable-to-produce-a-phantom-read/42796969#42796969)\n- [[10분 테코톡] 러쉬의 MySQL 트랜잭션 격리 수준](https://youtu.be/QHWwNTGkwAU?si=AMYGpIry6nCPosuu)", "title": "트랜잭션 격리수준은 무엇인가요?"}, "be-24": {"id": "be-24", "content": "자바에서 객체를 복사할 때 **얕은 복사**와 **깊은 복사**라는 두 가지 방식이 있습니다.\n먼저 Book과 Author라는 두 클래스를 사용해서 예제를 살펴볼게요. Book은 책의 이름(name)과 저자(author) 정보를 가지고 있고, Author는 저자의 이름을 가지고 있습니다.\n\n```java\nclass Book {\n\n    private String name; // 책 이름\n    private Author author; // 저자\n\n    public Book(String name, Author author) {\n        this.name = name;\n        this.author = author;\n    }\n\n    public Book shallowCopy() { // 얕은 복사\n        return new Book(this.name, this.author);\n    }\n\n    public Book deepCopy() { // 깊은 복사\n        Author copiedAuthor = new Author(this.author.getName());\n        return new Book(this.name, copiedAuthor);\n    }\n\n    public void changeAuthor(String name) { // 저자 이름 변경\n        author.setName(name);\n    }\n\n    @Override\n    public String toString() {\n        return \"Book name : \" + name + \", \" + author;\n    }\n\n    static class Author {\n\n        private String name; // 저자 이름\n\n        public Author(String name) {\n            this.name = name;\n        }\n\n        public String getName() { // 저자 이름 반환\n            return name;\n        }\n\n        public void setName(String name) { // 저자 이름 변경\n            this.name = name;\n        }\n\n        @Override\n        public String toString() {\n            return \"Author : \" + name;\n        }\n    }\n\n    public static void main(String[] args) {\n        Author author1 = new Author(\"조슈아 블로크\");\n        Book book1 = new Book(\"이펙티브 자바\", author1);\n\n        // 얕은 복사 후 변경\n        Book shallowCopyBook = book1.shallowCopy();\n        shallowCopyBook.changeAuthor(\"Joshua Bloch\");\n\n        // 얕은 복사 결과 출력\n        System.out.println(\"After shallow copy and change:\");\n        System.out.println(\"Original book1: \" + book1);\n        System.out.println(\"Shallow copied book: \" + shallowCopyBook);\n\n        Author author2 = new Author(\"마틴 파울러\");\n        Book book2 = new Book(\"리팩터링\", author2);\n\n        // 깊은 복사 후 변경\n        Book deepCopyBook = book2.deepCopy();\n        deepCopyBook.changeAuthor(\"Martin Fowler\");\n\n        // 깊은 복사 결과 출력\n        System.out.println(\"\\nAfter deep copy and change:\");\n        System.out.println(\"Original book2: \" + book2);\n        System.out.println(\"Deep copied book: \" + deepCopyBook);\n    }\n}\n```\n\nshallowCopy() 메서드는 새로운 Book 객체를 만들지만, 내부의 Author 객체는 원본과 동일한 객체를 참조합니다. 즉, Book 객체는 새로 만들었지만, Author 객체는 새로 만들지 않고 기존의 것을 그대로 사용합니다. 예를 들어, book1에서 shallowCopyBook을 만든 후, shallowCopyBook의 저자 이름을 “Joshua Bloch”로 바꾸면 book1의 저자 이름도 “Joshua Bloch”로 바뀝니다. 둘이 같은 Author 객체를 공유하고 있기 때문에 두 Book 객체의 Author가 동시에 변경되는 거죠.\n\n반면 deepCopy() 메서드는 Book 객체와 Author 객체 모두 새로운 객체로 만들어줘요. 그래서 book2에서 deepCopyBook을 만들고 deepCopyBook의 저자 이름을 “Martin Fowler”로 바꾸어도, book2의 저자 이름은 여전히 “마틴 파울러”로 남아 있어요. deepCopyBook과 book2가 서로 다른 Author 객체를 참조하고 있기 때문이에요.\n\n출력 결과를 보면,\n\n```java\nAfter shallow copy and change:\nOriginal book1: Book name : 이펙티브 자바, Author : Joshua Bloch\nShallow copied book: Book name : 이펙티브 자바, Author : Joshua Bloch\n```\n\n얕은 복사에서 shallowCopyBook과 book1이 같은 Author를 공유하니까, shallowCopyBook의 저자 이름을 바꾸면 book1의 저자 이름도 바뀐 거예요.\n\n```java\nAfter deep copy and change:\nOriginal book2: Book name : 리팩터링, Author : 마틴 파울러\nDeep copied book: Book name : 리팩터링, Author : Martin Fowler\n```\n깊은 복사한 deepCopyBook과 book2는 서로 다른 Author 객체를 참조하니까, deepCopyBook의 저자 이름을 바꿔도 book2는 영향을 받지 않습니다.", "title": "얕은 복사와 깊은 복사에 대해서 설명해주세요."}, "be-25": {"id": "be-25", "content": "로그는 서버가 동작할 때 서버의 상태와 동작 정보를 시간 경과에 따라 기록된 결과입니다. 로그는 시스템의 오류와 문제들을 쉽게 찾아낼 수 있도록 도와줍니다. 반면, 메트릭은 시스템의 성능과 상태에 대한 통계적인 정보를 의미합니다. 메트릭을 잘 수집하면 시스템의 현재 상태를 손쉽게 파악할 수 있고, 사업 현황에 관한 유용한 정보를 얻을 수 있습니다. 가령, 메트릭은 DAU, Retension, CPU 사용량, 메모리 사용량 등이 있습니다.\n\n### \b로그와 메트릭을 수집해 보신 적이 있나요? 🤔\n\n> 아래부터는 예시로 생각해주세요! 각자 진행하신 프로젝트 상황에 맞는 답변을 생각해 주세요. 😀\n\n스프링 부트 액추에이터를 사용해 메트릭을 생성하고 프로메테우스에 저장한 다음 그라파나로 시각화한 경험이 있습니다. 수집한 지표는 다음과 같습니다.\n\n-  CPU, 메모리, JVM 힙 사용량\n-  톰캣 스레드 풀과 데이터베이스 커넥션 풀 상태\n-  error 레벨 로그 증가량\n\n로깅은 LogBack을 이용했습니다. 그리고, Loki에 7일동안 보관하도록 설정했으며 로그 추적을 위해 MDC를 사용했습니다.\n\n### 언급해주신 메트릭을 수집하신 이유가 있으신가요? 🤓\n\nCPU, 메모리, JVM 사용량 지표를 수집한 이유는 서비스가 현재 안정적으로 동작하고 있는지 파악하기 위함입니다. 또한, 톰캣 스레드 풀과 커넥션 풀의 상태와 error 레벨 로그를 수집한 이유는 서버 프로그램 내부에 비정상적인 상황이 생기는 것을 신속히 대응하기 위함입니다.\n\n### System.out.println을 사용하면 로깅 프레임워크는 사용하지 않아도 되지 않나요? 👀\n\n로그를 출력하는 경우 대기 시간이 발생합니다. 그리고, 로그 또한 데이터이기 때문에 저장 공간을 요구합니다. 따라서, 정말로 필요한 경우에만 로깅을 수행하는 것이 비용 효율적입니다. 하지만, System.out.println은 로그 레벨 설정과 환경 별 필터링을 적용하기 까다롭습니다. 반면, 로깅 프레임워크는\u001d 로그 레벨 설정, 필터링 등 로그의 양 조절을 하기 위한 기능을 제공하기 때문에 이를 사용하는 것이 서비스 운영에 유리합니다.\n\n### 추가 학습 자료를 공유합니다.\n\n- [[제미니의 개발실무] 로깅과 로그관리 + 분산 추적](https://youtu.be/c7V52EMKXQM?si=reTb9qmJtBNyf1aj)\n- [[10분 테코톡] ☂️ 검프의 Logging(로깅) #1](https://youtu.be/1MD5xbwznlI?si=x-MM9GJedGZp71XD)\n- [[10분 테코톡] ☂️ 검프의 Logging(로깅) #2](https://youtu.be/JqZzy7RyudI?si=42hSLrogpWHwCt3A)\n- [[액추에이터] - 액추에이터(Actuator) 시작하기](https://ttl-blog.tistory.com/1322)\n- [[액추에이터] - 마이크로미터(Micrometer)와 메트릭(Metric)](https://ttl-blog.tistory.com/1322)", "title": "로그와 메트릭을 설명해주세요."}, "be-26": {"id": "be-26", "content": "\nJPA에서 ID를 생성하기 위해서는 직접 할당과 자동 할당을 사용할 수 있습니다. 직접 할당은 `@Id`어노테이션만을 사용하여 Id값을 직접 할당하는 방식입니다. 반면, 자동 할당은 `@Id`와 `@GeneratedValue`를 함께 사용해서 원하는 키 생성 전략을 선택하는 방식입니다. `@GeneratedValue`의 stretagy 옵션을 통해 생성 전략을 설정할 수 있는데, 여기에 올 수 있는 값인 GenerationType는 다음과 같습니다.\n\n```java\n@Target({ElementType.METHOD, ElementType.FIELD})  \n@Retention(RetentionPolicy.RUNTIME)  \npublic @interface GeneratedValue {  \n    GenerationType strategy() default GenerationType.AUTO;  \n  \n    String generator() default \"\";  \n}\n\npublic enum GenerationType { \n\tAUTO,\n\tIDENTITY,\n\tSEQUENCE, \n\tTABLE\n}\n```\n\n## 자동 생성 방식을 사용할 때 각 전략에 대해서 설명해주세요. 🤔\n\n**IDENTITY 전략**은 기본 키 생성을 DB에 위임하는 전략입니다. 주로 MySQL, PostgreSQL, SQL Server, DB2에서 사용됩니다. 해당 전략을 사용하면 엔티티를 생성할 때 쓰기 지연이 적용되지 않습니다. 왜냐하면 JPA에서 엔티티를 영속하기 위해선 식별자가 필요한데, IDENTITY 전략에서는 이 식별자가 DB에 저장되어야 할당되기 때문입니다. 따라서 엔티티를 생성할 때 즉시 INSERT 쿼리가 실행되어야 합니다. 이때 하이버네이트를 사용하는 경우에는 INSERT 쿼리의 결과를 다시 조회하지 않기 위해서 내부적으로 Statement.getGeneratedKeys를 사용합니다. 추가로 IDENTITY 전략을 사용하면 배치 인서트가 불가하다는 점을 주의해야합니다. \n\n**SEQUENCE 전략**은 시퀀스 키 생성 전략을 지원하는 DB에서 사용할 수 있습니다. 데이터베이스 시퀀스란, 유일한 값을 자동으로 생성하게 하는 객체입니다. auto_increment와 달리 초기 값과 한번에 증가할 크기를 설정할 수 있습니다. 해당 시퀀스를 키 생성 전략으로 갖는 DB에 대해 SEQUENCE 전략을 사용할 수 있습니다. 어떤 시퀀스를 사용할 것인지를 `@SequenceGenerator` 로 설정할 수 있습니다. SEQUENCE 전략은 em.persist()를 호출하는 경우 먼저 데이터베이스 시퀀스를 이용하여 식별자를 조회합니다. 이후 조회한 식별자를 엔티티에 할당한 후에 엔티티를 영속성 컨텍스트에 저장합니다. 트랜잭션을 커밋하여 플러시가 일어나면 엔티티를 저장한다는 점에서 IDENTITY 전략과 차이가 있습니다.\n\n**TABLE 전략**은 키 생성 전용 테이블을 만들어 시퀀스를 흉내내는 전략입니다. 어떤 테이블을 사용할 것인지를 `@TableGenerator`로 설정할 수 있습니다. TABLE 전략은 값을 조회하면서 SELECT 쿼리를 사용하며 증가를 위해 UPDATE 쿼리를 사용합니다. SEQUENCE 전략보다 DB와 한번 더 통신한다는 점에서 성능이 안좋다는 단점이 있지만, 모든 DB에 적용할 수 있다는 장점이 있습니다.\n\n**AUTO 전략**은 데이터베이스 방언에 따라서 IDENTITY, SEQUENCE, TABLE 중 하나를 자동으로 선택합니다. 데이터베이스를 변경해도 코드를 수정할 필요가 없다는 장점이 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[JPA] 기본 키(Primary Key)매핑 - @Id, @GeneratedValue](https://ttl-blog.tistory.com/123#%E2%AD%90%EF%B8%8F%20AUTO%C2%A0-1)\n- [[JPA] 기본 키 매핑 - SEQUENCE, TABLE 전략의 최적화](https://ttl-blog.tistory.com/122)\n- [Identity 전략으로는 Batch Insert가 불가능한 이유](https://dkswnkk.tistory.com/682#identity-%EC%A0%84%EB%9E%B5%EC%9C%BC%EB%A1%9C%EB%8A%94-batch-insert%EA%B0%80-%EB%B6%88%EA%B0%80%EB%8A%A5%ED%95%9C-%EC%9D%B4%EC%9C%A0)\n- [최범균님 JPA - JPA 기초 05 엔티티 식별자 생성 방식](https://youtu.be/Xw9uTs72SVo?feature=shared)", "title": "JPA에서 ID 생성 전략에 대해 설명해주세요."}, "be-27": {"id": "be-27", "content": "equals와 hashCode 메서드는 객체의 동등성 비교와 해시값 생성을 위해서 사용할 수 있습니다. 하지만, 함께 재정의하지 않는다면 예상치 못한 결과를 만들 수 있습니다. 가령, 해시값을 사용하는 자료구조(HashSet, HashMap..)을 사용할 때 문제가 발생할 수 있습니다. \n\n```java\nclass EqualsHashCodeTest {\n\n    @Test\n    @DisplayName(\"equals만 정의하면 HashSet이 제대로 동작하지 않는다.\")\n    void test() {\n        // 아래 2개는 같은 구독자\n        Subscribe subscribe1 = new Subscribe(\"team.maeilmail@gmail.com\", \"backend\");\n        Subscribe subscribe2 = new Subscribe(\"team.maeilmail@gmail.com\", \"backend\");\n        HashSet<Subscribe> subscribes = new HashSet<>(List.of(subscribe1, subscribe2));\n\n        // 결과는 1개여야하는데..? 2개가 나온다.\n        System.out.println(subscribes.size());\n    }\n\n    class Subscribe {\n\n        private final String email;\n        private final String category;\n\n        public Subscribe(String email, String category) {\n            this.email = email;\n            this.category = category;\n        }\n\n        @Override\n        public boolean equals(Object o) {\n            if (this == o) return true;\n            if (o == null || getClass() != o.getClass()) return false;\n            Subscribe subscribe = (Subscribe) o;\n            return Objects.equals(email, subscribe.email) && Objects.equals(category, subscribe.category);\n        }\n    }\n}\n\n```\n\n## 왜 이런 현상이 발생하나요? 🤔\n\n해시값을 사용하는 자료구조는 hashCode 메서드의 반환값을 사용하는데요. hashCode 메서드의 반환 값이 일치한 이후 equals 메서드의 반환값 참일 때만 논리적으로 같은 객체라고 판단합니다. 위 예제에서 Subscribe 클래스는 hashCode 메서드를 재정의하지 않았기 때문에 Object 클래스의 기본 hashCode 메서드를 사용합니다. Object 클래스의 기본 hashCode 메서드는 객체의 고유한 주소를 사용하기 때문에 객체마다 다른 값을 반환합니다. 따라서 2개의 Subscribe 객체는 다른 객체로 판단되었고 HashSet에서 중복 처리가 되지 않았습니다.", "title": "equals와 hashCode는 왜 함께 재정의해야 할까요?"}, "be-28": {"id": "be-28", "content": "동일성과 동등성은 객체를 비교할 때 중요한 개념입니다. 자바에서는 이 두 개념을 equals() 메서드와 == 연산자를 통해 구분할 수 있습니다.\n\n## `equals()`와 `==`의 차이는 무엇인가요?\n\nequals()는 **객체의 내용을 비교**하는 반면, ==는 **객체의 참조(레퍼런스)를 비교**합니다. 따라서 두 객체의 내용이 같더라도 서로 다른 객체라면 equals()는 true를 반환할 수 있지만, ==는 false를 반환합니다.\n\n## 동등성(Equality)은 뭔가요?\n동등성은 논리적으로 객체의 내용이 같은지를 비교하는 개념입니다. 자바에서는 `equals()` 메서드를 사용하여 객체의 동등성을 비교합니다. Apple 클래스를 예시로 보면, Object.equals 메서드를 오버라이딩하여 객체의 실제 데이터를 비교하도록 했습니다. 그래서 apple과 anotherApple은 다른 객체이지만, 무게가 같기 때문에 동등성 비교 결과 true가 반환됩니다.\n\n```java\npublic class Apple {\n\n    private final int weight;\n\n    public Apple(int weight) {\n        this.weight = weight;\n    }\n\n    @Override\n    public boolean equals(Object o) {\n        if (this == o) return true;\n        if (o == null || getClass() != o.getClass()) return false;\n        Apple apple = (Apple) o;\n        return weight == apple.weight;\n    }\n\n    @Override\n    public int hashCode() {\n        return Objects.hashCode(weight);\n    }\n\n    public static void main(String[] args) {\n        Apple apple = new Apple(100);\n        Apple anotherApple = new Apple(100);\n\n        System.out.println(apple.equals(anotherApple)); // true\n    }\n}\n```\n\n## 왜 equals() 메서드를 오버라이딩 했나요?\n\n```java\npublic class Object {\n    ...\n    public boolean equals(Object obj) {\n        return (this == obj);\n    }\n    ...\n}\n```\n\nObject 클래스의 equals() 메서드는 == 연산자를 사용하여 동일성을 비교합니다. 그리고 모든 클래스는 Object 클래스를 상속하여 동일성 비교를 기본으로 동작하기 때문에, 동등성 비교가 필요한 클래스에서 필요에 맞게 equals  & hashCode 메서드를 오버라이딩해야 합니다.\n\n## 동일성(Identity)은 뭔가요?\n\n동일성은 두 객체가 메모리 상에서 같은 객체인지 비교하는 개념입니다. 자바에서는 `==` 연산자를 사용하여 객체의 동일성을 비교합니다. == 연산자는 객체의 레퍼런스(참조)를 비교하므로, 두 변수가 동일한 객체를 가리키고 있는지를 확인합니다.\n\n```java\npublic static void main(String[] args) {\n    Apple apple1 = new Apple(100);\n    Apple apple2 = new Apple(100);\n    Apple apple3 = apple1;\n\n    System.out.println(apple1 == apple2); // false\n    System.out.println(apple1 == apple3); // true\n}\n```\napple1과 apple2는 참조가 다르기 때문에 == 연산 결과 false가 반환되지만, apple1의 참조를 가지는 apple3은 == 연산 결과 true를 반환합니다.\n\n## String은 객체인데 == 비교해도 되던데 어떻게 된건가요?\n문자열 리터럴은 **문자열 상수 풀(String Constant Pool)** 에 저장되기 때문에, 동일한 문자열 리터럴을 참조하면 ==  연산자가 true를 반환할 수 있습니다. 하지만 `new` 키워드를 사용하여 문자열을 생성하면 새로운 객체가 생성되므로 == 연산자가 false를 반환할 수 있습니다. 따라서 문자열 비교 시 항상 equals() 메서드를 사용한 동등성 비교를 하는 것이 좋습니다.\n\n```java\npublic class StringComparison {\n    public static void main(String[] args) {\n        String str1 = \"안녕하세요\";\n        String str2 = \"안녕하세요\";\n        String str3 = new String(\"안녕하세요\");\n        \n        // 동일성 비교\n        System.out.println(str1 == str2); // true\n        System.out.println(str1 == str3); // false\n        \n        // 동등성 비교\n        System.out.println(str1.equals(str2)); // true\n        System.out.println(str1.equals(str3)); // true\n    }\n}\n\n// String.class equals 오버라이딩 되어있음.\npublic boolean equals(Object anObject) {\n    if (this == anObject) {\n        return true;\n    }\n    return (anObject instanceof String aString)\n            && (!COMPACT_STRINGS || this.coder == aString.coder)\n            && StringLatin1.equals(value, aString.value);\n}\n```\n\n## Integer 같은 래퍼 클래스는 어떻게 비교하나요?\n래퍼 클래스도 객체이기 때문에 == 연산자는 참조를 비교합니다. 값 비교를 원할 경우 equals() 메서드를 사용해야 합니다. 다만, 자바는 특정 범위의 래퍼 객체를 캐싱하므로 같은 값의 Integer 객체가 같은 참조를 가질 수 있습니다(-128 ~ 127). 하지만 일반적으로 equals()를 사용하는 것이 안전합니다.\n\n## 추가 학습 자료를 공유합니다.\n- [자바의 동등성과 동일성 이해하기](https://f-lab.kr/insight/understanding-equality-and-identity-in-java)\n- [how-do-you-implement-equals-hashcode-methods](https://www.linkedin.com/advice/0/how-do-you-implement-equals-hashcode-methods)\n- [what-is-the-difference-between-identity-and-equality-in-oop](https://stackoverflow.com/questions/1692863/what-is-the-difference-between-identity-and-equality-in-oop)\n- [equals와 hashCode는 왜 함께 재정의해야 할까요?](https://www.maeil-mail.kr/question/70)", "title": "동일성과 동등성에 대해서 설명해주세요."}, "be-29": {"id": "be-29", "content": "@Component, @Service, @Controller, @Repository는 각각의 클래스를 특정 역할을 수행하는 Spring Bean으로 등록할 때 사용됩니다. 각 애너테이션은 클래스가 어떤 역할을 하는지를 명시적으로 나타내며, Spring의 @ComponentScan 기능을 통해 자동으로 Bean으로 등록됩니다. @Service, @Controller, @Repository 어노테이션은 내부적으로 @Component 어노테이션을 사용하고 있으며, 각 특징과 용도는 아래와 같습니다.\n\n- **@Component**는 가장 일반적인 형태의 어노테이션으로, 특정 역할에 종속되지 않는 일반적인 Spring Bean을 나타냅니다.\n공통 기능을 제공하는 유틸리티 클래스나, 특정 계층에 속하지 않는 일반적인 컴포넌트를 정의할 때 사용됩니다.\n\n- **@Service**는 비즈니스 로직을 수행하는 클래스에 사용되며 서비스 레이어의 Bean을 나타냅니다.\n\n- **@Controller**는 Spring MVC에서 웹 요청을 처리하는 컨트롤러 클래스에 사용되며 프레젠테이션 레이어의 Bean을 나타냅니다.\n\n- **@Repository**는 데이터베이스와의 상호작용을 수행하는 클래스에 사용되며. 데이터 액세스 레이어의 Bean을 나타냅니다.\n\n## @Controller, @Repository 대신 @Component 사용하면 안되나요?\n\nSpring 6(Spring Boot 3) 이전 버전에서는 @Component + @RequestMapping으로도 Bean 및 핸들러로 등록되었습니다. 하지만 Spring 6 이후 부터 @Controller 외에는 핸들러로 등록하지 않아 웹 요청을 정상적으로 수행할 수 없습니다.\n\n```java\npublic class RequestMappingHandlerMapping extends RequestMappingInfoHandlerMapping\n\t\timplements MatchableHandlerMapping, EmbeddedValueResolverAware {\n    ...\n    @Override\n    protected boolean isHandler(Class<?> beanType) {\n        return AnnotatedElementUtils.hasAnnotation(beanType, Controller.class); // 컨트롤러 애너테이션인지 확인\n    }\n    ...\n}\n```\n\n@Repository를 @Component로 대체할 경우, PersistenceExceptionTranslationPostProcessor에 의해 예외가 DataAccessException으로 변환되지 않습니다. 이 경우 데이터 액세스 계층에서 발생하는 예외 처리에 영향을 미칠 수 있습니다.\n\n또 @Service, @Controller, @Repository는 각각 특정 계층을 나타내므로, AOP의 포인트컷을 정의할 때 유용하게 사용될 수 있습니다. @Component를 사용하면 이러한 계층 구분이 불분명해져 AOP 적용이 어려울 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n- [Spring Bean Annotations](https://www.baeldung.com/spring-bean-annotations#repository)\n- [@RequestMapping without @Controller registered as handler [SPR-17622]](https://github.com/spring-projects/spring-framework/issues/22154)\n- [General ORM Integration Considerations](https://docs.spring.io/spring-framework/reference/data-access/orm/general.html#orm-exception-translation)", "title": "@Component, @Controller, @Service, @Repository의 차이점에 대해서 설명해주세요."}, "be-3": {"id": "be-3", "content": "## `@Value` 어노테이션 주의점\n\n`@Value`은 설정 파일에 설정한 값을 주입할 수 있는 어노테이션입니다. 첫 번째로 주의해야 할 부분은 **주입 시점**입니다. `@Value` 어노테이션은 대상 컴포넌트가 스프링 빈으로 등록되고 의존 관계를 주입할 때 동작합니다. 따라서 환경 변수를 주입받는 대상 클래스에 `@Component` 어노테이션을 붙여주지 않는다면 해당 클래스는 컴포넌트 스캔이 대상이 되지 않아 스프링 빈으로 등록되지 않고, `@Value` 어노테이션 또한 동작하지 않습니다.\n\n또한 상황에 따라서 **적절한 주입 방식**을 선택해야 하는데요. 빈을 주입받을 때와 마찬가지로 `@Value` 어노테이션을 사용할 때도 필드 주입, 생성자 주입, setter 주입 등의 방식을 사용할 수 있습니다. 따라서 이들의 장단점을 비교하고, 상황에 따라 적절한 주입 방식을 선택해야 합니다.\n\n마지막으로 **프로퍼티 파일의 경로와 스코프**를 확인해야 합니다. `application.yaml` 이 클래스 패스에 존재해야 하고, 프로퍼티 파일이 여러 개일 경우 우선순위를 고려해야 합니다.\n\n## `@ConfigurationProperties` 어노테이션과의 차이점은 무엇인가요? 🤔\n\n스프링의 프로퍼티 파일의 값은 Environment에 등록되는데요. 두 어노테이션 모두 이 값을 불러올 수 있다는 공통점이 있습니다. 단, **`@Value`의 경우에는 단일 값을 주입받기 위해서 사용되며, RelaxedBinding이 적용되지 않습니다.** RelaxedBingding이란 프로퍼티 이름이 조금 달라도 유연하게 바인딩을 시켜주는 규칙을 의미합니다. 반면, `@ConfigurationProperties` 어노테이션은 프로퍼티에 있는 값을 클래스로 바인딩하기 위해 사용됩니다. 그리고, **한 번에 여러 값을 바인딩 받을 수 있으며 RelaxedBinding을 적용합니다.**\n", "title": "@Value 어노테이션 사용 시 주의할 점을 설명해주세요."}, "be-30": {"id": "be-30", "content": "외부 서비스 장애로 인해 응답이 오래 걸린다고 했을 때 외부 API 응답으로 대기하는 자원들이 운영 서버 내부에 쌓이면서 성능에 악영향을 줄 수 있습니다. 이를 해결하기 위한 가장 기본적인 방법은 타임아웃을 설정하는 것입니다. 크게 타임아웃에는 커넥션 타임아웃과 리드 타임아웃, HTTP 커넥션 풀 타임아웃을 설정해 볼 수 있습니다.\n\n## 다음과 같이 특정 서비스의 장애가 전체 서비스에 영향을 주는 경우는 어떻게 해결할 수 있을까요? 🤔\n\n```\n1. A 서비스, B 서비스, C 서비스 연동 코드가 HTTP 커넥션 풀을 공유한다.\n2. A 서비스의 장애로 응답 시간 지연이 발생하는 경우\n    2-1. 풀에 남은 커넥션이 점점 줄어든다.\n    2-2. 풀에서 커넥션을 구하는 대기 시간이 증가한다.\n    2-3. B, C 서비스에 대한 연동도 함께 대기한다.\n```\n\n이 경우는 벌크헤드 패턴을 적용해 볼 수 있습니다. 벌크헤드 패턴은 기능의 종류마다 자원 사용을 분리하는 것을 의미하는데요. 자원을 격리하여 서비스 일부에 장애가 발생해도 전체로 전파되지 않도록 보장해 주는 패턴입니다. 위 예시에서는 외부 서비스마다 다른 HTTP 커넥션 풀을 사용하도록 벌크헤드 패턴을 적용할 수 있습니다. 서로 다른 커넥션 풀을 사용하기 때문에 A 서비스에 문제가 발생해도 B,C의 영향을 최소화할 수 있습니다.\n\n## 외부 서비스 장애가 계속 발생하면 어떻게 되나요? \n\n지속되는 외부 서비스 장애로 타임아웃에 의한 서비스 에러가 발생할 수 있습니다. 외부 서비스가 장애가 발생했는데도 불구하고 운영 서버는 계속 요청을 보내게 되니, 불필요하게 응답 시간이 저해되고, 처리량도 감소하게 됩니다. 이 문제를 해결하기 위해서는 서킷 브레이커를 적용할 수 있는데요. 서킷 브레이커는 오류가 지속되는 경우 일정 시간 동안 기능 실행을 차단할 수 있습니다. 서킷 브레이커가 빠른 실패를 도와주기 때문에 외부 서비스 장애에 의한 응답 시간 증가를 예방할 수 있습니다. \n\n## 추가 학습 자료를 공유합니다.\n\n- [외부 API 장애에 영향 덜 받는 3가지 방법](https://youtu.be/nuRO0ZBFdKk?si=9zZdnr_To1Cz4Ofu)\n- [Bulkhead 패턴을 사용한 장애 격리](https://hudi.blog/bulkhead-pattern/)\n- [Connection Timeout과 Read Timeout 살펴보기](https://alden-kang.tistory.com/20)", "title": "동기 방식으로 외부 서비스를 호출할 때 외부 서비스 장애가 나면 어떻게 조치할 수 있나요?"}, "be-31": {"id": "be-31", "content": "TCP 3-way handshake는 TCP/IP 네트워크에서 안정적이고 연결 지향적인 통신을 설정하기 위해 사용되는 절차입니다. 이 절차는 클라이언트와 서버 간에 신뢰할 수 있는 연결을 설정하기 위해 세 개의 메시지(세그먼트)를 교환하는 과정을 포함합니다.\n\n우선 클라이언트는 서버에 연결을 요청하는 SYN 세그먼트를 보내는데요. 이 세그먼트에는 초기 순서 번호(Sequence Number)와 윈도우 크기(Window Size) 정보가 포함되어 있습니다. \n\n이후 서버는 클라이언트의 요청을 수락하고, SYN과 ACK 플래그가 설정된 세그먼트를 클라이언트에 보냅니다. 이 세그먼트는 서버의 초기 순서 번호와 클라이언트의 초기 순서 번호에 대한 응답(ACK=클라이언트의 초기 순서 번호 + 1)을 포함합니다.\n\n클라이언트는 서버의 응답을 확인하고, ACK 플래그가 설정된 세그먼트를 서버에 보냅니다.\n이 세그먼트는 서버의 순서 번호에 대한 응답(ACK=서버의 초기 순서 번호 + 1)을 포함합니다.\n이 절차가 완료되면 클라이언트와 서버 간에 신뢰할 수 있는 연결이 설정되고, 데이터 전송이 시작될 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 🔮 수리의 TCP/IP](https://youtu.be/BEK354TRgZ8?feature=shared)\n- [[네트워크 쉽게 이해하기 22편] TCP 3 Way-Handshake & 4 Way-Handshake](https://mindnet.tistory.com/entry/%EB%84%A4%ED%8A%B8%EC%9B%8C%ED%81%AC-%EC%89%BD%EA%B2%8C-%EC%9D%B4%ED%95%B4%ED%95%98%EA%B8%B0-22%ED%8E%B8-TCP-3-WayHandshake-4-WayHandshake)\n\n", "title": "TCP 3-way handshake에 대해서 설명해주세요."}, "be-32": {"id": "be-32", "content": "동기와 비동기는 호출하는 함수의 작업 완료를 기다리는지 여부의 차이가 있습니다. 함수 A가 동기로 함수 B를 호출하면 A는 B의 작업이 완료될 때까지 기다려야 합니다. 따라서 작업이 순차적으로 진행됩니다. 반면, 함수 A가 비동기로 함수 B를 호출하면 A는 B의 작업 완료를 신경 쓰지 않고 따로 동작합니다. 따라서 작업이 순차적으로 진행되지 않습니다.\n\n## 블로킹과 동기는 어떤 차이가 있나요? 🤔\n\n두 개념은 유사하면서도 다른데요. 동기 호출에서는 호출된 함수가 작업을 완료할 때까지 호출한 함수가 기다립니다. 즉, 작업이 순차적으로 진행되는 것을 의미합니다. 반면, 블로킹은 함수가 호출된 후, 호출한 함수의 결과를 기다리기 위해 실행을 멈추는 상태를 의미합니다. 즉, 제어권이 반환되지 않고 대기하는 상황입니다. \n\n## 스프링에서 비동기 처리는 어떻게 하며 무엇을 주의해야 하나요?\n\n스프링에서는 `@Async` 어노테이션을 사용하여 비동기 처리를 수행할 수 있습니다. 해당 어노테이션을 사용하기 위해서는 몇 가지 주의할 부분이 있는데요. 기본적으로 `@Async` 가 적용된 메서드에서 발생하는 예외는 호출자에게 전파되지 않습니다. 비동기 메서드에서 예외를 정상적으로 처리하기 위해서는 별도의 비동기 예외 처리기를 사용해야 합니다. 또한, `@Async` 어노테이션은 프록시 기반으로 동작하기 때문에 같은 클래스 내부에서 직접 호출하는 경우 별도의 스레드에서 메서드가 실행되지 않습니다. 그리고, 비동기 메서드 내에서 생성한 트랜잭션은 상위 트랜잭션과 무관한 생명주기를 가집니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 호기의 blocking VS non-blocking, sync VS async](https://youtu.be/cmBFGSrHKnM?feature=shared)\n- [[10분 테코톡] 🐰 멍토의 Blocking vs Non-Blocking, Sync vs Async](https://youtu.be/oEIoqGd-Sns?feature=shared)\n- [[테코블] 동기와 비동기 with webClient](https://tecoble.techcourse.co.kr/post/2021-10-20-synchronous-asynchronous/)\n- [[Spring] @Async와 스레드풀](https://xxeol.tistory.com/44)", "title": "동기와 비동기의 차이점은 무엇인가요?"}, "be-33": {"id": "be-33", "content": "DBMS에서 트랜잭션을 특별한 제어 없이 병행 수행을 허용한다면 데이터의 일관성과 무결성을 보장하기 어려울 수 있습니다. 이때, 병행 수행되는 트랜잭션들을 제어하기 위해서 락을 사용할 수 있으며 DBMS에서 락은 크게 공유 락과 배타 락으로 분류할 수 있습니다.\n\n**공유 락(Shared Lock)** 은 읽기 락(Read Lock)이라고 부르며, 공유 락이 걸린 데이터에 대해서 다른 트랜잭션에서도 공유 락을 획득할 수 있지만, 배타 락은 획득할 수 없습니다. 즉, 공유 락을 사용하면 트랜잭션 내에서 조회한 데이터가 변경되지 않는다는 것을 보장합니다.\n\n```sql\nSELECT * FROM table_name WHERE id = 1 FOR SHARE;\n```\n\n**배타 락(Exclusive Lock)** 은 쓰기 락(Write Lock)이라고 부르며, 배타 락이 걸린 데이터에 대해서 다른 트랜잭션에서는 공유 락과 배타 락을 획득할 수 없습니다. 즉, 배타 락을 획득한 트랜잭션은 데이터에 대한 독점권을 가집니다.\n\n```sql\nSELECT * FROM table_name WHERE id = 1 FOR UPDATE;\n```\n\n정리하자면, 공유 락이 걸린 데이터는 다른 트랜잭션에서 공유 락을 획득 할 수 있고, 배타 락이 걸린 데이터는 다른 트랜잭션에서 어떤 종류의 락도 획득할 수 없어서 대기하는 상황이 발생할 수 있습니다.\n\n## 데드 락은 언제 발생하며 어떻게 해결할 수 있나요? 🤔\n\n**데드 락(Dead Lock)** 이란 교착 상태로, 두개 이상의 트랜잭션이 서로 필요로 하는 데이터의 락을 점유하고 있어서 무한히 대기하는 상황을 말합니다. 트랜잭션은 락을 획득하지 못하는 경우, 다른 트랜잭션이 점유하고 있는 락이 해제될 때까지 대기합니다. 예를 들어, 다음과 같은 트랜잭션들이 존재한다고 가정하겠습니다.\n\n- 트랜잭션 A, B가 있고 id가 1, 2인 데이터가 있는 상황에 두 트랜잭션이 시작합니다. \n- 트랜잭션 A는 id 1번을 읽고, 2번 데이터를 변경하는 트랜잭션입니다. \n- 트랜잭션 B는 id 2번을 읽고 1번을 변경하는 트랜잭션입니다. \n\n이때 다음과 같은 상황에서 데드 락이 발생할 수 있습니다.\n\n- A는 1번, B는 2번 데이터에 대해 공유 락을 획득합니다.\n- A는 2번 데이터의 공유 락을 가지고 있는 B 트랜잭션이 락을 해제할 때까지 대기합니다. \n- B는 1번 데이터의 공유 락을 가지고 있는 A 트랜잭션이 락을 해제할 때까지 대기합니다.\n\n데드 락을 해결하기 위해서 트랜잭션에서 락 획득 순서를 일관되게 할 수 있습니다. 모든 트랜잭션에서 1번 데이터, 2번 데이터 순으로 락을 획득할 시 데드 락이 발생하지 않습니다. 혹은 락 타임 아웃을 설정하여 데드 락 상황을 해결할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [MySQL 8.0의 공유 락(Shared Lock)과 배타 락(Exclusive Lock)](https://hudi.blog/mysql-8.0-shared-lock-and-exclusive-lock/)\n- [JPA의 비관적 락, MySQL 8.0 공유락과 베타락을 통한 동시성 제어](https://haon.blog/haon/jpa/pemistic-lock/)\n- [Shared and Exclusive Locks](https://dev.mysql.com/doc/refman/8.0/en/innodb-locking.html#innodb-shared-exclusive-locks)\n- [[10분 테코톡] ⛲️ 오즈의 데이터베이스 Lock](https://youtu.be/onBpJRDSZGA?si=UmGmBkVKYKO6-nsS)", "title": "공유 락과 배타 락에 대해서 설명해주세요."}, "be-34": {"id": "be-34", "content": "단위 테스트는 소프트웨어의 가장 작은 단위, 즉 개별 메서드나 함수의 기능을 검증하는 테스트입니다.\n특정 기능이 올바르게 동작하는지 확인하기 위함이며 독립적이고 빠르게 실행됩니다. 반면 통합 테스트는 개별 모듈들이 결합되어 전체 시스템이 올바르게 동작하는지 검증하는 테스트입니다.\n모듈 간의 상호작용이 올바르게 동작하는지 확인하기 위함이며 실제 데이터베이스, 네트워크 등의 외부 시스템과의 통합을 테스트합니다.\n\n## 슬라이스 테스트는 무엇인가요? 🤔\n\n슬라이스 테스트는 특정 레이어(ex. controller, service, repository)에 대한 테스트입니다.애플리케이션의 특정 슬라이스가 올바르게 동작하는지 확인하기 위해 작성됩니다. 스프링의 특정 컴포넌트만 로드하여 테스트하므로 상대적으로 빠르게 실행됩니다. 관련된 어노테이션으로는 `@WebMvcTest`, `@DataJpaTest` 등이 있습니다.\n\n## 테스트 코드를 작성해야하는 이유가 무엇인가요? 🤓\n\n테스트 코드를 작성하면 버그를 조기에 발견할 수 있으며 리팩터링을 수행할 경우 유용합니다. 또한, 개발 속도를 향상 시킬 수 있으며 코드에 대한 문서로서 역할을 수행할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [Spring Boot 슬라이스 테스트](https://tecoble.techcourse.co.kr/post/2021-05-18-slice-test/)\n- [스프링캠프 2019 [Track 2 Session 3] : 무엇을 테스트할 것인가? 어떻게 테스트할 것인가? (권용근)](https://youtu.be/YdtknE_yPk4?feature=shared)\n- [스프링캠프 2023 [Session 5] 실무에서 적용하는 테스트 코드 작성 방법과 노하우 (김남윤)](https://youtu.be/XSkz0kO7J3w?feature=shared)\n", "title": "단위 테스트와 통합 테스트의 차이점은 무엇인가요?"}, "be-35": {"id": "be-35", "content": "스레드, 프로세스, 코어의 수가 많을수록 시스템 성능이 향상된다고 생각할 수 있지만, 실제로는 그렇지 않을 확률이 큽니다. \n\n## 스레드가 많으면?\n스레드가 지나치게 많아지면 운영체제가 스레드 간 컨텍스트 스위칭을 자주 수행해야 하여 CPU 자원이 스레드 관리에 소모됩니다. 이로 인해 실제 작업 수행 효율이 떨어질 수 있으며, 많은 스레드가 동시에 실행될 경우 메모리나 캐시, 락 등의 자원을 경쟁하게 되어 성능 저하나 데드 락이 발생할 가능성이 높아집니다. 또한, 스레드가 많아지면 동기화와 상태 관리가 복잡해져 버그 발생 가능성도 커집니다.\n\n## 프로세스가 많으면?\n각 프로세스는 독립된 메모리 공간을 가집니다. 그래서 많은 프로세스가 동시에 실행되면 메모리 사용량이 급격히 증가할 수 있습니다. 또한, 프로세스를 생성하고 관리하는 데는 상당한 시스템 자원이 소모되며, 프로세스 간 통신(IPC)이 필요할 경우 성능 저하가 발생할 수 있습니다. 프로세스 간 컨텍스트 스위칭은 스레드 간 컨텍스트 스위칭보다 더 많은 오버헤드를 수반하기 때문에, 프로세스 수가 많아지면 시스템 성능이 저하될 수 있습니다. 운영체제는 동시에 실행할 수 있는 프로세스 수에 제한이 있으며, 이를 초과하면 새로운 프로세스 생성이 불가능하거나 시스템이 불안정해질 수 있습니다.\n\n## 코어가 많으면?\n많은 코어를 가진 CPU는 병렬 처리 성능을 향상시킬 수 있지만, 이를 최대한 활용하기 위해서는 소프트웨어가 멀티코어 환경에 최적화되어 있어야 합니다. 단일 스레드 작업이 주를 이루는 경우, 추가 코어의 이점을 제대로 활용하지 못할 수 있습니다. 또한, 코어 수가 많아질수록 CPU의 비용과 전력 소비가 증가할 수 있으며, 발열 관리도 더 복잡해집니다.\n\n## 추가 학습 자료를 공유합니다.\n- [CPU가 멀티태스킹을 하는 방법: 프로세스 VS 스레드](https://hongong.hanbit.co.kr/cpu%EA%B0%80-%EB%A9%80%ED%8B%B0%ED%83%9C%EC%8A%A4%ED%82%B9%EC%9D%84-%ED%95%98%EB%8A%94-%EB%B0%A9%EB%B2%95-%ED%94%84%EB%A1%9C%EC%84%B8%EC%8A%A4-vs-%EC%8A%A4%EB%A0%88%EB%93%9C/)\n- [완전히 정복하는 프로세스 vs 스레드 개념](https://inpa.tistory.com/entry/%F0%9F%91%A9%E2%80%8D%F0%9F%92%BB-%ED%94%84%EB%A1%9C%EC%84%B8%EC%8A%A4-%E2%9A%94%EF%B8%8F-%EC%93%B0%EB%A0%88%EB%93%9C-%EC%B0%A8%EC%9D%B4)\n- [[10분 테코톡] 🌷 코다의 Process vs Thread](https://www.youtube.com/watch?v=1grtWKqTn50)", "title": "스레드, 프로세스, 코어의 수는 많을수록 좋을까요?"}, "be-36": {"id": "be-36", "content": "애플리케이션과 데이터베이스가 통신을 하기 위해서는 데이터베이스 커넥션이 필요합니다. \n\n데이터베이스 커넥션의 생애주기 :\n1. 데이터베이스 드라이버를 사용하여 데이터베이스에 연결\n2. 데이터 읽기/쓰기를 위한 [TCP 소켓](https://en.wikipedia.org/wiki/Network_socket) 열기\n3. 소켓을 통한 데이터 읽기/쓰기\n4. 연결 종료\n5. 소켓 닫기\n\n커넥션 풀이 없다면 애플리케이션에서 데이터베이스에 접근해야하는 요청을 처리할 때마다 커넥션을 새로 생성하여 연결하고 해제하는 과정을 반복해야 합니다. 이 과정은 비용이 상당히 많이 들기 때문에 요청의 응답시간이 길어집니다. \n\n또 동시에 많은 요청이 들어올 경우 매번 새로운 커넥션을 생성하게 되는데, 데이터베이스의 최대 연결 수를 초과할 수 있습니다. 데이터베이스는 일반적으로 동시에 처리할 수 있는 요청 개수에 제한이 있는데, 이 제한을 초과하면 요청이 거부되어 사라지거나, 데이터베이스 자체가 비정상 종료될 수 있습니다.\n\n## 데이터베이스 커넥션 풀을 사용함으로써 얻을 수 있는 장점은 무엇인가요?\n\n커넥션 풀(Connection Pool)은 애플리케이션과 데이터베이스 간의 데이터베이스 연결(Connection)을 미리 생성해두고, 이를 재사용하는 기법을 말합니다. 데이터베이스에 접근할 때마다 새로운 연결을 생성하고 종료하는 대신, 미리 준비된 연결을 재사용함으로써 성능을 향상시키고 자원 사용을 최적화할 수 있습니다.\n\n커넥션 풀의 주요 구성 요소는 초기 풀 크기(Initial Pool Size), 최소 풀 크기(Minimum Pool Size), 최대 풀 크기(Maximum Pool Size), 연결 대기 시간(Connection Timeout) 등이 있고, 이를 통해 커넥션을 효율적으로 관리하고 사용할 수 있습니다.\n\n## 그럼 커넥션 풀 사이즈는 클 수록 좋나요? 🤔\n\n커넥션을 사용하는 주체는 스레드(Thread)이기 때문에, 커넥션과 스레드를 연결지어 생각해야 합니다. 만약 커넥션 풀 사이즈가 스레드 풀 사이즈보다 크면, 스레드가 모두 사용하지 못해서 리소스가 낭비됩니다. 반대로 커넥션 풀 사이즈가 스레드 풀 사이즈보다 작으면, 스레드가 커넥션이 반환되기를 기다려야 하기 때문에 작업이 지연됩니다.\n\n커넥션 풀 사이즈와 스레드 풀 사이즈의 균형이 맞더라도, 너무 큰 사이즈로 설정하면, 데이터베이스 서버, 애플리케이션 서버의 메모리와 CPU를 과도하게 사용하게 되므로 성능이 저하됩니다.\n\n## 추가 학습 자료를 공유합니다.\n- [A Simple Guide to Connection Pooling in Java](https://www.baeldung.com/java-connection-pooling)\n- [HikariCP](https://github.com/brettwooldridge/HikariCP)\n- [데이터베이스 커넥션 풀의 이해와 최적화 전략](https://f-lab.kr/insight/understanding-database-connection-pool)\n- [데이터베이스 커넥션 풀 (Connection Pool)과 HikariCP](https://hudi.blog/dbcp-and-hikaricp/)\n- [DBCP (DB connection pool)의 개념부터 설정 방법까지! hikariCP와 MySQL을 예제로 설명합니다!](https://youtu.be/zowzVqx3MQ4?si=NxuDRUs6SurARRx-)", "title": "데이터베이스 커넥션 풀(Connection Pool)을 사용하지 않으면 어떤 문제가 발생할 수 있나요?"}, "be-37": {"id": "be-37", "content": "예를들어 사용자가 `www.google.com`을 입력하면, 브라우저는 **HTTP 프로토콜**을 사용해 구글 웹 서버와 통신하려고 합니다. HTTP는 **OSI 7계층** 중 **애플리케이션 계층**에서 동작하는 프로토콜입니다. \n\n이때 브라우저는 요청한 도메인 이름(`www.google.com`)에 대한 **IP 주소**를 알아야 하기 때문에 **DNS(Domain Name System)** 서버에 질의합니다. 이 질의 과정 또한 **애플리케이션 계층**에서 이루어지며, DNS 서버는 해당 도메인에 대한 **IP 주소**(예를 들어, `142.250.190.78`)를 응답합니다.\n\nIP 주소를 얻은 후, 브라우저는 구글 서버와 통신을 시작합니다. HTTP는 **TCP/IP**를 기반으로 작동하므로, 데이터를 주고받기 전에 **TCP 3-Way Handshake** 과정이 필요합니다. 이 단계는 **전송 계층(4계층)** 에서 이루어집니다. \n\nTCP 연결이 성립된 후, 브라우저는 **HTTP Request** 메시지를 생성하여 구글 서버에 보냅니다. 예를 들어, 브라우저는 “GET / HTTP/1.1”이라는 요청을 **TCP 프로토콜**을 통해 **80번 포트**로 전송합니다. 이때 데이터는 **패킷(Packet)** 형태로 네트워크를 통해 전달됩니다. 네트워크를 통해 데이터를 전송하기 위해서는 **네트워크 계층(3계층)** 에서 IP 주소를 사용하고, **데이터 링크 계층(2계층)** 에서 MAC 주소를 사용하여 패킷이 전송됩니다.\n\n구글 서버는 클라이언트의 요청을 수신하고 이를 처리한 후, **HTTP Response** 메시지를 생성하여 응답합니다. 서버는 요청이 성공했음을 알리는 **200 OK** 상태 코드와 함께 웹 페이지 데이터를 전송합니다. 브라우저는 이 응답을 받아 HTML, CSS, 자바스크립트 등의 데이터를 해석하여 화면에 페이지를 렌더링합니다.\n\n모든 데이터 전송이 완료되면 클라이언트와 서버는 **4-Way Handshake** 과정을 거쳐 **TCP 연결을 종료**합니다.\n\n## 추가 학습 자료를 공유합니다.\n- [웹의 동작 방식](https://developer.mozilla.org/ko/docs/Learn/Getting_started_with_the_web/How_the_Web_works)\n- [웹페이지를 표시한다는 것: 브라우저는 어떻게 동작하는가](https://developer.mozilla.org/ko/docs/Web/Performance/How_browsers_work)\n- [웹 브라우저에 URL 입력하면 일어나는 일 - 인프라 위주](https://youtu.be/GAyZ_QgYYYo?si=w6SgpoZyDn2G4MQC)\n", "title": "사용자가 웹사이트에 처음 접근했을 때 발생하는 일련의 과정에 대해 설명해 주세요."}, "be-38": {"id": "be-38", "content": "연산을 여러 번 적용하더라도 결과가 달라지지 않는 성질을 멱등성이라고 합니다. HTTP 메서드의 멱등성은 동일한 요청을 한번 보내는 것과 여러번 보내는 것이 서로 동일한 효과를 지니며, 서버의 상태도 동일하게 남을 경우에 멱등하다고 이야기할 수 있습니다. 대표적으로 멱등한 메서드는 GET, HEAD, PUT, DELETE, TRACE, OPTIONS 가 있습니다. \n\n\n## 멱등성은 어떻게 활용될 수 있나요? 🤔\n\n모종의 이유로 전송 커넥션이 끊어졌을 때, 멱등성은 클라이언트가 다시 같은 요청을 해도 되는가에 대한 판단 근거가 될 수 있습니다. 멱등하다면 요청을 재시도할 때 같은 서버의 상태를 보장하기 때문에 문제가 없습니다. 반면, 멱등하지 않다면 재시도 요청시 중복 요청을 보내 문제를 발생 시킬 수 있습니다. 예를 들어, 사용자가 결제하는 시점에 타임아웃으로 인해 정상 응답을 못받는 상황을 생각해 볼 수 있습니다. 해당 경우에서 멱등하지 않은 결제 API 경우에는 결제가 성공했는지 수동으로 확인하고 재요청해야합니다. 반면, 멱등한 결제 API의 경우에는 안심하고 여러 번 요청할 수 있으며 중복 요청으로 발생하는 문제(중복 결제)를 방지할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [토스페이먼츠 - 멱등성이 뭔가요?](https://velog.io/@tosspayments/%EB%A9%B1%EB%93%B1%EC%84%B1%EC%9D%B4-%EB%AD%94%EA%B0%80%EC%9A%94)\n- [[HTTP] HTTP 메소드의 멱등성(Idempotence)과 Delete 메소드가 멱등한 이유](https://mangkyu.tistory.com/251)\n- [HTTP 멱등성(idempotency):개념에서 적용까지](https://rice-honey.tistory.com/8)\n\n", "title": "HTTP 메서드에서 멱등성이란 무엇인가요?"}, "be-39": {"id": "be-39", "content": "\n대표적인 동시성 제어 방식으로 **MVCC(Multi-Version Concurrency Control)** 와 **Lock-Based Concurrency Control**이 있습니다.\n\n## MVCC(Multi-Version Concurrency Control)\nMVCC는 데이터의 여러 버전을 유지하여 트랜잭션이 동시에 데이터를 읽고 쓸 수 있도록 하는 방식입니다. 각 트랜잭션은 자신만의 **일관된 스냅샷**을 기반으로 데이터를 읽어, 다른 트랜잭션의 변경 사항에 영향을 받지 않습니다.\n\n데이터의 각 버전을 유지하여 읽기 작업이 쓰기 작업과 독립적으로 이루어질 수 있습니다. 트랜잭션은 시작 시점의 스냅샷을 기반으로 데이터를 읽어, 다른 트랜잭션의 변경 사항을 보지 못합니다. \n\n또한 **읽기 작업 시 잠금을 사용하지 않아 높은 동시성**을 제공합니다. 읽기 작업이 잠금에 의해 지연되지 않아, 읽기 중심의 애플리케이션에서 우수한 성능을 보입니다. 읽기 작업 시 잠금을 사용하지 않으므로, 쓰기 작업과의 충돌이 줄어듭니다. 하지만 여러 버전의 데이터를 유지해야 하므로 저장 공간이 더 많이 필요할 수 있습니다.\n\n트랜잭션이 시작된 시점의 데이터 상태를 기반으로 읽기 작업을 수행하여 일관성을 유지합니다. 또 갭락과 넥스트키 락을 통해 팬텀 리드를 방지합니다.\n\n## Lock-Based Concurrency Control\nLock-Based 방식은 데이터에 접근할 때 **잠금(Lock)** 을 사용하여 동시성을 제어합니다. 트랜잭션이 데이터를 읽거나 수정할 때 해당 데이터에 잠금을 걸어 다른 트랜잭션의 접근을 제한합니다. 즉, 잠금을 통해 데이터의 일관성과 무결성을 직접적으로 제어합니다.\n\n데이터에 접근할 때 잠금을 걸어 다른 트랜잭션의 접근을 제한합니다. **읽기 작업은 공유 잠금**을, **쓰기 작업은 배타 잠금**을 사용하여 동시성을 제어합니다. 많은 다수의 트랜잭션이 동일한 데이터에 접근할 경우 성능 저하가 발생할 수 있습니다. 또 잘못된 잠금 순서나 설계로 인해 교착 상태(Deadlock)가 발생할 위험이 있습니다.\n\n\n## MVCC와 Lock-Based Concurrency Control 둘 중 어떤 걸 사용해야 하나요? 🤔\n실제 데이터베이스 시스템, 특히 MySQL의 InnoDB는 MVCC와 Lock-Based 방식의 장점을 결합하여 동시성 제어를 최적화합니다.\n\n**읽기 트랜잭션은 MVCC를 사용**하여 일관된 스냅샷을 기반으로 데이터를 읽으므로, **잠금을 최소화**하고 **높은 동시성**을 유지할 수 있습니다.\n\n**쓰기 트랜잭션은 잠금을 사용**하여 **데이터의 일관성과 무결성을 유지**하면서, 동시에 **데이터 충돌을 방지**합니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[Database] MVCC(다중 버전 동시성 제어)란?](https://mangkyu.tistory.com/53)\n- [MVCC(Multi Version Concurrency Control) 알아보기](https://monday9pm.com/mvcc-multi-version-concurrency-control-%EC%95%8C%EC%95%84%EB%B3%B4%EA%B8%B0-e4102cd97e59)\n- [Lock Based Concurrency Control Protocol in DBMS](https://www.geeksforgeeks.org/lock-based-concurrency-control-protocol-in-dbms/)\n- [What is MVCC? How does multiversion concurrency control work?](https://www.theserverside.com/blog/Coffee-Talk-Java-News-Stories-and-Opinions/What-is-MVCC-How-does-Multiversion-Concurrencty-Control-work)", "title": "데이터베이스 시스템에서 동시성을 제어하는 방법에 대해 설명해주세요."}, "be-4": {"id": "be-4", "content": "## @ExceptionHandler란?\n\n`@ExceptionHandler` 애너테이션은 Spring MVC에서 컨트롤러(`@Controller`)나 전역 예외 처리를 위한 `@ControllerAdvice` 클래스의 메서드에서 발생하는 예외를 처리하는 데 사용되는데요. 이 애너테이션은 특정 예외를 처리하는 메서드를 지정하거나 메서드의 파라미터로 처리할 예외를 설정할 수 있습니다.\n\n## 어떤 방식으로 동작하나요? 🤔\nSpring MVC 애플리케이션에서 예외가 발생하면, DispatcherServlet이 적절한 HandlerExceptionResolver를 찾아 예외를 처리합니다. Spring에 기본적으로 등록된 HandlerExceptionResolver는 세 가지가 있으며, 각 리졸버는 우선순위에 따라 예외를 처리합니다. 그 중 ExceptionHandlerExceptionResolver가 가장 먼저 동작하며, 발생한 예외가 `@ExceptionHandler`에 등록되어 있는지 확인합니다. 만약 처리할 수 없는 예외라면 다음 리졸버로 넘어갑니다. ExceptionHandlerExceptionResolver의 특징은 예외가 WAS로 던져지지 않고 직접 처리된다는 것입니다.\n\n이렇게 함으로써 예외가 발생했을 때 적절한 방법으로 처리되어 사용자에게 친화적인 에러 메시지를 제공하거나 로깅 등의 추가 작업을 수행할 수 있습니다.", "title": "@ExceptionHandler 어노테이션은 무엇인가요?"}, "be-40": {"id": "be-40", "content": "## Phantom Read란 무엇인가요?\n\nPhantom Read는 트랜잭션이 동일한 조건의 쿼리를 반복 실행할 때, 나중에 실행된 쿼리에서 처음에는 존재하지 않았던 새로운 행이 나타나는 현상을 말합니다. 이는 주로 **읽기 일관성(Read Consistency)** 을 유지하는 과정에서 발생할 수 있는 문제로, 데이터의 삽입이나 삭제가 다른 트랜잭션에 의해 이루어질 때 발생합니다.\n\n```sql\n-- 트랜잭션 A 시작\nSTART TRANSACTION;\n\n-- 트랜잭션 A 첫 번째 조회\nSELECT * FROM orders WHERE amount > 150;\n\n-- 트랜잭션 B 시작\nSTART TRANSACTION;\n\n-- 트랜잭션 B 새로운 행 삽입\nINSERT INTO orders (customer_id, amount) VALUES (4, 250);\n\n-- 트랜잭션 B 커밋\nCOMMIT;\n\n-- 동일한 조건으로 트랜잭션 A 두 번째 조회시, 트랜잭션 A의 첫 번째 조회에는 존재하지 않던, 트랜잭션 B에서 삽입된 새로운 행이 함께 조회된다.\n-- 단, MVCC를 지원하는 경우 해당 케이스에서 팬텀 리드가 발생하지 않는다.\nSELECT * FROM orders WHERE amount > 150;\n```\n\n## 갭락(Gap Lock)이란?\n\n갭 락은 특정 인덱스 값 사이의 **공간**을 잠그는 락입니다. 기존 레코드 간의 간격을 보호하여 새로운 레코드의 삽입을 방지합니다. 갭 락은 **범위 내에 특정 레코드가 존재하지 않을 때** 적용됩니다. 트랜잭션이 특정 범위 내에서 데이터의 삽입을 막아 **팬텀 읽기(Phantom Read)** 현상을 방지합니다. 예를 들어, 인덱스 값 10과 20 사이의 갭을 잠그면 이 범위 내에 새로운 레코드 15를 추가할 수 없습니다.\n\n```sql\n-- id 1, 3, 5가 저장된 orders 테이블\n\n-- 트랜잭션 A 시작\nSTART TRANSACTION;\n\n-- 트랜잭션 A 1-3과 3-5 사이의 갭과 3 레코드 락 설정(넥스트키 락)\nSELECT * FROM orders WHERE orders_id BETWEEN 2 AND 4 FOR UPDATE;\n\n-- 트랜잭션 B 시작\nSTART TRANSACTION;\n\n-- 트랜잭션 B가 id 4에 데이터 삽입 시도 시, 갭락으로 인해 삽입이 차단되어 대기\nINSERT INTO orders (orders_id, orders_amount) VALUES (4, 200);\n...\n```\n\n## 넥스트키 락(Next-Key Lock)이란?\n**넥스트키 락**은 **레코드 락**과 **갭락**을 결합한 형태로, 특정 인덱스 레코드와 그 주변의 갭을 동시에 잠그는 락입니다. 이를 통해 레코드 자체의 변경과 함께 그 주변 공간의 변경도 동시에 제어할 수 있습니다.\n\n넥스트키 락은 특정 레코드와 그 주변 공간을 잠그기 때문에, 다른 트랜잭션이 새로운 레코드를 삽입하여 팬텀 리드를 발생시키는 것을 방지합니다.\n\n| orders_id | orders_amount |\n| --------- | ------------- |\n| 1         | 100           |\n| 2         | 200           |\n| 3         | 300           |\n```sql\n-- 트랜잭션 A 시작\nSTART TRANSACTION;\n\n-- 트랜잭션 A amount = 200인 orders_id = 2 레코드에 대한 레코드 락과 1-2, 2-3에 대한 갭락을 동시에 잠금으로써 넥스트키 락을 설정\nSELECT * FROM orders WHERE orders_amount = 200 FOR UPDATE;\n\n-- 트랜잭션 B 시작\nSTART TRANSACTION;\n\n-- 트랜잭션 B orders_id = 4, orders_amount = 200인 레코드 삽입 시도 시, 넥스트키 락으로 인해 차단되어 대기\nINSERT INTO orders (orders_id, order_amount) VALUES (4, 200);\n...\n```  \n  \n## 갭락과 넥스트키 락을 통한 팬텀 리드 방지 메커니즘\n**트랜잭션 A**가 특정 범위의 데이터를 조회할 때, 해당 범위에 대해 갭락 또는 넥스트키 락을 설정합니다. 락이 설정된 범위 내에서는 **트랜잭션 B**가 새로운 레코드를 삽입하거나 기존 레코드를 수정하는 것이 차단됩니다. 따라서, 트랜잭션 A가 다시 동일한 조건으로 조회를 수행하더라도, 트랜잭션 B에 의해 새로운 데이터가 삽입되지 않아 팬텀 리드가 발생하지 않습니다.\n\n## 추가 학습 자료를 제공합니다.\n- [MySQL - InnoDB Locking](https://dev.mysql.com/doc/refman/8.0/en/innodb-locking.html)\n- [MySQL - Transaction Isolation Levels](https://dev.mysql.com/doc/refman/8.0/en/innodb-transaction-isolation-levels.html)\n- [[MySQL] 스토리지 엔진 수준의 락의 종류(레코드 락, 갭 락, 넥스트 키 락, 자동 증가 락)](https://mangkyu.tistory.com/298)", "title": "MySQL InnoDB에서 갭락과 넥스트키 락이란 무엇이며, 어떻게  팬텀 리드를 방지하나요?"}, "be-41": {"id": "be-41", "content": "CORS(Cross Origin Resource Sharing)는 출처가 다른 곳의 리소스를 요청할 때 접근 권한을 부여하는 메커니즘입니다. 리소스를 주고받는 두 곳의 출처가 다르면 출처가 교차한다고 합니다. 이때 출처는 URL뿐만 아니라 프로토콜과 포트까지 포함됩니다. 만약 클라이언트의 출처가 허용되지 않았다면 CORS 에러가 발생할 수 있습니다.\n\n## CORS는 왜 필요한가요?\n\n과거에는 크로스 사이트 요청 위조(CSRF, Cross-Site Request Forgery) 문제가 있었습니다. 피해자의 브라우저에서 다른 애플리케이션으로 가짜 클라이언트 요청을 전송하는 공격입니다.\n\nCSRF를 예방하기 위해 브라우저는 동일 출처 정책(SOP, same-origin policy)을 구현했습니다. SOP가 구현된 브라우저는 클라이언트와 동일한 출처의 리소스로만 요청을 보낼 수 있습니다.\n\n하지만, SOP는 한계가 있습니다. 현대의 웹 애플리케이션은 다른 출처의 리소스를 사용하는 경우가 많기 때문입니다. 따라서, SOP를 확장한 CORS가 필요합니다.\n\n## CORS는 어떻게 작동할까요? 🤔\n\n브라우저가 요청 메시지에 Origin 헤더와 응답 메시지의 Access-Control-Allow-Origin 헤더를 비교해서 CORS를 위반하는지 확인합니다. 이때, Origin에는 현재 요청하는 클라이언트의 출처(프로토콜, 도메인, 포트)가, Access-Control-Allow-Origin은 리소스 요청을 허용하는 출처가 작성됩니다.\n\n이렇게 단순하게 요청하는 것을 **Simple Request**라고 합니다. Simple Request은 요청 메서드(GET, POST, HEAD), 수동으로 설정한 요청 헤더(Accept, Accept-Language, Content-Language, Content-Type, Range), Content-Type 헤더(application/x-www-form-urlencoded, multipart/form-data, text/plain)인 경우에만 해당합니다.\n\n브라우저가 사전 요청을 보내는 경우도 있습니다. 이때 사전 요청을 **Preflight Request**라고 합니다. 브라우저가 본 요청을 보내기 이전, Preflight Request를 OPTIONS 메서드로 요청을 보내어 실제 요청이 안전한지 확인합니다.\n\nPreflight Request는 추가로 Access-Control-Request-Method로 실 요청 메서드와, Access-Control-Request-Headers 헤더에 실 요청의 추가 헤더 목록을 담아서 보내야 합니다.\n\n이에 대한 응답은 대응되는 Access-Control-Allow-Methods와 Access-Control-Headers를 보내야 하고, Preflight Request로 인한 추가 요청을 줄이기 위해 캐시 기간을 Access-Control-Max-Age에 담아서 보내야 합니다.\n\n또한 인증된 요청을 사용하는 방식도 있는데요. 이를 **Credential Request**라고 합니다. 쿠키나 토큰과 같은 인증 정보를 포함한 요청은 더욱 안전하게 처리되어야 합니다. 이때 Credential Request를 수행합니다.\n\nCredential Request를 요청하는 경우에는 서버에서는 Access-Control-Allow-Credentials를 true로 설정해야 하며 Access-Control-Allow-Origin에 와일드카드를 사용하지 못합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n\n- [토스페이먼츠 - CORS 대응하기](https://docs.tosspayments.com/blog/payment-window-cors-error#%EA%B2%B0%EC%A0%9C%EC%B0%BD%EC%97%90%EC%84%9C-cors-%EB%8C%80%EC%9D%91%ED%95%98%EA%B8%B0)\n- [MDN - 교차 출처 리소스 공유 (CORS)](https://developer.mozilla.org/ko/docs/Web/HTTP/CORS)\n- [테코블 - CORS란?](https://tecoble.techcourse.co.kr/post/2020-07-18-cors/)", "title": "CORS란 무엇인가요?"}, "be-42": {"id": "be-42", "content": "## 포워드 프록시(Forward Proxy)\n\n포워드 프록시는 주로 클라이언트 측에 위치하여, 사용자가 인터넷에 접근할 때 중개자 역할을 합니다. \n\n예를 들어, 회사 내부 네트워크에서 근무하는 직원이 외부 웹사이트에 접속하려고 할 때, 포워드 프록시 서버를 통해 요청이 전달됩니다. 이 과정에서 사용자의 실제 IP 주소는 숨겨지고, 프록시 서버의 IP 주소가 대신 사용됩니다.\n\n포워드 프록시의 핵심 기능 중 하나는 **익명성 제공**입니다. 사용자의 실제 IP를 숨김으로써 개인정보 보호와 보안 측면에서 큰 장점을 제공합니다.\n\n또한 **캐싱**을 통해 네트워크 성능을 향상시킵니다. 자주 요청되는 웹 페이지나 파일을 프록시 서버에 저장해두면, 동일한 요청이 다시 들어올 때 빠르게 응답할 수 있어 네트워크 대역폭을 절약할 수 있습니다. \n\n이와 함께 **보안 강화** 기능도 포워드 프록시의 중요한 역할 중 하나입니다. 악성 웹사이트나 불법적인 콘텐츠에 대한 접근을 차단하여 네트워크 보안을 강화하고, 바이러스나 악성 코드의 유입을 예방할 수 있습니다.\n\n\n## 리버스 프록시(Reverse Proxy)\n리버스 프록시는 서버 측에 위치하여 외부에서 들어오는 클라이언트의 요청을 내부 서버로 전달하는 역할을 합니다.\n\n리버스 프록시의 핵심 기능 중 하나는 **로드 밸런싱**입니다. 다수의 백엔드 서버로 트래픽을 분산시켜 서버 과부하를 방지하고, 서비스의 고가용성을 유지할 수 있습니다.\n\n또한 외부에서 직접 백엔드 서버에 접근하지 못하게 하여 DDoS 공격이나 해킹 시도로부터 서버를 보호할 수 있습니다.\n\n**SSL 종료**는 리버스 프록시의 또 다른 중요한 기능입니다. SSL/TLS 암호화를 리버스 프록시에서 처리함으로써 백엔드 서버의 부담을 줄이고, 중앙에서 인증서를 관리할 수 있습니다. \n\n또한, 리버스 프록시는 캐싱 및 콘텐츠 최적화 기능을 통해 정적 콘텐츠를 캐싱하여 응답 속도를 향상시키고 서버 부하를 줄일 수 있습니다.\n\n## 추가 학습 자료를 제공합니다.\n- [포워드 프록시와 리버스 프록시](https://hudi.blog/forward-proxy-reverse-proxy/)\n- [Reverse Proxy / Forward Proxy 정의 & 차이 정리 - Inpa Dev ‍](https://inpa.tistory.com/entry/NETWORK-%F0%9F%93%A1-Reverse-Proxy-Forward-Proxy-%EC%A0%95%EC%9D%98-%EC%B0%A8%EC%9D%B4-%EC%A0%95%EB%A6%AC)", "title": "리버스 프록시와 포워드 프록시의 차이점에 대해 설명해주세요."}, "be-43": {"id": "be-43", "content": "기본적으로 `@Transactional`, `@Cacheable`, `@Async` 등의 애너테이션은 런타임에 동작하는 Spring AOP를 기반으로 동작합니다. Spring AOP가 제공하는 JDK Dynamic Proxy, CGLIB 방식 모두 타깃이 구현하는 인터페이스나 구체 클래스를 대상으로 프록시를 만들어서 타깃 클래스의 메서드 수행 전후에 횡단 관심사에 대한 처리를 할 수 있습니다. \n\nSpring은 빈 생성시, 해당 빈에 AOP 애너테이션이 있는지 검사하고, 있다면 프록시 객체를 생성하여 빈을 대체합니다. AOP 적용 대상인 클래스의 경우, 즉, `@Transactional`과 같은 AOP 애너테이션이 하나라도 선언된 클래스는 프록시로 감싸집니다.\n\nJDK Dynamic Proxy의 경우 타깃 클래스가 구현하는 인터페이스를 기준으로 프록시를 생성하여\u001d`public` 메서드만 AOP 적용 가능합니다. CGLIB 방식의 경우 인터페이스를 구현하지 않는 클래스를 상속하여 프록시를 생성하고, `private`을 제외한 `public`, `protected`, `package-private` 메서드에 AOP 적용 가능합니다.\n\n```java\n@Slf4j  \n@RequiredArgsConstructor  \n@Service  \npublic class SelfInvocation {  \n  \n    private final MemberRepository memberRepository;  \n  \n    public void outerSaveWithPublic(Member member) {  \n        saveWithPublic(member);  \n    }  \n  \n    @Transactional  \n    public void saveWithPublic(Member member) {  \n        log.info(\"call saveWithPublic\");  \n        memberRepository.save(member);  \n        throw new RuntimeException(\"rollback test\");  \n    }  \n  \n    public void outerSaveWithPrivate(Member member) {  \n        saveWithPrivate(member);  \n    }  \n  \n    @Transactional  \n    private void saveWithPrivate(Member member) {  \n        log.info(\"call saveWithPrivate\");  \n        memberRepository.save(member);  \n        throw new RuntimeException(\"rollback test\");  \n    }  \n}\n\npublic interface MemberRepository extends JpaRepository<Member, Long> {  \n}\n```\n\n```java\n@SpringBootTest  \nclass SelfInvocationTest {  \n  \n    private static final Logger log = LoggerFactory.getLogger(SelfInvocationTest.class);  \n  \n    @Autowired  \n    private SelfInvocation selfInvocation;  \n  \n    @Autowired  \n    private MemberRepository memberRepository;  \n  \n    @AfterEach  \n    void tearDown() {  \n        memberRepository.deleteAllInBatch();  \n    }  \n  \n    @Test  \n    void aopProxyTest() {  \n        // @Transactional 애너테이션을 가지고 있으므로, 빈이 Proxy 객체로 대체되어 주입된다.  \n        assertThat(AopUtils.isAopProxy(selfInvocation)).isTrue();  \n        // interface를 구현하지 않은 클래스이므로 CGLIB Proxy가 생성된다.  \n        assertThat(AopUtils.isCglibProxy(selfInvocation)).isTrue();  \n    }  \n  \n    @Test  \n    void outerSaveWithPublic() {  \n        Member member = new Member(\"test\");  \n  \n        try {  \n            selfInvocation.outerSaveWithPublic(member);  \n        } catch (RuntimeException e) {  \n            log.info(\"catch exception\");  \n        }  \n  \n        List<Member> members = memberRepository.findAll();  \n        // self invocation 문제로 인해 트랜잭션이 정상 동작하지 않음.  \n        // 예외 발생으로 인한 롤백이 동작하지 않고 남아있음.\n    \n      assertThat(members).hasSize(1);  \n    }  \n  \n    @Test  \n    void outerSaveWithPrivate() {  \n        try {  \n            selfInvocation.outerSaveWithPrivate(new Member(\"test\"));  \n        } catch (RuntimeException e) {  \n            log.info(\"catch exception\");  \n        }  \n  \n        List<Member> members = memberRepository.findAll();  \n  \n        // self invocation 문제로 인해 트랜잭션이 정상 동작하지 않음.  \n        // 예외 발생으로 인한 롤백이 동작하지 않고 남아있음.        assertThat(members).hasSize(1);  \n    }  \n  \n    @Test  \n    void saveWithPublic() {  \n        Member member = new Member(\"test\");  \n  \n        try {  \n            selfInvocation.saveWithPublic(member);  \n        } catch (RuntimeException e) {  \n            log.info(\"catch exception\");  \n        }  \n  \n        List<Member> members = memberRepository.findAll();  \n  \n        // 외부에서 프록시 객체를 통해 메서드가 호출되었기 때문에 트랜잭션 정상 동작, 롤백 성공.  \n        assertThat(members).hasSize(0);  \n    }  \n}\n```\n\nSpring AOP는 외부에서 프록시 객체를 통해 메서드가 호출될 때만 AOP 어드바이스(트랜잭션 관리)를 적용합니다. 같은 클래스 내에서 메서드를 호출하면, 프록시를 거치지 않고 직접 호출되므로 트랜잭션 어드바이스가 적용되지 않습니다.\n\n이를 해결하기 위해서는 자기 자신을 프록시로 주입 받아 프록시를 통해 메서드를 호출하거나, 별도의 클래스로 분리하거나, AspectJ를 이용하는 방법이 있습니다. AspectJ를 사용하면 동일 클래스 내에서의 메서드 호출에도 AOP 어드바이스를 적용할 수 있습니다.\n\n## 자기 자신을 프록시로 주입 받는 방법\n\n```java\n@Slf4j  \n@RequiredArgsConstructor  \n@Service  \npublic class SelfInvocation {  \n  \n    private final MemberRepository memberRepository;  \n    private final SelfInvocation selfInvocation;  \n  \n    public void outerSaveWithPublic(Member member) {  \n        selfInvocation.saveWithPublic(member);  \n    }  \n  \n    @Transactional  \n    public void saveWithPublic(Member member) {  \n        log.info(\"call saveWithPublic\");  \n        memberRepository.save(member);  \n        throw new RuntimeException(\"rollback test\");  \n    }\n    ...\n}\n```\n\n이 방법은 순환 의존성 문제를 일으킬 수 있어 권장되지 않습니다.\n\n## 별도의 클래스로 분리하는 방법\n\n```java\n@Slf4j  \n@RequiredArgsConstructor  \n@Service  \npublic class TransactionService {  \n  \n    @Transactional  \n    public void outer() {  \n        log.info(\"call outer\");  \n        logCurrentTransactionName();  \n        logActualTransactionActive();  \n        inner();  \n    }  \n  \n    @Transactional(propagation = Propagation.REQUIRES_NEW)  \n    public void inner() {  \n        log.info(\"call inner\");  \n        logCurrentTransactionName();  \n        logActualTransactionActive();  \n    }  \n  \n    private void logActualTransactionActive() {  \n        boolean actualTransactionActive = TransactionSynchronizationManager.isActualTransactionActive();  \n        log.info(\"actualTransactionActive = {}\", actualTransactionActive);  \n    }  \n  \n    private void logCurrentTransactionName() {  \n        String currentTransactionName = TransactionSynchronizationManager.getCurrentTransactionName();  \n        log.info(\"currentTransactionName = {}\", currentTransactionName);  \n    }  \n}\n\n// 로그\n// call outer  \n// currentTransactionName = server.transaction.TransactionService.outer  \n// actualTransactionActive = true  \n// call inner  \n// currentTransactionName = server.transaction.TransactionService.outer  \n// actualTransactionActive = true\n```\n\nouter가 inner 메서드를 호출하는데, outer의 propagation 속성은 REQUIRED, inner는 REQUIRES_NEW로 서로 다른 트랜잭션으로 분리되어야 합니다. 하지만, 로그를 보면 동일한 outer의 트랜잭션에 속해있습니다. 이처럼 트랜잭션 전파 속성이 다른 두 메서드가 동일한 클래스 내부에서 self invocation 호출하면 의도대로 동작하지 않습니다. 이 때 outer와 inner 메서드를 각각 다른 클래스로 분리하여 호출하면 해결할 수 있습니다.\n\n```java \n// OuterTransactionService\n@Slf4j  \n@RequiredArgsConstructor  \n@Service  \npublic class OuterTransactionService {  \n  \n    private final InnerTransactionService innerTransactionService;  \n  \n    @Transactional  \n    public void outer() {  \n        log.info(\"call outer\");  \n        logCurrentTransactionName();  \n        logActualTransactionActive();  \n        innerTransactionService.inner();  \n    }  \n  \n    private void logActualTransactionActive() {  \n        boolean actualTransactionActive = TransactionSynchronizationManager.isActualTransactionActive();  \n        log.info(\"actualTransactionActive = {}\", actualTransactionActive);  \n    }  \n  \n    private void logCurrentTransactionName() {  \n        String currentTransactionName = TransactionSynchronizationManager.getCurrentTransactionName();  \n        log.info(\"currentTransactionName = {}\", currentTransactionName);  \n    }  \n}\n\n// InnerTransactionService\n@Slf4j  \n@RequiredArgsConstructor  \n@Service  \npublic class InnerTransactionService {  \n  \n    @Transactional(propagation = Propagation.REQUIRES_NEW)  \n    public void inner() {  \n        log.info(\"call inner\");  \n        logCurrentTransactionName();  \n        logActualTransactionActive();  \n    }  \n  \n    private void logActualTransactionActive() {  \n        boolean actualTransactionActive = TransactionSynchronizationManager.isActualTransactionActive();  \n        log.info(\"actualTransactionActive = {}\", actualTransactionActive);  \n    }  \n  \n    private void logCurrentTransactionName() {  \n        String currentTransactionName = TransactionSynchronizationManager.getCurrentTransactionName();  \n        log.info(\"currentTransactionName = {}\", currentTransactionName);  \n    }  \n}\n\n// 로그\n// call outer  \n// currentTransactionName = server.transaction.OuterTransactionService.outer  \n// actualTransactionActive = true  \n// call inner  \n// currentTransactionName = server.transaction.InnerTransactionService.inner  \n// actualTransactionActive = true\n```\n\n이처럼 각각 프록시를 생성할 수 있게 두 클래스로 분리하면 AOP 어드바이스가 적용되어 의도한 대로 독립적인 트랜잭션을 시작할 수 있게 됐습니다.\n\n## 추가 학습 자료를 제공합니다.\n- [Spring - Proxying Mechanisms](https://docs.spring.io/spring-framework/reference/core/aop/proxying.html)\n- [Spring - Programmatic Transaction Management](https://docs.spring.io/spring-framework/reference/data-access/transaction/programmatic.html)\n- [테코블 - AOP에 대
