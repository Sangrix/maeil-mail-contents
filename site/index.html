get`을 적절히 활용하면, 이벤트 처리 시 원하는 대상을 명확히 지정하여 예기치 않은 동작을 방지할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] Event: currentTarget property](https://developer.mozilla.org/en-US/docs/Web/API/Event/currentTarget)\n- [[Mong dev blog] event.target, event.currentTarget의 차이(feat. 이벤트 버블링)](https://mong-blog.tistory.com/entry/JS-eventtarget-eventcurrentTarget%EC%9D%98-%EC%B0%A8%EC%9D%B4feat-%EC%9D%B4%EB%B2%A4%ED%8A%B8-%EB%B2%84%EB%B8%94%EB%A7%81)", "title": "event.target과 event.currentTarget의 차이점은 무엇인가요?"}, "fe-59": {"id": "fe-59", "content": "CDN(Content Delivery Network)은 **전 세계에 분산되어 있는 서버들을 통해 사용자에게 웹 컨텐츠를 빠르고 효율적으로 제공하는 기술**입니다. 웹사이트의 이미지, CSS, JavaScript 파일, 동영상 등 정적 컨텐츠를 사용자와 물리적으로 가까운 서버에서 전달하는 방식입니다.\n\nCDN의 작동 방식은 간단합니다. 먼저, 자주 요청되는 컨텐츠를 전 세계 여러 지역에 위치한 \"엣지 서버(Edge Server)\"라고 불리는 서버들에 캐싱합니다. 그리고 사용자가 웹사이트에 요청을 보낼 때, DNS를 통해 가장 가까운 엣지 서버로 트래픽이 라우팅되어 처리되도록 합니다.\n\nCDN을 적용하면 컨텐츠 요청이 매번 원본 서버에 직접 전달되지 않으므로, 트래픽을 분산시키는 효과가 있습니다. 따라서 대규모 트래픽이 발생하더라도 안정적으로 컨텐츠를 제공할 수 있습니다. 더불어 물리적으로 가까운 위치에서 컨텐츠를 전송하므로 속도가 빠릅니다.\n\n## CDN은 언제 적용하는 것이 좋나요? 🤔\n첫째, **세계 여러 국가에서 서비스에 방문하는 경우**입니다. 만약 CDN을 적용하지 않은 한국 서비스에 브라질 사용자가 방문했다면, 방문자의 위치와 서버의 위치가 물리적으로 멀기 때문에 지연 시간이 깁니다. 반면, CDN을 적용하여 브라질에도 엣지 서버가 있다면, 브라질 사용자가 요청할 경우 가까운 위치에 있는 해당 서버를 통해 빠르게 응답할 수 있기 때문에 지연 시간이 짧습니다.\n\n둘째, **대량 트래픽이 발생하는 경우**입니다. CDN을 적용하면 엣지 서버들로 트래픽이 분산되기 때문에, 대량 트래픽이 발생해도 비교적 안정적으로 처리가 가능합니다. 또한, 하나의 서버에 장애가 생기더라도 다른 엣지 서버들을 통해 처리할 수 있기 때문에 예기치 못한 장애에 대응하기에도 용이합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[toss payments 용어 사전] CDN(Content Delivery Network)](https://docs.tosspayments.com/resources/glossary/cdn)\n- [[AWS] 콘텐츠 전송 네트워크(CDN)란 무엇인가요?](https://aws.amazon.com/ko/what-is/cdn/)", "title": "CDN이 무엇인지 설명해주세요."}, "fe-6": {"id": "fe-6", "content": "`props`는 **부모 컴포넌트가 자식 컴포넌트에 전달하는 데이터**입니다.\n`props`는 읽기 전용으로, 자식 컴포넌트는 `props`를 수정할 수 없습니다.\n\n```tsx\nfunction ChildComponent(props) {\n  props.name = \"New Name\"; // 오류 발생 가능\n  return <div>{props.name}</div>;\n}\n```\n이를 통해 컴포넌트 간의 데이터 흐름을 예측 가능하게 만들고, 컴포넌트의 재사용성을 높입니다.\n\n`state`는 **컴포넌트 내부에서 관리되는 데이터**입니다.\n`state`는 동적으로 변경될 수 있으며, 컴포넌트의 렌더링에 영향을 미칩니다. `state`를 변경하면 컴포넌트는 다시 렌더링되며, UI가 업데이트됩니다.\n`state`는 주로 사용자 입력이나 네트워크 요청의 응답에 따라 변하는 데이터를 관리할 때 사용됩니다.\n\n## props가 자식 컴포넌트에서 변하지 않는 이유는 무엇인가요? 🤔\n\n`props`가 자식 컴포넌트에서 변하지 않는 이유는 리액트의 **단방향 데이터 흐름 원칙** 때문입니다. 리액트는 부모 컴포넌트가 자식 컴포넌트에 데이터를 전달할 때 단방향으로 전달하도록 설계되었습니다. 이렇게 하면 컴포넌트 간의 데이터 흐름을 예측 가능하고 일관성 있게 만들 수 있어 애플리케이션 상태 관리가 간단해집니다.\n\n`props`는 **읽기 전용**이기 때문에, 부모 컴포넌트에서 전달된 값이 자식 컴포넌트 내에서 임의로 변경되지 않습니다. 이로 인해, 특정 상태가 어디서 어떻게 변했는지를 예측할 수 있어 버그 발생 가능성을 줄이고 디버깅을 쉽게 합니다.\n\n만약 `props`가 변경될 수 있다면, 자식 컴포넌트는 독립적으로 동작하지 않게 되고, 재사용이 어려워질 수 있습니다. `props`가 불변으로 유지됨으로써 컴포넌트는 외부 입력에 의존할 뿐 내부적으로 변경하지 않아 재사용성이 높아지고, 코드의 캡슐화가 강화됩니다.\n\n## 만약 자식 컴포넌트에서 부모 컴포넌트로부터 받은 props를 변경해야 한다면 어떻게 해야 할까요? 🧐\n\n만약 자식 컴포넌트가 부모로부터 받은 `props`를 변경해야 한다면, 부모 컴포넌트에서 상태로 해당 데이터를 관리하고, 상태 변경 함수를 자식 컴포넌트로 전달하는 방식으로 구현해야 합니다. 이렇게 하면 데이터는 여전히 단방향으로 흐르고, 상태는 부모 컴포넌트가 관리하므로 일관성을 유지할 수 있습니다. 이러한 기법을 **상태 끌어올리기**라고 합니다. ", "title": "리액트의 props와 state에 대해서 설명해주세요."}, "fe-60": {"id": "fe-60", "content": "HTML의 `<!DOCTYPE>`은 웹 브라우저에 해당 문서가 어떤 HTML 버전을 기반으로 작성되었는지 알려주는 역할을 하는 선언문입니다. 문서의 최상단에 위치하며, 브라우저가 HTML 문서를 해석하고 렌더링하는 방식을 결정합니다. 대소문자를 구분하지 않지만, 강조하기 위해 대문자를 사용하는 경우가 많습니다.\n\n과거에는 HTML의 다양한 버전(ex. XHTML 1.1, HTML 4.01 등)이 존재했기 때문에 브라우저가 문서를 올바른 방식으로 해석하기 위해, 적절한 방식으로 Doctype을 직접 지정해야 했습니다. HTML5에 접어들어서는 선언 방식이 단순화되어 `<!DOCTYPE html>`으로 간단하게 선언할 수 있습니다. 이 선언문은 HTML5를 사용하고 있음을 명시합니다.\n\n## Doctype을 선언하지 않아도 되나요? 🤔\n\n아니요, Doctype을 꼭 선언해 주어야 합니다. 만약 Doctype 선언이 없다면 브라우저는 문서를 **쿼크 모드(quirks mode)** 로 렌더링할 수 있습니다. 쿼크 모드는 오래된 웹사이트와의 호환성을 유지하기 위해 표준과 다른 방식으로 동작합니다. 이는 예상치 못한 동작을 발생시킬 수 있습니다. 따라서 정확하고 일관된 렌더링을 위해 Doctype 선언은 필수적입니다. 오늘날에는 대부분 HTML5를 사용하므로 `<!DOCTYPE html>`을 선언해주면 됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[생활코딩] HTML - DOCTYPE](https://www.youtube.com/watch?v=EgT5520Ztek)\n- [[MDN] Doctype](https://developer.mozilla.org/ko/docs/Glossary/Doctype)\n- [[위키백과] Document type declaration](https://ko.wikipedia.org/wiki/%EB%AC%B8%EC%84%9C_%ED%98%95%EC%8B%9D_%EC%84%A0%EC%96%B8)", "title": "HTML Doctype이 무엇인지 설명해주세요."}, "fe-61": {"id": "fe-61", "content": "전역 상태 관리 라이브러리를 사용하는 이유에 대해 크게 세 가지를 설명드리겠습니다. \n\n첫째, **컴포넌트 간 상태 공유가 용이해집니다**. 여러 컴포넌트에서 공통적으로 사용되는 상태를 중앙화하여 관리하고, 여러 곳에서 쉽게 접근할 수 있습니다. 부모 컴포넌트에서 자식 컴포넌트에게 상태를 전달하기 위해 여러 컴포넌트를 거치는 \"props drilling\"을 겪지 않고 상태를 공유할 수 있습니다.\n\n둘째, **관심사 분리가 용이해집니다**. 상태 관리 로직을 컴포넌트에서 분리하여 별도로 관리함으로써, 컴포넌트는 UI 로직에만 집중할 수 있게 됩니다. 예를 들어 Redux에서는 상태 변경 로직을 Reducer에 정의해두고, 컴포넌트 단에서는 Dispatch를 통해 Reducer를 호출하는 방식으로 동작합니다. 이러한 분리는 \"관심사의 분리 원칙\"을 따르며 코드 재사용성과 테스트 용이성을 높여줍니다.\n\n셋째, **성능 최적화에 도움이 됩니다**. 현대의 상태 관리 라이브러리들은 불필요한 리렌더링을 방지하는 메커니즘을 제공합니다. 예를 들어 Zustand는 구독 메커니즘을 통해 실제로 상태가 변경된 컴포넌트만 리렌더링되도록 보장합니다.\n\n## 전역 상태 관리 라이브러리 도입을 고려할 때 주의할 점이 있나요? 🤔\n\n**작은 규모의 프로젝트에서는 전역 상태 관리 라이브러리가 오버엔지니어링이 될 수 있다**는 점을 고려해야 합니다. 작은 규모임에도 도입한다면 오히려 불필요한 복잡성이 추가되어 개발 생산성이 저하될 수 있습니다. React의 내장 기능인 `useState`, `useContext`만으로도 충분할 수 있습니다. \n\n프로젝트 규모가 크고 복잡한 상태 관리가 필요하거나, 여러 컴포넌트에서 공유해야 하는 상태가 많은 등 실제로 필요성이 느껴질 때 도입하는 것이 오버엔지니어링을 막을 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 온스타의 상태관리](https://www.youtube.com/watch?v=jqir73Lourk)\n- [[ReactEurope] recoil 제작자의 recoil 설명 영상](https://www.youtube.com/watch?v=_ISAA_Jt9kI&t=125s)\n- [[우현민님의 블로그] 전역 상태 관리를 사용하지 않는 7가지 이유](https://velog.io/@woohm402/no-global-state-manager?utm_source=oneoneone)", "title": "전역 상태 관리 라이브러리는 왜 사용하나요?"}, "fe-62": {"id": "fe-62", "content": "Node와 Element의 핵심적인 차이점에 대해 설명드리겠습니다.\n\nNode는 **DOM을 구성하는 가장 기본적인 구성 단위**입니다. Node에는 여러 가지 타입이 존재합니다. \"Document Node\"는 HTML 문서 전체를 나타내는 루트 노드이며, \"Element Node\"는 HTML 태그를 나타내고, \"Text Node\"는 텍스트 내용을, \"Comment Node\"는 주석을 나타냅니다. 이처럼 Node는 DOM 트리의 모든 구성 요소를 포함하는 포괄적인 개념입니다.\n\n반면 Element는 Node의 특정 타입 중 하나로, **HTML이나 XML 태그로 표현되는 객체**를 의미합니다. 쉽게 말해, 모든 Element는 Node이지만, 모든 Node가 Element인 것은 아닙니다. Element는 `id`, `class`, `style`과 같은 HTML 속성을 가질 수 있으며, `querySelector()`나 `getElementsByClassName()`과 같은 메서드를 사용할 수 있다는 특징이 있습니다.\n\n예를 들어 `<div>Hello<!--주석-->World</div>`라는 HTML이 있다면, div 태그는 Element Node이면서 동시에 Node입니다. 반면 'Hello'와 'World'라는 텍스트는 Text Node이며, 주석은 Comment Node입니다. 이들은 모두 Node이지만 Element는 아닙니다.\n\n## Node와 Element의 차이와 관련된 구체적인 예시를 들어주세요. 🤔\n\n예를 들어, `textContent`라는 속성은 Node의 속성이므로 모든 종류의 Node에서 사용할 수 있지만, `innerHTML`은 Element의 속성이므로 Element에서만 사용할 수 있습니다. \n\n또한, `childNodes`와 `children` 속성에도 중요한 차이가 있습니다. Node의 속성인 `childNodes`는 주어진 요소의 모든 자식 Node를 포함하는 `NodeList`를 반환합니다. 여기에는 Element뿐만 아니라 모든 종류의 Node가 포함됩니다. 따라서 HTML 태그뿐 아니라 텍스트, 주석도 `childNodes`에 포함됩니다. 반면 Element의 속성인 `children`은, Element 타입의 자식 노드만을 포함하는 `HTMLCollection`을 반환합니다. 여기에는 텍스트 노드나 주석 노드는 제외되고 HTML 요소 노드만 포함됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[뉴렉처] Node와 Element Node, 그리고 childNodes, children](https://www.youtube.com/watch?v=pNqlLVEvnQo)", "title": "Node와 Element의 차이에 대해 설명해주세요."}, "fe-63": {"id": "fe-63", "content": "`useRef()`는 React의 훅 중 하나로, **컴포넌트 내에서 변경 가능한 값을 저장하고 관리**할 수 있게 해줍니다. `useRef()`는 주로 두 가지 목적에 사용됩니다.  **DOM 요소에 접근하거나, 값을 유지하면서도 렌더링을 트리거하지 않기 위해** 사용됩니다.\n\n첫째, `useRef()`는 **DOM 요소에 접근할 때** 사용됩니다. 예를 들어, 특정 DOM 요소에 직접 접근하고 싶을 때 `useRef()`를 사용하여 해당 요소의 참조를 얻을 수 있습니다. 이는 `useEffect()`나 이벤트 핸들러 내에서 해당 DOM 요소에 직접 작업을 수행할 때 유용합니다. 예를 들어, 입력 필드에 포커스를 설정하고 싶을 때, `useRef()`를 사용해 input 요소에 접근할 수 있습니다.\n\n```jsx\nconst inputRef = useRef(null);\n\nuseEffect(() => {\n  inputRef.current.focus(); // 컴포넌트 마운트 시 input에 포커스를 맞춘다.\n}, []);\n\nreturn <input ref={inputRef} />;\n```\n\n둘째, **useRef는 값을 유지하면서도 렌더링을 트리거하지 않기 위해** 사용됩니다. 일반적으로 상태 값을 관리할 때 사용하는 `useState()`는 상태 변화가 리렌더링을 트리거하는 반면, `useRef()`는 값이 변경되어도 리렌더링을 트리거하지 않습니다. 예를 들어, 타이머 id를 추적할 때 `useRef()`를 사용할 수 있습니다.\n\n```jsx\nconst timerRef = useRef(null);\n\nconst startTimer = () => {\n  timerRef.current = setInterval(() => {\n    console.log('타이머 실행')\n  }, 1000);\n};\n\nconst stopTimer = () => {\n  clearInterval(timerRef.current); // 타이머를 정지한다.\n};\n```\n위 예시에서 `useRef()`를 이용하여 타이머의 id를 추적하면서도 해당 상태 값이 업데이트될 때 컴포넌트를 리렌더링하지 않습니다. \n\n## 📚 추가 학습 자료를 공유합니다.\n- [[React 공식 문서] useRef](https://ko.react.dev/reference/react/useRef)\n- [[별코딩] React Hooks에 취한다 - useRef 완벽 정리 1# 변수 관리](https://www.youtube.com/watch?v=VxqZrL4FLz8)", "title": "useRef는 언제 사용하나요?"}, "fe-64": {"id": "fe-64", "content": "TDD(Test-Driven Development)는 소프트웨어 개발 방법론 중 하나로, **테스트를 먼저 작성한 후 실제 코드를 작성하는 방법론**입니다.  \n\nTDD는 일반적으로 ‘Red-Green-Refactor’ 사이클을 따릅니다. 첫 번째 단계는 Red로, 실패하는 테스트를 작성하는 것입니다. 이 테스트는 아직 구현되지 않은 기능에 대한 테스트로, 코드가 이를 통과하지 못하는 상태에서 시작됩니다. 두 번째 단계는 Green으로, 테스트를 통과할 수 있도록 최소한의 코드를 작성합니다. 이 단계에서는 테스트를 통과시키는 것만 목표로 하여 코드를 간결하게 작성합니다. 마지막 단계는 Refactor로, 작성한 코드를 리팩토링하여 가독성이나 성능을 개선합니다. 이때 테스트는 여전히 통과해야 하므로, 리팩토링이 기능에 영향을 미치지 않도록 합니다.\n\n## TDD에는 어떤 장점이 있나요? 🤔\n\nTDD는 여러 장점이 있습니다.\n\n첫째, **디버깅 시간을 단축**할 수 있습니다. 자동화된 테스트를 통해 오작동하는 영역을 쉽게 좁혀나갈 수 있습니다.  \n둘째, **리팩토링이 용이**해집니다. 작성된 테스트가 리팩토링 후에도 코드가 올바르게 동작하는지 확인해 주기 때문에, 코드를 수정하는 데 자신감을 가질 수 있습니다.  \n셋째, **좋은 설계가 유도**됩니다. 테스트를 통해 요구 사항을 명확하게 이해하고, 이를 바탕으로 더 나은 설계를 할 수 있습니다. 또 각 기능을 테스트하기 용이하게 만드는 과정에서 자연스럽게 좋은 설계가 유도됩니다.\n\n처음에는 테스트를 작성하는 데 시간이 소요될 수 있지만, 장기적으로는 위와 같은 장점들로 인해 생산성이 오히려 높아지는 효과를 누릴 수 있습니다.\n\n## 📚 추가 자료를 공유합니다.\n- [[Inpa Dev] TDD 방법론 (테스트 주도 개발) - 알기 쉽게 정리](https://inpa.tistory.com/entry/QA-%F0%9F%93%9A-TDD-%EB%B0%A9%EB%B2%95%EB%A1%A0-%ED%85%8C%EC%8A%A4%ED%8A%B8-%EC%A3%BC%EB%8F%84-%EA%B0%9C%EB%B0%9C)\n- [[드림코딩] 테스트 코드와 TDD](https://www.youtube.com/watch?v=Npi21gLIEZM) \n", "title": "TDD란 무엇인지 설명해주세요."}, "fe-65": {"id": "fe-65", "content": "프로토타입은 자바스크립트에서 객체 간의 상속을 구현하는 메커니즘입니다. 자바스크립트의 모든 객체는 기본적으로 `[[Prototype]]`이라는 숨김 프로퍼티를 가지고 있으며, 이 프로퍼티는 다른 객체를 참조하거나 `null` 값을 가집니다. 프로토타입 연결은 `Object.create()`나 함수 생성자의 `prototype` 프로퍼티를 통해 이루어집니다.\n\n**프로토타입 상속이 동작하는 방식은 프로토타입 체인을 기반**으로 합니다. 객체에서 어떤 프로퍼티를 접근하려고 할 때, 자바스크립트 엔진은 해당 객체에서 프로퍼티를 찾습니다. 그리고 만약 찾을 수 없다면, 객체의 `[[Prototype]]`이 가리키는 프로토타입 객체에서 프로퍼티를 탐색합니다. 만약 프로토타입 객체에서도 해당 프로퍼티를 찾지 못하면, 그 다음에는 프로토타입의 프로토타입을 탐색합니다. 탐색 과정을 계속 반복하면서 결국 원하는 프로퍼티를 찾거나, 프로토타입이 `null`이 되는 단계에 도달할 때까지 프로토타입 체인을 타고 올라가는 방식으로 탐색합니다. 이런 식으로 프로토타입이 꼬리에 꼬리를 물고 연결된 형태를 두고 **프로토타입 체인**이라고 부르는 것입니다.\n\n### 예시 코드\n```js\n// 1) Object.create()를 이용한 방식\nconst dog = {\n  greet() {\n    console.log('Hello from dog!');\n  }\n};\n\nconst maru = Object.create(dog); // maru의 프로토타입이 dog로 설정됨\nmaru.greet(); // \"Hello from dog!\" 출력\n```\n```js\n// 2) prototype 프로퍼티를 이용한 방식\nfunction Dog() {}\nDog.prototype.greet = function () {\n  console.log('Hello from Dog!');\n};\n\nconst maru = new Dog(); // maru의 프로토타입이 dog로 설정됨\nmaru.greet(); // \"Hello from Dog!\" 출력\n```\n\n객체 `maru`가 `dog`를 프로토타입으로 갖는다고 가정해봅시다. 만약 `maru.greet()`을 호출했을 시 `maru`에 `greet()`이 없으면 프로토타입인 `dog`에 `greet()`이 존재하는지 탐색합니다. 이때 `dog`에 `greet()`이 존재하면 탐색을 멈추고 해당 메서드를 호출합니다. 만약 `dog`에도 존재하지 않는다면 프로토타입 체인의 끝에 도달할 때까지 상위 프로토타입을 계속 탐색해 나갑니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[코딩애플] 이거보고 prototype 이해 못하면 강의접음](https://www.youtube.com/watch?v=wUgmzvExL_E)\n- [[javascript.info] 프로토타입 상속](https://ko.javascript.info/prototype-inheritance)\n- [[임성묵님 블로그] 자바스크립트는 왜 프로토타입을 선택했을까](https://medium.com/@limsungmook/%EC%9E%90%EB%B0%94%EC%8A%A4%ED%81%AC%EB%A6%BD%ED%8A%B8%EB%8A%94-%EC%99%9C-%ED%94%84%EB%A1%9C%ED%86%A0%ED%83%80%EC%9E%85%EC%9D%84-%EC%84%A0%ED%83%9D%ED%96%88%EC%9D%84%EA%B9%8C-997f985adb42)", "title": "프로토타입 상속의 동작 방식에 대해 설명해주세요."}, "fe-66": {"id": "fe-66", "content": "자주 활용되는 **JPEG, PNG, WebP, SVG**에 대해 설명드리겠습니다.\n\n먼저 **JPEG는 Joint Photographic Experts Group의 줄임말로, 손실 압축 방식을 사용하는 이미지 포맷**입니다. 파일 크기를 효율적으로 줄일 수 있다는 장점이 있습니다. 하지만 이미지를 저장할 때마다 데이터가 손실되어 화질이 점점 나빠지는 현상이 발생한다는 단점이 있습니다. 이미지를 여러 번 편집하고 저장하는 과정을 반복하면 이미지 품질이 현저히 저하될 수 있습니다. 사진과 같이 복잡한 색상과 그라데이션이 있는 이미지에 적합한 이미지 포맷입니다.\n\n**PNG는 Portable Network Graphics의 줄임말로, 무손실 압축 방식을 사용하는 이미지 포맷**입니다. PNG는 투명도를 지원하며, JPEG보다 파일 크기가 큰 편입니다. 회사 로고나 아이콘과 같이 선명한 텍스트나 투명 색상이 있는 이미지에 적합합니다.\n\n**WebP는 Google이 웹 환경을 위해 개발한 최신 이미지 포맷**입니다. 손실/무손실 압축을 모두 지원하며 투명도도 지원합니다. JPEG나 PNG보다 더 나은 압축률을 제공하면서도 화질을 유지할 수 있어 웹 최적화에 적합합니다. 다만, WebP는 비교적 최신 포맷이기 때문에 지원하지 않는 브라우저가 존재합니다. 따라서 호환성 문제에 유의해야 합니다.\n\n**SVG는 Scalable Vector Graphics의 줄임말로, 벡터 기반의 이미지 포맷**입니다. SVG는 XML 형식으로 이루어져 있습니다. 크기를 조절해도 이미지 품질 저하가 없고 파일 크기가 작다는 장점이 있습니다. 이미지의 형태가 복잡할 경우 XML 기반의 코드가 매우 길어져 파일 크기가 커지고 연산이 무거워진다는 단점이 있습니다. 주로 로고, 아이콘, 단순한 일러스트레이션에 사용됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[컴싸부] 이미지 확장자의 종류와 특징](https://www.youtube.com/watch?v=SRdTJyd5f_U)", "title": "알고 있는 이미지 포맷과 각 포맷별 특징을 알려주세요."}, "fe-67": {"id": "fe-67", "content": "`box-sizing`은 **CSS에서 요소의 크기를 어떻게 계산할지를 결정하는 속성**입니다. 레이아웃을 스타일링할 때 예상치 못한 크기(너비, 높이) 변화가 발생하곤 하는데요. 그런 상황에서 `box-sizing` 속성이 도움이 될 수 있습니다.\n\n`box-sizing`에는 두 가지 옵션이 있습니다. 바로, `content-box`와 `border-box`입니다.\n\n### 1. `box-sizing: content-box` (기본값)\n\n`content-box`는 `box-sizing` 속성의 기본값으로, 적용 시 요소의 `width`와 `height` 값이 내용 영역만의 크기를 나타냅니다. 즉, `width`와 `height`는 요소의 실제 콘텐츠 크기만을 정의하고, 그 안에 추가되는 padding과 border는 크기에 포함되지 않습니다.\n\n예를 들어, `width: 200px`로 설정된 요소에 `padding: 20px`과 `border: 2px solid black`이 있으면, 요소의 실제 너비는 `200px + 20px * 2 (padding) + 2px * 2 (border)`로, 총 `244px`가 됩니다. 이 방식은 padding과 border가 요소의 총 크기에 영향을 미친다는 점에서 때때로 예측하기 어려운 결과를 초래하기도 합니다.\n\n### 2. `box-sizing: border-box`\n\n`border-box`를 적용하면 `width`와 `height` 값이 `내용 영역`, `padding`, `border`를 모두 포함하는 크기를 나타냅니다. 즉, `width`와 `height`는 실제 콘텐츠의 크기뿐만 아니라 패딩과 테두리까지 포함된 크기로 설정됩니다. 예를 들어, `width: 200px`로 설정된 요소에 `padding: 20px`과 `border: 2px solid black`이 있으면, 콘텐츠의 크기는 자동으로 `200px - 20px * 2 - 2px * 2`로 계산되어, 실제 콘텐츠 영역의 크기는 `156px`가 됩니다. 이 방식은 직관적으로 레이아웃의 크기를 예측하기 용이합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] box-sizing](https://developer.mozilla.org/ko/docs/Web/CSS/box-sizing)\n- [[생활코딩] CSS 수업 - box-sizing](https://www.youtube.com/watch?v=9BXZq8TzqH8)", "title": "css box-sizing 속성에 대해 설명해주세요."}, "fe-68": {"id": "fe-68", "content": "**프록시 서버**를 이용한다면 CORS 설정 없이도 SOP를 우회할 수 있습니다. 여기서 이야기하는 프록시 서버는 **브라우저 대신 외부 서버에 요청을 보내고 응답을 받는 역할을 대리 수행하는 서버**입니다. 브라우저 측에서 직접 외부 서버에 요청을 보내지 않고, 클라이언트와 동일한 origin의 프록시 서버를 통해 요청을 보내면 SOP의 제한을 피할 수 있습니다.\n\n예를 들어, 클라이언트 측 도메인이 `client.com`이고, 서버 측 도메인이 `server.com`라고 가정하겠습니다. 이때 CORS 설정을 별도로 하지 않았다면, 도메인이 다르므로 브라우저 단에서 SOP에 의해 통신이 차단됩니다. 그런데 이때 만약 브라우저가 아닌 클라이언트 서버를 통해 `server.com`에 요청을 보낸다면 응답을 받을 수 있게 됩니다. 서버와 서버 간의 통신에는 SOP가 적용되지 않기 때문입니다.\n\n이후, 클라이언트 서버는 `client.com/api/xxx`와 같은 경로로 `server.com`으로부터 받은 응답을 브라우저(클라이언트)에 반환합니다. 이렇게 하면 클라이언트 측 origin과 서버 측 origin이 `client.com`으로 일치하기 때문에 정상적으로 응답을 수신할 수 있게 됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[Stephen Biston] Resolve CORS Errors Once and For All: Three Methods](https://medium.com/@stephen.biston/resolve-cors-errors-once-and-for-all-three-methods-d821c258d025)\n- [[toss payments] CORS #프락시-서버-사용하기](https://docs.tosspayments.com/resources/glossary/cors#%ED%94%84%EB%9D%BD%EC%8B%9C-%EC%84%9C%EB%B2%84-%EC%82%AC%EC%9A%A9%ED%95%98%EA%B8%B0)", "title": "CORS 설정 없이 SOP를 우회하여 외부 서버와 통신할 수 있는 방법이 있을까요?"}, "fe-69": {"id": "fe-69", "content": "Virtual DOM은 React에서 사용되는 핵심 개념으로, **실제 DOM을 JS 객체 형태로 복제한 가벼운 사본**이라고 할 수 있습니다. 브라우저의 DOM은 구조적으로 복잡하고, 이를 직접 조작하는 작업은 성능 비용이 상당히 높습니다. Virtual DOM은 이를 개선하여 웹 애플리케이션의 성능을 최적화하기 위해 등장했습니다.\n\nVirtual DOM의 핵심 아이디어는 **상태 변경이 발생할 때마다 전체 UI를 Virtual DOM에 반영하고, 이를 이전 상태와 비교하여 필요한 부분에 한해서 최소한의 DOM 업데이트를 수행**하는 것입니다. Virtual DOM을 업데이트하고 비교하는 일은, 실제 DOM을 조작하지 않고 메모리 상에서 업데이트와 비교가 이뤄지기 때문에 가볍고 빠르게 수행됩니다.\n\nReact에서 Virtual DOM을 활용되는 구체적인 과정은 다음과 같습니다.\n1.\t**상태 변경**: 컴포넌트의 상태나 props가 변경되면 Virtual DOM이 다시 생성됩니다.\n2.\t**재조정(Reconciliation)**: 비교 알고리즘을 이용해 새로운 Virtual DOM과 이전 Virtual DOM 간의 차이를 계산합니다.\n3.\t**re-render**: 계산된 차이에 따라 실제 DOM에서 필요한 부분만 업데이트합니다.\n\nVirtual DOM은 이처럼 DOM 업데이트의 비용을 줄이고, 브라우저 렌더링 성능을 개선합니다.\n\n## React는 비교(diffing) 알고리즘을 어떻게 효율화했나요? 🤔\nReact는 O(n³)의 복잡도를 가질 수 있는 트리 비교 문제를, 휴리스틱을 통해 O(n)으로 최적화했습니다.\n\n휴리스틱 알고리즘은 크게 두 가지 가정을 두고 있습니다\n### 1. 서로 다른 타입의 두 요소는 서로 다른 트리를 만들어낸다.\nDOM 요소의 타입이 다르면(ex. `<div>` → `<span>`) 비교를 수행하지 않고, 해당 요소와 그 자식들을 모두 새로 생성합니다. 자식 요소들의 내용이 같더라도 이전의 트리를 모두 버리고 완전히 새로 만듭니다. 이는 비효율적으로 보일 수 있지만, 실제 애플리케이션에서 타입이 다른 경우는 보통 완전히 다른 컴포넌트로 교체되는 상황이 많기 때문에 이 가정이 대부분의 경우 효율적입니다.\n\n만약 동일한 타입의 요소라면, 동일한 내역은 유지하고 변경된 속성만 갱신합니다.\n```jsx\n<div className=\"before\" title=\"stuff\" />\n\n<div className=\"after\" title=\"stuff\" />\n```\n예를 들어, 이 예시에서는 `className`만 수정합니다.\n\n### 2. 개발자가 key prop을 통해, 여러 렌더링 사이에서 어떤 자식 엘리먼트가 변경되지 않아야 할지 표시해 줄 수 있다.\n같은 레벨의 자식들을 비교할 때 개발자가 입력한 `key` prop을 사용하여 요소를 식별합니다. 이를 통해 리스트 내역의 일부가 수정됐을 때 모든 아이템 요소들을 불필요하게 갱신하지 않고, 실제 변경된 요소만 감지하여 효율적으로 갱신합니다.\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[React] 재조정 (Reconciliation)](https://ko.legacy.reactjs.org/docs/reconciliation.html)\n- [[10분 테코톡] 돔하디의 Virtual DOM](https://www.youtube.com/watch?v=6rDBqVHSbgM)\n", "title": "Virtual DOM에 대해서 설명해주세요."}, "fe-7": {"id": "fe-7", "content": "**Controlled Component**는 리액트 상태(`state`)를 통해 입력 값을 제어하는 컴포넌트를 말합니다.\n이 방식에서는 입력 요소의 값(`value`)을 리액트 상태와 동기화하고, 사용자가 입력을 변경할 때마다 `onChange` 이벤트 핸들러를 통해 상태를 업데이트합니다. Controlled Component는 값이 리액트의 `state`로 관리되므로, 입력 시마다 값을 검증하거나, 값을 자유롭게 변경할 수 있으며, 복잡한 폼 로직을 처리하는 데 유용합니다.\n\n**Uncontrolled Component**는 입력 값을 리액트의 상태로 관리하지 않고, DOM을 통해 입력 값을 제어하는 방식입니다. 즉, 입력 요소의 값은 DOM에서 직접 관리되며, 리액트는 이를 제어하지 않습니다. 이 방식에서는 `useRef`를 사용해 생성된 참조 객체인 `ref`를 사용하여 DOM 요소에 직접 접근하여 값을 읽거나 조작합니다. Uncontrolled Component는 리액트 상태 관리에 따른 성능 비용이 없으므로 상대적으로 간단한 폼에서 주로 사용됩니다.\n\n## Controlled Component와 Uncontrolled Component는 각각 어떤 상황에서 사용되나요? 🤔\n\n단순한 입력 필드가 포함된 폼에서는 입력 요소의 값을 리액트 상태로 관리할 필요성이 적으므로, Uncontrolled Component를 사용하는 것이 더 간단하고 성능이 좋습니다. 사용자가 제출 버튼을 클릭했을 때만 입력 값을 가져와도 충분한 경우를 예시로 들 수 있습니다.\n\n반면, 값을 입력할 때마다 유효성 검증을 실시간으로 해주어야 하는 경우에는 Controlled Component를 사용해야 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 세인의 제어 컴포넌트와 비제어 컴포넌트](https://www.youtube.com/watch?v=PBgQKK6nelo&t=253s)\n", "title": "리액트의 Controlled Component와 Uncontrolled Component의 차이점에 대해서 설명해주세요."}, "fe-70": {"id": "fe-70", "content": "CI/CD는 애플리케이션 배포 과정을 자동화하여 더 짧은 주기로 고객에게 서비스를 제공하는 방식입니다. 먼저, CI는 **Continuous Integration**의 약어로 **지속적 통합**을 의미합니다. CD는 **Continuous Delivery(지속적 전달)** 또는 **Continuous Deployment(지속적 배포)** 를 의미합니다.\n\n먼저, **CI**는 **개발자들이 코드 변경사항을 주기적으로 메인 브랜치에 병합하는 과정을 자동화**한 것입니다. 이 과정에서 코드 변경사항이 발생할 때마다 자동으로 빌드와 테스트를 수행하여 문제를 조기에 발견할 수 있습니다. 예를 들어, 여러 개발자가 함께 작업할 때 한 개발자의 변경사항이 다른 개발자의 작업과 충돌하거나 전체 애플리케이션에 문제를 일으킬 수 있는데, CI를 거치면 이러한 문제를 병합 이전에 미리 파악할 수 있습니다.\n\n**CD**는 **CI 이후 단계를 자동화**하는 것으로, 애플리케이션의 변경사항을 production 환경으로 배포하는 과정을 자동화한 것입니다. **Continuous Delivery**의 경우, **배포 가능한 상태로 준비하는 과정까지**는 자동화하고 실제 배포는 사람의 승인을 거쳐 수동으로 진행합니다. 반면, **Continuous Deployment**는 **production 환경에 배포하는 과정까지** 모두 자동화합니다.\n\n현업에서는 GitHub Actions, Jenkins, GitLab CI 등의 도구를 사용하여 CI/CD 파이프라인을 구축합니다. CI/CD 프로세스에 대한 하나의 예시를 들면 다음과 같습니다.\n1. 개발자가 PR을 올리면 자동으로 테스트/빌드 실행\n2. 테스트/빌드를 성공한 경우 메인 브랜치로의 머지 활성화\n3. 메인 브랜치 머지 시 production 환경으로 자동 배포\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[드림코딩] CI/CD 5분 개념 정리 (현업에서 쓰는 개발 프로세스)](https://www.youtube.com/watch?v=0Emq5FypiMM)\n- [[10분 테코톡] 루카의 CI/CD](https://www.youtube.com/watch?v=6awJbcWXsts)", "title": "CI/CD란 무엇인지 설명해주세요"}, "fe-71": {"id": "fe-71", "content": "`transform`과 `position`은 각각 적합한 경우가 다른데, 애니메이션이나 동적인 위치 변경이 필요한 경우 `transform`을 선호합니다.\n\n`transform`을 선호하는 이유는 성능 때문입니다. `transform`은 브라우저의 composite 단계에서 실행됩니다. 따라서 reflow나 repaint를 유발하지 않아 성능 상 이점이 있습니다.\n\n반면, `position` 관련 속성을 이용한 위치 변경은 reflow, repaint를 유발합니다. 예를 들어 `top`, `left` 등의 속성을 변경하면 브라우저는 주변 요소들의 위치를 다시 계산하는 과정부터 다시 수행하며, 이는 성능 부하를 높입니다.\n\n두 방식을 사용하여 버튼 호버 시 살짝 위로 올라가는 효과를 구현하면 각각 다음과 같습니다.\n```css\n/* transform: 성능이 더 좋음 */\n.button:hover {\n  transform: translateY(-5px);\n}\n\n/* position: 성능이 상대적으로 떨어짐 */\n.button {\n  position: relative;\n}\n.button:hover {\n  top: -5px;\n}\n```\n\n## 그렇다면 position 관련 속성은 사용하지 않나요? 🤔\n\n아닙니다. 레이아웃의 구조를 잡거나, 부모를 기준으로 위치를 조정할 때에는 `position`을 사용합니다. `transform`은 시각적인 위치만 변경할 뿐 실제 문서 흐름과는 무관하게 동작하기 때문에, 문서 흐름에 따라 조정되는 경우에는 사용할 수 없기 때문입니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 체프의 브라우저 렌더링](https://www.youtube.com/watch?v=sJ14cWjrNis&t=8s)\n- [[위니북스] translate vs position](https://www.books.weniv.co.kr/essentials-html-css/chapter15/15-1#1.6%20translate%20vs%20position)\n- [[마이구미의 HelloWorld] translate() vs positioning 비교](https://mygumi.tistory.com/238)", "title": "위치를 동적으로 변경할 때 css 속성 중 transform과 position 중 어떤 것을 선호하시나요?"}, "fe-72": {"id": "fe-72", "content": "React를 이용해서 웹 애플리케이션을 구현하기 위해서는 번들러 설정, 라우팅 설정, 다양한 렌더링 방식을 위한 추가 세팅 등 복잡한 과정을 거쳐야 합니다. 이러한 작업들은 시간과 노력이 많이 들며, 많은 개발자들에게 진입 장벽이 될 수 있습니다.\n\nNext.js는 이러한 복잡한 과정을 생략하고, **기본적으로 설정된 환경에서 편하게 웹 애플리케이션을 개발할 수 있도록 도와줍니다**. 예를 들어, 파일 기반 라우팅 시스템은 별도의 라우팅 설정 없이 디렉토리 구조만으로 페이지를 생성할 수 있게 해줍니다. 또한, CSR, SSR, SSG 등 다양한 렌더링 방식을 내장되어 있는 기능만으로 쉽게 구현할 수 있게 해줍니다. 이외에도 이미지 최적화, 코드 스플리팅, 데이터 캐싱 등 현대적인 웹 애플리케이션에 필수적인 기능들을 기본적으로 제공합니다.\n\n정리하면, Next.js는 React 기반 웹 개발의 복잡함을 줄여주며, 현대 웹 개발에서 요구되는 성능과 생산성을 모두 만족시키는 프레임워크이기 때문에 많은 개발자들이 선택하고 있습니다.\n\n## Next.js를 도입할 때의 단점은 없나요? 🤔\n앞서 말씀드린 것과 같이 Next.js는 많은 기능들이 기본으로 내장되어 있습니다. 이 특성이 Next.js의 장점이면서 동시에 단점으로 이어지기도 합니다.\n\n첫째는, **구조상의 제약이 있기 때문에 커스터마이징하기 비교적 어렵다**는 점입니다. 많은 기능들이 기본 설정 및 추상화되어 있는 만큼, 기본 설정을 커스터마이징하기 어려운 경향이 있습니다. 예를 들면, Next.js는 디렉토리 구조에 기반한 라우팅 규칙이 정해져 있어서 자유로운 구조 설계가 어렵습니다.\n\n둘째는, **러닝커브가 존재한다**는 점입니다. Next.js에서 제시하는 기본적인 구조와 규칙에 대해 이해해야 합니다. 더불어 React를 넘어선 새로운 개념들을 익혀야 하는 경우도 있고, Next.js의 버전이 업데이트될 때마다 변경사항을 추가로 학습해야 합니다. 이러한 점은 학습 부담을 높이는 원인이 됩니다.\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [Vercel CEO Guillermo Rauch와 함께하는 팟캐스트](https://softwareengineeringdaily.com/2020/03/02/nextjs-with-guillermo-rauch/)\n- [[vercel] lead maintainer가 소개하는 Next.js](https://www.youtube.com/watch?v=yPG1iaBCJuM)", "title": "Next.js를 사용하는 이유가 무엇인가요?"}, "fe-73": {"id": "fe-73", "content": "```js\nfunction change(a, b, c) {\n    a = 'a changed'\n    b = { b: 'changed' };\n    c.c = 'changed';\n}\n\nlet a = 'a unchanged';\nlet b = { b: 'unchanged' };\nlet c = { c: 'unchanged' };\n\nchange(a, b, c);\n\nconsole.log(a, b, c); // ?\n```\n\n> 위 코드를 복사하여 브라우저 콘솔 창에서 직접 실행해보세요. 🙂\n\n<details>\n  <summary>답변 보기</summary>\n\n**답:** `a unchanged {b: 'unchanged'} {c: 'changed'}`\n\n자바스크립트는 **Call by Value 방식**으로 매개변수를 전달합니다. 이는 함수 매개변수에 **값의 복사본**이 전달된다는 의미입니다. 이로 인해 다음과 같은 결과가 나타납니다.\n  \n### 1. a (문자열)\n\n`a`는 문자열입니다. 문자열 값의 복사본이 파라미터에 전달되므로, 함수 내에서 값이 변경되어도 호출한 곳의 변수에는 영향을 미치지 않습니다.\n\n따라서 호출한 곳의 `a`는 여전히 `'a unchanged'`로 유지됩니다.\n    \n### 2. b (객체)\n`b`는 객체입니다. 원본 객체의 참조 값(주소)의 복사본이 파라미터에 전달됩니다. `b = { b: 'changed' }`와 같이 객체를 새롭게 할당하면, 해당 복사본이 가리키는 참조 값이 새로운 객체의 참조 값으로 변경됩니다.\n이로 인해 함수 내의 복사본 `b`는 `b = { b: 'changed' }`의 참조 값을 가리키게 되지만, 함수 외부의 `b`는 여전히 `{ b: 'unchanged' }`로 유지됩니다.\n    \n### 3. c (객체)\n`c`는 객체입니다. 원본 객체의 참조 값의 복사본이 파라미터에 전달됩니다. 함수 내부와 외부의 변수가 모두 동일한 참조 값을 가리키고 있으므로, 함수 내부에서 객체의 속성을 변경하면 호출한 곳의 객체에도 영향을 미칩니다.\n\n`c.c = 'changed'`는 c 객체의 속성을 변경한 것이므로, 호출한 곳의 c 객체는 `{ c: 'changed' }`로 변경됩니다.\n</details>\n\n## 📚 추가 학습 자료를 공유합니다.\n- [ZeroCho의 JS 중급 강좌 12-1. call by value, call by reference, call by sharing](https://www.youtube.com/watch?v=-w-oJp6OVd4)\n- [[think0wise.tistory] 자바스크립트 - Call by value / Call by reference / Call by sharing](https://think0wise.tistory.com/65)", "title": "다음 JS 코드의 실행 결과를 설명해주세요."}, "fe-74": {"id": "fe-74", "content": "Server Action은 Next.js에서 제공하는 기능으로, **서버에서 실행되며 브라우저에서 호출할 수 있는 비동기 함수**입니다. 이 기능은 서버 로직을 직접 호출함으로써 클라이언트와 서버 간의 상호작용을 간소화할 수 있게 해줍니다. 예를 들면 백엔드 서버와 API 통신을 하는 대신 Next 서버에서 데이터베이스에 직접 접근하는 식으로 활용할 수 있습니다.\n\n### 사용 방법\nServer Action은 `use server` 디렉티브를 사용하여 정의할 수 있습니다. 이 디렉티브는 함수가 서버에서만 실행되도록 지정합니다.\n\n```tsx\n\"use server\";\n\nexport async function createReviewAction(data: FormData) {\n  const content = data.get(\"content\");\n  // 데이터베이스 저장 등의 작업\n}\n```\n\n```tsx\n// 컴포넌트에서 사용\n<form action={createReviewAction}>\n  <textarea name=\"content\" required />\n  <button type=\"submit\">Submit</button>\n</form>\n```\n\n이처럼 Server Action을 이용하면 폼이 제출될 때 해당 정보를 가지고 데이터베이스 저장과 같은 서버 작업을 수행할 수 있습니다.\n\n## Server Action의 장점은 무엇인가요? 🤔\n첫째, **클라이언트와 서버 간 상호작용을 간소화할 수 있습니다**. 기존에는 데이터베이스와 관련된 처리를 위해 백엔드 API와 통신하는 방식을 사용했습니다. 만약 Server Action을 이용한다면 백엔드 API와 통신하지 않고, Next 서버에서 직접 데이터베이스 작업을 수행할 수 있습니다. 이러한 점은 개발 생산성 향상에 도움이 될 수 있습니다. 또한 네트워크 통신을 줄여 성능 면에서도 이점이 있을 수 있습니다.\n\n둘째, **Server Action 로직은 클라이언트에 전송되지 않습니다**. 이는 보안에 도움이 될 수 있습니다. 외부에 노출되면 안 되는 정보나 로직을 숨기는 데 활용할 수 있습니다. 더불어 클라이언트 단의 일부 로직을 Server Action으로 옮긴다면 번들의 크기가 줄어드는 데도 기여할 수 있습니다.\n\n셋째, **JS가 로드되기 이전의 시점에도 서버와 상호작용할 수 있게 됩니다**. Server Action은 html `<form>`의 `action` 속성을 이용하여 폼 데이터를 서버에 전송합니다. 따라서 JS가 로드되지 않거나 비활성화되어도 서버와 통신이 가능하다는 장점이 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[coding apple] Next.js의 Server actions 기능](https://codingapple.com/unit/nextjs-server-actions/)\n- [[Next.js] Server Actions and Mutations](https://nextjs-ko.org/docs/app/building-your-application/data-fetching/server-actions-and-mutations)", "title": "Server Action이란 무엇인가요?"}, "fe-75": {"id": "fe-75", "content": "**쌓임 맥락(Stacking Context)은 가상의 z축을 상정하여 HTML 요소들을 3차원으로 개념화한 것**입니다. 쌓임 맥락은 요소들이 쌓이는 순서에 영향을 미칩니다.\n\n기본적으로 HTML 요소는 DOM 순서에 따라 쌓입니다. HTML 상에서 위쪽에 위치할수록 아래쪽에 쌓이는 방식입니다. 또한, `position` 속성이 적용되어 있는 요소들은 `z-index` 값이 낮을수록 아래쪽으로, 높을수록 위쪽으로 쌓입니다.\n\n그런데 **특정 조건이 충족되면 새로운 쌓임 맥락이 생성**됩니다. 이 쌓임 맥락은 독립적인 3차원 공간을 만들며, 부모 쌓임 맥락의 영향을 받지 않고 해당 쌓임 맥락 내에서만 비교가 이뤄져 쌓임 순서가 결정됩니다.\n\n대표적으로 쌓임 맥락이 생성되는 조건은 다음과 같습니다. ([MDN 참고 자료](https://developer.mozilla.org/ko/docs/Web/CSS/CSS_positioned_layout/Understanding_z-index/Stacking_context#%EC%84%A4%EB%AA%85))\n1. `position` 속성이 `relative` 또는 `absolute`이고 `z-index` 값이 `auto`가 아닌 경우\n2. `postion` 속성이 `fixed` 또는 `sticky`인 경우\n3. `display`가 `flex` 또는 `grid`이고, `z-index`가 설정된 경우\n4. `opacity` 값이 1 미만인 경우\n5. `transform`, `filter`, `backdrop-filter` 등의 속성이 적용되는 경우\n\n<br/>\n\n쌓임 맥락이 동작하는 간단한 예시를 설명드리겠습니다.\n```html\n<div style=\"position: relative; z-index: 1;\">\n    A 요소 (z-index: 1)\n    <div style=\"position: absolute; z-index: 999;\">\n        A-1 요소 (z-index: 999)\n    </div>\n</div>\n\n<div style=\"position: relative; z-index: 2;\">\n    B 요소 (z-index: 2)\n</div>\n```\n위 예시에서 **가장 위쪽에 쌓이는 요소는 B 요소입니다. 그 다음 A-1 요소, A 요소 순**으로 쌓입니다.  \n\n최상위 쌓임 맥락 내의 요소들인 A 요소와 B 요소의 `z-index` 값을 비교했을 때, B 요소가 크기 때문에 가장 위쪽에 쌓입니다. 그리고 A 요소가 형성한 쌓임 맥락 내에서 `z-index` 값을 비교했을 때, A 요소보다 `z-index`가 큰 A-1 요소가 더 위쪽에 쌓이게 됩니다.  \n이런 예시를 보면 `z-index` 값이 더 크다고 무조건 위쪽에 쌓이는 것이 아니며, 쌓임 맥락을 고려해야 한다는 사실을 알 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 쑤쑤의 z-index의 동작 방식](https://www.youtube.com/watch?v=ln9vfw-JAr8)\n- [[MDN] 쌓임 맥락](https://developer.mozilla.org/ko/docs/Web/CSS/CSS_positioned_layout/Understanding_z-index/Stacking_context)", "title": "쌓임 맥락에 대해 설명해주세요."}, "fe-76": {"id": "fe-76", "content": "`<link>`는 외부 리소스와의 연결을 돕는 요소이며, `rel` 속성 값인 **preconnect**, **preload**, **prefetch**는 **리소스 로드의 우선순위를 설정하여 로드 성능을 최적화하기 위해 사용됩니다**.\n\n### 1. preconnect\n`preconnect`는 **브라우저가 특정 origin에 대한 네트워크 연결을 미리 설정하도록 지시합니다**. 이를 통해 DNS 조회, TLS 핸드셰이크, TCP 연결을 미리 완료하여 리소스 로드 지연을 줄일 수 있습니다. 외부 API나 CDN의 리소스를 사용할 경우 `preconnect`를 사용하면 첫 번째 요청의 대기 시간을 줄일 수 있습니다. \n\n```html\n<link rel=\"preconnect\" href=\"https://external-resource.com\" crossorigin=\"anonymous\">\n```\n\n`preconnect`는 리소스 자체를 로드하지 않고, 요청할 origin과의 연결만 미리 준비합니다. 자주 사용하는 외부 리소스의 도메인에 대해 적용하는 것이 효과적입니다.\n\n### 2. preload\n`preload`는 **특정 리소스를 미리 가져오도록 브라우저에 지시합니다**. 예를 들어, 웹 폰트를 preload하면 해당 리소스가 실제로 사용되기 전에 다운로드가 완료됩니다.\n\n```html\n<link rel=\"preload\" href=\"/fonts/my-font.woff2\" as=\"font\" crossorigin=\"anonymous\">\n```\n웹 폰트가 늦게 로드되면 텍스트가 기본 폰트로 잠시 표시되는 FOUT 현상이 발생할 수 있는데, 이를 `preload`로 방지할 수 있습니다.\n\n### 3. prefetch\n`prefetch`는 **브라우저가 향후 필요할 가능성이 있는 리소스를 미리 가져오도록 지시합니다**. `preload`와는 다르게, 현재 화면에 즉시 필요하지 않지만 다음에 필요할 가능성이 있는 리소스를 미리 로드하는 역할을 합니다. `prefetch`는 다른 속성 값에 비해 우선순위가 상대적으로 낮습니다.\n\n```html\n<link rel=\"prefetch\" href=\"/next-page.css\" as=\"style\">\n```\n사용자가 페이지에서 버튼을 클릭해 다음 화면으로 이동할 가능성이 높을 경우, 다음 화면에 필요한 css 리소스를 미리 준비하는 방식으로 사용할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[web.dev] 리소스 힌트로 브라우저 지원](https://web.dev/learn/performance/resource-hints?hl=ko)\n- [[JsCafe] Preload Prefetch Preconnect | Network Optimization | System Design for frontend engineers](https://www.youtube.com/watch?v=PLYIrkT4OCg)", "title": "HTML link 요소의 rel 속성 값 preconnect, preload, prefetch에 대해 설명해주세요."}, "fe-77": {"id": "fe-77", "content": "자바스크립트에서 **`this`는 함수가 호출되는 방식에 따라 값이 달라집니다**. 다양한 상황에서 `this`가 어떻게 바인딩되는지 크게 6가지 상황으로 나누어 설명드리겠습니다.\n\n### 1. 전역 호출\n전역에서 함수가 호출되면, **`this`는 전역 객체를 참조합니다**. 브라우저 환경에서는 `window` 객체를, Node.js 환경에서는 `global` 객체를 가리킵니다.\n\n```js\nfunction globalFunc() {\n  console.log(this);\n}\nglobalFunc(); // 브라우저: window, Node.js: global\n```\n\n### 2. 메서드 호출\n객체의 메서드로 호출된 함수에서는 **`this`가 해당 객체를 참조합니다**.\n```js\nconst obj = {\n  name: \"Alice\",\n  greet: function () {\n    console.log(this.name);\n  },\n};\nobj.greet(); // \"Alice\"\n```\n\n### 3. 생성자 함수와 클래스\n생성자 함수나 클래스에서 `this`는 **새로 생성되는 객체, 즉 인스턴스를 참조합니다**.\n\n```js\nfunction Person(name) {\n  this.name = name;\n}\nconst person = new Person(\"Alice\");\nconsole.log(person.name); // \"Alice\"\n```\n\n### 4. 명시적 바인딩\n`call()`, `apply()`, `bind()` 메서드를 사용하면 **`this`를 명시적으로 설정할 수 있습니다**.\n```js\nfunction greet() {\n  console.log(this.name);\n}\nconst user = { name: \"Alice\" };\ngreet.call(user); // \"Alice\"\n```\n\n### 5. 화살표 함수\n화살표 함수는 **상위 스코프의 `this`를 상속받습니다**. 자체적인 `this`를 가지지 않으므로, 사용 위치에 따라 `this`가 결정됩니다.\n```js\nconst obj = {\n  name: \"Alice\",\n  greet: () => console.log(this.name),\n};\nobj.greet(); // undefined (전역 `this`)\n```\n\n### 6. DOM 이벤트 핸들러\nDOM 요소의 이벤트 핸들러에서 **`this`는 기본적으로 이벤트를 발생시킨 요소를 참조합니다**. 하지만 화살표 함수를 사용하면 상위 스코프의 `this`를 참조합니다.\n\n```js\nbutton.addEventListener(\"click\", function () {\n  console.log(this); // 클릭된 button 요소\n});\n```\n\n지금까지 설명드린 것과 같이 **`this`는 함수 호출 방식에 따라 값이 달라집니다**. 따라서 상황에 따른 동작을 이해하고 적절한 방식을 사용해야 합니다. 특히, 화살표 함수와 명시적 바인딩은 `this`를 제어하는 데 유용합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] this](https://developer.mozilla.org/ko/docs/Web/JavaScript/Reference/Operators/this)\n- [[F-Lab] 자바스크립트의 this 바인딩 이해하기](https://f-lab.kr/insight/understanding-javascript-this-binding-20240525?gad_source=1&gad_source=1&gclid=Cj0KCQiAs5i8BhDmARIsAGE4xHzjUu8bXibmJP8ra6xF91QgcM3IPXCW86355_GB86m7BAwmTFoQCwUaAqWoEALw_wcB)", "title": "상황에 따라 this 바인딩이 어떻게 이뤄지는지 설명해주세요."}, "fe-78": {"id": "fe-78", "content": "쉽게 설명하면, **타입 단언(Type Assertion)은 컴파일러에게 특정 값이 어떤 타입인지 개발자가 더 잘 알고 있다고 알려주는 방법**입니다. 개발자가 `as`를 이용해 타입을 단언하면, 자동 추론된 타입을 덮어쓰게 됩니다. 이는 컴파일러가 타입을 자동으로 추론하지 못하거나 잘못 추론하는 상황에서 사용됩니다.\n\n예를 들어, DOM 요소를 가져오는 `document.getElementById()` 메서드의 반환 타입은 `HTMLElement | null`로 정의되어 있습니다. 하지만 개발자가 해당 요소가 `HTMLDivElement`임을 확신한다면, `as HTMLDivElement`를 사용해 컴파일러에게 명시적으로 알려줄 수 있습니다. 이를 통해 타입 오류 없이 안전하게 속성에 접근할 수 있습니다.\n```js\nconst element = document.getElementById(\"myElement\") as HTMLDivElement;\n\nelement.style.backgroundColor = \"blue\"; \n```\n\n\n타입 단언은 주로 **API나 외부 라이브러리의 반환 타입을 확실히 알고 있을 때** 사용됩니다. 컴파일러가 타입 추론에 실패하거나 경고를 발생시키는 경우에 타입 단언을 통해 올바른 타입을 지정할 수 있습니다.\n\n## 타입 단언을 사용할 때 주의할 점은 무엇인가요? 🤔\n타입 단언은 **컴파일러의 타입 검사를 우회하기 때문에, 실제 값이 단언한 타입과 다를 경우 런타임 에러가 발생할 수 있습니다**. 따라서 타입 단언은 해당 타입을 확실히 알고 있을 때만 사용하는 것이 중요하며, 가능한 한 타입 추론과 타입 가드를 우선적으로 사용하는 것이 바람직합니다. 잘못된 사용은 타입스크립트의 장점을 훼손하며, 오히려 코드의 안정성을 해칠 수 있습니다.\n\n## 타입 단언을 더 안전하게 활용하기 위한 원칙이 있나요? 🧐\n첫째로, **타입 단언보다는 타입 내로잉(narrowing)을 우선적으로 활용하는 것이 좋습니다**. 타입스크립트는 조건문과 타입 체크를 통해 자동으로 타입을 좁힐 수 있으므로, 가능한 한 단언 없이 타입을 명확히 하는 방식이 권장됩니다.\n```ts\nfunction printLength(value: string | string[]) {\n  if (Array.isArray(value)) {\n    console.log(value.length); // 타입 내로잉으로 배열로 안전하게 처리\n  } else {\n    // 문자열로 처리\n  }\n}\n```\n\n또한, **type predicate을 활용한 타입 가드를 통해서도 타입 안전성을 높일 수 있습니다**. type predicate을 통해 데이터 구조를 확인하여 런타임 오류를 줄이는 방식입니다.\n```ts\nfunction isFish(pet: Fish | Bird): pet is Fish {\n    return (pet as Fish).swim !== undefined;\n}\n\nif (isFish(pet)) {\n    pet.swim();\n}\n```\n\n\n마지막으로, **타입 단언은 최소한의 범위에서만 사용하는 것이 좋습니다**. 전체 객체보다는 필요한 속성이나 특정 부분만 단언하는 방식으로 불필요한 위험을 줄이는 것이 바람직합니다.\n```ts\nconst element = document.getElementById(\"myElement\");\nif (element) {\n  (element as HTMLDivElement).style.backgroundColor = \"blue\"; // 필요한 부분만 단언\n}\n```\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[캡틴판교] 타입스크립트 핸드북 - 타입 단언](https://joshua1988.github.io/ts/guide/type-assertion.html#%ED%83%80%EC%9E%85-%EB%8B%A8%EC%96%B8-type-assertion)\n- [[yceffort] 타입스크립트 타입 단언](https://yceffort.kr/2019/08/20/typescript-type-assertion)", "title": "타입 단언이란 무엇이며 언제 사용하나요?"}, "fe-79": {"id": "fe-79", "content": "웹 개발에서는 브라우저가 제공하는 기본 스타일이 서로 다를 수 있기 때문에, 이를 통일하여 일관된 디자인을 구현하는 것이 중요합니다. **Reset CSS**와 **Normalize CSS**는 모두 **브라우저 간의 스타일 차이를 줄이기 위해 사용되는 CSS 파일**입니다. 두 방법은 목적이 같지만 방식에 차이가 있습니다.\n\n먼저, **Reset CSS는 모든 브라우저의 기본 스타일을 완전히 제거하는 방식**입니다. 예를 들어, HTML 요소에 기본적으로 적용된 여백, 패딩, 글자 크기 등을 초기화하여, 모든 요소를 스타일이 전혀 없는 상태로 만듭니다. 이렇게 하면, 개발자는 특정 브라우저의 기본 스타일에 영향을 받지 않고 완전히 통제된 상태에서 스타일링을 시작할 수 있습니다. Reset CSS는 모든 요소를 초기화하기 때문에, 스타일을 처음부터 새롭게 작성해야 하는 수고가 있지만, 완전한 스타일 통일성을 보장합니다.\n```css\n/* 모든 요소의 기본 스타일을 초기화 */\n* {\n  margin: 0;\n  padding: 0;\n  border: 0;\n  font-size: 100%;\n  font: inherit;\n  vertical-align: baseline;\n}\n```\n\n반면, **Normalize CSS는 브라우저 간 스타일 차이를 줄이는 데 중점을 둔 방식**입니다. 모든 요소의 기본 스타일을 완전히 제거하는 대신, 브라우저 간에 일관되지 않은 스타일만 수정하여 자연스러운 기본값을 유지합니다. 예를 들어, Normalize CSS는 제목 태그(`h1`, `h2` 등)의 기본 크기나 폰트를 브라우저마다 일관되게 조정하면서도, 요소의 기본적인 스타일은 그대로 둡니다. 이를 통해 자연스러운 초기 스타일을 유지하면서, 브라우저 간의 주요한 차이만 해소하는 것입니다.\n```css\n/* 브라우저 기본 스타일을 일관되게 유지 */\nh1 {\n  font-size: 2em;\n  margin: 0.67em 0;\n}\na {\n  background-color: transparent;\n}\n```\n\n## 둘 중 어떤 방식을 선택하는 것이 좋나요? 🤔\n이는 **프로젝트 상황이나 개인의 취향에 따라 다를 수 있습니다**. 앞서 설명드렸던 것과 같이 **Reset CSS**는 스타일 통일성을 확실하게 보장받을 수 있다는 장점이 있지만, 처음부터 다시 스타일링해야 한다는 번거로움이 있습니다. 반면, **Normalize CSS**는 기본 스타일을 유지하는 장점이 있지만, 통일성이 비교적 떨어진다는 단점이 있습니다.  \n<br />\n이러한 트레이드오프를 고려하여 결정해야 합니다. 예를 들어 데드라인이 넉넉하지 않은 프로젝트에서는 처음부터 일일이 스타일링할 여력이 없으니 **Normalize CSS**를 선택하는 것이 유리할 수 있습니다. 한편, 디자인 시스템과 같이 모든 것을 직접 스타일링하는 것이 중요한 상황에서는 **Reset CSS**를 선택하는 것이 유리할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[DaleSeo] CSS Normalize와 CSS Reset](https://www.daleseo.com/css-normalize-reset/)\n- [[디자인 베이스 Youtube] 스타일 초기화를 위한 Reset.css & Normalize.css](https://www.youtube.com/watch?v=DpES7X-xgUc)", "title": "Reset CSS와 Normalize CSS가 무엇인가요?"}, "fe-8": {"id": "fe-8", "content": "리액트에서 성능 최적화를 위해 여러 가지 방법을 사용할 수 있는데요. 대표적으로 메모이제이션을 말씀 드릴 수 있겠습니다.\n\n리액트의 `memo`를 사용하여 컴포넌트를 메모이제이션할 수 있습니다.\n이는 컴포넌트의 props가 변경되지 않았을 때, 리렌더링을 방지하여 성능을 최적화합니다.\n이는 특히 렌더링 비용이 큰 컴포넌트에서 유용합니다.\n\n또한 `useCallback`과 `useMemo`를 활용할 수도 있습니다.\n`useCallback` 은 함수를 메모이제이션하여 불필요한 함수 재생성을 방지하고, `useMemo`는 값의 재계산을 방지하여 성능을 최적화합니다.\n이를 통해 자식 컴포넌트로 전달되는 함수나 값이 변경되지 않으면 리렌더링을 피할 수 있습니다.\n\n마지막으로 `코드 스플리팅`을 활용해볼 수 있습니다.\n코드 스플리팅은 큰 애플리케이션을 여러 개의 작은 청크로 나누어, 필요한 청크만 로드하게 하여 초기 로드 시간을 줄입니다.\nReact.lazy와 Suspense를 사용하여 동적으로 컴포넌트를 로드할 수 있습니다.\n\n## 코드 스플리팅은 어떤 경우에 사용해야 할까요? 🤔\n\n첫번째로는 **초기 로딩 시간이 길어지는 경우**입니다.\n애플리케이션이 커지면, 초기 로딩에 모든 코드를 로드하는 것이 비효율적일 수 있습니다. 코드 스플리팅을 사용해 초기 로드 시 필요한 핵심 코드만 로드하고, 이후 추가적인 기능은 필요할 때 로드하도록 하면 초기 로딩 속도를 크게 개선할 수 있습니다.\n\n두번째로는 **라우트별 코드 분할이 필요한 경우**입니다.\nSPA에서는 각 페이지가 별도의 기능과 UI를 가지므로, 라우트별로 필요한 코드만 분리하여 로드할 수 있습니다. 이 방식은 리액트의 React.lazy와 Suspense를 사용하여 라우트별 컴포넌트를 동적으로 불러올 때 유용합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 앨버의 리액트 렌더링 최적화](https://www.youtube.com/watch?v=1YAWshEGU6g)", "title": "리액트에서 성능 최적화를 위해 적용할 수 있는 방법들을 설명해주세요."}, "fe-80": {"id": "fe-80", "content": "이미지의 `alt` 속성은 단순 부가 설명이 아니라 여러 중요한 기능을 가지는 속성입니다. \n\n먼저, `alt` 속성은 **이미지를 로드할 수 없는 상황에서 대체 텍스트를 제공하여** 사용자에게 콘텐츠를 이해할 수 있도록 돕는 역할을 합니다. 예를 들어, 네트워크 문제로 이미지가 로드되지 않는 경우, alt 속성의 텍스트가 대신 표시되어 이미지의 의도를 전달할 수 있습니다.\n\n또한, `alt` 속성은 **접근성 측면에서 큰 도움을 줍니다**. 스크린 리더를 사용하는 시각 장애 사용자는 이미지를 직접 볼 수 없기 때문에, `alt` 속성을 통해 이미지의 내용을 음성으로 듣게 됩니다. `alt` 속성을 적절히 설정하면 웹 페이지 내 이미지 컨텐츠에 시각 장애 여부와 상관 없이 누구나 접근할 수 있게 됩니다.\n\n마지막으로, `alt` 속성은 **SEO 측면에서도 중요한 요소로 작용합니다**. 검색 엔진은 이미지를 시각적으로 분석할 수 없기 때문에, `alt` 속성에 포함된 텍스트를 기반으로 이미지의 콘텐츠를 이해하고 이를 검색 결과에 반영합니다. 적절한 키워드가 포함된 `alt` 속성은 이미지 검색에서 상위 노출을 도울 수 있습니다.\n\n이처럼 `alt` 속성에는 단순한 부가 설명 이상의 기능이 있습니다. 사용자 경험, 접근성, SEO 측면에서 중요한 역할을 합니다.\n\n## 모든 이미지에 alt 속성을 꼭 작성해야 하나요? 🤔\n반드시 그렇지는 않습니다. 장식적인 용도로만 사용되는 이미지에는 `alt` 속성을 비워두는 것이 더 좋습니다. 예를 들어, 배경으로 사용되는 이미지나 레이아웃 디자인을 위한 이미지는 의미를 전달하지 않아도 되므로 `alt=\"\"`로 빈 값을 설정하는 것이 좋습니다. 이렇게 설정하면 스크린 리더가 이를 건너뛰도록 하여 사용자가 불필요한 요소에 대한 설명을 듣지 않고 넘어갈 수 있습니다.\n\n반면, 만약 중요한 정보나 컨텐츠를 담고 있는 이미지라면 항상 적절한 alt 텍스트를 제공해야 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] image alt 속성](https://developer.mozilla.org/ko/docs/Web/HTML/Element/img#alt)\n- [[SNC lab] 대체 텍스트 올바르게 제공하기](https://brunch.co.kr/@snclab/2)", "title": "image 요소의 alt 속성은 어떤 목적으로 사용하나요?"}, "fe-81": {"id": "fe-81", "content": "모노레포는 **mono(단일)** 와 **repo(레포지토리)** 를 합친 용어로, **여러 프로젝트 또는 패키지를 하나의 코드 저장소에 통합하여 관리하는 방식**을 의미합니다. \n\n모노레포를 구성하기 위해 대표적으로 두 가지 구성 방식이 사용됩니다.\n\n먼저, **프로젝트 단위로 분리된 구조**를 사용합니다. 모든 프로젝트가 하나의 저장소 안에서 각각 독립적인 폴더로 구성되며, 각 폴더는 독립적인 패키지로 관리됩니다. 이때 프로젝트 간의 공통 의존성은 `yarn workspaces`나 `npm workspaces` 같은 기능을 사용해 중앙에서 관리합니다. 이를 통해 중복된 의존성을 최소화하고, 프로젝트 간 코드 공유를 쉽게 합니다.\n\n다음으로, **공통 모듈을 별도의 폴더로 분리하는 방식**을 사용합니다. 예를 들어, 여러 프로젝트에서 자주 사용하는 유틸리티 함수, 스타일, 공통 컴포넌트를 `shared`라는 폴더에 모아두고 각 프로젝트에서 이를 가져다 사용하는 방식입니다. 이렇게 하면 공통 코드를 한 번만 업데이트해도 여러 프로젝트에 즉시 반영할 수 있어 효율적입니다.\n\n## 모노레포의 장점은 무엇인가요? 🤔\n첫째, **여러 프로젝트의 코드 및 설정 등을 일관되게 관리할 수 있다는 점입니다.** 예를 들어, 대규모 조직에서 여러 팀이 각기 다른 서비스를 개발하더라도, 모노레포를 통해 동일한 코드베이스에서 협력할 수 있습니다. 이를 통해 공통 모듈이나 설정 등을 공유하여, 불필요한 중복 작업을 줄이고 협업 효율성을 높일 수 있습니다.\n\n둘째, **모노레포는 중앙화된 의존성 관리를 가능하게 해줍니다.** 예를 들어, 프로젝트 내에서 공통으로 사용되는 유틸리티나 컴포넌트를 한 번 업데이트하면 모든 관련 프로젝트에 즉시 적용할 수 있습니다.\n\n또한, **여러 프로젝트들이 동일한 버전 관리 시스템을 공유할 수 있습니다.** 이를 통해 한 프로젝트에서 변경된 사항이 다른 프로젝트에 미치는 영향을 보다 명확히 추적할 수 있습니다.\n\n## 모노레포의 단점은 없나요? 🧐\n물론, 모노레포에도 단점이 있습니다.  \n\n첫째, **스케일링이 복잡하고 어려워집니다**. 여러 프로젝트들이 모여 있으니 코드베이스가 빠르게 커지는데, 이때 빌드 및 테스트 시간이 그와 비례하여 길어집니다. 또한, CI/CD 파이프라인 관리의 복잡도가 증가합니다. 이러한 단점을 극복하기 위해 `Nx`, `Turborepo`와 같은 모노레포 관리 툴을 이용할 수 있습니다.\n\n또한, **권한 관리가 까다로울 수 있습니다**. 모든 프로젝트가 하나의 저장소에 통합되기 때문에 특정 팀이나 프로젝트만 접근 권한을 가지도록 설정하는 것이 어렵습니다.\n\n이러한 단점을 고려했을 때, 작은 규모의 팀이나 단일 프로젝트 중심의 개발 환경에서는 오히려 복잡성을 증가시킬 가능성이 있어 모노레포 사용이 적합하지 않을 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[Heechan님의 Medium] MonoRepo 개념과 장단점 알아보기](https://medium.com/hcleedev/dev-monorepo-%EA%B0%9C%EB%85%90-%EC%95%8C%EC%95%84%EB%B3%B4%EA%B8%B0-33fd3ce2b767)\n- [[fromundefined.com] 궁극의 JavaScript 모노레포 설정](https://fromundefined.com/posts/2022-08-ultimate-monorepo/)", "title": "모노레포란 무엇인가요?"}, "fe-82": {"id": "fe-82", "content": "주로 경험해본 전략으로는 **Git Flow, GitHub Flow, 그리고 Trunk-Based Development**가 있습니다.\n\n먼저, **Git Flow**를 소개해 드리겠습니다. Git Flow에서 기능 개발은 `feature` 브랜치에서 이루어지고, 완료된 후 `develop` 브랜치에 병합됩니다. 릴리스를 준비할 때는 `release` 브랜치를 따로 만들어 QA와 최종 검증을 거친 뒤, 프로덕션 코드를 관리하는 `main`에 병합하게 됩니다. 만약 긴급한 수정 사항이 발생하면 `hotfix` 브랜치를 만들어 신속히 배포하고, 수정 사항을 `develop`에도 반영합니다. Git Flow를 이용하면 대규모 프로젝트에서 굉장히 체계적이고 안정적인 관리가 가능하지만, 브랜치가 많아짐에 따라 복잡도가 올라간다는 단점이 존재합니다.\n\n다음으로, **GitHub Flow**는 Git Flow보다 단순한 구조를 가지고 있습니다. 모든 변경 사항은 `main` 브랜치 기준으로 이루어지는데요, 새로운 기능을 개발할 때 `feature` 브랜치를 생성한 뒤 작업이 끝나면 코드 리뷰를 받고 바로 `main`에 병합합니다. 이 방식은 간소화된 프로세스를 가지고 있기 때문에 짧은 주기의 배포 환경에서 특히 유용합니다. 하지만 릴리스와 QA를 위한 별도의 브랜치가 없기 때문에, 안정성 관리가 중요한 프로젝트에는 다소 부담스러울 수 있습니다.\n\n마지막으로, **Trunk-Based Development**는 `main(또는 trunk)` 브랜치 하나만 운용하는 방식입니다. 작업을 `main` 브랜치에 직접 커밋하거나, `feature` 브랜치를 만들고 며칠 내에 빠르게 병합합니다. 병합 주기가 짧아 코드 충돌 가능성이 적다는 장점이 있습니다. 한편, 철저한 자동화 환경이 뒷받침되어야 한다는 단점이 존재합니다.\n\n## Git Flow와 Github Flow 중 어떤 전략을 선호하시나요? 🤔\n선호하는 하나의 전략이 있다기보다는, 프로젝트 상황에 맞는 전략을 선택하는 게 중요하다고 생각합니다.\n\n**Git Flow**는 릴리스 주기가 길고 QA가 중요한 프로젝트에서 사용하기 적합합니다. 예를 들어, 금융 서비스처럼 안정성과 품질이 중요한 프로젝트에서는 Git Flow가 더 적합할 것입니다. 반면, **GitHub Flow**는 자주 배포가 이루어지고 변경 사항을 빠르게 반영해야 하는 스타트업과 유사한 환경에서 유리할 것입니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 렉스의 Git 브랜칭 전략](https://www.youtube.com/watch?v=wtsr5keXUyE)\n- [Git Flow에서 트렁크 기반 개발으로 나아가기](https://tech.mfort.co.kr/blog/2022-08-05-trunk-based-development/)", "title": "알고 계신 git 브랜치 전략들에 대해 소개해주세요."}, "fe-83": {"id": "fe-83", "content": "CSS 전처리기는 **CSS를 더 효율적이고 체계적으로 작성할 수 있도록 도와주는 도구**입니다. CSS는 기본적으로 스타일 규칙을 선언하는 데 필요한 문법만 제공하기 때문에 반복적인 작업이나 코드의 재사용성이 떨어지는 단점이 있습니다. CSS 전처리기는 이러한 한계를 극복하고 CSS에 프로그래밍적 기능을 추가하는 역할을 합니다. 대표적인 CSS 전처리기로는 `Sass`, `Less`, `Stylus`가 있습니다.\n\n기본적으로, CSS에는 변수, 함수, 조건문과 같은 기능이 없습니다. 하지만 CSS 전처리기를 사용하면 이러한 기능들을 구현할 수 있습니다. CSS 전처리기를 사용하여 작성한 코드는 일반 CSS로 컴파일되어 브라우저에서 사용됩니다.\n\n실제 사용 예시는 다음과 같습니다.\n\n### 일반 CSS\n```css\n.primary-button {  \n  background-color: #007bff;  \n  color: white;  \n  padding: 10px 20px;  \n  border-radius: 4px;  \n}  \n\n.secondary-button {  \n  background-color: #6c757d;  \n  color: white;  \n  padding: 10px 20px;  \n  border-radius: 4px;  \n}  \n```\n### Sass(SCSS)\n```sass\n$button-padding: 10px 20px;  \n$border-radius: 4px;  \n\n@mixin button($bg-color) {  \n  background-color: $bg-color;  \n  color: white;  \n  padding: $button-padding;  \n  border-radius: $border-radius;  \n}  \n\n.primary-button {  \n  @include button(#007bff);  \n}  \n\n.secondary-button {  \n  @include button(#6c757d);  \n}  \n```\n\n## CSS 전처리기와 Zero Runtime CSS의 차이는 무엇인가요? 🤔\n두 도구는 컴파일 타임에 CSS를 생성한다는 점에서 공통점이 있지만, **등장 배경과 목적에서 차이가 있습니다.**\n\n먼저, **CSS 전처리기는 순수 CSS만으로 구현하기 어려운 프로그래밍적인 기능(변수, 중첩, 믹스인 등)을 지원하기 위해 등장했습니다.** 이를 통해 코드 재사용성을 높이고, 스타일 관리의 복잡성을 줄이는 것이 주요 목표입니다.\n\n반면, **Zero Runtime CSS는 CSS in JS의 성능 문제를 해결하기 위해 탄생했습니다.** CSS in JS는 런타임에서 CSS 관련 연산을 수행하며 성능 오버헤드를 발생시킬 수 있는데, Zero Runtime CSS는 이를 컴파일 타임에 미리 처리함으로써 런타임 비용을 제거하고 성능을 최적화합니다.\n\n이러한 등장 배경 차이로 인해 문법 형태도 다릅니다. CSS 전처리기는 CSS와 유사한 문법을 사용하며, 전통적인 CSS 스타일을 확장합니다. 반면 Zero Runtime CSS는 CSS in JS와 유사하게 JS 문법을 기반으로 작성하며, 컴포넌트 중심의 스타일링을 지원합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[F-lab] 현대 웹 개발에서의 CSS 전처리기의 역할과 중요성](https://f-lab.kr/insight/role-of-css-preprocessors-in-modern-web-development)\n- [[드림코딩] CSS 핫🔥 트렌드](https://www.youtube.com/watch?v=Eim11QYLfEY)", "title": "CSS 전처리기(CSS preprocessor)란 무엇인가요?"}, "fe-84": {"id": "fe-84", "content": "> 💬 면접자 개인의 경험/노하우를 묻는 질문입니다. 아래의 답안은 참고용으로만 읽어주세요.\n\n디버깅을 잘하기 위해서는 **문제를 정확히 이해하는 것이 가장 중요하다고 생각합니다.** 따라서 가장 먼저 오류 메시지를 꼼꼼하게 읽어 어떤 원인에 의해 문제가 발생한 것인지 구체적이고 명확하게 파악하려 노력합니다.\n\n다음으로, **문제를 격리하는 과정이 필요합니다.** 코드베이스가 클수록, 문제가 특정 위치에 국한되지 않고 여러 요소가 얽혀 있을 가능성이 높습니다. 이럴 때는 문제를 작게 분리해 재현 가능한 환경을 구성하는 것이 중요합니다. 예를 들어, 복잡한 컴포넌트에서 문제가 발생하면 해당 컴포넌트만 따로 실행해보거나, 간단한 테스트 데이터를 사용해 문제가 있는 부분만 집중적으로 테스트하는 방식으로 문제를 좁혀갈 수 있습니다. 이러한 과정을 거쳐 크고 복잡한 문제를 작고 단순한 문제로 최대한 깎아냅니다.\n\n문제를 좁히는 과정에서, **정상 케이스의 동작 흐름과 문제 상황의 동작 흐름을 비교하는 일도 문제를 좁히는 데 큰 도움이 됩니다.** 정상적으로 동작한다면 애플리케이션이 어떤 절차로 동작해야 하는지 먼저 스케치해본 후, 문제 상황 당시의 동작 흐름을 스케치하여 비교합니다. 그 후, 두 동작 흐름 간의 차이를 바탕으로 문제 지점을 도출합니다.\n\n마지막으로, **파악한 문제를 해결할 수 있는 방법을 모색합니다.** 우선적으로 공식 문서와 공신력 있는 출처의 글들을 참고하여 문제 해결 방법을 찾습니다. 혹은, 관련 Github 레포지토리를 찾아가 Issue 게시판을 탐색하기도 합니다. 그럼에도 해결법을 찾지 못하면 구글링 및 생성형 AI를 활용하여 검색합니다.  \n\n\n이외에도, 브라우저 개발자 도구 및 IDE에서 제공하는 디버깅 도구들을 적극적으로 활용하거나, 문제 해결 후 그 과정을 기록하는 습관을 들이는 등 여러 노력을 기울이고 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[포프 TV] 프로그래밍의 반은 디버깅](https://www.youtube.com/watch?v=rHgYy7JrP1c)", "title": "효과적으로 디버깅하기 위한 방법에 대해서 설명해주세요."}, "fe-85": {"id": "fe-85", "content": "`useState()`를 조건문 안에서 사용하면 안 되는 이유는 **리액트가 `state`를 관리하는 방식이 `useState`를 호출하는 순서과 연관되어 있기 때문입니다.**\n\n리액트는 **컴포넌트 내부에서 `useState()`가 호출된 순서를 기준으로 `state`를 저장하고 업데이트합니다.** 그런데 `useState()`를 조건문 안에서 호출하면 특정 렌더링 시에는 호출되고, 다른 렌더링에서는 호출되지 않을 가능성이 생깁니다. 이렇게 되면 리액트가 호출 순서를 기반으로 `state`를 추적하는 과정에서 혼동이 발생하게 됩니다.\n\n예를 들어, 다음과 같은 코드가 있다고 가정해 보겠습니다.\n```jsx\nfunction Example({ shouldUseState }) {\n  if (shouldUseState) {\n    const [count, setCount] = useState(0);\n  }\n\n  return <div>Example Component</div>;\n}\n```\n\n위 코드에서 `shouldUseState` 값이 `true`일 때만 `useState()`가 호출됩니다. 문제는, `shouldUseState`가 `false`로 바뀌는 경우입니다. 이때 `useState()`의 호출 개수가 변경되면서 리액트의 내부 상태 저장 방식과 불일치가 발생합니다. 리액트는 상태를 순서 기반으로 관리하기 때문에, 이후 렌더링에서 이전에 있던 `useState()` 호출이 사라지면 다른 `useState()` 호출들이 엇갈려 버그가 발생할 수 있습니다.\n\n이러한 문제를 방지하기 위해서는 **`useState()`가 항상 컴포넌트의 최상위에서 호출되어야 합니다.** 즉, 조건문이나 반복문, 함수 내부에서 호출하지 않아야 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[React] Hook의 규칙](https://ko.legacy.reactjs.org/docs/hooks-rules.html)\n- [[d5br5.dev] React useState 동작 원리 이해하기](https://d5br5.dev/blog/deep_dive/react_useState_understanding)", "title": "왜 useState를 조건문 안에서 사용하면 안 되나요?"}, "fe-86": {"id": "fe-86", "content": "의사 요소는 **CSS 선택자에 추가하는 키워드로, 특정 요소의 일부분에 스타일을 적용할 때 사용됩니다.** 일반적인 CSS 선택자는 요소 전체의 스타일을 지정하지만, 의사요소를 사용하면 요소 내부의 특정 부분에만 스타일을 적용할 수 있습니다. 대표적인 예시로는 `::before`, `::after`, `::first-letter`, `::first-line` 등이 있습니다.\n\n`::before`와 `::after`는 콘텐츠를 삽입할 때 유용하게 사용됩니다. 예를 들어, 특정 요소 앞이나 뒤에 장식적인 아이콘을 추가할 때 활용할 수 있습니다.\n```css\nbutton::before {\n  content: '🔥';\n  margin-right: 5px;\n}\n```\n위 코드처럼 `::before`를 사용하면 버튼 앞에 불꽃 이모지가 추가됩니다. 이와 유사하게 `::after`를 사용하면 요소 뒤에 내용을 추가할 수도 있습니다.\n\n이처럼 의사 요소는 HTML 구조를 변경하지 않고도 특정 부분에 스타일을 적용할 수 있게 해줍니다.\n\n## 의사 요소와 의사 클래스의 차이는 무엇인가요? 🤔\n의사 요소는 요소의 특정 부분에 스타일을 적용하는 반면, **의사클래스는 요소의 상태나 조건을 기반으로 스타일을 변경한다는 점에서 차이가 있습니다.**\n\n예를 들어, `:hover`는 사용자가 요소 위에 마우스를 올렸을 때 스타일을 변경하는 의사 클래스이며, `::before`는 요소의 앞부분에 콘텐츠를 삽입하는 의사 요소입니다. 쉽게 말해, 의사 클래스는 **\"어떤 상태/조건인지\"** 를 기준으로 동작하고, 의사요소는 **\"어떤 부분인지\"** 를 기준으로 동작한다고 이해하면 됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[TCP School] 의사 요소](https://www.tcpschool.com/css/css_selector_pseudoElement)\n- [[TCP School] 의사 클래스](https://www.tcpschool.com/css/css_selector_pseudoClass)", "title": "CSS 의사 요소(Pseudo-elements)란 무엇인가요?"}, "fe-87": {"id": "fe-87", "content": "크게 세 가지 장점에 대해 설명드리겠습니다.\n\n첫째, **JWT는 Stateless 인증 방식을 제공합니다.** 서버가 사용자의 인증 상태를 별도로 저장할 필요가 없어, 서버의 메모리나 데이터베이스 비용을 줄일 수 있습니다. 인증 상태 관리에 대한 부담이 없어지니 서버의 확장성 측면에서도 유리합니다.\n\n둘째, **JWT는 토큰에 자체적으로 필요한 정보를 포함할 수 있습니다.** 사용자 ID, 권한 정보 등을 토큰 자체에 담을 수 있어, 추가적인 데이터베이스 조회 없이도 필요한 인증 관련 정보를 얻을 수 있습니다.\n\n셋째, **JWT는 서명(Signature)을 포함하고 있어 데이터의 무결성을 보장할 수 있습니다.** 서버에서 발급한 JWT가 변경되었는지 검증할 수 있으므로, 클라이언트가 임의로 내용을 조작하는 것을 방지할 수 있습니다. \n\n## JWT의 단점은 무엇인가요? 🤔\n먼저, **로그아웃을 강제할 수 없다는 문제가 있습니다.** 액세스 토큰의 상태는 서버에서 별도로 관리하지 않기 때문에, 한 번 발급된 토큰은 만료될 때까지 유효합니다. 따라서 서버에서 임의로 토큰을 무효화할 수 없으며, 다중 로그인 제한과 같은 기능도 구현하기 어렵습니다.\n\n또한, **페이로드 크기로 인한 네트워크 부하가 발생할 수 있습니다.** JWT는 사용자 정보를 포함하므로 일반적인 세션 ID보다 용량이 크며, 이에 따라 네트워크 비용이 증가할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[얄팍한 코딩사전] 세션 VS. 토큰! JWT가 뭔가요?](https://www.youtube.com/watch?v=1QiOXWEbqYQ)\n- [[yceffort] JWT의 단점과 주의사항](https://yceffort.kr/2021/05/drawback-of-jwt)", "title": "JWT(Json Web Token)의 장점은 무엇인가요?"}, "fe-88": {"id": "fe-88", "content": "`Content-Type`은 **HTTP 요청과 응답에서 전송되는 데이터의 타입을 명시하는 헤더**입니다. 서버와 클라이언트가 데이터를 주고받을 때, 올바르게 해석할 수 있도록 하기 위해 사용합니다.\n\n예를 들어, JSON 데이터를 전송할 경우 `Content-Type: application/json`을 사용하면, 서버는 해당 데이터가 JSON 형식이라는 것을 알고 적절한 방식으로 해석할 수 있습니다. 혹은 서버가 클라이언트에게 HTML을 응답할 때 `Content-Type: text/html`을 지정하면 브라우저는 이를 HTML로 렌더링할 수 있습니다.\n\n`Content-Type` 헤더는 **MIME 타입을 기반으로 하며,  `[type]/[subtype]` 형식**으로 구성됩니다. 예를 들어, JSON 데이터는 `application/json`, HTML 문서는 `text/html`를 사용합니다. 만약 파일을 업로드하는 경우에는 `multipart/form-data`를 사용합니다.\n\n`Content-Type` 헤더를 정확하게 지정하지 않으면, 클라이언트나 서버에서 데이터를 올바르게 해석하지 못할 수 있습니다. 예를 들어, JSON 데이터를 전송하면서 `Content-Type: application/x-www-form-urlencoded`로 설정하면 서버는 데이터를 잘못된 방식으로 처리하거나, `415 Unsupported Media Type`를 반환할 수 있습니다.\n\n## Content-Type과 Accept 헤더의 차이는 무엇인가요? 🤔\n`Content-Type` 헤더는 전송되는 데이터의 타입을 지정하는 반면, `Accept` 헤더는 **응답으로 받고자 하는 데이터의 타입을 지정합니다.** 예를 들어, 클라이언트가 JSON 응답을 원할 경우 `Accept: application/json`을 설정하면, 서버는 가능하면 JSON 형식으로 응답을 반환하게 됩니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] Content-Type](https://developer.mozilla.org/ko/docs/Web/HTTP/Headers/Content-Type)\n- [[rookieand 벨로그] MIME type은 뭐고, Content-type은 뭔데?](https://velog.io/@rookieand/MIME-type%EC%9D%80-%EB%AD%90%EA%B3%A0-Content-type%EC%9D%80-%EB%AD%94%EB%8D%B0)", "title": "Content-Type 헤더에 대해서 설명해주세요"}, "fe-89": {"id": "fe-89", "content": "불변성이란 **데이터가 최초 생성된 이후 그 상태를 변경할 수 없는 성질**을 의미합니다. 프로그래밍에서 불변성을 지키는 것은 예측 가능하고 안정적인 코드를 작성하는 데 중요합니다.\n\n객체와 배열 같은 참조 타입은 기본적으로 가변적입니다. 예를 들어, 객체의 프로퍼티 값을 직접 변경할 수 있습니다. 여기서 만약 불변성을 유지하고 싶다면, 객체의 프로퍼티를 직접 변경하지 않고 새로운 객체를 생성하는 방식을 사용해야 합니다. 구체적인 예를 들면 다음과 같습니다.\n\n```js\nconst person = { name: \"Alice\", age: 25 };\n\n// 불변성 미유지\nperson.age = 26;\n\n// 불변성 유지\nconst updatedPerson = { ...person, age: 26 }; \n```\n\n불변성을 유지하기 위해 스프레드 연산자, `Object.assign()`, `Object.freeze()`와 같은 내장 기능을 활용하거나, Immutable js와 같은 도구를 활용할 수 있습니다.\n\n## 불변성을 유지하면 성능 면에서 불리할 것 같은데, 왜 불변성을 유지하나요? 🤔\n말씀해주신 대로 업데이트마다 새로운 객체를 생성해야 하므로 메모리 비용이 약간 증가할 수 있습니다. 하지만 이 비용은 일반적으로 무시할만한 수준이며, 불변성 유지는 **장기적으로 유지보수성과 안정성을 크게 향상시킨다는 장점이 있습니다.**\n\n**불변성은 데이터의 변경 흐름을 추적하기 쉽게 만들어줍니다.** 가변 데이터를 이곳저곳에서 수정해가며 사용하면 데이터가 언제, 어디서 변경되었는지 파악하기 어렵습니다. 반면, 불변성을 지키면 데이터 변경이 항상 새로운 객체 생성을 통해 이루어지므로 변경 지점을 명확하게 추적할 수 있습니다. \n\n## 📚 추가 학습 자료를 공유합니다.\n- [[10분 테코톡] 소피아의 데이터타입과 불변성](https://www.youtube.com/watch?v=hM8s3ZaycGk)\n- [[evan-moon] 변하지 않는 상태를 유지하는 방법, 불변성(Immutable)](https://evan-moon.github.io/2020/01/05/what-is-immutable/)", "title": "불변성(Immutability)이란 무엇인가요?"}, "fe-9": {"id": "fe-9", "content": "브라우저가 웹 페이지를 화면에 표시하기 위해 거치는 과정을 브라우저 렌더링 파이프라인이라고 합니다. 이 과정은 크게 6단계로 나눌 수 있습니다.\n\n첫번째로 **DOM 생성**입니다.  \n브라우저가 HTML 파일을 받으면, 이 파일을 바이트(byte) 단위로 읽기 시작합니다.\n브라우저의 HTML 파서(Parser)는 이 바이트들을 문자(character)로 변환하고, 이 문자들을 다시 HTML 토큰으로 변환합니다.\n이 HTML 토큰들은 각각의 태그와 그 안에 포함된 텍스트, 속성 등을 의미하게 됩니다.\n\nHTML 토큰이 생성되면, 브라우저는 이를 기반으로 **DOM 트리**를 생성합니다.\n**DOM 트리**는 HTML 문서의 구조를 트리 형태로 표현한 것으로, 각 태그가 노드(node)가 되어 부모-자식 관계를 형성합니다.\n예를 들어, `<body>` 태그 아래에 `<div>`가 있다면, DOM 트리에서도 `<body>` 노드 아래에 `<div>` 노드가 있게 됩니다.\n\n<br />\n\n두번째로 **CSSOM 생성**입니다.  \n브라우저는 CSS 파일을 파싱(parse)합니다.\nCSS 파일 역시 바이트로 전송되므로, 브라우저는 이를 문자로 변환한 뒤, CSS 규칙으로 나눕니다.\n각 CSS 규칙은 `선택자(selector)`와 `선언(declaration)`으로 구성되는데, 선택자는 스타일을 적용할 HTML 요소를 정의하고, 선언은 적용할 스타일을 정의합니다.\n\n브라우저는 이 CSS 규칙들을 기반으로 **CSSOM 트리**를 생성합니다.\nCSSOM 트리는 DOM과 유사하게 트리 구조를 가지며, 각 노드는 해당 노드에 적용될 스타일 정보를 포함합니다.\n\n<br />\n\n세번째로 **렌더 트리 생성**입니다.  \n이제 브라우저는 DOM과 CSSOM을 결합하여 **렌더 트리**를 생성합니다.\n렌더 트리는 화면에 실제로 표시될 요소들로만 구성됩니다. 예를 들어 `display: none` 속성이 있는 요소는 렌더 트리에 포함되지 않습니다.\n이는 렌더 트리가 실제로 화면에 그려질 요소들만을 포함하기 때문입니다.\n\n렌더 트리의 각 노드는 DOM 트리의 요소와 연결되며, CSSOM 트리에서 해당 요소에 적용된 스타일 정보를 포함합니다.\n즉, 렌더 트리는 HTML 문서의 구조와 각 요소의 스타일 정보를 모두 포함한 트리입니다.\n\n<br />\n\n네번째로 **레이아웃**입니다.  \n렌더 트리가 생성된 후, 브라우저는 이 트리를 사용해 각 요소의 정확한 위치와 크기를 계산합니다.\n이 과정이 바로 레이아웃(Layout)입니다. 레이아웃 과정에서는 렌더 트리의 각 노드가 화면의 어디에 위치할지, 그리고 얼마나 큰지를 계산하게 됩니다. 이 계산은 화면의 뷰포트(viewport) 크기와 같은 정보에 의존합니다.\n\n만약, 화면 크기가 변경되면 브라우저는 레이아웃 과정을 다시 수행해야 합니다. 이 과정을 흔히 '리플로우(Reflow)'라고 부르는데, 리플로우는 성능에 영향을 줄 수 있으므로 이를 최소화하는 것이 중요합니다.\n\n<br />\n\n다섯번째로 **페인팅**입니다.  \n레이아웃이 완료되면, 브라우저는 각 요소를 실제로 화면에 그리는 작업을 시작합니다.\n이 과정을 페인팅이라고 합니다. 페인팅 단계에서는 텍스트, 색상, 그림자, 이미지 등 모든 시각적 요소가 화면에 그려집니다.\n\n페인팅은 화면에 표시될 그래픽 요소를 생성하는 과정이기 때문에, 이 과정도 성능에 큰 영향을 줄 수 있습니다.\n특히, 복잡한 그래픽이나 애니메이션이 포함된 경우 페인트 작업이 많아져 성능이 저하될 수 있습니다.\n\n<br />\n\n마지막 단계는 **컴포지팅**입니다.  \n브라우저는 화면에 그려질 요소들을 각각의 레이어(layer)로 분리하고, 이 레이어들을 결합하여 최종 화면을 구성합니다.\n이 과정에서는 GPU를 활용하여 각 레이어를 빠르게 합성합니다.\n\ntransform과 opacity와 같은 속성은 레이아웃이나 페인트 과정을 거치지 않고, 이 컴포지팅 단계에서만 처리됩니다.\n이 덕분에 이러한 속성을 사용하는 애니메이션은 더 부드럽고 빠르게 실행될 수 있습니다.\n컴포지팅 단계는 GPU 가속을 활용하여 성능을 최적화하고, 화면에 최종적으로 표시되는 결과를 빠르게 생성하는 데 중요한 역할을 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[MDN] 웹페이지를 표시한다는 것: 브라우저는 어떻게 동작하는가](https://developer.mozilla.org/ko/docs/Web/Performance/How_browsers_work)\n- [[제주코딩베이스캠프] 브라우저는 어떻게 화면을 렌더링할까?](https://www.youtube.com/watch?v=z1Jj7Xg-TkU&t=284s)\n", "title": "브라우저 렌더링 파이프라인에 대해서 설명해주세요."}, "fe-90": {"id": "fe-90", "content": "`requestAnimationFrame()`은 **브라우저의 화면 갱신 주기에 맞춰 콜백 함수를 실행하도록 요청하는 API입니다.** 이를 통해 애니메이션을 보다 부드럽게 렌더링하고 성능을 최적화할 수 있습니다.\n\n`requestAnimationFrame()`의 목적은 **애니메이션을 위한 프레임 렌더링을 브라우저의 화면 갱신 속도에 맞추는 것입니다**. 브라우저는 화면의 프레임을 1초당 60번(60fps)이나 120번(120fps) 갱신하는 것이 일반적인데, `requestAnimationFrame()`은 이러한 갱신 주기에 맞춰 콜백을 실행해줍니다. 이를 통해 브라우저가 최적의 시점에 프레임을 렌더링하도록 보장하여 부드러운 사용자 경험을 제공하고, 불필요한 연산을 줄일 수 있습니다.\n\n사용 예시를 들면, 반복 애니메이션 동작을 다음과 같은 형태로 구현할 수 있습니다.\n```js\nconst animate = () => {\n  /* 애니메이션을 위한 동작 */\n\n  if (일정시간이지나면) {\n    return;\n  }\n  \n  requestAnimationFrame(animate)\n}\n\nrequestAnimationFrame(animate)\n```\n\n물론, `setTimeout()`이나 `setInterval()`을 사용해도 일정한 간격으로 함수를 실행할 수 있지만, 브라우저의 화면 갱신 주기와 맞지 않는 경우가 발생합니다. 그리고 이로 인해 프레임 드롭 및 애니메이션의 끊김 현상이 발생할 수 있습니다. 반면, `requestAnimationFrame()`은 화면 갱신 주기에 맞춰 실행되므로 프레임 드롭 없이 애니메이션이 매끄럽게 보여지고, 성능 측면에서도 유리합니다.\n\n## 이외에 추가적인 장점은 없나요? 🤔\n이외에도, **디스플레이의 주사율에 맞게 콜백의 실행 주기가 동적으로 조정된다**는 장점이 있습니다.  60Hz, 120Hz, 144Hz 등 여러 주사율의 디스플레이에서 최적의 타이밍을 찾아 실행됩니다.  \n더불어, **백그라운드 탭이나 hidden 상태일 때는 실행을 중지한다**는 장점이 있습니다. 이는 사용자의 배터리 수명과 시스템 리소스 절약에 도움이 됩니다.\n\n## requestAnimationFrame 콜백은 태스크 큐에서 관리되나요? 🧐\n`requestAnimationFrame()`의 콜백은 태스크 큐나 마이크로태스크 큐와는 다른 곳에서 관리됩니다. `requestAnimationFrame()`의 콜백은 **\"map of animation frame callbacks\"** 이라 불리는 map 형태의 자료구조에서 별도로 관리되며 독자적인 실행 주기를 갖습니다. \n\n## 📚 추가 학습 자료를 공유합니다.\n- [[Inpa Dev] 웹 애니메이션 최적화 requestAnimationFrame 가이드](https://inpa.tistory.com/entry/%F0%9F%8C%90-requestAnimationFrame-%EA%B0%80%EC%9D%B4%EB%93%9C)\n- [[HTML Standard] Animation Frames](https://html.spec.whatwg.org/multipage/imagebitmap-and-animations.html#list-of-animation-frame-callbacks)\n- [[stackoverflow] Which queue is associated with requestAnimationFrame?](https://stackoverflow.com/questions/77008112/which-queue-is-associated-with-requestanimationframe)", "title": "requestAnimationFrame에 대해서 설명해주세요."}, "fe-91": {"id": "fe-91", "content": "## pnpm\npnpm은 **npm에 비해 성능과 디스크 효율성을 개선한 패키지 매니저입니다.**\n\n일반적으로 npm이나 yarn을 사용하면 프로젝트의 node_modules 폴더에 각 패키지의 실제 복사본이 저장됩니다. 하지만 pnpm은 content-addressable store라는 전역 저장소에 패키지를 보관한 후, 각 프로젝트에서는 하드 링크와 심볼릭 링크를 활용해 해당 패키지의 링크만 참조하도록 합니다. 이로 인해 **동일한 패키지를 여러 프로젝트에서 공유할 수 있어** 설치 속도가 크게 향상되고 스토리지 용량이 줄어듭니다.\n\n이외에도, **유령 의존성 문제가 발생하지 않으며, workspace 기능을 통해 한 프로젝트에 여러 패키지가 있는 모노레포를 구성하는 데 활용**할 수 있다는 장점이 있습니다.\n\n## Yarn Berry\nYarn Berry는 **Yarn의 2.0 버전 이상을 가리키며, PnP(Plug'n'Play) 와 Zero Install을 도입하여 패키지 관리 방식을 개선한 패키지 매니저입니다.**  \n\n기존 `node_modules` 폴더를 없애고 `.pnp.cjs` 파일을 이용하여 의존성을 관리하는 것이 특징입니다. `.pnp.cjs`에는 패키지의 위치와 의존성 정보들이 완전하게 기술되어 있어 **패키지를 찾는 과정이 효율적이고 정확하게 이뤄집니다.**\n\n그리고 패키지들이 `.yarn/cache` 디렉토리에 **zip 압축 파일 형태로 관리되어 용량이 작다는 장점이 있습니다.** 이로 인해 패키지 설치 속도가 빠르며 스토리지 용량을 아낄 수 있습니다.  \n또한 용량이 크게 줄어들었기 때문에 **의존성들을 버전 관리에 포함시켜 git으로 관리**할 수 있게 되었습니다. 이렇게 의존성을 버전 관리에 포함시키는 것을 **Zero Install**이라고 부릅니다. 이를 통해 저장소를 새로 복제하거나 브랜치를 이동할 때 의존성을 설치할 필요가 없게 되었습니다.\n\n이외에도 Yarn Berry 역시 유령 의존성이 발생하지 않으며, workspace 기능을 지원한다는 장점을 가지고 있습니다.\n\n## 추가 질문\n1.  유령 의존성 문제란 무엇이며, pnpm/Yarn Berry는 그 문제를 어떻게 해결했나요? 🤔\n2.  pnpm과 yarn berry의 단점은 없나요? 🧐\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[pnpm] 제작 동기](https://pnpm.io/ko/next/motivation)\n- [[po4tion.dev] pnpm 파헤치기](https://po4tion.dev/pnpm)\n- [[toss] node_modules로부터 우리를 구원해 줄 Yarn Berry](https://toss.tech/article/node-modules-and-yarn-berry)", "title": "패키지 매니저 pnpm과 yarn berry에 대해 설명해주세요."}, "fe-92": {"id": "fe-92", "content": "결론부터 말씀드리면, 인증(Authentication)은 **\"사용자가 누구인지 확인하는 과정\"** 이고, 인가(Authorization)는 **\"사용자가 특정 자원에 접근할 권한이 있는지 확인하는 과정\"** 입니다.\n\n먼저, 인증은 **사용자의 신원을 검증하는 과정입니다.** 예를 들어, 웹사이트에 로그인할 때 아이디와 비밀번호를 입력받아 해당 사용자가 누구인지 검증하는 것이 이에 해당합니다. 인증 방식에는 비밀번호 기반 인증, 생체 인증, OTP 인증 등이 있습니다. 또한, 최근에는 보안 강화를 위해 MFA(다중 요소 인증)도 널리 사용되고 있습니다.\n\n반면, 인가는 인증을 통해 신원이 식별된 사용자가 **특정 리소스에 접근할 수 있는 권한을 갖고 있는지 확인하는 과정입니다.** 예를 들어, 회사 내부 시스템에서 일반 직원은 고객 데이터를 조회할 수 없지만, 관리자 계정은 조회할 수 있도록 설정하는 것이 인가의 한 예입니다. 이 사례에서 일반 직원이 고객 데이터에 접근하지 못하는 이유는 인증에는 성공하지만, 권한이 부족하여 인가에 실패하기 때문입니다.\n\n## 접근 제어 방식에는 어떤 방식들이 있나요? 🤔\n\n대표적인 접근 제어 방식으로는, RBAC(Role-Based Access Control), ABAC(Attribute-Based Access Control), ReBAC(Relationship-Based Access Control)이 있습니다.\n\n**RBAC**는 사용자의 역할에 따라 접근 권한을 부여하는 방식으로, 조직 내에서 필요한 역할들을 생성하고 각 역할 별로 어떤 자원에 접근이 가능하며 어떤 행동이 가능한지를 설정합니다. **ABAC**는 사용자의 속성을 기반으로 접근 권한을 결정하는 방식으로, 보다 세밀한 제어가 가능합니다. **ReBAC**는 사용자 및 자원 간의 관계를 기반으로 접근 권한을 결정하는 방식입니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[okta] 인증과 인가 비교](https://www.okta.com/kr/identity-101/authentication-vs-authorization/)\n- [[okta] RBAC와 ABAC 의 특징 비교: 정의 및 사용 사례](https://www.okta.com/kr/identity-101/role-based-access-control-vs-attribute-based-access-control/)\n- [[Permit] Understanding Relationship Based Access Control (ReBAC)](https://www.youtube.com/watch?v=xCqpxiPXnCk)", "title": "인증과 인가에 대해 설명해주세요."}, "fe-93": {"id": "fe-93", "content": "`npm install`과 `npm ci`(clean-install) 모두 의존성 목록을 설치하는 커맨드이지만, 세부 동작에 차이가 있습니다. 요약하면, **`npm ci`는 `npm install`에 비해 의존성의 버전을 엄격하게 유지합니다.**\n\n두 커맨드의 차이점에 대해 설명드리겠습니다.\n\n첫째, `npm install`은 `package.json`에 명시된 version range 내에서 다른 버전을 설치할 가능성이 있지만, `npm ci`는 오직 `package-lock.json`에 정확하게 표기된 특정 버전을 따릅니다. 이로 인해 예기치 않게 다른 버전의 의존성을 설치하는 일을 방지합니다. 더불어 정확히 명시된 버전을 설치하므로 버전을 결정하기 위한 연산을 수행할 필요가 없어 설치 속도에서 유리한 측면이 있습니다.\n\n둘째, `npm install`은 `package-lock.json`을 변경할 가능성이 있지만, `npm ci`는 절대 변경하지 않습니다. 이러한 특징으로 인해 `npm ci`는 의존성 목록의 버전을 변경없이 일관되게 유지할 수 있게 해줍니다.\n\n셋째, `npm ci`는 매번 `node_modules`을 삭제한 후 설치합니다. 이를 통해 이전에 설치된 의존성과의 충돌로 인한 문제를 방지합니다. 또한, 오로지 `package-lock.json`에 따라서 매번 동일한 의존성을 설치할 것을 확실하게 보장합니다.\n\n이러한 차이점들로 인해 `npm ci`는 CI/CD 환경에서 빌드 과정의 일관성을 보장하기 위한 목적으로 사용되는 경우가 많습니다.\n\n##  npm ci를 로컬 개발 환경에서도 사용하면 안 되나요? 🤔\n가능합니다. 하지만 `npm ci`는 `node_modules`을 매번 모두 삭제하고 다시 설치하기 때문에 불필요한 시간이 소요될 수 있습니다. 따라서, 로컬에서는 일반적으로 `npm install`을 사용하고, CI/CD 환경에서는 `npm ci`를 사용하는 경우가 많습니다. 다만, 팀 내에서 의존성 버전을 엄격하게 맞추는 것이 중요하다고 판단되면 로컬 환경에서도 `npm ci`를 사용할 수 있습니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[npm docs] npm-ci](https://docs.npmjs.com/cli/v8/commands/npm-ci)", "title": "npm install과 npm ci의 차이점에 대해 설명해주세요."}, "fe-94": {"id": "fe-94", "content": "BFF(Backend for Frontend)는 **클라이언트가 백엔드 API를 직접 호출할 때 발생하는 여러 문제를 해결하기 위해, 프론트엔드를 위한 보조 서버를 두는 방식입니다.** BFF는 클라이언트와 백엔드 사이에서 데이터 가공 및 전달을 담당하며, 이를 통해 프론트엔드가 효율적으로 동작할 수 있도록 도와줍니다.\n\n첫째, **BFF는 MSA(Microservices Architecture) 환경에서 여러 API로부터 받은 데이터를 조합 및 가공하기 위해 활용됩니다.** 과거 모놀리식 아키텍처에서는 단일 백엔드 서버가 모든 로직을 처리했고, 프론트엔드는 서버로부터 받은 데이터를 단순히 렌더링하는 역할을 했습니다. 하지만 MSA로 전환하면서 프론트엔드는 여러 서비스의 API를 호출해야 했고, 이 데이터들을 조합하거나 가공해야 하는 부담이 생겼습니다. 다시 말해, API 호출 수가 늘어나고, 클라이언트 코드의 복잡도가 증가하는 문제가 발생했습니다. BFF는 이러한 문제를 해결하기 위해 중간 계층 역할을 하며 여러 API에서 데이터를 받아 프론트엔드가 필요로 하는 형태로 가공하여 전달합니다. 이를 통해 클라이언트 단의 불필요한 API 호출을 줄이고, 프론트엔드의 복잡도를 낮추면서도 최적화된 데이터 제공이 가능하게 합니다.\n\n둘째, **BFF는 다양한 플랫폼 환경에 맞는 데이터로 가공하기 위해 활용됩니다.** 최근에는 웹, 모바일, 스마트 TV 등 여러 종류의 프론트엔드 플랫폼이 등장하면서, 각 플랫폼에 적합한 데이터 형식과 응답 구조가 필요하게 됐습니다. 예를 들어, 웹 애플리케이션은 상대적으로 복잡한 데이터 구조를 받아도 큰 문제가 없지만, 모바일 애플리케이션의 경우 네트워크 비용을 줄이기 위해 최소한의 데이터만 요청하는 것이 유리합니다. BFF를 활용하면 각 플랫폼의 특성에 맞춰 데이터를 변환하거나 선택적으로 제공할 수 있으며, 이를 통해 성능 최적화도 이룰 수 있습니다.\n\nBFF는 이외에도 여러 가지 이유로 활용됩니다. 예를 들어, **API 키 및 인증 정보 관리, CORS 문제 해결** 등 클라이언트 단에서 발생할 수 있는 다양한 이슈를 효과적으로 해결할 수 있습니다. 또한, **백엔드 시스템 변경 시 프론트엔드 코드의 수정 범위를 최소화**하는 역할도 수행할 수 있어 유지보수성을 높이는 데 도움이 되기도 합니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[kakao entertainment] 카카오페이지는 BFF를 어떻게 적용했을까?](https://fe-developers.kakaoent.com/2022/220310-kakaopage-bff/)\n- [[moon medium] API 수정 요청? 이제 그만! BFF로 프론트엔드에 책임 떠넘기기](https://medium.com/@wjdwoeotmd/api-%EC%88%98%EC%A0%95-%EC%9A%94%EC%B2%AD-%EC%9D%B4%EC%A0%9C-%EA%B7%B8%EB%A7%8C-bff%EB%A1%9C-%ED%94%84%EB%A1%A0%ED%8A%B8%EC%97%94%EB%93%9C%EC%97%90-%EC%B1%85%EC%9E%84-%EB%96%A0%EB%84%98%EA%B8%B0%EA%B8%B0-%EF%B8%8F-f2605c95f652)", "title": "BFF(Backend For Frontend)란 무엇인가요?"}, "fe-95": {"id": "fe-95", "content": "**`infer` 키워드는 조건부 타입에서 특정 타입을 추론하는 데 사용됩니다.** 즉, 타입을 직접 지정하는 것이 아니라 타입스크립트가 해당 타입을 유추할 수 있도록 돕는 역할을 합니다. `infer`는 `extends`를 사용하는 조건부 타입 안에서 활용되며, 특정 타입을 분해하여 사용할 수 있습니다.\n\n간단한 예시를 설명드리겠습니다.\n```ts\ntype GetReturnType<T> = T extends (...args: any[]) => infer R ? R : never;\n```\n위 코드는 함수 타입 `T`의 반환 타입을 추출하는 유틸리티 타입입니다. `T`가 함수 타입이라면 infer R을 통해 반환 타입을 R로 추론하고, 그렇지 않다면 `never`을 반환합니다.\n```ts\ntype ReturnType = GetReturnType<() => string>; // string\n```\n\n주의할 점은, infer는 반드시 조건부 타입 안에서 사용되어야 합니다. 독립적으로 사용하면 문법 오류가 발생합니다.\n\n## 설명 중에 언급하신 extends 키워드는 무엇인가요? 🤔\nextends 키워드는 타입스크립트에서 두 가지 주요 용도로 사용됩니다.\n\n첫째, **제네릭에서 타입을 제한하는 역할을 합니다.** 예를 들어, 특정 타입이 반드시 string을 확장해야 한다면 다음과 같이 정의할 수 있습니다.\n```ts\ntype Example<T extends string> = T;\n```\n\n둘째, **조건부 타입에서 특정 타입이 다른 타입을 포함하는지를 확인하는 역할을 합니다.** \n\n```ts\ntype Check<T> = T extends string ? '문자열' : '다른 타입';\n\ntype Example1 = Check<'hello'>; // '문자열'\ntype Example2 = Check<42>; // '다른 타입'\n```\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[타입스크립트 핸드북] infer란?](https://joshua1988.github.io/ts/usage/infer.html#infer%EB%9E%80)\n- [[NAVER D2] infer, never만 보면 두려워지는 당신을 위한 고급 TypeScript](https://www.youtube.com/watch?v=xesy1i67OWI)", "title": "타입스크립트의 infer 키워드에 대해서 설명해주세요."}, "fe-96": {"id": "fe-96", "content": "`<a>`를 이용해 외부 링크를 연결할 때는 `rel` 속성을 적절히 설정하여 중요 정보가 유출되지 않도록 해야 합니다.\n\n첫째, **`rel=\"noopener\"`를 설정하여 외부 페이지에서 `opener` 객체에 접근할 수 없도록 막아야 합니다.** 기본적으로, `target=\"_blank\"`가 설정된 `<a>` 를 통해 열린 외부 사이트에서 `window.opener` 객체에 접근할 수 있습니다. `window.opener` 객체에 대한 접근을 허용하면, 악의적으로 피싱 사이트로 연결시키는 **탭 내빙(Tabnabbing) 공격**이 가능해집니다. 이를 방지하기 위해서는 `noopener`를 설정해야 합니다.\n\n둘째, **`rel=\"noreferrer\"`를 설정하여 Referer 헤더 정보가 노출되지 않도록 막아야 합니다.** 브라우저는 링크 연결 시 Referer 헤더를 통해 사용자가 어떤 웹사이트에서 이동된 것인지를 전달하는데, 이 정보에 민감한 데이터가 포함될 수 있습니다. 예를 들어, URL에 세션 ID나 사용자 식별 정보가 포함되어 있다면 이 정보가 외부로 유출될 수 있습니다. 따라서 `noreferrer`를 설정하여 이를 예방해야 합니다.  \n참고로, `noreferrer` 속성에는 `noopener`와 마찬가지로 `opener`를 생략하는 기능도 포함됩니다.\n\n셋째, **`rel=\"nofollow\"`를 설정하여 검색 엔진이 외부 링크를 따라가지 않도록 해야 합니다.** 기본적으로 검색 엔진은 페이지 내의 링크를 따라가며 웹을 크롤링합니다. 하지만 검증되지 않은 외부 링크나 상업적 링크가 검색 엔진에 의해 인덱싱된다면 SEO 상 불리할 수 있습니다. 따라서 `nofollow`를 설정하여 검증되지 않은 외부 링크가 SEO에 악영향을 미치는 일을 막아야 합니다. 예를 들어, 사용자 생성 컨텐츠에서 스팸 링크를 방지하거나, 광고 링크가 SEO에 영향을 미치지 않도록 해야 합니다.\n\n끝으로, `noopener`, `noreferrer`, `nofollow` 세 가지 속성은 함께 적용할 수 있습니다. 예를 들어 `rel=\"noopener noreferrer nofollow\"`와 같이 조합하여 사용할 수 있습니다. 따라서 각 상황에 맞게 적절한 조합을 선택해야 합니다.\n\n## 탭 내빙 공격이란 무엇인가요? 🤔\n탭 내빙 공격은 **사용자가 새롭게 열린 탭에서 기존 탭으로 돌아올 때, 해당 탭을 원본 사이트와 유사한 피싱 사이트로 이동시켜 공격을 시도하는 기법**입니다. 사용자가 외부 링크를 클릭하여 새로운 탭이 열리고, 이후 원래 탭으로 돌아왔을 때 해당 페이지가 악성 사이트로 변경될 수 있습니다. 이를 방지하기 위해 `rel=\"noopener\"`를 설정하면 새로운 탭이 원본 탭의 컨트롤을 가질 수 없게 되어 공격이 불가능해집니다.\n\n\n\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[요즘IT] 하이퍼링크를 신뢰할 수 없다면? noopener, noreferrer, nofollow](https://yozm.wishket.com/magazine/detail/1586/)", "title": "\\<a> 태그를 이용해 외부 페이지를 열 때 보안상 고려해야 할 점은 무엇인가요?"}, "fe-97": {"id": "fe-97", "content": "테스트 용이성을 높이기 위한 몇 가지 조건들에 대해 설명드리겠습니다.\n\n첫째, **순수 함수가 테스트하기 용이합니다.** 순수 함수란 동일한 입력에 대해 항상 동일한 출력을 반환하는, 부수 효과가 없는 함수를 의미합니다. 부수 효과를 일으키는 비순수 함수를 테스트하는 것은 까다롭습니다. 예를 들어, 함수 외부의 상태에 의존하거나, API 호출을 하거나, DOM을 직접 조작하는 등의 동작이 포함된 함수는 외부의 영향을 받으므로 테스트의 정확성을 보장받기 어렵습니다. 반면, 입력을 받아 단순히 계산한 값을 반환하는 순수함수는 독립적으로 테스트하기 좋습니다.\n\n둘째, **단일 책임 원칙을 준수한 코드가 테스트하기 용이합니다.** 하나의 함수나 모듈이 한 번에 많은 역할을 수행하면 테스트를 작성하기 어려워집니다. 예를 들어, 데이터를 가져오는 함수가 UI를 렌더링하는 기능까지 포함하고 있다면, 테스트를 작성하기 불리합니다. 테스트 코드의 복잡도가 증가하며, 테스트가 실패할 때 그 원인을 파악하기 어려워지기 때문입니다. 역할을 명확히 분리하여 한 가지 기능만 담당하도록 설계하면, 테스트 코드가 간결하고 명확해집니다.\n\n셋째, **예측하기 쉬운 코드가 테스트하기 용이합니다.** 코드가 복잡하고 내부 동작을 쉽게 이해할 수 없다면, 테스트를 작성하는 것도 어렵습니다. 따라서 명확한 변수명과 일관된 코드 스타일을 유지하고, 예상치 못한 동작이 발생하지 않도록 설계하는 것이 중요합니다.\n\n## 테스트 용이성을 높이기 위해 코드를 수정하는 게 합리적일까요? 🤔\n**테스트를 위해 코드를 과도하게 수정하는 것은 오히려 유지보수성을 해칠 수 있습니다.** 예를 들어 테스트를 위해서 `private` 메서드를 `public`으로 바꾸거나, 테스트만을 위한 메서드를 만드는 등의 행위는 코드의 품질을 저하시킬 수 있습니다.\n\n**다만, 테스트 작성이 어렵다면 코드 품질에도 문제가 있을 가능성이 큽니다.** 예를 들어, 함수가 너무 많은 역할을 하거나, 의존성이 강하게 결합되어 있다면 테스트가 어려워질 수 있습니다. 이럴 때는 테스트를 쉽게 만들기 위해 코드 개선을 고려하는 것이 좋습니다. 이러한 개선은 테스트 용이성을 높일 뿐 아니라, 궁극적으로 코드의 품질을 높이기 때문입니다.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[기억보단 기록을] 테스트하기 좋은 코드 - 테스트하기 어려운 코드](https://jojoldu.tistory.com/674)\n- [[f-lab] 테스트하기 쉬운 코드 작성법](https://f-lab.kr/blog/good-code-to-test)", "title": "테스트하기 쉬운 코드의 조건들에 대해 설명해주세요."}, "fe-98": {"id": "fe-98", "content": "**Cache-Control은 클라이언트(브라우저)와 중간 서버(proxy, CDN 등)가 어떤 방식으로 캐싱할지를 지정하는 헤더입니다.** 즉, “특정 응답을 얼마나 오래, 어떻게 캐싱할 것인가”를 결정합니다. 이를 잘 활용하면 불필요한 네트워크 요청을 줄이고 웹 성능을 개선할 수 있습니다.\n\nCache-Control의 핵심은 **특정 리소스를 얼마나 오래 저장할 수 있는지를 서버가 결정하는 것입니다.** 웹 페이지를 방문할 때 브라우저는 서버에서 HTML, CSS, JavaScript, 이미지 등의 리소스를 다운로드하는데, 이 리소스를 매번 다시 다운로드하지 않고 저장된 데이터를 활용하면 성능이 향상될 수 있습니다. 한편, 모든 리소스를 무조건 캐시에 저장하면 최신 데이터가 반영되지 않는 문제가 발생할 수 있기 때문에, 리소스 유형 별로 적절한 캐싱 정책을 설정하는 것이 중요합니다.\n\n예를 들어, **자주 변경되지 않는 정적 리소스는 장기간 캐시에 저장해 불필요한 다운로드를 방지하는 것이 좋습니다.** `Cache-Control: public, max-age=31536000, immutable`와 같은 헤더를 설정할 수 있습니다. **반면, 변경 가능성이 높은 HTML 문서는 항상 최신 상태를 유지할 수 있도록 매번 서버의 검증을 요구하는 방식으로 관리해야 합니다.** 이때는 `Cache-Control: no-cache, must-revalidate`와 같은 헤더를 설정할 수 있습니다.  \n캐싱 전략을 잘못 설정하면 오래된 데이터를 계속 제공하거나 불필요한 네트워크 요청이 증가하는 등의 문제가 발생할 수 있으므로, 각 리소스의 특성을 고려하여 적절한 설정을 적용해야 합니다.\n\n## 캐싱의 장점에 대해서 설명해주세요. 🤔\n캐싱을 잘 활용하면 사용자의 대역폭 소비를 줄이고, 그에 따라 서버 부하를 낮추며, 페이지 로딩 속도를 개선하는 효과를 얻을 수 있습니다. 특히, 네트워크 환경이 열악한 모바일 환경에서는 캐싱이 더욱 중요한 역할을 합니다.\n\n## 프로젝트에서 수립하신 캐싱 전략에 대해서 공유해주세요. 🧐\n> 개인의 경험을 묻는 질문입니다. 경험에 기반하여 정돈된 형태로 답변하는 연습을 해보세요.\n\n## 📚 추가 학습 자료를 공유합니다.\n- [[toss tech] 웹 서비스 캐시 똑똑하게 다루기](https://toss.tech/article/smart-web-service-cache)", "title": "Cache-Control 헤더에 대해 설명해주세요."}, "fe-99": {"id": "fe-99", "content": "쉽게 설명드리면, 웹뷰는 **모바일 앱 내에 포함된 웹 브라우저입니다.** 네이티브 앱 내부에서 웹 페이지를 불러와서 마치 앱의 일부처럼 동작하도록 만들어 줍니다. 웹뷰는 하이브리드 앱 개발에서 사용되며, 안드로이드에서는 `WebView`, iOS에서는 `WKWebView`를 통해 구현할 수 있습니다.\n\n웹뷰는 웹 브라우저 엔진을 활용하여 **HTML, CSS, JavaScript로 작성된 웹 페이지를 앱 내부에서 실행할 수 있습니다.** 이를 통해 하나의 웹 코드를 기반으로 다양한 플랫폼에서 동일한 UI와 기능을 제공하는 것이 가능합니다. 특정 페이지를 웹으로 구현하고, 모바일 앱에서 해당 웹 페이지를 웹뷰로 띄우면 한 번만 개발하여 여러 플랫폼에서 재사용할 수 있습니다.\n\n또한, **웹뷰를 사용하면 업데이트가 자유롭다는 장점이 있습니다.** 네이티브 앱은 스토어 심사를 거쳐야 업데이트를 배포할 수 있습니다. 반면 웹뷰를 사용한 앱은 심사를 거치지 않고도 업데이트를 배포할 수 있기 때문에, 업데이트 빈도가 잦거나 빠르게 업데이트해야 하는 경우에 유용하게 활용될 수 있습니다.\n\n## 웹뷰의 단점은 무엇인가요? 🤔\n첫째, **웹뷰는 네이티브에 비해 성능이 떨어질 수 있습니다.** 특히, 복잡한 애니메이션이나 높은 연산량을 요구하는 경우 웹뷰보다는 네이티브 개발이 더 적합할 수 있습니다.\n\n둘째, **보안 문제를 고려해야 합니다.** 웹뷰를 통해 외부 웹사이트를 로드할 경우 악성 코드나 피싱 공격에 취약하므로, 사용자 입력을 처리할 때 보안을 위해 추가적인 노력을 들여야 합니다.\n\n마지막으로, **웹뷰에서는 네이티브 기능이 제한됩니다.** 웹뷰는 기본적으로 네이티브 앱이 아닌 웹 컨텐츠를 렌더링하는 컴포넌트입니다. 따라서 브라우저에서 제공하는 기능들은 활용할 수 있지만 네이티브 앱에서 직접 제공하는 기능들은 제한적입니다. 물론 브릿지를 통해 이용할 수 있지만 네이티브와 동일한 수준으로 사용할 수는 없습니다. 예를 들어, 파일 업로드 및 다운로드에 제약이 있고, GPS/카메라/마이크와 같은 하드웨어를 네이티브 수준으로 제어할 수 없습니다. \n\n## 웹뷰와 PWA(Progressive Web App)의 차이점은 무엇인가요? 🧐\n**PWA는 웹 기술로 만들어졌지만 네이티브 앱과 유사한 기능들을 제공하는 웹 애플리케이션입니다.**\n\n웹뷰는 네이티브와 웹을 혼합해 사용하는 하이브리드 접근법인 반면, PWA는 웹 표준만으로 앱 수준의 경험을 구현하는 것에 초점을 둡니다. 따라서 웹뷰는 네이티브 앱에 종속되어 있지만, PWA는 독립적으로 실행되며, 스토어 등록 없이도 배포가 가능합니다.\n\n## 추가 학습 자료를 공유합니다.\n- [[토스페이먼츠] 웹뷰(WebView)](https://docs.tosspayments.com/resources/glossary/webview)\n- [[인프런] 웹뷰를 이용해 웹 서비스를 앱으로 빠르게 구현하기](https://www.youtube.com/watch?v=hsh8BS7gyrY)", "title": "웹뷰(WebView)란 무엇인가요?"}}}, "backend": {"categories": [{"name": "자바 언어, 컬렉션과 자료구조", "desc": "자바 문법과 객체 모델, 컬렉션, 자료구조처럼 언어 레벨 이해를 묻는 질문들입니다.", "items": ["be-119", "be-68", "be-28", "be-27", "be-24", "be-69", "be-108", "be-111", "be-98", "be-20", "be-106", "be-113", "be-79", "be-104", "be-46", "be-80", "be-112", "be-127", "be-70", "be-21", "be-117"]}, {"name": "운영체제, 동시성과 런타임", "desc": "프로세스와 스레드, 메모리와 스케줄링, 락과 런타임처럼 컴퓨터 시스템의 동작 원리에 가까운 질문들입니다.", "items": ["be-115", "be-118", "be-74", "be-116", "be-32", "be-54", "be-35", "be-122", "be-59", "be-149", "be-73", "be-33", "be-67", "be-101", "be-133", "be-134", "be-99", "be-145", "be-71", "be-125", "be-147", "be-75", "be-124"]}, {"name": "아키텍처, 객체지향과 설계 패턴", "desc": "객체지향 설계, 추상화, 계층 분리, 디자인 패턴처럼 코드 구조를 더 크게 바라보는 질문들입니다.", "items": ["be-128", "be-65", "be-51", "be-49", "be-150", "be-87", "be-137", "be-129", "be-132"]}, {"name": "Spring과 애플리케이션 계층", "desc": "스프링 MVC 요청 처리, 컨트롤러/예외 처리, 의존성 주입, 트랜잭션 경계처럼 애플리케이션 레이어를 설계하고 운영할 때 자주 만나는 주제들입니다.", "items": ["be-13", "be-11", "be-151", "be-89", "be-146", "be-29", "be-12", "be-3", "be-7", "be-8", "be-6", "be-10", "be-5", "be-123", "be-4", "be-9", "be-88", "be-43", "be-102", "be-135", "be-1"]}, {"name": "Persistence와 데이터베이스", "desc": "JPA, 트랜잭션, 쿼리 최적화, DB 모델링처럼 데이터를 저장하고 조회하는 과정에서 필요한 개념들을 모았습니다.", "items": ["be-57", "be-61", "be-94", "be-22", "be-143", "be-36", "be-14", "be-15", "be-18", "be-16", "be-17", "be-26", "be-19", "be-131", "be-121", "be-110", "be-142", "be-23", "be-39", "be-40", "be-120", "be-50", "be-126", "be-136", "be-138"]}, {"name": "네트워크, HTTP와 웹 인프라", "desc": "HTTP와 TCP/IP, 웹 서버와 프록시, 주소 체계처럼 서버가 웹과 연결되는 기본 통신 층의 질문들입니다.", "items": ["be-107", "be-78", "be-86", "be-81", "be-72", "be-100", "be-31", "be-114", "be-48", "be-37", "be-56", "be-38", "be-60", "be-44", "be-47", "be-42", "be-103", "be-41", "be-148", "be-52", "be-45", "be-53", "be-58", "be-85", "be-30"]}, {"name": "분산 시스템, 캐시와 운영 인프라", "desc": "대규모 트래픽, 분산 환경, 메시징, 캐시, 배포 전략, 운영 자동화처럼 시스템을 실제로 굴릴 때 필요한 주제입니다.", "items": ["be-2", "be-55", "be-62", "be-66", "be-95", "be-64", "be-141", "be-63", "be-92", "be-144", "be-83", "be-91", "be-96", "be-93", "be-152", "be-109", "be-130"]}, {"name": "테스트, 보안과 관측 가능성", "desc": "품질 보증, 보안 기본기, 로그와 메트릭처럼 서비스를 안전하게 운영하기 위해 꼭 필요한 질문들입니다.", "items": ["be-34", "be-76", "be-97", "be-139", "be-90", "be-77", "be-84", "be-82", "be-140", "be-25", "be-105"]}], "items": {"be-1": {"id": "be-1", "content": "## OSIV(Open Session In View)\n\n**OSIV(open session in view)** 는 영속성 컨텍스트를 뷰까지 열어둔다는 의미입니다. 영속성 컨텍스트가 살아있으면 엔티티는 영속 상태로 유지될 수 있어, 뷰에서도 지연 로딩을 사용할 수 있어요. OSIV의 핵심은 뷰에서도 지연 로딩이 가능하도록 하는 것입니다. 가장 단순한 구현은 클라이언트 요청이 들어올때 필터나 인터셉터에서 트랜잭션을 시작하는 방법인데요. 이를 트랜잭션 방식 OSIV라고 합니다. 하지만, 트랜잭션 방식 OSIV는 표현 계층에서도 엔티티를 수정할 수 있기 때문에 유지보수하기 어려운 코드를 만들 수 있습니다. \n\n## 트랜잭션 방식의 OSIV의 문제는 어떻게 풀어볼 수 있을까요? 🤔\n최신 방식의 OSIV는 트랜잭션 방식의 문제를 해결합니다. 스프링 OSIV는 OSIV를 사용하면서 트랜잭션은 비즈니스 계층에서만 사용해요. 표현 계층에서는 트랜잭션이 없기 때문에 수정이 불가능합니다. 하지만, 표현 계층에서 트랜잭션 없는 읽기를 이용해 지연 로딩은 가능합니다. 동작 원리는 다음과 같습니다.\n\n1. 클라이언트의 요청이 들어오면 서블릿 필터나 스프링 인터셉터에서 영속성 컨텍스트를 생성합니다.\n2. 응용 계층에서 @Transactional로 트랜잭션을 시작할 때 미리 생성한 영속성 컨텍스트를 찾아와서 트랜잭션을 시작합니다.\n3. 응용 계층이 끝나면 트랜잭션을 커밋하고 영속성 컨텍스트를 플러시합니다. (영속성 컨텍스트는 종료하지 않습니다.)\n4. 컨트롤러와 뷰까지 영속성 컨텍스트가 유지되므로 조회한 엔티티는 영속 상태를 유지할 수 있습니다.\n5. 필터, 인터셉터로 요청이 돌아오면 영속성 컨텍스트를 종료하는데 이때 플러시는 수행하지 않습니다.\n\n## 스프링 방식의 OSIV의 문제점을 한 번 생각해볼까요? 😀\n<details>\n    <summary>충분히 고민해보신 다음에 펼쳐보세요!</summary> \n\n- 표현 계층에서 엔티티를 수정하면 데이터베이스에 반영하지 않습니다. 하지만, 엔티티를 수정한 이후 트랜잭션을 시작하는 응용 계층을 시작한 경우 문제가 발생합니다. 응용 계층 트랜잭션이 끝나고 영속성 컨텍스트를 플러시하는 과정에서 변경 감지가 동작할 수 있습니다.\n- OSIV 기능을 사용하면 상대적으로 오래 DB 커넥션을 점유하기 때문에 커넥션 고갈로 이어질 수 있습니다.\n\n\n</details>\n  \n## OSIV 기능을 비활성화하여 성능 최적화를 해볼 수 있어요. 🤓\n\nOSIV 기능이 활성화되어 있는 경우에는 트랜잭션의 범위를 벗어나도 커넥션을 계속 유지해요. 만약 트래픽을 많이 받는 상황이라면, 커넥션 고갈로 이어질 수 있습니다. OSIV 기능을 비활성화하여 데이터베이스 커넥션을 효율적으로 사용할 수 있습니다.\n\n## 그러면 무조건 OSIV 기능을 비활성화해야 할까요? 🤔\n\n무조건 비활성화하기 보다는 꺼야하는 근거가 필요해요. 만약 트랜잭션 범위 밖에서 지연로딩을 반드시 수행해야하는 경우에는 비활성화하기 어려울 수도 있어요.\n\n데이터베이스를 복제하여 사용하는 경우, 데이터소스도 분리해야하는데요. OSIV 기능으로 인해 예기치 않은 데이터베이스로 요청이 전달될 수 있어요. 그리고, 대량의 트래픽이 발생하는 경우처럼 데이터베이스 커넥션을 효율적으로 사용해야할 수도 있습니다. 위와 같은 경우에는 OSIV 비활성화를 고려해볼 수 있을 것 같아요.\n\n결국, 요지는 상황에 적합한 경우 OSIV 기능을 비활성화하는 것이 적절하다고 생각합니다.", "title": "OSIV(Open Session In View) 옵션에 대해서 설명해주세요."}, "be-10": {"id": "be-10", "content": "이들은 클라이언트 측에서 보낸 데이터를 Java 객체로 만들어주는데\nRequestBody 는 `요청의 본문(Body)`에 있는 값을 바인딩할 때 사용하고,\nModelAttribute 는 `요청 파라미터나 multipart/form-data 형식`을 바인딩할 때 사용합니다.\n\n### RequestBody\n- 클라이언트가 보내는 요청의 본문을 자바 객체로 변환합니다.\n- 내부적으로 HttpMessageConverter를 거치는데, 이때 ObjectMapper를 통해 JSON 값을 java 객체로 역직렬화합니다. \n- 따라서 변환될 java 객체에 기본 생성자를 정의해야 하고, getter나 setter를 선언해야 합니다. [참고](https://jenkov.com/tutorials/java-json/jackson-objectmapper.html#how-jackson-objectmapper-matches-json-fields-to-java-fields)\n- cf. record에 기본 생성자를 따로 정의하지 않았는데 역직렬화가 되는 이유\n     - record 는 기본생성자를 자동으로 제공하지 않는 대신, ’모든 필드를 초기화하는 생성자’를 제공합니다.\n     - jackson 은 일반 객체와 달리, record를 역직렬화할 때는 ’모든 필드를 초기화하는 생성자’를 사용해 역직렬화하기 때문입니다.\n\n### ModelAttribute\n- 두가지 사용법이 있습니다.\n- 첫번째 사용법인 메서드 단에서의 사용법은 jsp의 Model에 하나 이상의 속성을 추가하고 싶을 때 사용합니다.\n  - e.g. `model.addAttribute(“속성 이름”, “속성 값”)`\n- 두번째 사용법인 인자 단에서의 사용으로 클라이언트가 보내는 요청의 파라미터나 multipart/form-data 형식의 데이터를 자바 객체로 변환합니다.\n- 내부적으로 ModelAttributeMethodProcessor를 거치는데, 이때 지정된 클래스의 생성자를 찾아 객체로 변환합니다.\n\n출처: https://tecoble.techcourse.co.kr/post/2021-05-11-requestbody-modelattribute/\n\n출처: https://blog.karsei.pe.kr/59\n", "title": "RequestBody VS ModelAttribute의 차이점을 말해주세요."}, "be-100": {"id": "be-100", "content": "IP 주소는 변환될 수 있으며, 기억하기 어렵기 때문에 대부분의 웹 서비스는 도메인 주소를 사용합니다. **DNS(Domain Name System)** 는 도메인 주소에 대응되는 원격 호스트 IP 주소를 관리하고 질의할 수 있는 시스템 혹은 이를 이용하기 위한 프로토콜을 의미합니다. DNS 시스템 내에서 도메인 주소를 관리하는 서버들을 네임 서버라고 부르며, 계층적인 형태로 존재합니다.\n\n## DNS 질의 과정을 설명해 주세요. 🤓\n\nDNS를 이용해 IP 주소를 찾는 과정에는 로컬 네임 서버, 루트 네임 서버, TLD 네임 서버, 권한 네임 서버가 등장합니다. \n - **로컬 네임 서버(Local Name Server)** 는 통신사 DNS, 구글 DNS 처럼 클라이언트와 가장 가까이 존재하는 네임 서버입니다.\n - **루트 네임 서버(Root Name Server)** 는 루트 도메인을 관리하는 서버이며, TLD 네임 서버의 주소를 알고 있습니다.\n - **TLD 네임 서버(Top-level Domain Server)** 는 .com, .kr, .net을 관리하는 네임 서버입니다.\n - **권한 네임 서버(Authoriative Name Server)** 는 네트워크를 운영하는 기관에서 보유하고 있는 도메인을 관리하는 네임 서버입니다. ex) .maeil-mail.kr을 관리하고, api.maeil-mail.kr, mail.maeil-mail.kr 의 정보를 관리하는 네임 서버\n \napi.maeil-mail.kr의 IP 주소를 찾는 과정을 예시로 설명해 드리겠습니다.\n\n가장 먼저 클라이언트는 로컬 네임 서버에 api.maeil-mail.kr의 IP 주소를 질의합니다. 만약, 로컬 네임 서버에서 값을 찾지 못했다면 로컬 네임 서버는 루트 네임 서버에게 IP 주소를 물어봅니다. 요청을 받은 루트 네임 서버는 .kr TLD 네임 서버 주소를 응답합니다. 이를 받은 로컬 네임 서버는 .kr TLD 네임 서버에 다시 요청을 보내고, maeil-mail.kr 권한 네임 서버의 주소를 응답 받습니다. 최종적으로 로컬 네임 서버는 권한 네임 서버에서 api.maeil-mail.kr IP 주소를 받아서 클라이언트에게 응답합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 엘리의 DNS](https://youtu.be/sDXcLyrn6gU?feature=shared)\n- [[10분 테코톡] 레디의 DNS](https://youtu.be/X2hcteH8kR0?feature=shared)\n- [널널한 개발자 - 전세계 인터넷을 멈추는 방법과 DNS](https://youtu.be/XXzxetbAIfA?feature=shared)\n- [토스페이먼츠 - DNS](https://docs.tosspayments.com/resources/glossary/dns)\n- [지리적 라우팅 설계](https://okms1017.tistory.com/97)\n- [Netflix 기술 블로그 - Active-Active for Multi-Regional Resiliency](https://netflixtechblog.com/active-active-for-multi-regional-resiliency-c47719f6685b)\n\n", "title": "DNS란 무엇인가요?"}, "be-101": {"id": "be-101", "content": "**경쟁 상태(Race Condition)** 는 두 개 이상의 스레드가 공유 자원에 동시에 접근할 때 스레드 간의 실행 순서에 따라 결과가 달라지는 현상으로, **원자성**과 **가시성** 모두 보장되어야 해결할 수 있습니다.\n\n**원자성(Atomicity)** 은 공유 자원에 대한 작업의 단위가 더 이상 쪼갤 수 없는 하나의 연산처럼 동작하는 성질을 의미합니다.\n\n**가시성(Visibility)** 은 한 스레드에서 변경한 값이 다른 스레드에서 즉시 확인 가능한 성질을 의미합니다.\n\n## 원자성을 보장하지 않으면 어떤 문제가 발생하나요?\n\n예를 들어 `i++` 연산은 하나의 문장이지만 CPU가 이를 수행하려면 세 단계의 instruction으로 분리됩니다.\n\n1. `i` 변수의 기존 값을 읽음 (Read)\n2. 기존 값에 1을 더함 (Modify)\n3. 결과 값을 다시 `i` 변수에 할당 (Write)\n\n연산 사이에 다른 스레드가 개입하면 기대하지 않은 결과가 발생할 수 있습니다.\n\n<img src=\"https://github.com/user-attachments/assets/d7c8463f-9a94-4909-ab30-86e9572f8bd2\">\n\n만약 두 개의 스레드가 동시에 `i++` 연산을 수행할 때, `Thread 1`이 i + 1을 하기 전에 `Thread 2`가 i를 읽어서 i + 1을 수행한 후 반영하면 `Thread 2`의 연산은 무시됩니다.\n\n## 가시성을 보장하지 않으면 어떤 문제가 발생하나요?\n\n<img src=\"https://github.com/user-attachments/assets/93ea2c5e-cda8-464a-9703-637e255afee2\">\n\n현대의 컴퓨터는 여러 개의 CPU 코어가 있고 각 코어마다 CPU 캐시가 존재하는데요. 한 스레드에서 공유 자원을 변경할 경우 메인 메모리에서 CPU 캐시로 값을 읽어들인 후, 변경된 값을 자신의 CPU 캐시에 반영합니다. 하지만 변경된 값이 메인 메모리에 언제 반영될지 알 수 없기 때문에 다른 스레드가 공유 자원을 읽을 때 변경 사항을 즉시 확인할 수 없습니다.\n\n## java에서 원자성과 가시성을 보장하기 위해 어떤 방법을 사용할 수 있나요?\n\n원자성과 가시성을 모두 보장하려면 `synchronized` 키워드, CAS(Compare-And-Swap) 알고리즘을 사용하는 `Atomic` 클래스, `ReentrantLock`과 같은 lock 클래스, Concurrent Collections 등을 사용해서 동기화할 수 있습니다.\n\n가시성만 보장하려면 `volatile` 키워드로 CPU 캐시를 사용하지 않고 메인 메모리에서 공유 자원을 직접 읽거나 쓸 수 있습니다. 이 때 **하나의 스레드에서만 쓰기 작업**을 수행하고, 나머지 스레드는 읽기 작업만 수행해야 합니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 알렉스, 열음의 멀티스레드와 동기화 In Java](https://www.youtube.com/watch?v=ktWcieiNzKs)\n- [[개발자 면접 질문] 운영체제 - 가시성, 원자성](https://www.youtube.com/watch?v=sQ-G8Gd5qVU)\n", "title": "동시성 문제 중 경쟁 상태를 해결하려면 무엇이 보장되어야 하나요?"}, "be-102": {"id": "be-102", "content": "스프링에서 **트랜잭션 전파(Transaction Propagation)** 는 트랜잭션의 경계에서 이미 진행 중인 트랜잭션이 있을 때 또는 없을 때 어떻게 동작할 것인가를 결정하는 기능입니다. 가령, `@Transactional` 어노테이션이 존재하는 메서드를 호출했을 때, 기존에 트랜잭션이 존재하면 재사용할지, 예외를 던질지 등 행동을 결정할 수 있습니다.\n\n트랜잭션 전파 속성에는 REQUIRED, REQUIRED_NEW, MANDATORY, SUPPORTS, NOT_SUPPORTED, NESTED, NEVER가 존재하며, `@Transactional` 어노테이션의 propagation 속성에 값을 설정할 수 있습니다.\n\n## 각 트랜잭션 전파 속성을 설명해 주세요. 🤔\n\n- **REQUIRED**는 트랜잭션이 존재하는 경우 해당 트랜잭션 사용하고, 트랜잭션이 없는 경우 트랜잭션을 생성합니다.\n- **REQUIRED_NEW**는 트랜잭션이 존재하는 경우 트랜잭션을 잠시 보류시키고, 신규 트랜잭션을 생성하여 사용합니다.\n- **MANDATORY**는 트랜잭션이 반드시 있어야 합니다. 트랜잭션이 없다면, 예외가 발생합니다. 만약, 트랜잭션이 존재한다면 해당 트랜잭션을 사용합니다.\n- **SUPPORTS**는 트랜잭션이 존재하는 경우 트랜잭션을 사용하고, 트랜잭션이 없다면 트랜잭션 없이 실행합니다. \n- **NOT_SUPPORTED**는 트랜잭션이 존재하는 경우 트랜잭션을 잠시 보류하고, 트랜잭션이 없는 상태로 처리합니다.\n- **NESTED**는 트랜잭션이 있다면 SAVEPOINT를 남기고 중첩 트랜잭션을 시작합니다. 만약 없는 경우에는 새로운 트랜잭션을 시작합니다. \n- **NEVER**는 트랜잭션이 존재하는 경우 예외를 발생시키고, 트랜잭션이 없다면 생성하지 않습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 키아라의 스프링 트랜잭션 전파](https://youtu.be/b0s9RzKyHN0?feature=shared)\n- [[10분 테코톡] 후니의 스프링 트랜잭션](https://youtu.be/cc4M-GS9DoY?feature=shared)\n- [망나니개발자 - 스프링의 트랜잭션 전파 속성(Transaction propagation) 완벽하게 이해하기](https://mangkyu.tistory.com/269)\n- [stackoverflow - Nested transaction in Spring app with JPA (postgres)](https://stackoverflow.com/questions/37927208/nested-transaction-in-spring-app-with-jpa-postgres)\n- [REQUIRES_NEW에 대한 오해와 주의할 점](https://hstory0208.tistory.com/entry/REQUIRESNEW%EC%97%90-%EB%8C%80%ED%95%9C-%EC%98%A4%ED%95%B4%EC%99%80-%EC%A3%BC%EC%9D%98%ED%95%A0-%EC%A0%90)\n", "title": "스프링 트랜잭션 전파 속성에 대해서 설명해주세요."}, "be-103": {"id": "be-103", "content": "**콘텐츠 전송 네트워크(Content Delivery Network, CDN)** 은 전 세계에 분산된 서버 네트워크며, 사용자와 물리적으로 가까운 위치에서 정적 콘텐츠(혹은 동적 콘텐츠)를 제공하여 서버 과부하를 방지하고 통신 지연을 단축합니다. CDN은 통신에 참여하는 호스트 간에 중간 서버를 두어 성능을 향상합니다. 대표적인 CDN 서비스로는 CloudFront, CloudFlare 등이 있습니다.\n\n## CDN에서 Push 방식과 Pull 방식의 차이점은 무엇인가요? 🤓\n\nPush 방식은 원본 서버가 콘텐츠를 미리 CDN 서버로 전달하는 방식입니다. Push 방식은 적절한 시기에 정확한 콘텐츠를 제공할 수 있습니다. 하지만, 지속적으로 업데이트를 해줘야 한다는 점에서 관리 비용이 상대적으로 높습니다.\n\nPull 방식은 CDN 서버가 원본 서버로 요청을 보내 콘텐츠를 가져오는 방식입니다. 클라이언트가 요청을 보내는 경우, CDN에 원하는 콘텐츠가 없다면 원본 서버로부터 콘텐츠를 가져와서 업데이트하는 방식으로 동작합니다. 초기 요청에서는 원본 서버에서 콘텐츠를 가져오는 작업을 수행해야 하므로 응답 속도가 저하될 수 있습니다.\n\n## CDN을 사용해야 할 때 고려해야 할 점은 무엇인가요? 🤔\n\nCDN을 사용해야 할 때는 크게 비용, 만료 시간, CDN 장애 대응, 콘텐츠 무효화를 고려해야 합니다.\n\n- CDN은 주로 제 3 사업자(클라우드 서비스 등)에게 비용을 지불하고 사용합니다. 비용 대비 효과를 고려하여 비판적으로 도입하고, 성능 향상이 필요한 콘텐츠만 캐싱하는 등 비용을 절약하기 위한 고민이 필요합니다.\n- 콘텐츠의 적절한 만료 시간에 대해서 고려해야 합니다. 콘텐츠의 만료 시간이 길다면 신선도가 떨어지며, 짧다면 원본 서버로의 요청이 빈번해집니다.\n- CDN에 장애가 발생했을 때 어떻게 대응해야 할지 고려해야 합니다. 예를 들어, CDN에서 콘텐츠를 응답할 수 없는 경우, 클라이언트에서 원본 서버로부터 직접 콘텐츠를 가져오도록 구성할 수 있습니다.\n- CDN에 존재하는 콘텐츠를 무효화하기 위해서 어떤 방식을 선택할 것인지 고려해야 합니다. 예를 들어, 오브젝트 버저닝을 사용하거나 CDN 서비스에서 제공되는 API를 사용할 수 있습니다.\n\n## 추가 학습 자료를 공유합니다.\n\n- [얄팍한 코딩사전 - 웹서비스에 필수! CDN이 뭔가요?](https://youtu.be/_kcoeK0ITkQ?feature=shared)\n- [라인개발실록 - 글로벌한 라인의 속도와 안정성의 비결은? CDN!](https://youtu.be/Zz-IehTBgjY?feature=shared)\n- [라인개발실록 - CDN으로 무엇을 할 수 있나요?](https://youtu.be/54PLQS4OS5E?feature=shared)\n- [글로벌 비디오 서비스가 가능하게 한 넷플릭스의 Microservice 아키텍쳐 구조 분석]( https://cottonblue.tistory.com/31)\n- [Why is Netflix so fast? Open Connect CDN | Push vs Pull CDN | System Design Concepts\n](https://youtu.be/Grhua7yhWh4?feature=shared)\n", "title": "CDN이란 무엇인가요?"}, "be-104": {"id": "be-104", "content": "하나의 문제를 해결하는 여러 알고리즘이 존재할 수 있습니다. 그리고, 개발자는 성능을 평가하여 하나를 결정해야 합니다. 이때, 코드가 실행될 때 걸리는 정확한 시간을 측정하는 방법으로 속도를 비교할 수 있습니다. 하지만, 실행 시간은 기계에 의존적이며 대안으로 나온 알고리즘들이 모두 짧은 시간 내로 수행되어 비교가 어려울 수 있습니다. \n\n이러한 경우, 직접 속도를 측정하는 것이 아닌 컴퓨터가 처리해야 하는 연산의 수를 세는 것이 나은 방법일 수 있습니다. 이러한 아이디어를 기반으로 특정 입력을 기준으로 개략적인 연산의 수를 계산한 것이 **시간 복잡도(Time Complexity)** 입니다. 반면, **공간 복잡도(Space Complexity)** 는 특정 입력을 기준으로 알고리즘이 얼마나 많은 공간을 차지하는지를 다룹니다. \n\n정리하자면, 시간 복잡도와 공간 복잡도는 모두 알고리즘 평가의 척도로 사용될 수 있습니다. 시간 복잡도는 개략적인 연산의 수를 기준으로 알고리즘 속도를 평가하는 척도로 사용되는 반면, 공간 복잡도는 알고리즘의 메모리 사용량을 평가하는 척도로 사용되는 것이 차이점입니다.\n\n## 빅오 표기법은 무엇인가요? 😀\n\n빅오 표기법은 복잡도를 표현하는 표기법 중 하나로 불필요한 상세를 무시하고 필수적인 부분에 집중하는 점근적 표기법을 따릅니다. 빅오 표기법은 `O(n)` 형식으로 어떤 함수의 입력 값에 따라 알고리즘의 실행 시간 및 공간 사용량이 어떻게 변하는지를 설명합니다. 빅오 표기법의 예시는 다음과 같습니다.\n\n```java\n// n이 입력되면 n번 루프가 반복되므로, O(n)으로 표기합니다.\nfor (int i = 0; i < n; i++) { ... }\n\n// 아래 루프는 O(n)으로 표기합니다. n이 무한에 가까울 수록 k가 의미가 없기 때문입니다. (상수항과 계수 무시)\nint k = 5;\nfor (int i = 0; i < n * k; i++) { ... }\n\n// 입력값인 n과 m이 독립적이라면 빅오는 더할 수 있습니다. O(n + m)으로 표기합니다.\nfor (int i = 0; i < n; i++) { ... }\nfor (int i = 0; i < m; i++) { ... }\n\n// 빅오는 곱해질 수 있습니다. O(n^2)으로 표기합니다.\nfor (int i = 0; i < n; i++) {\n  for (int j = 0; j < n * 5; j++) {}\n}\n\n// 가장 큰 항 외에는 무시할 수 있습니다. O(n^2)로 표기합니다.\nfor (int i = 0; i < n; i++) {}\n\nfor (int i = 0; i < n; i++) {\n  for (int j = 0; j < n; j++) {}\n}\n```\n\n## 추가 학습 자료를 공유합니다.\n\n- [[10분 테코톡] 🙋‍♂️제이의 시간복잡도](https://youtu.be/IEH3YA2Nn4Q?feature=shared)\n- [Eleanor Lim님 유튜브 - 빅오(Big-O)표기법 완전정복\n](https://youtu.be/6Iq5iMCVsXA?feature=shared)\n- [노마드 코더 - 개발자라면 이제는 알아야하는 Big O 설명해드림. 10분컷.\n](https://youtu.be/BEVnxbxBqi8?feature=shared)\n\n", "title": "시간 복잡도와 공간 복잡도의 차이점은 무엇인가요?"}, "be-105": {"id": "be-105", "content": "## **Micrometer란 무엇이며, 왜 사용하나요?**\n\nMicrometer는 벤더 중립적인 메트릭 계측 라이브러리로, 애플리케이션에서 발생하는 다양한 지표(예: CPU 사용량, 메모리 소비, HTTP 요청 및 커스텀 이벤트)를 수집합니다.\n이 라이브러리는 Prometheus, Datadog, Graphite 등 여러 모니터링 시스템에 메트릭을 전송할 수 있도록 단순하고 일관된 API(파사드)를 제공하여, 각 백엔드 클라이언트의 복잡한 세부 구현을 감춥니다.\n특히 Spring Boot Actuator와 깊이 통합되어, 기본 메트릭을 자동으로 수집하고 노출할 수 있습니다.\n\n## **Spring Boot Actuator와 Micrometer의 관계는 무엇인가요?**\n\nSpring Boot Actuator는 애플리케이션의 상태, 헬스 체크, 환경, 로그 등 여러 운영 정보를 노출하는 관리 엔드포인트를 제공합니다.\n내부적으로 Actuator는 Micrometer를 사용하여 JVM, HTTP, 데이터베이스 등 다양한 메트릭을 수집합니다.\n즉, Actuator는 모니터링 및 관리 인터페이스를 제공하고, Micrometer는 그 밑에서 실제 메트릭 데이터를 계측하고 여러 모니터링 시스템으로 전송하는 역할을 담당합니다.\n\n## **Micrometer를 사용하여 커스텀 메
