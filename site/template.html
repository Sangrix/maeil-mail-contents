<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>매일메일 스터디</title>
<style>
  :root {
    --bg: #0f0e0c;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-strong: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.11);
    --glass-border-soft: rgba(255, 255, 255, 0.07);
    --text: #f2efe9;
    --text-dim: #b6b0a5;
    --text-faint: #837c70;
    --accent: #d97757;
    --accent-strong: #e79274;
    --accent-soft: rgba(217, 119, 87, 0.18);
    --accent-dim: rgba(217, 119, 87, 0.45);
    --done: #6fbf8b;
    --done-soft: rgba(111, 191, 139, 0.16);
    --code-bg: rgba(0, 0, 0, 0.35);
    --radius: 16px;
    --sidebar-w: 340px;
    --blur: blur(20px) saturate(140%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: break-word;
    background: var(--bg);
  }
  header {
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--glass-border-soft);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 15.5px;
    margin: 0;
    font-weight: 800;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .subject-toggle {
    display: flex;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 11px;
    padding: 3px;
    gap: 3px;
  }
  .subject-toggle button {
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: background .12s, color .12s;
  }
  .subject-toggle button.active {
    background: var(--accent);
    color: #16110d;
    box-shadow: 0 2px 10px rgba(217, 119, 87, 0.4);
  }
  #search {
    flex: 1;
    min-width: 180px;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 11px;
    font-size: 13px;
  }
  #search::placeholder { color: var(--text-faint); }
  #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn {
    border: 1px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: border-color .12s, color .12s, background .12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--glass-strong); }
  #progress-summary {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    white-space: nowrap;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 8px 12px;
    border-radius: 11px;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .category {
    flex-shrink: 0;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-soft);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(5, 8, 20, 0.25);
    overflow: hidden;
    transition: border-color .12s, background .12s;
  }
  .category.open { border-color: var(--glass-border); background: var(--glass-strong); }
  .category-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 13px 14px;
    cursor: pointer;
    user-select: none;
  }
  .category-head:hover { background: rgba(255,255,255,0.05); }
  .cat-index {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: var(--accent-soft);
    border: 1px solid var(--glass-border-soft);
    color: var(--accent-strong);
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .category-head-main { flex: 1; min-width: 0; }
  .category-title {
    font-size: 13.5px;
    font-weight: 700;
    display: block;
    line-height: 1.5;
  }
  .category-progress-track {
    margin-top: 7px;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .category-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--done), #7fe8c2);
    border-radius: 3px;
    transition: width .2s;
  }
  .category-count {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-top: 2px;
  }
  .category-count.all-done { color: var(--done); }
  .chevron {
    flex-shrink: 0;
    transition: transform .15s;
    color: var(--text-faint);
    font-size: 10px;
    margin-top: 3px;
  }
  .category.open .chevron { transform: rotate(90deg); color: var(--accent); }
  .category-desc {
    font-size: 11.5px;
    color: var(--text-faint);
    padding: 0 14px 13px 48px;
    line-height: 1.55;
    margin-top: -2px;
  }
  .category-items {
    display: none;
    padding: 4px 8px 10px;
    border-top: 1px solid var(--glass-border-soft);
  }
  .category.open .category-items { display: block; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 8px 8px 8px 10px;
    margin: 2px 0;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text-dim);
    line-height: 1.55;
    border-radius: 9px;
  }
  .item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .item.active { background: var(--accent-soft); color: var(--text); }
  .item.active .item-title { color: var(--text); font-weight: 600; }
  .item.done .item-title { color: var(--text-faint); }
  .item input[type=checkbox] { margin-top: 2px; accent-color: var(--done); cursor: pointer; flex-shrink: 0; }
  #content-pane {
    flex: 1;
    overflow-y: auto;
    padding: 32px 32px 100px;
  }
  #content-inner {
    max-width: 720px;
    margin: 0 auto;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-soft);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(5, 8, 20, 0.3);
    padding: 36px 44px;
  }
  #content-inner:has(.empty-state) {
    background: transparent;
    border: none;
    box-shadow: none;
  }
  .empty-state {
    color: var(--text-faint);
    font-size: 14px;
    margin: 100px auto;
    text-align: center;
    line-height: 1.8;
  }
  .qa-breadcrumb {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-strong);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qa-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 14px;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }
  .qa-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--glass-border-soft);
    color: var(--text-faint);
    font-size: 12px;
  }
  .qa-meta .qa-id {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border-soft);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .qa-meta .btn { padding: 6px 12px; font-size: 12px; }
  .qa-meta .btn.is-done { border-color: var(--done); color: var(--done); background: var(--done-soft); }
  .course-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--glass-border-soft);
  }
  .course-nav-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    max-width: 44%;
    padding: 10px 14px;
    text-align: left;
  }
  .course-nav-btn.next { align-items: flex-end; text-align: right; margin-left: auto; }
  .course-nav-btn .cn-label { font-size: 10.5px; color: var(--text-faint); font-weight: 700; }
  .course-nav-btn .cn-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .course-nav-btn:hover .cn-title { color: var(--accent-strong); }
  .course-position {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .md h2 {
    font-size: 17px;
    font-weight: 700;
    margin-top: 40px;
    margin-bottom: 16px;
    padding-top: 24px;
    border-top: 1px solid var(--glass-border-soft);
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .md h2::before {
    content: "Q";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .md h3 { font-size: 15px; margin-top: 22px; color: var(--text); }
  .md p { line-height: 1.9; margin: 0 0 16px; font-size: 15px; color: var(--text); }
  .md ul, .md ol { line-height: 1.9; font-size: 15px; margin: 0 0 16px; padding-left: 24px; color: var(--text); }
  .md li { margin-bottom: 6px; }
  .md blockquote {
    margin: 0 0 16px;
    padding: 10px 16px;
    border-left: 3px solid var(--accent);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    border-radius: 0 10px 10px 0;
    font-size: 14px;
  }
  .md code {
    background: var(--code-bg);
    border: 1px solid var(--glass-border-soft);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 0.88em;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    color: #f0cf8e;
  }
  .md pre {
    background: var(--code-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
    overflow-x: auto;
    margin: 0 0 18px;
  }
  .md pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.7; color: var(--text); }
  .md-table-wrap {
    overflow-x: auto;
    margin: 0 0 18px;
    border: 1px solid var(--glass-border-soft);
    border-radius: 12px;
  }
  .md table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .md thead th {
    background: rgba(255,255,255,0.05);
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--glass-border);
    color: var(--text);
    font-weight: 700;
    white-space: nowrap;
  }
  .md tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--glass-border-soft);
    color: var(--text-dim);
  }
  .md tbody tr:last-child td { border-bottom: none; }
  .md tbody tr:hover td { background: rgba(255,255,255,0.03); }
  .md a { color: var(--accent-strong); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  .md a:hover { border-bottom-color: var(--accent-strong); }
  .md strong { color: #fff; font-weight: 700; }
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--glass-strong);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    #sidebar { width: 100%; max-height: 44vh; }
    #content-pane { padding: 20px 16px; }
    #content-inner { padding: 24px 22px; }
  }
</style>
</head>
<body>
<header>
  <h1>매일메일 스터디</h1>
  <div class="subject-toggle" id="subject-toggle">
    <button data-subject="frontend" class="active">Frontend</button>
    <button data-subject="backend">Backend</button>
  </div>
  <input type="text" id="search" placeholder="질문 검색... (예: 클로저, useEffect)" />
  <button class="btn" id="course-btn">학습 코스</button>
  <button class="btn" id="random-btn">랜덤 복습</button>
  <span id="progress-summary"></span>
</header>
<main>
  <nav id="sidebar"></nav>
  <section id="content-pane">
    <div id="content-inner">
      <div class="empty-state">왼쪽 목록에서 질문을 선택하거나, "랜덤 복습" 버튼을 눌러보세요.</div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const DATA = /*__DATA__*/;

/* ---------- 아주 작은 마크다운 렌더러 (오프라인 전용, 이 콘텐츠의 문법만 지원) ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderInline(text) {
  text = escapeHtml(text);
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/<br\s*\/?>/g, "<br>");
  return text;
}
function isTableRow(line) {
  return /^\s*\|.*\|\s*$/.test(line);
}
function isTableSeparator(line) {
  return isTableRow(line) && /^[\s|:-]+$/.test(line) && line.includes("-");
}
function splitTableRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map(c => c.trim());
}
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let i = 0;
  let listBuffer = null; // {type: 'ul'|'ol', items: []}
  function flushList() {
    if (!listBuffer) return;
    const tag = listBuffer.type;
    html += `<${tag}>` + listBuffer.items.map(it => `<li>${renderInline(it)}</li>`).join("") + `</${tag}>`;
    listBuffer = null;
  }
  let paraBuffer = [];
  function flushPara() {
    if (paraBuffer.length) {
      html += `<p>${paraBuffer.map(renderInline).join("<br>")}</p>`;
      paraBuffer = [];
    }
  }
  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      flushPara(); flushList();
      const lang = line.replace(/^```/, "").trim();
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      html += `<pre><code class="lang-${escapeHtml(lang)}">${escapeHtml(code.join("\n"))}</code></pre>`;
      i++;
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara(); flushList();
      const level = Math.min(h[1].length, 3);
      html += `<h${level}>${renderInline(h[2])}</h${level}>`;
      i++; continue;
    }
    if (isTableRow(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
      flushPara(); flushList();
      const headerCells = splitTableRow(line);
      i += 2;
      const bodyRows = [];
      while (i < lines.length && isTableRow(lines[i])) {
        bodyRows.push(splitTableRow(lines[i]));
        i++;
      }
      html += "<div class=\"md-table-wrap\"><table><thead><tr>"
        + headerCells.map(c => `<th>${renderInline(c)}</th>`).join("")
        + "</tr></thead><tbody>"
        + bodyRows.map(row => "<tr>" + row.map(c => `<td>${renderInline(c)}</td>`).join("") + "</tr>").join("")
        + "</tbody></table></div>";
      continue;
    }
    const bq = line.match(/^>\s?(.*)$/);
    if (bq) {
      flushPara(); flushList();
      const quote = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, "")); i++; }
      html += `<blockquote>${quote.map(renderInline).join("<br>")}</blockquote>`;
      continue;
    }
    const ul = line.match(/^[-*]\s+(.*)$/);
    if (ul) {
      flushPara();
      if (!listBuffer || listBuffer.type !== "ul") { flushList(); listBuffer = { type: "ul", items: [] }; }
      listBuffer.items.push(ul[1]);
      i++; continue;
    }
    const ol = line.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      flushPara();
      if (!listBuffer || listBuffer.type !== "ol") { flushList(); listBuffer = { type: "ol", items: [] }; }
      listBuffer.items.push(ol[1]);
      i++; continue;
    }
    if (line.trim() === "") {
      flushPara(); flushList();
      i++; continue;
    }
    paraBuffer.push(line);
    i++;
  }
  flushPara(); flushList();
  return html;
}

/* ---------- 진행 상태 저장 (localStorage) ---------- */
const STORAGE_KEY = "maeil-mail-study-progress-v1";
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();
function isDone(id) { return !!progress[id]; }
function toggleDone(id) {
  if (progress[id]) delete progress[id]; else progress[id] = true;
  saveProgress(progress);
}

/* ---------- 상태 ---------- */
let currentSubject = "frontend";
let currentId = null;
let openCategories = new Set();

const sidebarEl = document.getElementById("sidebar");
const contentInner = document.getElementById("content-inner");
const searchEl = document.getElementById("search");
const progressSummaryEl = document.getElementById("progress-summary");
const toastEl = document.getElementById("toast");

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1600);
}

function allItemIds(subject) {
  return Object.keys(DATA[subject].items);
}

/* 추천 학습 순서(카테고리 순서 + 카테고리 내 큐레이션 순서)를 그대로 이어붙인 코스 순서 */
function courseOrder(subject) {
  return DATA[subject].categories.flatMap(cat => cat.items);
}

function updateProgressSummary() {
  const ids = allItemIds(currentSubject);
  const done = ids.filter(isDone).length;
  progressSummaryEl.textContent = `${done} / ${ids.length} 완료`;
}

function matchesSearch(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return item.title.toLowerCase().includes(q) || item.content.toLowerCase().includes(q);
}

function renderSidebar() {
  const query = searchEl.value.trim();
  const section = DATA[currentSubject];
  sidebarEl.innerHTML = "";

  section.categories.forEach((cat, catIdx) => {
    const catItems = cat.items
      .map(id => section.items[id])
      .filter(item => item && matchesSearch(item, query));
    if (query && catItems.length === 0) return;

    const catKey = currentSubject + "-" + catIdx;
    const isOpen = query ? true : openCategories.has(catKey);

    const catEl = document.createElement("div");
    catEl.className = "category" + (isOpen ? " open" : "");

    const doneCount = cat.items.filter(id => section.items[id] && isDone(id)).length;
    const total = cat.items.length;
    const pct = total ? Math.round((doneCount / total) * 100) : 0;
    const allDone = total > 0 && doneCount === total;

    const head = document.createElement("div");
    head.className = "category-head";
    head.innerHTML = `
      <span class="cat-index">${String(catIdx + 1).padStart(2, "0")}</span>
      <span class="category-head-main">
        <span class="category-title">${escapeHtml(cat.name)}</span>
        <span class="category-progress-track"><span class="category-progress-fill" style="width:${pct}%"></span></span>
      </span>
      <span class="category-count${allDone ? " all-done" : ""}">${doneCount}/${total}</span>
      <span class="chevron">▶</span>
    `;
    head.addEventListener("click", () => {
      if (openCategories.has(catKey)) openCategories.delete(catKey);
      else openCategories.add(catKey);
      renderSidebar();
    });
    catEl.appendChild(head);

    if (cat.desc) {
      const desc = document.createElement("div");
      desc.className = "category-desc";
      desc.textContent = cat.desc;
      catEl.appendChild(desc);
    }

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "category-items";
    catItems.forEach(item => {
      const done = isDone(item.id);
      const itemEl = document.createElement("div");
      itemEl.className = "item" + (done ? " done" : "") + (item.id === currentId ? " active" : "");
      itemEl.innerHTML = `
        <input type="checkbox" ${done ? "checked" : ""} data-id="${item.id}" />
        <span class="item-title">${escapeHtml(item.title || item.id)}</span>
      `;
      itemEl.querySelector("input").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleDone(item.id);
        if (item.id === currentId) selectItem(item.id);
        else renderSidebar();
        updateProgressSummary();
      });
      itemEl.addEventListener("click", () => selectItem(item.id));
      itemsWrap.appendChild(itemEl);
    });
    catEl.appendChild(itemsWrap);
    sidebarEl.appendChild(catEl);
  });
}

function findCategory(subject, id) {
  return DATA[subject].categories.find(c => c.items.includes(id));
}

function selectItem(id) {
  currentId = id;
  const item = DATA[currentSubject].items[id];
  if (!item) return;
  const done = isDone(id);
  const category = findCategory(currentSubject, id);
  if (category) {
    const catIdx = DATA[currentSubject].categories.indexOf(category);
    openCategories.add(currentSubject + "-" + catIdx);
  }

  const order = courseOrder(currentSubject);
  const idx = order.indexOf(id);
  const prevItem = idx > 0 ? DATA[currentSubject].items[order[idx - 1]] : null;
  const nextItem = idx >= 0 && idx < order.length - 1 ? DATA[currentSubject].items[order[idx + 1]] : null;

  contentInner.innerHTML = `
    ${category ? `<div class="qa-breadcrumb">${escapeHtml(category.name)}</div>` : ""}
    <h2 class="qa-title">${escapeHtml(item.title || item.id)}</h2>
    <div class="qa-meta">
      <span class="qa-id">${item.id}</span>
      <button class="btn${done ? " is-done" : ""}" id="toggle-done-btn">${done ? "✅ 학습 완료" : "☐ 학습 완료로 표시"}</button>
    </div>
    <div class="md">${renderMarkdown(item.content)}</div>
    <div class="course-nav">
      ${prevItem ? `<button class="btn course-nav-btn prev" id="course-prev-btn"><span class="cn-label">◀ 이전</span><span class="cn-title">${escapeHtml(prevItem.title || prevItem.id)}</span></button>` : "<span></span>"}
      ${idx >= 0 ? `<span class="course-position">코스 ${idx + 1} / ${order.length}</span>` : ""}
      ${nextItem ? `<button class="btn course-nav-btn next" id="course-next-btn"><span class="cn-label">다음 ▶</span><span class="cn-title">${escapeHtml(nextItem.title || nextItem.id)}</span></button>` : "<span></span>"}
    </div>
  `;
  document.getElementById("toggle-done-btn").addEventListener("click", () => {
    toggleDone(id);
    selectItem(id);
    renderSidebar();
    updateProgressSummary();
  });
  const prevBtn = document.getElementById("course-prev-btn");
  if (prevBtn) prevBtn.addEventListener("click", () => selectItem(order[idx - 1]));
  const nextBtn = document.getElementById("course-next-btn");
  if (nextBtn) nextBtn.addEventListener("click", () => selectItem(order[idx + 1]));
  contentInner.parentElement.scrollTop = 0;
  renderSidebar();
}

function pickRandom() {
  const ids = allItemIds(currentSubject);
  if (ids.length === 0) return;
  const notDone = ids.filter(id => !isDone(id));
  const pool = notDone.length > 0 ? notDone : ids;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  selectItem(pick);
  if (notDone.length === 0) showToast("모든 문항을 학습했어요! 전체에서 무작위로 골랐습니다 🎉");
}

function startCourse() {
  const order = courseOrder(currentSubject);
  if (order.length === 0) return;
  const resumeAt = order.find(id => !isDone(id));
  if (resumeAt) {
    selectItem(resumeAt);
    showToast("추천 학습 순서로 이어서 시작합니다 📘");
  } else {
    selectItem(order[0]);
    showToast("모든 코스를 완료했어요! 처음부터 다시 시작합니다 🎉");
  }
}

document.getElementById("subject-toggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-subject]");
  if (!btn) return;
  currentSubject = btn.dataset.subject;
  document.querySelectorAll("#subject-toggle button").forEach(b => b.classList.toggle("active", b === btn));
  currentId = null;
  contentInner.innerHTML = '<div class="empty-state">왼쪽 목록에서 질문을 선택하거나, "랜덤 복습" 버튼을 눌러보세요.</div>';
  renderSidebar();
  updateProgressSummary();
});

searchEl.addEventListener("input", () => renderSidebar());
document.getElementById("random-btn").addEventListener("click", pickRandom);
document.getElementById("course-btn").addEventListener("click", startCourse);

renderSidebar();
updateProgressSummary();
</script>
</body>
</html>
